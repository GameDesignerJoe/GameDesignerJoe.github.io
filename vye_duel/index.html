<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Vye Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a game table. Header with tabs, then one working surface per tab: Setup (config panels), Play (board + side rail), Simulate (controls + results). */
:root {
  --bg: #E6E9EC; --surface: #F5F6F7; --sunk: #DADFE4; --ink: #1A2027; --muted: #5A6470; --line: #C4CBD3;
  --brass: #8E6610; --brass-soft: #F1E2BC;
  --blue: #2C5AA5; --blue-soft: #D7E2F4; --red: #B13939; --red-soft: #F4DADA;
  --good: #2F7A4C; --warn: #A3641A;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --cell: 72px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161B; --surface: #1B2128; --sunk: #232B34; --ink: #E5E8EC; --muted: #98A2AE; --line: #303A45;
  --brass: #D6A642; --brass-soft: #3A3020; --blue: #6F99E2; --blue-soft: #1E2D47; --red: #E27474; --red-soft: #452525;
  --good: #63BE86; --warn: #E0A050; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161B; --surface: #1B2128; --sunk: #232B34; --ink: #E5E8EC; --muted: #98A2AE; --line: #303A45;
  --brass: #D6A642; --brass-soft: #3A3020; --blue: #6F99E2; --blue-soft: #1E2D47; --red: #E27474; --red-soft: #452525;
  --good: #63BE86; --warn: #E0A050; color-scheme: dark }

* { box-sizing: border-box; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }

/* header */
header.top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.mark { display: flex; align-items: baseline; gap: 10px; }
.mark h1 { font-size: 30px; line-height: 1; }
.mark .ed { font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
nav.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
nav.tabs[hidden] { display: none; }
nav.tabs { margin: 10px auto 12px; max-width: 520px; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
a.btn { text-decoration: none; color: inherit; display: inline-block; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 19px; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.grid-setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl b { font-weight: 500; }
.row .lbl small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.chip { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); vertical-align: 2px; margin-left: 4px; }
.chip.new { background: var(--brass-soft); color: var(--brass); }
.numbox { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 13.5px; color: var(--muted); }
.numbox input { width: 6ch; box-sizing: content-box; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card, transparent); color: var(--ink); font: inherit; font-weight: 700; text-align: right; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.stepper button { width: 30px; height: 30px; border: 0; background: var(--sunk); cursor: pointer; font-size: 17px; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 32px; text-align: center; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13.5px; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--brass); }
.fam-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fam-cols h3 { font-size: 15px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.p0 { background: var(--blue); } .dot.p1 { background: var(--red); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 4px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.stat .v { font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.note { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; margin-top: 10px; }
.note.warn { background: var(--brass-soft); color: var(--warn); }
.note.ok { background: var(--sunk); color: var(--muted); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.preset { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; background: var(--sunk); border: 2px solid transparent; }
.preset.on { border-color: var(--ink); }
.preset .btn { align-self: flex-start; }
.preset .btn.on, .preset .btn.on:disabled { background: var(--ink); color: var(--bg); border-color: var(--ink); opacity: 1; }
.preset small { font-size: 13px; color: var(--muted); line-height: 1.4; }
.presets .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.presets .k { color: var(--muted); font-size: 13px; margin-right: 4px; }

/* play */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 900px), (pointer: coarse) and (max-height: 600px) { .play { grid-template-columns: 1fr; } .fam-cols { grid-template-columns: 1fr; } }
.table { background: var(--sunk); border-radius: 14px; padding: 18px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.prompt { min-height: 36px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 14.5px; text-align: center; }
.prompt .who { font-family: var(--display); font-weight: 700; font-size: 17px; }
.prompt .who.p0 { color: var(--blue); } .prompt .who.p1 { color: var(--red); }
.board { display: grid; gap: 5px; }
.cell { width: var(--cell); height: var(--cell); border-radius: 9px; position: relative; }
.cell.empty { border: 1px dashed transparent; }
.cell.empty.open { border-color: var(--line); }
.cell.target { cursor: pointer; }
.cell.empty.target { border: 2px dashed var(--brass); background: color-mix(in srgb, var(--brass) 10%, transparent); }
.cell.target:not(.empty) { outline: 3px solid var(--brass); outline-offset: 2px; }
.cell.target:hover { filter: brightness(1.08); }
.tile { position: absolute; inset: 0; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #fff; text-align: center; user-select: none; }
.tile .g { font-size: calc(var(--cell) * .38); line-height: 1; }
.tile .n { font-size: calc(var(--cell) * .135); line-height: 1.05; margin-top: 3px; font-weight: 500; padding: 0 3px; }
.tile.land { background: var(--lc); }
.tile.fam, .tile.spec, .tile.start { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.tile.spec .g { color: var(--brass); }
.tile.start .g { color: var(--muted); }
.tile.sinkhole { background: #3A3F46; color: #C9CED4; border-color: #3A3F46; }
.tile.sinkhole .g { color: #C9CED4; }
.pat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: calc(var(--cell) * .38); height: calc(var(--cell) * .38); }
.pat i { border-radius: 2px; background: var(--line); }
.pat i.on { background: var(--brass); }
.pat i.me { background: var(--ink); }
.pat.pat5 { grid-template-columns: repeat(5, 1fr); gap: 1px; }
.pat i.skip { background: color-mix(in srgb, var(--line) 50%, transparent); }
.pat i.opt { background: color-mix(in srgb, var(--brass) 40%, transparent); }
/* ownership: outline frame + sigil */
.own { position: absolute; inset: 0; border-radius: 9px; pointer-events: none; }
.own.p0 { box-shadow: inset 0 0 0 4px var(--blue); }
.own.p1 { box-shadow: inset 0 0 0 4px var(--red); }
.own.both { box-shadow: inset 0 0 0 4px var(--blue), inset 0 0 0 7px var(--red); }
.no-borders .own { display: none; }
.no-borders .sig { width: calc(var(--cell) * .3); height: calc(var(--cell) * .3); box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.4); }
.sig { position: absolute; top: 4px; right: 4px; width: calc(var(--cell) * .27); height: calc(var(--cell) * .27); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--cell) * .17); color: #fff; line-height: 1; }
.sig.p0 { background: var(--blue); } .sig.p1 { background: var(--red); }
.sig.both { background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
.sig svg { width: 72%; height: 72%; display: block; }
.sigi { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.15em; }
.sigi svg { width: 100%; height: 100%; display: block; }
.stack { position: absolute; bottom: 3px; left: 4px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; padding: 0 5px; border-radius: 4px; }
.cell.stacked::before { content: ""; position: absolute; inset: 0; transform: translate(3px, 3px); border-radius: 9px; background: var(--line); }
.cell.last::after { content: ""; position: absolute; inset: -4px; border-radius: 12px; border: 2px solid var(--ink); opacity: .55; pointer-events: none; }
.cell.ghost .tile { opacity: .65; }
@keyframes pop { from { transform: scale(.7); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
@media (prefers-reduced-motion: reduce) { .cell .tile, .hcard.pick { animation: none !important; } }

/* the player whose turn it is gets a gold border around their hand */
.hand-area { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 2px solid transparent; border-radius: 14px; transition: border-color .25s, box-shadow .25s; }
.hand-area.turn { border-color: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft); }
.hand-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
.hand { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.hcard { width: 78px; height: 78px; border-radius: 10px; position: relative; cursor: pointer; border: 0; padding: 0; background: none; --cell: 78px; }
.hcard.sel { outline: 3px solid var(--brass); outline-offset: 3px; }
.cell.chosen::after { content: ""; position: absolute; inset: -5px; border-radius: 13px; border: 3px solid var(--brass); pointer-events: none; }
.hcard.pick { outline: 3px dashed var(--brass); outline-offset: 3px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-3px); } }
img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 9px; pointer-events: none; }
.tile.has-art { background: #F9F1E4; }
.tile.has-art > .g, .tile.has-art > .n, .tile.has-art > .pat { display: none; }
.bonus { white-space: nowrap; font-size: 12px; font-weight: 700; vertical-align: super; margin-left: 3px; padding: 0 4px; border-radius: 4px; background: var(--red); color: #fff; cursor: help; letter-spacing: 0; }
.flyer { position: fixed; z-index: 40; pointer-events: none; border-radius: 9px; }
.flyer .tile { box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.cell .tile.under { z-index: 0; }
.cell.incoming > .tile:not(.under) { visibility: hidden; }
.tile.icon { background: none; border: 0; padding: 0; }
.tile.icon svg { width: 100%; height: 100%; display: block; }
.cbgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .cbgrid { grid-template-columns: 1fr; } }
.cbgrid h3 { font-size: 14px; margin: 0 0 8px; }
.cbrow { display: grid; grid-template-columns: 9.5em 1fr 3em; gap: 10px; align-items: center; padding: 4px 0; cursor: help; font-size: 13.5px; }
.cbrow b { text-align: right; }
.cbtrack { position: relative; height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.cbtrack i:first-child { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brass); border-radius: 6px; }
.cbtrack i.mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1.5px; background: var(--muted); }
.counts { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-size: 13.5px; margin-bottom: 12px; }
.counts .hd { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.counts .num { text-align: right; }
.counts .sub { font-size: 12px; color: var(--muted); padding-left: 10px; }
.counts .tot { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 700; }
.hcard.dead { opacity: .4; cursor: not-allowed; }
.hcard.back { background: repeating-linear-gradient(45deg, var(--line) 0 6px, var(--sunk) 6px 12px); cursor: default; border: 1px solid var(--line); }
.cardinfo { font-size: 13.5px; color: var(--muted); text-align: center; max-width: 520px; min-height: 2.6em; display: grid; place-items: center; }
.choices { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.rail { display: flex; flex-direction: column; gap: 14px; }
.seat { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.seed { width: 92px; font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.log .e { display: flex; gap: 8px; align-items: baseline; }
.log .e .t { color: var(--muted); width: 22px; flex: none; text-align: right; font-size: 12px; }
.log .e .sw { margin-left: auto; font-weight: 700; flex: none; }
.p0c { color: var(--blue); } .p1c { color: var(--red); }
.endcard { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 14px; z-index: 5; }
.endcard .box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: 90%; }
.endcard h2 { font-size: 26px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); justify-content: center; }

/* simulate */
.simgrid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
/* phones in landscape are wide but short: keep them in one column like portrait */
@media (max-width: 900px), (pointer: coarse) and (max-height: 600px) { .simgrid { grid-template-columns: 1fr; } .grid-setup { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.persona-blurb { font-size: 12.5px; color: var(--muted); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.progress i { display: block; height: 100%; background: var(--brass); width: 0; transition: width .15s; }
.results { display: flex; flex-direction: column; gap: 16px; }
.winbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; font-size: 12.5px; font-weight: 700; color: #fff; }
.winbar span { display: grid; place-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.rng { text-align: left; }
th, td { padding-inline: 6px; }
th.col-range { text-align: left; }
@media (max-width: 1250px) { .col-range { display: none; } }
@media (max-width: 560px) { .col-flips, .col-plays { display: none; } th .q { display: none; } }
.flag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.flag.hot { background: var(--red-soft); color: var(--red); }
.flag.flat { background: var(--sunk); color: var(--muted); }
pre.report { background: var(--sunk); border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; margin: 8px 0 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.matrix td, .matrix th { text-align: center; }
.empty-results { color: var(--muted); padding: 30px 10px; text-align: center; }
.tray { display: contents; }
/* Table background picture (Game panel > Background). Cover keeps any picture's shape: it fills the play area
   and trims the overflow evenly from the edges; a dark vignette hides where it's been trimmed. */
.table.has-bg { background-color: #241713; background-position: center; background-size: cover; background-repeat: no-repeat;
  box-shadow: inset 0 0 80px 18px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35); }
.table.has-bg .hand-label, .table.has-bg .cardinfo, .table.has-bg .prompt { color: #F4EADB; text-shadow: 0 1px 3px rgba(0,0,0,.75); }
.table.has-bg .prompt .btn { background: #F4EADB; color: #1d1530; border-color: transparent; text-shadow: none; }
.table.has-bg .cell.empty.open { border-color: rgba(255,240,222,.32); background: rgba(0,0,0,.12); }
.boardbox { display: grid; place-items: center; flex: none; max-width: 100%; }
/* Picture stage (portrait backgrounds): the whole picture shows, nothing trimmed; the board sits in its play area */
.stage-col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.table.stage { display: block; padding: 0; flex: none; background-size: 100% 100%; background-color: #1d1530; max-width: 100%;
  box-shadow: 0 10px 30px rgba(0,0,0,.28); border-radius: 16px; overflow: hidden; }
.stage-top, .stage-bot { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px 10px; }
.stage-top { top: 0; justify-content: space-between; padding-top: 10px; padding-bottom: 6px; }
.stage-bot { bottom: 0; justify-content: flex-end; padding-bottom: 10px; }
.table.stage .gear { bottom: calc(10px + var(--safeb, 0px)); }
.stage-board { position: absolute; display: grid; place-items: center; }
.table.stage .mscore { padding: 0 4px; }
.table.stage .hand-area { width: auto; max-width: 100%; padding: 6px 10px; gap: 4px; background: rgba(18,12,28,.375); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); border-color: rgba(255,255,255,.08); }
.table.stage .hand-area.turn { border-color: var(--brass); }
.table.stage .hand-label { font-size: 10.5px; justify-content: center; }
.table.stage .hand { gap: 6px; flex-wrap: nowrap; }
.table.stage .stage-bot .hand-area { max-width: calc(100% - 104px); }
.table.stage .hcard { width: var(--hc); height: var(--hc); --cell: var(--hc); flex: none; }

<script id="vye-engine">
/* Vye Duel — rules engine, AI personas and batch simulator.
   Runs in the browser (global VyeEngine) and in Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- coordinates ----------
  const SIZE = 64, OFF = 32;
  const key = (x, y) => (x + OFF) * SIZE + (y + OFF);
  const kx = k => Math.floor(k / SIZE) - OFF;
  const ky = k => (k % SIZE) - OFF;
  const ORTHO = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const ALL8 = ORTHO.concat(DIAG);
  const ORTHO_D = ORTHO.map(([dx, dy]) => dx * SIZE + dy);
  const DIAG_D = DIAG.map(([dx, dy]) => dx * SIZE + dy);
  const ALL8_D = ORTHO_D.concat(DIAG_D);

  // ---------- content ----------
  const LANDS = [
    // The first 7 are the ones in play by default and in the print and play (landSets: 7 takes them in order).
    { name: 'Dragon Keep', art: 'dragon-keep', glyph: '♜', color: '#9C3D2E' },
    { name: 'Longship', art: 'longship', glyph: '♦', color: '#2F6FA0' },
    { name: 'Owl Marsh', art: 'owl-marsh', glyph: '✱', color: '#3E8E7E' },
    { name: 'Raven Moor', art: 'raven-moor', glyph: '✶', color: '#4A4458' },
    { name: 'Firelands', art: 'firelands', glyph: '✹', color: '#D9792B' },
    { name: 'Violet Peaks', art: 'violet-peaks', glyph: '▲', color: '#8C5D88' },
    { name: 'Green Hills', art: 'green-hills', glyph: '■', color: '#7FA44A' },
    // the other nine, used when more than 7 Land types are switched on in Setup
    { name: 'Wolf Hollow', art: 'wolf-hollow', glyph: '◐', color: '#8A9289' },
    { name: 'Spire Isle', art: 'spire-isle', glyph: '⌂', color: '#79A08A' },
    { name: 'Ice Cliffs', art: 'ice-cliffs', glyph: '❄', color: '#7E8E9E' },
    { name: 'Golden Fields', art: 'golden-fields', glyph: '☼', color: '#B5834C' },
    { name: 'Night Thicket', art: 'night-thicket', glyph: '●', color: '#AB9764' },
    { name: 'Birchwood', art: 'birchwood', glyph: '♣', color: '#7A6554' },
    { name: 'High Peaks', art: 'high-peaks', glyph: '△', color: '#664D36' },
    { name: 'Whale Sea', art: 'whale-sea', glyph: '≈', color: '#275B5E' },
    { name: 'Stag Forest', art: 'stag-forest', glyph: '♠', color: '#4F3D28' }
  ];

  const MEMBERS = {
    advisor: { name: 'Advisor', dirs: ALL8_D, rule: 'Flips all 8 surrounding tiles.' },
    king: { name: 'King', dirs: ORTHO_D, rule: 'Flips the 4 adjacent tiles.' },
    queen: { name: 'Queen', dirs: DIAG_D, rule: 'Flips the 4 diagonal tiles.' },
    heir: { name: 'Heir', dirs: null, rule: 'Flips 1 surrounding tile of your choice.' },
    knave: { name: 'Knave', dirs: null, rule: 'Does the family\u2019s dirty work: slips past an adjacent tile and flips the tile on its far side.' }
  };
  const MEMBER_ORDER = ['advisor', 'king', 'queen', 'heir', 'knave'];

  const HOUSES = [
    { name: 'House Midnight', short: 'Midnight', sigil: '☾', color: 'blue', art: 'blue' },
    { name: 'House of a Thousand Roses', short: 'Roses', sigil: '✿', color: 'red', art: 'red' }
  ];

  // mode: place = goes in an empty space, cover = stacks on a tile, replace = swaps a tile out
  const SPECIALS = {
    lostcity: { name: 'Lost City', mode: 'cover', origin: 'Original',
      rule: 'Cover a Land you own. Worth extra points in your kingdom (set below).' },
    sinkhole: { name: 'Sinkhole', mode: 'cover', origin: 'Original',
      rule: 'Cover any tile. Nobody owns it, ever. Breaks connections.' },
    sanctuary: { name: 'Sanctuary', mode: 'cover', origin: 'Original',
      rule: 'Cover any tile. Owned by both players. Can’t be flipped or moved, and can only be covered when stacking is Unlimited.' },
    underminers: { name: 'Underminers', mode: 'place', origin: 'Adapted',
      rule: 'Place it, then flip the tile on the far side of an adjacent tile.' },
    earthquake: { name: 'Earthquake', mode: 'place', origin: 'Original',
      rule: 'Place it, then swap any two tiles (not Sanctuary). Nothing triggers.' },
    waystone: { name: 'Waystone', mode: 'place', origin: 'Original',
      rule: 'Place it and take another turn. Flipping it also grants an extra turn.' },
    usurp: { name: 'Usurp', mode: 'replace', origin: 'New',
      rule: 'Swap a Land on the board for a Land from your hand, then match. Old Land goes under the deck.' }
  };
  const SPECIAL_ORDER = ['lostcity', 'sinkhole', 'sanctuary', 'usurp', 'underminers', 'earthquake', 'waystone'];

  function defaultConfig() {
    return {
      landSets: 7,
      landCopies: 3,
      specials: { lostcity: 1, sinkhole: 1, sanctuary: 0, usurp: 1, underminers: 0, earthquake: 0, waystone: 0 },
      family: [{ advisor: 0, king: 1, queen: 0, heir: 0, knave: 1 }, { advisor: 0, king: 1, queen: 0, heir: 0, knave: 1 }],
      gridW: 5, gridH: 5,
      handSize: 2,
      start: 'neutral',      // neutral | none
      stacking: 'unlimited', // once | unlimited (unlimited: any tile can be covered, Sanctuary and Sinkhole included)
      crossroadsCover: false,   // can cover cards be played on the Crossroads?
      crossroadsCapture: true,  // can Family captures take the Crossroads?
      lostCityValue: 2,      // points a Lost City is worth in your kingdom
      usurpMatch: true,      // does the Land put down by Usurp trigger matching?
      secondApart: false,    // second player's first tile can't go on or next to a first-player tile
      colorCapture: true,
      end: { boardFull: true, deckEmpty: false, noValidPlay: true },
      tiebreak: 'second',    // none | total | second  (default: the second player wins ties)
      secondExtraCards: 0,   // second player starts with this many extra cards
      secondBonus: 0         // points added to the second player's kingdom at the end
    };
  }

  // ---------- rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  // ---------- cards ----------
  function cardLabel(c) {
    if (c.kind === 'land') return 'Land';
    if (c.kind === 'family') return MEMBERS[c.member].name;
    if (c.kind === 'special') return SPECIALS[c.special].name;
    return 'Start';
  }
  function cardTitle(c) {
    if (c.kind === 'land') return LANDS[c.land].name;
    if (c.kind === 'family') return HOUSES[c.house].short + ' ' + MEMBERS[c.member].name;
    if (c.kind === 'special') return SPECIALS[c.special].name;
    return 'Crossroads';
  }

  function newGame(cfg, seed) {
    cfg = JSON.parse(JSON.stringify(cfg));
    const rng = mulberry32(seed >>> 0);
    let id = 1;
    const deck = [];
    for (let l = 0; l < cfg.landSets; l++)
      for (let c = 0; c < cfg.landCopies; c++) deck.push({ id: id++, kind: 'land', land: l });
    for (const s of SPECIAL_ORDER) {
      const n = (cfg.specials && cfg.specials[s]) | 0;
      for (let i = 0; i < n; i++) deck.push({ id: id++, kind: 'special', special: s });
    }
    shuffle(deck, rng);
    const players = [0, 1].map(p => {
      const side = [];
      for (const m of MEMBER_ORDER) {
        const n = (cfg.family[p] && cfg.family[p][m]) | 0;
        for (let i = 0; i < n; i++) side.push({ id: id++, kind: 'family', member: m, house: p });
      }
      return { hand: [], side };
    });
    for (let i = 0; i < cfg.handSize; i++) for (const pl of players) if (deck.length) pl.hand.push(deck.pop());
    for (let i = 0; i < (cfg.secondExtraCards | 0); i++) if (deck.length) players[1].hand.push(deck.pop());
    const board = new Map();
    if (cfg.start === 'neutral') board.set(key(0, 0), [{ id: id++, kind: 'start', owner: null }]);
    const state = {
      cfg, rng, seed, board, deck, players, discard: [],
      turn: 0, turnNo: 0, passes: 0, over: false, endReason: null, winner: null,
      plays: [], log: [], lastMove: null, initialDeck: deck.length, leads: []
    };
    state.moves = legalMoves(state, 0);
    if (!state.moves.length) checkEnd(state, true);
    return state;
  }

  // ---------- board helpers ----------
  const top = (board, k) => { const s = board.get(k); return s ? s[s.length - 1] : null; };
  const landOf = t => !t ? -1 : t.kind === 'land' ? t.land : -1;
  const ownedBy = (t, p) => t && (t.owner === p || t.owner === 'both');
  function canFlip(t) {
    if (!t || (t.owner !== 0 && t.owner !== 1)) return false;
    if (t.kind === 'start') return false;
    return t.special !== 'sanctuary' && t.special !== 'sinkhole';
  }
  // Family captures may also take the neutral Crossroads when the rule is on.
  function canTake(t, p, fam, cfg) {
    if (t && t.kind === 'start' && fam && cfg && cfg.crossroadsCapture) return t.owner !== p;
    return canFlip(t) && t.owner !== p;
  }
  function setTop(board, k, tile) { const s = board.get(k).slice(); s[s.length - 1] = tile; board.set(k, s); }
  function pushTile(board, k, tile) { const s = board.get(k); board.set(k, s ? s.concat([tile]) : [tile]); }

  function bbox(board) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const k of board.keys()) { const x = kx(k), y = ky(k); if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { x0, x1, y0, y1 };
  }
  function placeCells(state) {
    const { board, cfg } = state;
    if (board.size === 0) return [key(0, 0)];
    const b = bbox(board);
    const out = new Set();
    for (const k of board.keys()) {
      for (const d of ORTHO_D) {
        const n = k + d;
        if (board.has(n) || out.has(n)) continue;
        const x = kx(n), y = ky(n);
        if (Math.max(b.x1, x) - Math.min(b.x0, x) + 1 > cfg.gridW) continue;
        if (Math.max(b.y1, y) - Math.min(b.y0, y) + 1 > cfg.gridH) continue;
        out.add(n);
      }
    }
    return [...out];
  }
  function coverable(state, k) {
    const s = state.board.get(k);
    if (!s) return false;
    const t = s[s.length - 1], unl = state.cfg.stacking === 'unlimited';
    if (t.kind === 'start' && !state.cfg.crossroadsCover) return false;
    if (t.special === 'sanctuary' && !unl) return false;
    if (!unl && s.length > 1) return false;
    return true;
  }
  function components(board, p, skip) {
    const comp = new Map(); let n = 0;
    for (const k of board.keys()) {
      if (k === skip || comp.has(k) || !ownedBy(top(board, k), p)) continue;
      const q = [k]; comp.set(k, n);
      while (q.length) { const c = q.pop(); for (const d of ORTHO_D) { const m = c + d; if (m !== skip && !comp.has(m) && board.has(m) && ownedBy(top(board, m), p)) { comp.set(m, n); q.push(m); } } }
      n++;
    }
    return comp;
  }
  function score(board, cfg) {
    const lc = cfg && cfg.lostCityValue != null ? cfg.lostCityValue : 2;
    const largest = [0, 0], total = [0, 0];
    for (const p of [0, 1]) {
      const seen = new Set();
      for (const k of board.keys()) {
        const t = top(board, k);
        if (!ownedBy(t, p)) continue;
        total[p] += t.special === 'lostcity' ? lc : 1;
        if (seen.has(k)) continue;
        let v = 0; const q = [k]; seen.add(k);
        while (q.length) {
          const c = q.pop(); const tc = top(board, c); v += tc.special === 'lostcity' ? lc : 1;
          for (const d of ORTHO_D) { const m = c + d; if (!seen.has(m) && board.has(m) && ownedBy(top(board, m), p)) { seen.add(m); q.push(m); } }
        }
        if (v > largest[p]) largest[p] = v;
      }
    }
    return { largest, total };
  }

  // ---------- move generation ----------
  function flipTargets(board, k, p, dirs, cfg) {
    const out = [];
    for (const d of dirs) { const t = top(board, k + d); if (canTake(t, p, true, cfg)) out.push(k + d); }
    return out;
  }
  // Tiles two spaces away, past an occupied neighbour (Underminers and the Knave).
  function jumpTargets(board, k, p, fam, cfg) {
    const tg = [];
    for (const d of ORTHO_D) { if (!board.has(k + d)) continue; const t = top(board, k + 2 * d); if (canTake(t, p, fam, cfg)) tg.push(k + 2 * d); }
    return tg;
  }

  // All moves for one card. opts.prune limits Earthquake enumeration for the AI.
  function cardMoves(state, p, card, src, opts) {
    const { board } = state;
    const moves = [];
    const add = (k, choice) => moves.push({ cardId: card.id, src, pos: k, choice: choice === undefined ? null : choice });
    const occupied = [...board.keys()];
    if (card.kind === 'land') { for (const k of placeCells(state)) add(k); return moves; }
    if (card.kind === 'family') {
      for (const k of placeCells(state)) {
        if (card.member === 'heir') { const t = flipTargets(board, k, p, ALL8_D, state.cfg); if (t.length) t.forEach(c => add(k, c)); else add(k); }
        else if (card.member === 'knave') { const t = jumpTargets(board, k, p, true, state.cfg); if (t.length) t.forEach(c => add(k, c)); else add(k); }
        else add(k);
      }
      return moves;
    }
    const s = card.special;
    switch (s) {
      case 'lostcity':
        for (const k of occupied) { const t = top(board, k); if (coverable(state, k) && landOf(t) >= 0 && t.owner === p) add(k); }
        break;
      case 'sinkhole':
        for (const k of occupied) if (coverable(state, k) && (state.cfg.stacking === 'unlimited' || top(board, k).special !== 'sinkhole')) add(k);
        break;
      case 'sanctuary':
        for (const k of occupied) if (coverable(state, k)) add(k);
        break;
      case 'usurp': {
        const hand = state.players[p].hand.filter(c => c.kind === 'land' && c.id !== card.id);
        const byType = new Map(); hand.forEach(c => { if (!byType.has(c.land)) byType.set(c.land, c); });
        if (!byType.size) break;
        for (const k of occupied) {
          const st = board.get(k); if (st.length !== 1 || st[0].kind !== 'land') continue;
          for (const c of byType.values()) if (!(c.land === st[0].land && st[0].owner === p)) add(k, { cardId: c.id, land: c.land });
        }
        break;
      }
      case 'underminers':
        for (const k of placeCells(state)) {
          const tg = jumpTargets(board, k, p, false, state.cfg);
          if (tg.length) tg.forEach(c => add(k, c)); else add(k);
        }
        break;
      case 'earthquake': {
        let cells = placeCells(state);
        if (opts && opts.prune && cells.length > 3) cells = shuffle(cells.slice(), state.rng || Math.random).slice(0, 3);
        for (const k of cells) {
          add(k, null);
          const all = occupied.concat([k]).filter(c => c === k || top(board, c).special !== 'sanctuary');
          for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
            const a = all[i] === k ? null : top(board, all[i]), b = all[j] === k ? null : top(board, all[j]);
            if (opts && opts.prune) { // skip swaps that can't change ownership layout
              const oa = a ? a.owner : p, ob = b ? b.owner : p; if (oa === ob) continue;
            }
            add(k, [all[i], all[j]]);
          }
        }
        break;
      }
      case 'waystone':
        for (const k of placeCells(state)) add(k);
        break;
    }
    return moves;
  }

  function legalMoves(state, p, opts) {
    const out = legalMovesAll(state, p, opts);
    // Optional opening rule: the second player's first tile keeps its distance from the first player.
    if (p === 1 && state.cfg.secondApart && state.plays && !state.plays.some(x => x.p === 1)) {
      const near = k => [k].concat(ORTHO_D.map(d => k + d)).some(n => { const t = top(state.board, n); return t && t.owner === 0; });
      const ok = out.filter(m => !near(m.pos));
      if (ok.length) return ok;
    }
    return out;
  }
  function legalMovesAll(state, p, opts) {
    const pl = state.players[p];
    const out = [];
    const seen = new Set();
    for (const c of pl.hand) {
      const sig = c.kind + (c.land ?? '') + (c.special ?? '');
      if (opts && opts.dedupe && seen.has(sig)) continue; seen.add(sig);
      out.push(...cardMoves(state, p, c, 'hand', opts));
    }
    const seenSide = new Set();
    for (const c of pl.side) {
      if (opts && opts.dedupe && seenSide.has(c.member)) continue; seenSide.add(c.member);
      out.push(...cardMoves(state, p, c, 'side', opts));
    }
    return out;
  }

  // ---------- effects (board only) ----------
  function findCard(state, p, id) {
    const pl = state.players[p];
    return pl.hand.find(c => c.id === id) || pl.side.find(c => c.id === id);
  }
  function applyEffect(board, cfg, p, card, k, choice) {
    const res = { flips: [], from: {}, extra: false, removed: null, placed: k };
    const flip = (n, fam) => { const t = top(board, n); if (canTake(t, p, fam, cfg)) { setTop(board, n, Object.assign({}, t, { owner: p })); res.flips.push(n); res.from[n] = t.owner; if (t.special === 'waystone') res.extra = true; } };
    const landMatch = (start, L) => {
      const seen = new Set([start]); const q = [start];
      while (q.length) { const c = q.pop(); for (const d of ORTHO_D) { const n = c + d; if (!seen.has(n) && landOf(top(board, n)) === L) { seen.add(n); flip(n); q.push(n); } } }
    };
    const familyCapture = (member, house, heirChoice, color) => {
      if (member === 'heir' || member === 'knave') { if (heirChoice != null) flip(heirChoice, true); }
      else for (const d of MEMBERS[member].dirs) flip(k + d, true);
      if (color && cfg.colorCapture) for (const d of ORTHO_D) { const t = top(board, k + d); if (t && t.kind === 'family' && t.house === house) flip(k + d, true); }
    };
    const base = { id: card.id, kind: card.kind, owner: p };
    if (card.kind === 'land') { pushTile(board, k, Object.assign(base, { land: card.land })); landMatch(k, card.land); return res; }
    if (card.kind === 'family') { pushTile(board, k, Object.assign(base, { member: card.member, house: card.house })); familyCapture(card.member, card.house, choice, true); return res; }
    const s = card.special; base.special = s;
    switch (s) {
      case 'lostcity': pushTile(board, k, base); break;
      case 'sinkhole': base.owner = null; pushTile(board, k, base); break;
      case 'sanctuary': base.owner = 'both'; pushTile(board, k, base); break;
      case 'usurp': {
        res.removed = board.get(k)[0]; board.delete(k);
        pushTile(board, k, { id: choice.cardId, kind: 'land', land: choice.land, owner: p });
        if (cfg.usurpMatch !== false) landMatch(k, choice.land); break;
      }
      case 'underminers': pushTile(board, k, base); if (choice != null) flip(choice); break;
      case 'earthquake': pushTile(board, k, base); if (choice) { const a = board.get(choice[0]), b = board.get(choice[1]); board.set(choice[0], b); board.set(choice[1], a); } break;
      case 'waystone': pushTile(board, k, base); res.extra = true; break;
    }
    return res;
  }

  // ---------- turn flow ----------
  function playMove(state, move) {
    if (state.over) return null;
    const p = state.turn, o = 1 - p, pl = state.players[p];
    const card = findCard(state, p, move.cardId);
    if (!card) throw new Error('card not in hand');
    const before = score(state.board, state.cfg);
    const res = applyEffect(state.board, state.cfg, p, card, move.pos, move.choice);
    const after = score(state.board, state.cfg);
    // remove card(s) from hand
    const rm = id => { let i = pl.hand.findIndex(c => c.id === id); if (i >= 0) return pl.hand.splice(i, 1)[0]; i = pl.side.findIndex(c => c.id === id); return i >= 0 ? pl.side.splice(i, 1)[0] : null; };
    rm(card.id);
    if (card.special === 'usurp') { rm(move.choice.cardId); state.discard.push(card); }
    if (res.removed) state.deck.unshift({ id: res.removed.id, kind: 'land', land: res.removed.land });
    const swing = (after.largest[p] - after.largest[o]) - (before.largest[p] - before.largest[o]);
    const play = { p, turn: state.turnNo, label: cardLabel(card), title: cardTitle(card), swing,
      mine: after.largest[p] - before.largest[p], theirs: after.largest[o] - before.largest[o], flips: res.flips.length };
    state.plays.push(play);
    if (state.leads) state.leads.push(after.largest[0] - after.largest[1]); // Midnight's kingdom lead after every play
    state.lastMove = { n: state.turnNo, p, pos: move.pos, flips: res.flips, from: res.from, removed: res.removed, card, choice: move.choice };
    state.log.push(play);
    while (pl.hand.length < state.cfg.handSize && state.deck.length) pl.hand.push(state.deck.pop());
    state.turnNo++;
    state.passes = 0;
    state.turn = res.extra ? p : o;
    checkEnd(state, false);
    return play;
  }

  function cardsLeft(state, p) { const pl = state.players[p]; return pl.hand.length + pl.side.length; }

  function checkEnd(state, initial) {
    const { cfg } = state;
    const end = r => { state.over = true; state.endReason = r; state.moves = []; finish(state); };
    if (!initial) {
      if (cfg.end.boardFull && state.board.size >= cfg.gridW * cfg.gridH) return end('Board full');
      if (cfg.end.deckEmpty && state.deck.length === 0) return end('Bag empty');
    }
    if (!state.deck.length && !cardsLeft(state, 0) && !cardsLeft(state, 1)) return end('Out of cards');
    for (let tries = 0; tries < 2; tries++) {
      state.moves = legalMoves(state, state.turn);
      if (state.moves.length) return;
      if (cfg.end.noValidPlay) return end('No valid play');
      state.log.push({ p: state.turn, pass: true, turn: state.turnNo });
      state.turn = 1 - state.turn;
    }
    end('Neither player can play');
  }

  function finish(state) {
    const s = score(state.board, state.cfg);
    state.final = s;
    const a = s.largest[0], b = s.largest[1] + (state.cfg.secondBonus | 0);
    s.adjusted = [a, b];
    let w = a > b ? 0 : b > a ? 1 : -1;
    if (w === -1 && state.cfg.tiebreak === 'total') w = s.total[0] > s.total[1] ? 0 : s.total[1] > s.total[0] ? 1 : -1;
    if (w === -1 && state.cfg.tiebreak === 'second') w = 1;
    state.winner = w;
  }

  // ---------- AI ----------
  const PERSONAS = {
    // hold: how much a persona values saving a capture card for a turn where it actually captures something
    greedy: { name: 'Greedy', blurb: 'Takes the biggest immediate swing every turn.', a: 0, hold: 0, look: 0, noise: 0.01 },
    builder: { name: 'Builder', blurb: 'Grows total territory and saves capture cards for big turns.', a: 0.35, hold: 0.8, look: 0, noise: 0.02 },
    cautious: { name: 'Cautious', blurb: 'Weighs the best reply the opponent could make, and doesn\u2019t waste capture cards.', a: 0.2, hold: 1.0, look: 1, noise: 0.01 },
    hoarder: { name: 'Hoarder', blurb: 'Holds Family and Specials until they can make a big play.', a: 0.2, hold: 1.8, look: 0, noise: 0.02 },
    chaotic: { name: 'Chaotic', blurb: 'Plays decent moves with a lot of randomness.', a: 0.1, hold: 0.3, look: 0, noise: 1.5 },
    random: { name: 'Random', blurb: 'Any legal move. Baseline for sanity checks.', random: true }
  };

  function evalBoard(board, p, a, cfg) {
    const s = score(board, cfg), o = 1 - p;
    return (s.largest[p] - s.largest[o]) + a * (s.total[p] - s.total[o]);
  }

  // Opponent reply estimate uses only public info: their Family sideboard plus one Land of each type not yet seen.
  function oppProxyCards(state, p) {
    const o = 1 - p, cards = [];
    const seenFam = new Set();
    for (const c of state.players[o].side) if (!seenFam.has(c.member)) { seenFam.add(c.member); cards.push(c); }
    const count = new Array(state.cfg.landSets).fill(state.cfg.landCopies);
    for (const st of state.board.values()) for (const t of st) if (t.kind === 'land') count[t.land]--;
    for (const c of state.players[p].hand) if (c.kind === 'land') count[c.land]--;
    count.forEach((n, L) => { if (n > 0) cards.push({ id: -1 - L, kind: 'land', land: L }); });
    return cards;
  }

  // Rough extra value of a card over a plain Land, from simulation averages.
  const HOLD = { advisor: 4, king: 2, queen: 2.5, heir: 2, knave: 2.5, usurp: 2, sinkhole: 1.5, underminers: 2, earthquake: 2, sanctuary: 1, waystone: 0.5, lostcity: 0.3 };
  function holdValue(card) { return card.kind === 'family' ? HOLD[card.member] || 2 : card.kind === 'special' ? HOLD[card.special] || 1 : 0; }

  function chooseMove(state, personaKey) {
    const per = PERSONAS[personaKey] || PERSONAS.greedy;
    const p = state.turn, rng = state.rng;
    const moves = legalMoves(state, p, { prune: true, dedupe: true });
    if (!moves.length) return null;
    if (per.random) return moves[Math.floor(rng() * moves.length)];
    const base = evalBoard(state.board, p, per.a, state.cfg);
    const progress = state.initialDeck ? state.deck.length / state.initialDeck : 0;
    const scored = moves.map(m => {
      const card = findCard(state, p, m.cardId);
      const b = new Map(state.board);
      const r = applyEffect(b, state.cfg, p, card, m.pos, m.choice);
      let v = evalBoard(b, p, per.a, state.cfg) - base;
      if (r.extra) v += 0.8;
      // Spending a capture card costs what it could have done later; late in the game that cost fades so cards get used.
      v -= (per.hold || 0) * holdValue(card) * Math.min(1, progress * 1.3);
      if (per.keep && card.kind === 'family') v -= per.keep * progress;
      if (card.special === 'usurp') v -= 0.3; // costs two cards
      v += per.noise * (rng() - 0.5);
      return { m, v, b };
    });
    scored.sort((x, y) => y.v - x.v);
    if (per.look) {
      const proxy = oppProxyCards(state, p), o = 1 - p;
      const K = Math.min(5, scored.length);
      for (let i = 0; i < K; i++) {
        const sc = scored[i];
        const fake = { cfg: state.cfg, board: sc.b, players: state.players };
        const before = evalBoard(sc.b, o, 0, state.cfg);
        let best = 0;
        for (const c of proxy) {
          for (const om of cardMoves(fake, o, c, 'x', { prune: true })) {
            const b2 = new Map(sc.b);
            applyEffect(b2, state.cfg, o, c, om.pos, om.choice);
            const sw = evalBoard(b2, o, 0, state.cfg) - before;
            if (sw > best) best = sw;
          }
        }
        sc.v -= per.look * 0.6 * best;
      }
      scored.sort((x, y) => y.v - x.v);
    }
    return scored[0].m;
  }

  // ---------- simulation ----------
  function playOut(cfg, seed, personas, maxTurns) {
    const st = newGame(cfg, seed);
    let guard = 0;
    while (!st.over && guard++ < (maxTurns || 400)) {
      const m = chooseMove(st, personas[st.turn]);
      if (!m) break;
      playMove(st, m);
    }
    if (!st.over) { st.over = true; st.endReason = 'Turn limit'; finish(st); }
    return st;
  }

  // ---------- comebacks and runaway leads ----------
  const CHECKS = [0.25, 0.5, 0.75];
  function addLeadStats(S, st) {
    const L = S.lead || (S.lead = { checks: CHECKS.map(() => ({ led: 0, leaderWon: 0, even: 0, gap: 0 })), bySize: [[0, 0], [0, 0], [0, 0]], changes: 0, decided: [], fromHalf: 0, halfBehindGames: 0, from3: 0, decidedGames: 0, maxDeficit: {} });
    const h = st.leads || [], n = h.length, w = st.winner;
    if (!n) return;
    CHECKS.forEach((f, i) => {
      const d = h[Math.max(0, Math.ceil(f * n) - 1)], c = L.checks[i];
      if (d === 0) { c.even++; return; }
      c.led++; c.gap += Math.abs(d);
      if (w === (d > 0 ? 0 : 1)) c.leaderWon++;
    });
    // at halfway, does the size of the lead matter? buckets: ahead by 1-2, 3-4, 5+
    const dh = h[Math.max(0, Math.ceil(0.5 * n) - 1)];
    if (dh) { const b = Math.abs(dh) <= 2 ? 0 : Math.abs(dh) <= 4 ? 1 : 2; L.bySize[b][0]++; if (w === (dh > 0 ? 0 : 1)) L.bySize[b][1]++; }
    let last = 0; for (const d of h) { const s = Math.sign(d); if (s && last && s !== last) L.changes++; if (s) last = s; }
    if (w === -1) return;
    const sgn = w === 0 ? 1 : -1;
    L.decidedGames++;
    let k = n - 1; while (k >= 0 && sgn * h[k] > 0) k--;      // last moment the eventual winner wasn't ahead
    L.decided.push((k + 1) / n);
    const half = h[Math.max(0, Math.ceil(0.5 * n) - 1)] * sgn;
    if (half < 0) L.fromHalf++;
    const worst = Math.min(0, ...h.map(d => d * sgn));
    if (worst <= -3) L.from3++;
    L.maxDeficit[-worst] = (L.maxDeficit[-worst] || 0) + 1;
  }
  function summarizeLeads(S) {
    const L = S.lead; if (!L) return null;
    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    return {
      checks: L.checks.map((c, i) => ({ at: CHECKS[i], leaderWins: c.led ? c.leaderWon / c.led : 0, even: c.even / S.games, avgLead: c.led ? c.gap / c.led : 0 })),
      leadChanges: L.changes / S.games,
      halfwayBySize: ['1\u20132', '3\u20134', '5+'].map((label, i) => ({ label, games: L.bySize[i][0] / S.games, leaderWins: L.bySize[i][0] ? L.bySize[i][1] / L.bySize[i][0] : 0 })),
      decidedAt: mean(L.decided),
      decidedLate: L.decided.filter(x => x >= 0.75).length / Math.max(1, L.decidedGames),
      comebackFromHalf: L.fromHalf / Math.max(1, L.decidedGames),
      comebackFrom3: L.from3 / Math.max(1, L.decidedGames),
      maxDeficit: L.maxDeficit
    };
  }

  function newStats() {
    return { games: 0, wins: {}, ties: 0, seatWins: [0, 0], endReasons: {}, turns: [], margins: [], scores: {}, cards: {}, unplayedFamily: 0, seconds: 0 };
  }
  function addCardStat(cs, label, play, won) {
    let c = cs[label];
    if (!c) c = cs[label] = { plays: 0, sum: 0, sq: 0, min: Infinity, max: -Infinity, flips: 0, mine: 0, theirs: 0, games: 0, gamesWon: 0, hist: {} };
    c.plays++; c.sum += play.swing; c.sq += play.swing * play.swing; c.flips += play.flips; c.mine += play.mine; c.theirs += play.theirs;
    if (play.swing < c.min) c.min = play.swing; if (play.swing > c.max) c.max = play.swing;
    c.hist[play.swing] = (c.hist[play.swing] || 0) + 1;
  }

  // personas: [keyA, keyB]. alternate = swap seats every other game.
  function runBatch(cfg, personas, n, seed, alternate, onProgress) {
    const S = newStats(); const t0 = Date.now();
    S.personas = personas.slice();
    if (personas[0] !== personas[1]) for (const k of personas) { S.wins[k] = 0; S.scores[k] = []; }
    if (personas[0] === personas[1]) { S.wins = { [personas[0] + ' (A)']: 0, [personas[1] + ' (B)']: 0 }; }
    const nameOf = idx => personas[0] === personas[1] ? personas[idx] + (idx ? ' (B)' : ' (A)') : personas[idx];
    for (let g = 0; g < n; g++) {
      const swap = alternate && g % 2 === 1;
      const seats = swap ? [personas[1], personas[0]] : [personas[0], personas[1]];
      const who = swap ? [1, 0] : [0, 1]; // seat -> persona index
      const st = playOut(cfg, (seed + g * 7919) >>> 0, seats);
      S.games++;
      S.endReasons[st.endReason] = (S.endReasons[st.endReason] || 0) + 1;
      S.turns.push(st.turnNo);
      S.margins.push(Math.abs(st.final.largest[0] - st.final.largest[1]));
      for (const seat of [0, 1]) { const nm = nameOf(who[seat]); (S.scores[nm] = S.scores[nm] || []).push(st.final.largest[seat]); }
      if (st.winner === -1) S.ties++; else { S.seatWins[st.winner]++; const nm = nameOf(who[st.winner]); S.wins[nm] = (S.wins[nm] || 0) + 1; }
      const playedBy = [new Set(), new Set()];
      for (const pl of st.plays) { addCardStat(S.cards, pl.label, pl); playedBy[pl.p].add(pl.label); }
      for (const seat of [0, 1]) for (const lab of playedBy[seat]) { const c = S.cards[lab]; c.games++; if (st.winner === seat) c.gamesWon++; }
      S.unplayedFamily += st.players[0].side.length + st.players[1].side.length;
      addLeadStats(S, st);
      if (onProgress && (g % 20 === 19 || g === n - 1)) onProgress(g + 1, n);
    }
    S.seconds = (Date.now() - t0) / 1000;
    return S;
  }

  function summarize(S) {
    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    const cards = Object.entries(S.cards).map(([label, c]) => {
      const m = c.sum / c.plays; const sd = Math.sqrt(Math.max(0, c.sq / c.plays - m * m));
      return { label, plays: c.plays, perGame: c.plays / S.games, mean: m, sd, min: c.min, max: c.max, flips: c.flips / c.plays,
        mine: c.mine / c.plays, theirs: c.theirs / c.plays, winWhenPlayed: c.games ? c.gamesWon / c.games : 0, hist: c.hist };
    }).sort((a, b) => b.mean - a.mean);
    const scores = {}; for (const [k, v] of Object.entries(S.scores)) scores[k] = { mean: mean(v), min: Math.min(...v), max: Math.max(...v) };
    const marginHist = {}; S.margins.forEach(m => marginHist[m] = (marginHist[m] || 0) + 1);
    return {
      games: S.games, seconds: S.seconds, wins: S.wins, ties: S.ties,
      firstSeatWinRate: S.seatWins[0] / S.games, secondSeatWinRate: S.seatWins[1] / S.games, tieRate: S.ties / S.games,
      endReasons: S.endReasons, turns: { mean: mean(S.turns), min: Math.min(...S.turns), max: Math.max(...S.turns) },
      margin: { mean: mean(S.margins), hist: marginHist }, scores, cards,
      unplayedFamilyPerGame: S.unplayedFamily / S.games,
      comeback: summarizeLeads(S)
    };
  }

  function reportText(sum, cfg, personas) {
    const pct = x => (100 * x).toFixed(1) + '%';
    const f = x => (x >= 0 ? '+' : '') + x.toFixed(2);
    const L = [];
    L.push(`Vye Duel simulation — ${sum.games} games, ${personas.join(' vs ')}, ${sum.seconds.toFixed(1)}s`);
    L.push(`Config: ${cfg.landSets} land sets × ${cfg.landCopies}, grid ${cfg.gridW}×${cfg.gridH}, hand ${cfg.handSize}, stacking ${cfg.stacking}, start ${cfg.start}`);
    L.push(`Family Blue: ${famStr(cfg.family[0])} | Red: ${famStr(cfg.family[1])}`);

  img.addEventListener('error', () => { img.remove(); el.classList.remove('has-art'); });
  el.classList.add('has-art'); el.prepend(img);
}
// House sigil (owl or rose) as an inline SVG. o: 0 Midnight, 1 Roses, 'both' = none
function sigEl(cls, o) {
  const el = h('span', { class: cls });
  if (o === 0 || o === 1) el.innerHTML = VyeTiles.sigilSvg(o === 0 ? 'b' : 'r', 'currentColor');
  return el;
}
function tileEl(t, owner) {
  if (tileStyle === 'icons' && window.VyeTiles) return iconTile(t, owner);
  let el;
  if (t.kind === 'land') {
    const L = E.LANDS[t.land];
    el = h('div', { class: 'tile land', style: '--lc:' + L.color }, h('span', { class: 'g' }, L.glyph), h('span', { class: 'n' }, L.name));
  } else if (t.kind === 'family') {
    el = h('div', { class: 'tile fam' }, patEl(t.member), h('span', { class: 'n' }, E.MEMBERS[t.member].name), h('span', { class: 'n', style: 'opacity:.6;margin-top:0' }, E.HOUSES[t.house].short));
  } else if (t.kind === 'special') {
    const S = E.SPECIALS[t.special];
    el = h('div', { class: 'tile spec ' + t.special }, h('span', { class: 'g' }, SPEC_GLYPH[t.special]), h('span', { class: 'n' }, S.name));
  } else el = h('div', { class: 'tile start' }, h('span', { class: 'g' }, '✣'), h('span', { class: 'n' }, 'Crossroads'));
  addArt(el, t);
  el.title = E.cardTitle(t);
  const o = owner === undefined ? t.owner : owner;
  if (o === 0 || o === 1 || o === 'both') {

}
function cardDesc(c) {
  if (c.kind === 'land') return `${E.LANDS[c.land].name}: matches adjacent ${E.LANDS[c.land].name} and flips the whole chain.`;
  if (c.kind === 'family') return `${E.MEMBERS[c.member].name}: ${E.MEMBERS[c.member].rule}` + (cfg.colorCapture ? ' Also flips adjacent same-house Family.' : '');
  return `${E.SPECIALS[c.special].name}: ${specialRule(c.special)}`;
}
function specialRule(s) {
  if (s === 'lostcity') return `Cover a Land you own. Worth ${cfg.lostCityValue ?? 2} points in your kingdom.`;
  if (s === 'usurp') return cfg.usurpMatch === false ? 'Swap a Land on the board for a Land from your hand. It takes that space only, with no matching. Old Land goes under the bag.' : 'Swap a Land on the board for a Land from your hand, then match. Old Land goes under the bag.';

// ---------- play ----------
const seats = store.get('vyeMicro.seats', ['human', 'cautious']);
// Seconds the AI waits before each move (after any animation). Set on the Setup tab; kept per browser, not part of the rules config.
let aiPause = +store.get('vyeMicro.aiPause', 1.5);
if (!(aiPause >= 0)) aiPause = 1.5;
let reveal = false;
let revealBag = false;
let G = null;            // game state
let history = [];        // snapshots before human moves
let ui = { sel: null, pos: null, phase: null, eqA: null };
let aiTimer = null, paused = false;
let gameSeed = Math.floor(Math.random() * 1e6);

function snapshot(s) {
  return { board: new Map(s.board), deck: s.deck.slice(), players: s.players.map(p => ({ hand: p.hand.slice(), side: p.side.slice() })), discard: s.discard.slice(),
    turn: s.turn, turnNo: s.turnNo, passes: s.passes, over: s.over, endReason: s.endReason, winner: s.winner, final: s.final, plays: s.plays.slice(), log: s.log.slice(), lastMove: s.lastMove, moves: s.moves };
}
function restore(s, snap) { Object.assign(s, snap, { board: new Map(snap.board), deck: snap.deck.slice(), players: snap.players.map(p => ({ hand: p.hand.slice(), side: p.side.slice() })) }); }

function newGame(seed) {
  clearTimeout(aiTimer); paused = false;
  gameSeed = seed != null ? seed : Math.floor(Math.random() * 1e6);
  G = E.newGame(cfg, gameSeed); history = []; ui = { sel: null, pos: null, phase: null, eqA: null }; animatedN = -1; animBusyUntil = 0;
  sfx('shuffle'); renderPlay(); scheduleAI();
}
const isHuman = p => seats[p] === 'human';
function scheduleAI() {
  clearTimeout(aiTimer);
  if (!G || G.over || isHuman(G.turn) || paused) return;
  aiTimer = setTimeout(() => {
    if (!G || G.over || isHuman(G.turn) || paused) return;
    const m = E.chooseMove(G, seats[G.turn]);
    if (m) { animFrom = sourceRect(G.turn, m.cardId); E.playMove(G, m); }
    renderPlay(); scheduleAI();
  }, Math.max(0, animBusyUntil - performance.now()) + aiPause * 1000);
}
function humanPlay(move) {
  animFrom = sourceRect(G.turn, move.cardId);
  history.push(snapshot(G));
  E.playMove(G, move);
  ui = { sel: null, pos: null, phase: null, eqA: null };
  renderPlay(); scheduleAI();
}
function undo() {
  if (!history.length) return;
  clearTimeout(aiTimer);
  restore(G, history.pop()); animatedN = G.lastMove ? G.lastMove.n : -1;
  ui = { sel: null, pos: null, phase: null, eqA: null };
  renderPlay();
}

function selCard() { if (!ui.sel || !G) return null; return E.findCard(G, G.turn, ui.sel); }
function movesFor() { return G.moves.filter(m => m.cardId === ui.sel); }

function clickCell(k) {
  if (!ui.sel) return;
  const card = selCard(); const ms = movesFor();
  if (ui.phase === null) {
    const pm = ms.filter(m => m.pos === k); if (!pm.length) return;
    if (!pm.some(m => m.choice != null)) return humanPlay(pm[0]);
    ui.pos = k;
    if (card.special === 'usurp') ui.phase = 'usurp';
    else if (card.special === 'earthquake') ui.phase = 'eqA';
    else ui.phase = 'cell';
    sfx('tick'); return renderPlay();
  }
  const pm = ms.filter(m => m.pos === ui.pos);
  if (ui.phase === 'cell') { const m = pm.find(m => m.choice === k); if (m) humanPlay(m); return; }
  if (ui.phase === 'eqA') { if (pm.some(m => m.choice && m.choice.includes(k))) { ui.eqA = k; ui.phase = 'eqB'; sfx('tick'); renderPlay(); } return; }
  if (ui.phase === 'eqB') { const m = pm.find(m => m.choice && m.choice.includes(ui.eqA) && m.choice.includes(k) && k !== ui.eqA); if (m) humanPlay(m); return; }
}

function targetsNow() {
  if (!G || G.over || !isHuman(G.turn) || !ui.sel) return new Set();
  const ms = movesFor();
  if (ui.phase === null) return new Set(ms.map(m => m.pos));
  const pm = ms.filter(m => m.pos === ui.pos);
  if (ui.phase === 'cell') return new Set(pm.map(m => m.choice).filter(c => c != null));
  if (ui.phase === 'eqA') { const s = new Set(); pm.forEach(m => m.choice && m.choice.forEach(c => s.add(c))); return s; }
  if (ui.phase === 'eqB') { const s = new Set(); pm.forEach(m => { if (m.choice && m.choice.includes(ui.eqA)) m.choice.forEach(c => { if (c !== ui.eqA) s.add(c); }); }); return s; }
  return new Set();
}

function usurpPick(c) {
  const m = movesFor().find(m => m.pos === ui.pos && m.choice && m.choice.land === c.land);
  if (m) humanPlay(Object.assign({}, m, { choice: { cardId: c.id, land: c.land } }));
}

// The board always takes the room of the biggest board it can show (limit + 1 each way, since a board one short of
// the limit can still grow on either side), so nothing around it moves as tiles go down. fit: {w, h} box in px (stage).
function renderBoard(fit) {
  const b = G.board;
  const cs = b.size ? E.bbox(b) : { x0: 0, x1: 0, y0: 0, y1: 0 };
  const open = new Set(G.over ? [] : E.placeCells(G));
  let x0 = cs.x0, x1 = cs.x1, y0 = cs.y0, y1 = cs.y1;
  for (const k of open) { x0 = Math.min(x0, E.kx(k)); x1 = Math.max(x1, E.kx(k)); y0 = Math.min(y0, E.ky(k)); y1 = Math.max(y1, E.ky(k)); }
  if (ui.pos != null) { x0 = Math.min(x0, E.kx(ui.pos)); x1 = Math.max(x1, E.kx(ui.pos)); y0 = Math.min(y0, E.ky(ui.pos)); y1 = Math.max(y1, E.ky(ui.pos)); }
  const cols = x1 - x0 + 1, rows = y1 - y0 + 1;
  const phone = window.innerWidth <= 700, gap = phone ? 4 : 5;
  const NX = Math.max(cols, (G.cfg.gridW | 0) + 1), NY = Math.max(rows, (G.cfg.gridH | 0) + 1);
  let cell;
  if (fit) cell = Math.max(24, Math.min(96, Math.floor(Math.min((fit.w - gap * (NX - 1)) / NX, (fit.h - gap * (NY - 1)) / NY))));
  else {
    const vw = ($('#view-play') || document.body).clientWidth;
    const oneCol = window.matchMedia('(max-width: 900px), (pointer: coarse) and (max-height: 600px)').matches;
    const avail = phone ? vw - 12 : Math.min(vw - 40, 720);
    // also fit the window's height (the hands, scores and help line take about 480px), so the whole table shows at once
    const vt = Math.max(0, ($('#view-play') || document.body).getBoundingClientRect().top);
    const availH = phone ? Infinity : window.innerHeight - vt - 500;
    cell = Math.max(phone ? 30 : 44, Math.min(86, Math.floor((avail - gap * (NX - 1)) / NX), Math.floor((availH - gap * (NY - 1)) / NY)));
  }
  const tg = targetsNow();
  const lm = G.lastMove; const flipped = new Set(lm ? lm.flips : []);
  const grid = h('div', { class: 'board', style: `grid-template-columns: repeat(${cols}, ${cell}px); --cell:${cell}px` });
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const k = E.key(x, y); const st = b.get(k);
    const cls = ['cell'];
    if (!st) cls.push('empty'); if (!st && open.has(k)) cls.push('open');
    if (tg.has(k)) cls.push('target');
    if (ui.phase && ui.pos === k && st) cls.push('chosen');
    if (st && st.length > 1) cls.push('stacked');
    if (lm && lm.pos === k) cls.push('last');
    if (flipped.has(k)) cls.push('flipped');
    const c = h('div', { class: cls.join(' '), 'data-k': k, onclick: () => clickCell(k), title: st ? st.slice().reverse().map(E.cardTitle).join(' over ') : null });
    if (st) {
      c.append(tileEl(st[st.length - 1]));
      if (st.length > 1) c.append(h('span', { class: 'stack' }, '×' + st.length));
    } else if (ui.pos === k && ui.phase) {
      c.classList.add('ghost'); c.append(tileEl(selCard(), G.turn));
    }
    grid.append(c);
  }
  return h('div', { class: 'boardbox', style: `width:${NX * cell + gap * (NX - 1)}px;height:${NY * cell + gap * (NY - 1)}px` }, grid);
}

function promptEl() {
  if (G.over) return h('div', { class: 'prompt' }, h('span', null, 'Game over · ' + resultLine()), h('button', { class: 'btn', onclick: () => { ui.hideEnd = false; renderPlay(); } }, 'Show result'));
  const p = G.turn; const who = h('span', { class: 'who p' + p }, E.HOUSES[p].short);
  // whose turn it is shows as the gold border on their hand; the prompt only gives instructions mid-play
  if (!isHuman(p)) return h('div', { class: 'prompt' });
  const card = selCard();
  if (!card) return h('div', { class: 'prompt' });
  // no Cancel / Back: tapping the chosen tile in your hand again puts it back
  const pm = movesFor().filter(m => m.pos === ui.pos);
  if (ui.phase === 'usurp') return h('div', { class: 'prompt' }, h('span', null, 'Usurp: tap the Land from your hand to put in its place.'));
  if (ui.phase === 'cell') return h('div', { class: 'prompt' }, 'Choose the tile to flip.');
  if (ui.phase === 'eqA') return h('div', { class: 'prompt' }, 'Earthquake: pick the first tile to swap.', h('button', { class: 'btn', onclick: () => humanPlay(pm.find(m => m.choice === null)) }, 'No swap'));
  if (ui.phase === 'eqB') return h('div', { class: 'prompt' }, 'Pick the second tile.');
  return h('div', { class: 'prompt' });   // the card's rules (shown with it) are enough here
}

function handEl(p, other) {
  const pl = G.players[p];
  const mine = isHuman(p) && G.turn === p && !G.over;
  const show = isHuman(p) || reveal || G.over;
  const playable = new Set(mine ? G.moves.map(m => m.cardId) : []);
  const cardBtn = c => {
    const picking = mine && ui.phase === 'usurp';
    const pickable = picking && c.kind === 'land' && movesFor().some(m => m.pos === ui.pos && m.choice && m.choice.land === c.land);
    const ok = picking ? pickable || ui.sel === c.id : playable.has(c.id);
    const b = h('button', { 'data-cid': c.id, class: 'hcard' + (ui.sel === c.id ? ' sel' : '') + (pickable ? ' pick' : '') + (mine && !ok ? ' dead' : ''), title: cardDesc(c), 'aria-label': E.cardTitle(c),
      onclick: () => { if (!mine || !ok) return; if (pickable) return usurpPick(c); sfx(ui.sel === c.id ? 'put' : 'pick'); ui = { sel: ui.sel === c.id ? null : c.id, pos: null, phase: null, eqA: null }; renderPlay(); } });
    b.append(tileEl(c, p)); return b;
  };
  return h('div', { class: 'hand-area' + (other ? ' other' : '') + (G.turn === p && !G.over ? ' turn' : ''), 'data-p': p },
    h('div', { class: 'hand-label' }, h('span', { class: 'dot p' + p }), `${E.HOUSES[p].short} hand`),
    h('div', { class: 'hand' }, show ? pl.hand.map(cardBtn) : pl.hand.map(() => h('span', { class: 'hcard back' })),
      pl.side.length ? h('span', { style: 'width:14px' }) : null, pl.side.map(cardBtn)));
}

// Second-player bonus ("first player must win by 2") shown next to Roses' score.
function bonusTag() {
  const b = cfg.secondBonus | 0, tie = cfg.tiebreak === 'second';
  if (!b && !tie) return null;
  const tip = `Roses went second, so ${b ? `Roses get +${b} at the end` : ''}${b && tie ? ' and ' : ''}${tie ? 'win ties' : ''}. Midnight has to win by ${b + (tie ? 1 : 0) + (b || tie ? 0 : 1)} or more.`;
  return h('span', { class: 'bonus', 'data-tip': tip, tabindex: '0' }, b ? `+${b}` : 'wins ties');
}
function resultLine() {
  const [a, b] = G.final.largest, w = G.winner;
  if (w === -1) return `Tie at ${a}`;
  return `${E.HOUSES[w].short} wins (${a} to ${b}` + ((cfg.secondBonus | 0) ? `, Roses +${cfg.secondBonus}` : '') + ')';
}
function resultWhy() {
  const [a, b] = G.final.largest, bonus = cfg.secondBonus | 0, adj = b + bonus, w = G.winner;
  const tie = cfg.tiebreak === 'second';
  let s = `Midnight ${a}, Roses ${b}`;
  if (bonus) s += ` + ${bonus} second-player bonus = ${adj}`;
  s += '. ';
  if (w === 1 && a > b) s += a === adj ? 'That\u2019s a tie, and ties go to the second player, so Roses win. Midnight needed to win by 2.' : 'The bonus puts Roses ahead. Midnight needed to win by 2.';
  else if (w === 1 && a === b && tie) s += 'Ties go to the second player.';
  else if (w === 0 && bonus) s += 'Midnight won by enough to beat the bonus.';
  else if (w === -1 && cfg.tiebreak === 'total') s += 'Still tied on total tiles.';
  else if (w !== -1 && a === adj && cfg.tiebreak === 'total') s += 'Tied, so it went to whoever owns more tiles in total.';
  return s;
}

function countsEl() {
  let tiles = 0; for (const st of G.board.values()) tiles += st.length;
  const P = G.players, row = (label, a, b, cls) => [h('span', { class: cls }, label), h('span', { class: 'num ' + (cls || '') }, a), h('span', { class: 'num ' + (cls || '') }, b)];
  const total = tiles + G.deck.length + G.discard.length + P[0].hand.length + P[1].hand.length + P[0].side.length + P[1].side.length;
  const covered = tiles - G.board.size;
  return h('div', { class: 'counts' },
    row('Tiles', sigEl('sigi p0c', 0), sigEl('sigi p1c', 1), 'hd'),
    row(covered ? `On board (${covered} covered)` : 'On board', String(tiles), '', ''),
    row('Spaces filled', `${G.board.size} of ${cfg.gridW * cfg.gridH}`, '', ''),
    row('In the bag', String(G.deck.length), '', ''),
    revealBag && G.deck.length ? row((n => `${n} Land${n === 1 ? '' : 's'}`)(G.deck.filter(c => c.kind === 'land').length) + G.deck.filter(c => c.kind !== 'land').map(c => ', ' + E.SPECIALS[c.special].name).join(''), '', '', 'sub') : [],
    row('In hand', h('span', { class: 'p0c' }, String(P[0].hand.length)), h('span', { class: 'p1c' }, String(P[1].hand.length))),
    row('Sideboard', h('span', { class: 'p0c' }, String(P[0].side.length)), h('span', { class: 'p1c' }, String(P[1].side.length))),
    G.discard.length ? row('Discarded', String(G.discard.length), '', '') : [],
    row(`Total · turn ${G.turnNo + 1}`, String(total), '', 'tot'));
}

// ---------- play animations ----------
// ---------- sound ----------
// All synthesized with Web Audio (no files). The context wakes on the first tap or key press, as browsers require.
let soundOn = store.get('vyeMicro.sound', true);
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  const ctx = () => {
    if (!soundOn) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC(); master = ac.createGain(); master.gain.value = .45; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  // one pitched blip: from freq f0 to f1 over dur seconds, starting `at` seconds from now
  const tone = (f0, f1, dur, vol = .3, type = 'sine', at = 0) => {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  };
  // filtered noise: a whoosh (bandpass sweep f0 -> f1) or a rumble (lowpass)
  const noise = (dur, f0, f1, vol = .25, kind = 'bandpass', at = 0) => {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + at, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = kind; f.Q.value = kind === 'bandpass' ? 1.2 : .7;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  };
  const N = { C4: 262, D4: 294, E4: 330, G4: 392, A4: 440, C5: 523, D5: 587, E5: 659, G5: 784, A5: 880, C6: 1047 };
  const S = {
    pick: () => tone(620, 880, .07, .22, 'sine'),
    put: () => tone(760, 520, .07, .18, 'sine'),
    tick: () => tone(520, 520, .045, .18, 'triangle'),
    swish: () => noise(.2, 500, 2200, .22),
    land: () => { tone(150, 55, .12, .5, 'sine'); noise(.05, 1800, 900, .18, 'bandpass'); },
    flip: (i = 0) => { const f = [N.C5, N.D5, N.E5, N.G5, N.A5, N.C6][i % 6]; tone(f, f * 1.02, .09, .2, 'triangle'); noise(.04, 3000, 1500, .06); },
    cover: () => { tone(N.G4, N.G4, .18, .16, 'triangle'); tone(N.C5, N.C5, .3, .16, 'triangle', .1); },
    usurp: () => { tone(N.E5, N.E5, .12, .2, 'square', 0); tone(N.C5, N.C5, .12, .2, 'square', .1); tone(N.G5, N.G5, .2, .2, 'square', .2); },
    lostcity: () => [N.C4, N.E4, N.G4, N.C5].forEach((f, i) => tone(f, f, .5, .18, 'sine', i * .09)),
    sinkhole: () => { tone(320, 45, .7, .4, 'sine'); noise(.7, 700, 80, .3, 'lowpass'); },
    quake: () => { noise(1.1, 140, 40, .55, 'lowpass'); for (let i = 0; i < 6; i++) tone(70 + (i % 2) * 8, 45, .14, .3, 'sine', i * .17); },
    shuffle: () => [0, .07, .14, .21].forEach(d => noise(.06, 1500, 3500, .12, 'bandpass', d)),
    win: () => [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(f, f, .45, .25, 'triangle', i * .13)),
    lose: () => [N.G4, N.E4, N.D4, N.C4].forEach((f, i) => tone(f, f * .99, .5, .22, 'sine', i * .18)),
    tie: () => { tone(N.E5, N.E5, .4, .2, 'triangle'); tone(N.G4, N.G4, .6, .2, 'triangle', .2); }
  };
  const play = (name, ...args) => { try { S[name](...args); } catch (e) {} };
  // browsers want a user gesture before audio can start
  const wake = () => { if (soundOn) ctx(); };
  addEventListener('pointerdown', wake, { once: true }); addEventListener('keydown', wake, { once: true });
  return play;
})();
// Sounds for the move just played, timed to match runAnim (same timings; with animations off they all land at once).
function moveSounds(lm) {
  if (!soundOn) return;
  const D = animOn ? (aiPause < 0.5 ? 280 : 500) : 0;
  const card = lm.card, removed = lm.removed, flips = lm.flips || [];
  const st = G.board.get(lm.pos) || [];
  const covering = !removed && st.length > 1 && card.kind === 'special' && card.special !== 'usurp';
  const eq = card.special === 'earthquake' && lm.choice;
  const showcase = animOn && card.kind === 'special' && (covering || !!removed || !!eq);
  const total = showcase ? D + 1300 + D : D;
  const at = (ms, fn) => ms <= 0 ? fn() : setTimeout(fn, ms);
  if (animOn) sfx('swish');
  if (showcase) at(D, () => sfx(removed ? 'usurp' : 'cover'));
  at(total, () => {
    sfx('land');

    self.postMessage({ type: 'matrix', out, keys });
  }
};`;
}
function startWorker(msg) {
  if (simWorker) simWorker.terminate();
  try {
    simWorker = new Worker(URL.createObjectURL(new Blob([workerSrc()], { type: 'text/javascript' })));
  } catch (e) { simWorker = null; }
  const bar = $('#sim-bar'), lbl = $('#sim-status');
  const onMsg = d => {
    if (d.type === 'progress') { bar.style.width = (100 * d.i / d.n) + '%'; lbl.textContent = `${d.i} of ${d.n}`; }
    if (d.type === 'done') { simResult = { sum: d.sum, text: d.text, cfg: JSON.parse(JSON.stringify(cfg)), personas: msg.personas }; simWorker = null; renderSim(); }
    if (d.type === 'matrix') { matrixResult = d; simWorker = null; renderSim(); }
  };
  if (simWorker) { simWorker.onmessage = e => onMsg(e.data); simWorker.postMessage(msg); }
  else { // fallback: run on the main thread
    setTimeout(() => {
      if (msg.type === 'batch') { const S = E.runBatch(msg.cfg, msg.personas, msg.n, msg.seed, msg.alt); const sum = E.summarize(S); onMsg({ type: 'done', sum, text: E.reportText(sum, msg.cfg, msg.personas) }); }
    }, 30);
  }
  renderSimRunning();
}
function renderSimRunning() { const b = $('#sim-run'), m = $('#sim-matrix'); if (b) b.disabled = true; if (m) m.disabled = true; $('#sim-status').textContent = 'Starting…'; }

const TIPS = {
  first: 'How often the player who went first won. In a fair game this sits near the second player’s number.',
  second: 'How often the player who went second won.',
  ties: 'Games where both kingdoms ended the same size.',
  turns: 'Average number of turns in a game, counting both players.',
  margin: 'How many tiles the winner usually won by. Small means close games. Big means blowouts.',
  kingdom: 'Average size of each side’s biggest connected group at the end.',
  card: 'The card that was played. Hover a row for a plain-English summary of that card.',
  plays: 'How often this card got played per game, counting both players. 2.00 means each player played it about once.',
  mean: 'The typical result. On average, one play of this card moved the race this many tiles your way. A plain Land is about +1.',
  sd: 'Spread (standard deviation): how predictable it is. Under 1 means it does about the same thing every time. Over 2 means it’s a gamble: sometimes huge, sometimes nothing.',
  min: 'The worst single play of this card across all the games.',

  range: 'The line runs from worst to best play. The shaded band is where most plays landed. The dot is the typical play.',

function rowTip(c, landMean) {
  const x = landMean > 0 ? c.mean / landMean : 0;
  const strength = c.label === 'Land' ? 'This is the yardstick everything else is compared to.'
    : x >= 3 ? `That’s about ${x.toFixed(1)}× a plain Land, which is a lot.`
    : x >= 1.6 ? `That’s about ${x.toFixed(1)}× a plain Land.`
    : x >= 0.7 ? 'About the same as a plain Land.' : 'Less than a plain Land, at least in the race for the biggest kingdom.';
  const pred = c.sd < 0.6 ? 'It does nearly the same thing every time.' : c.sd < 1.5 ? 'It’s fairly predictable.' : c.sd < 2.5 ? 'Results vary a fair bit.' : 'It’s a gamble: results vary wildly.';
  const win = c.winWhenPlayed >= 0.56 ? 'Players who used it won more often than not.' : c.winWhenPlayed <= 0.44 ? 'Players who used it usually lost.' : 'Using it doesn’t change who wins much.';
