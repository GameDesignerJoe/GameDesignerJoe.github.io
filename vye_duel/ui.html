<title>Vye Duel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a game table. Header with tabs, then one working surface per tab: Setup (config panels), Play (board + side rail), Simulate (controls + results). */
:root {
  --bg: #E6E9EC; --surface: #F5F6F7; --sunk: #DADFE4; --ink: #1A2027; --muted: #5A6470; --line: #C4CBD3;
  --brass: #8E6610; --brass-soft: #F1E2BC;
  --blue: #2C5AA5; --blue-soft: #D7E2F4; --red: #B13939; --red-soft: #F4DADA;
  --good: #2F7A4C; --warn: #A3641A;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --cell: 72px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161B; --surface: #1B2128; --sunk: #232B34; --ink: #E5E8EC; --muted: #98A2AE; --line: #303A45;
  --brass: #D6A642; --brass-soft: #3A3020; --blue: #6F99E2; --blue-soft: #1E2D47; --red: #E27474; --red-soft: #452525;
  --good: #63BE86; --warn: #E0A050; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161B; --surface: #1B2128; --sunk: #232B34; --ink: #E5E8EC; --muted: #98A2AE; --line: #303A45;
  --brass: #D6A642; --brass-soft: #3A3020; --blue: #6F99E2; --blue-soft: #1E2D47; --red: #E27474; --red-soft: #452525;
  --good: #63BE86; --warn: #E0A050; color-scheme: dark }

* { box-sizing: border-box; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }

/* header */
header.top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 18px 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.mark { display: flex; align-items: baseline; gap: 10px; }
.mark h1 { font-size: 30px; line-height: 1; }
.mark .ed { font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
nav.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h2 { font-size: 19px; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.grid-setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl b { font-weight: 500; }
.row .lbl small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.chip { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); vertical-align: 2px; margin-left: 4px; }
.chip.new { background: var(--brass-soft); color: var(--brass); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.stepper button { width: 30px; height: 30px; border: 0; background: var(--sunk); cursor: pointer; font-size: 17px; line-height: 1; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 32px; text-align: center; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13.5px; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--brass); }
.fam-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.fam-cols h3 { font-size: 15px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.p0 { background: var(--blue); } .dot.p1 { background: var(--red); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 4px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.stat .v { font-size: 22px; font-weight: 700; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.note { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; margin-top: 10px; }
.note.warn { background: var(--brass-soft); color: var(--warn); }
.note.ok { background: var(--sunk); color: var(--muted); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.presets .k { color: var(--muted); font-size: 13px; margin-right: 4px; }

/* play */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .play { grid-template-columns: 1fr; } .fam-cols { grid-template-columns: 1fr; } }
.table { background: var(--sunk); border-radius: 14px; padding: 18px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.prompt { min-height: 36px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 14.5px; text-align: center; }
.prompt .who { font-family: var(--display); font-weight: 700; font-size: 17px; }
.prompt .who.p0 { color: var(--blue); } .prompt .who.p1 { color: var(--red); }
.board { display: grid; gap: 5px; }
.cell { width: var(--cell); height: var(--cell); border-radius: 9px; position: relative; }
.cell.empty { border: 1px dashed transparent; }
.cell.empty.open { border-color: var(--line); }
.cell.target { cursor: pointer; }
.cell.empty.target { border: 2px dashed var(--brass); background: color-mix(in srgb, var(--brass) 10%, transparent); }
.cell.target:not(.empty) { outline: 3px solid var(--brass); outline-offset: 2px; }
.cell.target:hover { filter: brightness(1.08); }
.tile { position: absolute; inset: 0; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #fff; text-align: center; user-select: none; }
.tile .g { font-size: calc(var(--cell) * .38); line-height: 1; }
.tile .n { font-size: calc(var(--cell) * .135); line-height: 1.05; margin-top: 3px; font-weight: 500; padding: 0 3px; }
.tile.land { background: var(--lc); }
.tile.fam, .tile.spec, .tile.start { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.tile.spec .g { color: var(--brass); }
.tile.start .g { color: var(--muted); }
.tile.sinkhole { background: #3A3F46; color: #C9CED4; border-color: #3A3F46; }
.tile.sinkhole .g { color: #C9CED4; }
.pat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: calc(var(--cell) * .38); height: calc(var(--cell) * .38); }
.pat i { border-radius: 2px; background: var(--line); }
.pat i.on { background: var(--brass); }
.pat i.me { background: var(--ink); }
.pat i.opt { background: color-mix(in srgb, var(--brass) 40%, transparent); }
/* ownership: outline frame + sigil */
.own { position: absolute; inset: 0; border-radius: 9px; pointer-events: none; }
.own.p0 { box-shadow: inset 0 0 0 4px var(--blue); }
.own.p1 { box-shadow: inset 0 0 0 4px var(--red); }
.own.both { box-shadow: inset 0 0 0 4px var(--blue), inset 0 0 0 7px var(--red); }
.sig { position: absolute; top: 4px; right: 4px; width: calc(var(--cell) * .27); height: calc(var(--cell) * .27); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--cell) * .17); color: #fff; line-height: 1; }
.sig.p0 { background: var(--blue); } .sig.p1 { background: var(--red); }
.sig.both { background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
.stack { position: absolute; bottom: 3px; left: 4px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; padding: 0 5px; border-radius: 4px; }
.cell.stacked::before { content: ""; position: absolute; inset: 0; transform: translate(3px, 3px); border-radius: 9px; background: var(--line); }
.cell.last .tile { animation: pop .35s ease-out; }
.cell.flipped .tile { animation: flip .5s ease-out; }
.cell.last::after { content: ""; position: absolute; inset: -4px; border-radius: 12px; border: 2px solid var(--ink); opacity: .55; pointer-events: none; }
.cell.ghost .tile { opacity: .65; }
@keyframes pop { from { transform: scale(.7); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
@media (prefers-reduced-motion: reduce) { .cell .tile, .hcard.pick { animation: none !important; } }

.hand-area { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.hand-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
.hand { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.hcard { width: 78px; height: 78px; border-radius: 10px; position: relative; cursor: pointer; border: 0; padding: 0; background: none; --cell: 78px; }
.hcard.sel { outline: 3px solid var(--brass); outline-offset: 3px; }
.cell.chosen::after { content: ""; position: absolute; inset: -5px; border-radius: 13px; border: 3px solid var(--brass); pointer-events: none; }
.hcard.pick { outline: 3px dashed var(--brass); outline-offset: 3px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-3px); } }
.bag { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 13.5px; color: var(--muted); cursor: help; }
.bag-label { font-weight: 500; }
.bag.low .bag-label { color: var(--warn); }
.pips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 360px; }
.pips i { width: 7px; height: 11px; border-radius: 2px; border: 1px solid var(--line); }
.pips i.on { background: var(--brass); border-color: var(--brass); }
.bag.low .pips i.on { background: var(--warn); border-color: var(--warn); }
.counts { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-size: 13.5px; margin-bottom: 12px; }
.counts .hd { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.counts .num { text-align: right; }
.counts .tot { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 700; }
.hcard.dead { opacity: .4; cursor: not-allowed; }
.hcard.back { background: repeating-linear-gradient(45deg, var(--line) 0 6px, var(--sunk) 6px 12px); cursor: default; border: 1px solid var(--line); }
.cardinfo { font-size: 13.5px; color: var(--muted); text-align: center; max-width: 520px; min-height: 20px; }
.choices { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.rail { display: flex; flex-direction: column; gap: 14px; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pscore { border-radius: 10px; padding: 10px 12px; border: 2px solid transparent; }
.pscore.p0 { background: var(--blue-soft); } .pscore.p1 { background: var(--red-soft); }
.pscore.active.p0 { border-color: var(--blue); } .pscore.active.p1 { border-color: var(--red); }
.pscore .nm { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; }
.pscore .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
.pscore .sm { font-size: 12.5px; color: var(--muted); }
.seat { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
select { font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.seed { width: 92px; font: inherit; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.log .e { display: flex; gap: 8px; align-items: baseline; }
.log .e .t { color: var(--muted); width: 22px; flex: none; text-align: right; font-size: 12px; }
.log .e .sw { margin-left: auto; font-weight: 700; flex: none; }
.p0c { color: var(--blue); } .p1c { color: var(--red); }
.endcard { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); border-radius: 14px; z-index: 5; }
.endcard .box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: 90%; }
.endcard h2 { font-size: 26px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); justify-content: center; }

/* simulate */
.simgrid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .simgrid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.persona-blurb { font-size: 12.5px; color: var(--muted); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; margin: 10px 0; }
.progress i { display: block; height: 100%; background: var(--brass); width: 0; transition: width .15s; }
.results { display: flex; flex-direction: column; gap: 16px; }
.winbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; font-size: 12.5px; font-weight: 700; color: #fff; }
.winbar span { display: grid; place-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.rng { text-align: left; }
.flag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.flag.hot { background: var(--red-soft); color: var(--red); }
.flag.flat { background: var(--sunk); color: var(--muted); }
pre.report { background: var(--sunk); border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; margin: 8px 0 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.matrix td, .matrix th { text-align: center; }
.empty-results { color: var(--muted); padding: 30px 10px; text-align: center; }
.tray { display: contents; }
.tray .prompt { order: -1; }
.mscore { display: none; }
button, .cell, .hcard { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (max-width: 700px) {
  header.top { gap: 10px; padding-block: 10px; margin-bottom: 12px; }
  .mark h1 { font-size: 24px; } .mark .ed { display: none; }
  nav.tabs { order: 3; width: 100%; } nav.tabs button { flex: 1; padding: 9px 8px; }
  #copy-config { padding: 5px 10px; font-size: 13px; }
  .wrap { padding-block: 0 24px; }
  .table { padding: 8px 6px 0; gap: 10px; border-radius: 12px; }
  .board { gap: 4px; }
  .mscore { display: flex; width: 100%; align-items: stretch; gap: 6px; }
  .mchip { flex: 1; display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 9px; border: 2px solid transparent; }
  .mchip.p0 { background: var(--blue-soft); } .mchip.p1 { background: var(--red-soft); flex-direction: row-reverse; text-align: right; }
  .mchip.active.p0 { border-color: var(--blue); } .mchip.active.p1 { border-color: var(--red); }
  .mchip .sig { position: static; width: 22px; height: 22px; font-size: 13px; flex: none; }
  .mchip b { font-size: 22px; line-height: 1; }
  .mchip small { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .mdeck { align-self: center; font-size: 11px; color: var(--muted); text-align: center; width: 38px; flex: none; display: flex; flex-direction: column; line-height: 1.1; }
  .mdeck b { font-size: 18px; color: var(--ink); }
  .bag { display: none; }
  .rail .score { display: none; }
  .tray { display: flex; flex-direction: column; gap: 6px; position: sticky; bottom: 0; z-index: 4; width: calc(100% + 12px); margin: 0 -6px;
    background: var(--sunk); border-top: 1px solid var(--line); box-shadow: 0 -8px 18px rgba(0,0,0,.10);
    padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-radius: 12px 12px 0 0; }
  .tray .prompt { min-height: 0; font-size: 14px; gap: 6px; }
  .tray .prompt .who { font-size: 15px; }
  .tray .prompt .btn { padding: 6px 12px; }
  .tray .cardinfo { font-size: 12.5px; min-height: 0; }
  .tray .cardinfo.idle { display: none; }
  .tray .hand-label { display: none; }
  .hand { flex-wrap: nowrap; overflow-x: auto; justify-content: safe center; gap: 6px; padding: 3px; }
  .hcard { width: 58px; height: 58px; --cell: 58px; flex: none; }
  .hand-area.other { padding-bottom: 10px; }
  .hand-area.other .hand { display: none; }
  .tile .n { font-size: max(8.5px, calc(var(--cell) * .135)); }
  .cell.last::after { inset: -3px; }
  .endcard .box { padding: 18px; }
}
@media (max-width: 380px) { .hcard { width: 50px; height: 50px; --cell: 50px; } }
th[data-tip], .stat[data-tip] { cursor: help; }
tbody tr[data-tip] { cursor: help; }
tbody tr[data-tip]:hover, tbody tr[data-tip]:focus-visible { background: var(--sunk); }
.q { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--line); color: var(--muted); font-size: 10px; font-weight: 700; margin-left: 4px; vertical-align: 1px; text-transform: none; letter-spacing: 0; }
#tip { position: fixed; z-index: 30; max-width: 290px; background: var(--ink); color: var(--bg); font-size: 13.5px; line-height: 1.4; padding: 9px 12px; border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.25); pointer-events: none; text-transform: none; letter-spacing: 0; font-weight: 400; white-space: normal; text-align: left; }
.review h3 { font-size: 16px; margin: 12px 0 4px; }
.review ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.review li { max-width: 72ch; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
</style>

<div class="wrap">
  <header class="top">
    <div class="mark"><h1>Vye Duel</h1><span class="ed">two-player prototype</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-setup" aria-selected="false">Setup</button>
      <button role="tab" id="tab-play" aria-selected="true">Play</button>
      <button role="tab" id="tab-sim" aria-selected="false">Simulate</button>
    </nav>
    <div class="spacer"></div>
    <button class="btn" id="copy-config">Copy config</button>
  </header>

  <section id="view-setup" hidden></section>
  <section id="view-play"></section>
  <section id="view-sim" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>
<div id="tip" role="tooltip" hidden></div>

<script id="vye-engine">
/*ENGINE*/
</script>

// ---------- play ----------
const seats = store.get('vyeMicro.seats', ['human', 'cautious']);
let speed = store.get('vyeMicro.speed', 600);
let reveal = false;
let revealBag = false;
let G = null;            // game state
let history = [];        // snapshots before human moves
let ui = { sel: null, pos: null, phase: null, eqA: null };
let aiTimer = null, paused = false;
let gameSeed = Math.floor(Math.random() * 1e6);

function snapshot(s) {
  return { board: new Map(s.board), deck: s.deck.slice(), players: s.players.map(p => ({ hand: p.hand.slice(), side: p.side.slice() })), discard: s.discard.slice(),
    turn: s.turn, turnNo: s.turnNo, passes: s.passes, over: s.over, endReason: s.endReason, winner: s.winner, final: s.final, plays: s.plays.slice(), log: s.log.slice(), lastMove: s.lastMove, moves: s.moves };
}
function restore(s, snap) { Object.assign(s, snap, { board: new Map(snap.board), deck: snap.deck.slice(), players: snap.players.map(p => ({ hand: p.hand.slice(), side: p.side.slice() })) }); }

function newGame(seed) {
  clearTimeout(aiTimer); paused = false;
  gameSeed = seed != null ? seed : Math.floor(Math.random() * 1e6);
  G = E.newGame(cfg, gameSeed); history = []; ui = { sel: null, pos: null, phase: null, eqA: null };
  renderPlay(); scheduleAI();
}
const isHuman = p => seats[p] === 'human';
function scheduleAI() {
  clearTimeout(aiTimer);
  if (!G || G.over || isHuman(G.turn) || paused) return;
  aiTimer = setTimeout(() => {
    if (!G || G.over || isHuman(G.turn) || paused) return;
    const m = E.chooseMove(G, seats[G.turn]);
    if (m) E.playMove(G, m);
    renderPlay(); scheduleAI();
  }, speed);
}
function humanPlay(move) {
  history.push(snapshot(G));
  E.playMove(G, move);
  ui = { sel: null, pos: null, phase: null, eqA: null };
  renderPlay(); scheduleAI();
}
function undo() {
  if (!history.length) return;
  clearTimeout(aiTimer);
  restore(G, history.pop());
  ui = { sel: null, pos: null, phase: null, eqA: null };
  renderPlay();
}

function selCard() { if (!ui.sel || !G) return null; return E.findCard(G, G.turn, ui.sel); }
function movesFor() { return G.moves.filter(m => m.cardId === ui.sel); }

function clickCell(k) {
  if (!ui.sel) return;
  const card = selCard(); const ms = movesFor();

    const pm = ms.filter(m => m.pos === k); if (!pm.length) return;
    if (!pm.some(m => m.choice != null)) return humanPlay(pm[0]);
    ui.pos = k;
    if (card.special === 'usurp') ui.phase = 'usurp';
    else if (card.special === 'earthquake') ui.phase = 'eqA';
    else ui.phase = 'cell';
    return renderPlay();
  }
  const pm = ms.filter(m => m.pos === ui.pos);
  if (ui.phase === 'cell') { const m = pm.find(m => m.choice === k); if (m) humanPlay(m); return; }
  if (ui.phase === 'eqA') { if (pm.some(m => m.choice && m.choice.includes(k))) { ui.eqA = k; ui.phase = 'eqB'; renderPlay(); } return; }
  if (ui.phase === 'eqB') { const m = pm.find(m => m.choice && m.choice.includes(ui.eqA) && m.choice.includes(k) && k !== ui.eqA); if (m) humanPlay(m); return; }
}

function targetsNow() {
  if (!G || G.over || !isHuman(G.turn) || !ui.sel) return new Set();
  const ms = movesFor();
  if (ui.phase === null) return new Set(ms.map(m => m.pos));
  const pm = ms.filter(m => m.pos === ui.pos);
  if (ui.phase === 'cell') return new Set(pm.map(m => m.choice).filter(c => c != null));
  if (ui.phase === 'eqA') { const s = new Set(); pm.forEach(m => m.choice && m.choice.forEach(c => s.add(c))); return s; }
  if (ui.phase === 'eqB') { const s = new Set(); pm.forEach(m => { if (m.choice && m.choice.includes(ui.eqA)) m.choice.forEach(c => { if (c !== ui.eqA) s.add(c); }); }); return s; }
  return new Set();

function usurpPick(c) {
  const m = movesFor().find(m => m.pos === ui.pos && m.choice && m.choice.land === c.land);
  if (m) humanPlay(Object.assign({}, m, { choice: { cardId: c.id, land: c.land } }));
}

function renderBoard() {
  const b = G.board;

  const open = new Set(G.over ? [] : E.placeCells(G));
  let x0 = cs.x0, x1 = cs.x1, y0 = cs.y0, y1 = cs.y1;
  for (const k of open) { x0 = Math.min(x0, E.kx(k)); x1 = Math.max(x1, E.kx(k)); y0 = Math.min(y0, E.ky(k)); y1 = Math.max(y1, E.ky(k)); }
  if (ui.pos != null) { x0 = Math.min(x0, E.kx(ui.pos)); x1 = Math.max(x1, E.kx(ui.pos)); y0 = Math.min(y0, E.ky(ui.pos)); y1 = Math.max(y1, E.ky(ui.pos)); }
  const cols = x1 - x0 + 1, rows = y1 - y0 + 1;
  const phone = window.innerWidth <= 700, gap = phone ? 4 : 5;
  const vw = ($('#view-play') || document.body).clientWidth;
  const avail = phone ? vw - 12 : Math.min(vw - (window.innerWidth > 900 ? 380 : 40), 720);
  const cell = Math.max(34, Math.min(86, Math.floor((avail - gap * (cols - 1)) / cols)));

  const lm = G.lastMove; const flipped = new Set(lm ? lm.flips : []);
  const grid = h('div', { class: 'board', style: `grid-template-columns: repeat(${cols}, ${cell}px); --cell:${cell}px` });
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const k = E.key(x, y); const st = b.get(k);

    if (st && st.length > 1) cls.push('stacked');
    if (lm && lm.pos === k) cls.push('last');
    if (flipped.has(k)) cls.push('flipped');
    const c = h('div', { class: cls.join(' '), onclick: () => clickCell(k), title: st ? st.slice().reverse().map(E.cardTitle).join(' over ') : null });
    if (st) {

  if (G.over) return h('div', { class: 'prompt' }, `Game over · ${G.winner === -1 ? 'Tie' : E.HOUSES[G.winner].short + ' wins'} ${G.final.largest[0]}–${G.final.largest[1]}`, h('button', { class: 'btn', onclick: () => { ui.hideEnd = false; renderPlay(); } }, 'Show result'));

  if (!isHuman(p)) return h('div', { class: 'prompt' }, h('span', null, who, paused ? ' is paused.' : ' is thinking…'));
  const card = selCard();
  if (!card) return h('div', { class: 'prompt' }, h('span', null, who, ' to play. Pick a tile from your hand or sideboard.'));
  const cancel = h('button', { class: 'btn', onclick: () => { ui = { sel: null, pos: null, phase: null, eqA: null }; renderPlay(); } }, 'Cancel');
  const back = h('button', { class: 'btn', onclick: () => { ui.pos = null; ui.phase = null; ui.eqA = null; renderPlay(); } }, 'Back');

let simState = store.get('vyeMicro.sim', { a: 'cautious', b: 'greedy', n: 500, alt: true });
let simResult = null, simWorker = null, matrixResult = null;
function workerSrc() {
  return $('#vye-engine').textContent + `
self.onmessage = e => {
  const d = e.data;
  if (d.type === 'batch') {
    const S = VyeEngine.runBatch(d.cfg, d.personas, d.n, d.seed, d.alt, (i, n) => self.postMessage({ type: 'progress', i, n }));
    const sum = VyeEngine.summarize(S);
    self.postMessage({ type: 'done', sum, text: VyeEngine.reportText(sum, d.cfg, d.personas) });
  } else if (d.type === 'matrix') {
    const keys = d.keys, out = {}; let done = 0, total = keys.length * (keys.length - 1) / 2;
    for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
      const S = VyeEngine.runBatch(d.cfg, [keys[i], keys[j]], d.n, d.seed, true);
      out[keys[i] + '|' + keys[j]] = { a: S.wins[keys[i]] / S.games, b: S.wins[keys[j]] / S.games };
      self.postMessage({ type: 'progress', i: ++done, n: total });
    }
    self.postMessage({ type: 'matrix', out, keys });
  }
};`;
}
function startWorker(msg) {
  if (simWorker) simWorker.terminate();
  try {
    simWorker = new Worker(URL.createObjectURL(new Blob([workerSrc()], { type: 'text/javascript' })));
  } catch (e) { simWorker = null; }
  const bar = $('#sim-bar'), lbl = $('#sim-status');
  const onMsg = d => {
    if (d.type === 'progress') { bar.style.width = (100 * d.i / d.n) + '%'; lbl.textContent = `${d.i} of ${d.n}`; }
    if (d.type === 'done') { simResult = { sum: d.sum, text: d.text, cfg: JSON.parse(JSON.stringify(cfg)), personas: msg.personas }; simWorker = null; renderSim(); }
    if (d.type === 'matrix') { matrixResult = d; simWorker = null; renderSim(); }
  };
  if (simWorker) { simWorker.onmessage = e => onMsg(e.data); simWorker.postMessage(msg); }
  else { // fallback: run on the main thread
    setTimeout(() => {
      if (msg.type === 'batch') { const S = E.runBatch(msg.cfg, msg.personas, msg.n, msg.seed, msg.alt); const sum = E.summarize(S); onMsg({ type: 'done', sum, text: E.reportText(sum, msg.cfg, msg.personas) }); }
    }, 30);
  }
  renderSimRunning();
}
function renderSimRunning() { const b = $('#sim-run'), m = $('#sim-matrix'); if (b) b.disabled = true; if (m) m.disabled = true; $('#sim-status').textContent = 'Starting…'; }

function rowTip(c, landMean) {
  const x = landMean > 0 ? c.mean / landMean : 0;
  const strength = c.label === 'Land' ? 'This is the yardstick everything else is compared to.'
    : x >= 3 ? `That’s about ${x.toFixed(1)}× a plain Land, which is a lot.`
    : x >= 1.6 ? `That’s about ${x.toFixed(1)}× a plain Land.`
    : x >= 0.7 ? 'About the same as a plain Land.' : 'Less than a plain Land, at least in the race for the biggest kingdom.';
  const pred = c.sd < 0.6 ? 'It does nearly the same thing every time.' : c.sd < 1.5 ? 'It’s fairly predictable.' : c.sd < 2.5 ? 'Results vary a fair bit.' : 'It’s a gamble: results vary wildly.';
  const win = c.winWhenPlayed >= 0.56 ? 'Players who used it won more often than not.' : c.winWhenPlayed <= 0.44 ? 'Players who used it usually lost.' : 'Using it doesn’t change who wins much.';
  return `${c.label}: a typical play moves the race ${c.mean >= 0 ? '+' : ''}${c.mean.toFixed(1)} tiles your way. ${strength} ${pred} Worst play ${c.min}, best play ${c.max}. ${win} (${Math.round(100 * c.winWhenPlayed)}% win)`;
}

// Turns a summary into plain-English findings and suggestions.
function buildReview(s, c, personas) {
  const status = [], suggest = [];
  const pct = x => Math.round(100 * x) + '%';
  const N = s.games, f = s.firstSeatWinRate, sc = s.secondSeatWinRate, decided = f + sc;
  const share = decided ? f / decided : 0.5;
  const moe = decided ? 1.96 * Math.sqrt(share * (1 - share) / (decided * N)) : 1;
  const mirror = personas[0] === personas[1];
  const careless = personas.every(p => p === 'greedy' || p === 'chaotic' || p === 'random');
  // seat balance
  const gap = share - 0.5;
  if (Math.abs(gap) <= Math.max(moe, 0.025)) status.push(`Going first or second makes no real difference here (first ${pct(f)}, second ${pct(sc)}). That’s within the noise for ${N} games.`);
  else {
    const who = gap > 0 ? 'first' : 'second', size = Math.abs(gap) > 0.1 ? 'a big' : Math.abs(gap) > 0.05 ? 'a clear' : 'a small';
    status.push(`The ${who} player has ${size} edge: first wins ${pct(f)}, second wins ${pct(sc)}, ties ${pct(s.tieRate)}.`);
    if (gap > 0) {
      if (!(c.secondBonus >= 1 && c.tiebreak === 'second')) suggest.push('Even out the first-player edge with “first player must win by 2” (Second player bonus 1, ties go to the second player). In testing that brought careful play to about 49/51 on the default build.');
      else if (c.secondBonus < 2) suggest.push('The first player still leads even with the +1 bonus. Try a bonus of 2, or give the second player 1 extra starting card as well.');
    } else {
      if (c.secondBonus > 0 || c.tiebreak === 'second') suggest.push('The second player is now ahead, so the bonus is too generous for these players. Try lowering the Second player bonus by 1.');
      else if (careless) suggest.push('With greedy or random players the second player tends to win. Careful players flip that, so check this again with Cautious or Builder before changing rules.');
      else suggest.push('The second player is ahead. Try giving ties to the first player’s side by leaving ties as ties, or let the first player start with an extra card.');
    }
  }
  if (!mirror) {
    const [a, b] = personas, wa = s.wins[a] / N, wb = s.wins[b] / N;
    const nm = k => E.PERSONAS[k].name;
    if (Math.abs(wa - wb) > 0.08) status.push(`${nm(wa > wb ? a : b)} beat ${nm(wa > wb ? b : a)} ${pct(Math.max(wa, wb))} to ${pct(Math.min(wa, wb))}, so skill matters in this build${Math.max(wa, wb) > 0.85 ? ', maybe too much: the weaker player rarely gets a win' : ''}.`);
    else status.push(`${nm(a)} and ${nm(b)} finished close (${pct(wa)} vs ${pct(wb)}). Either the build rewards luck, or these two styles are evenly matched.`);
  }
  // ties and margins
  if (s.tieRate > 0.08 && c.tiebreak === 'none') { status.push(`Ties are common (${pct(s.tieRate)}).`); suggest.push('Pick a tiebreak in Setup → Game end. Total tiles owned is the most neutral; giving ties to the second player also helps seat balance.'); }
  const avgK = Object.values(s.scores).reduce((a, x) => a + x.mean, 0) / Math.max(1, Object.keys(s.scores).length);
  const ratio = avgK ? s.margin.mean / avgK : 0;
  if (ratio > 0.6) { status.push(`Games are often one-sided: the winner leads by ${s.margin.mean.toFixed(1)} tiles on average when kingdoms are about ${avgK.toFixed(1)}.`); suggest.push('Blowouts usually come from big swing cards. Toning down the hottest card below is the quickest way to keep games close.'); }
  else if (ratio < 0.3) status.push(`Games are close: the average winning margin is ${s.margin.mean.toFixed(1)} tiles.`);
  else status.push(`Winning margins are moderate (${s.margin.mean.toFixed(1)} tiles on kingdoms of about ${avgK.toFixed(1)}).`);
  // cards
  const land = s.cards.find(x => x.label === 'Land'), lm = land ? land.mean : 1;
  const others = s.cards.filter(x => x.label !== 'Land' && x.plays >= Math.max(20, N * 0.2));
  const hot = others.filter(x => x.mean > lm * 3 && x.mean > 3).sort((a, b) => b.mean - a.mean);
  const swingy = others.filter(x => x.sd > 2).sort((a, b) => b.sd - a.sd);
  const deciders = others.filter(x => x.winWhenPlayed > 0.58).sort((a, b) => b.winWhenPlayed - a.winWhenPlayed);
  const weak = others.filter(x => x.winWhenPlayed < 0.42).sort((a, b) => a.winWhenPlayed - b.winWhenPlayed);
  const FIX = {
    'Queen': 'take the Queen out of the sideboards, or replace it with a second King',
    'Advisor': 'drop the Advisor, or have it flip only up to 4 of its 8 neighbors',
    'Usurp': 'stop the new Land from matching, so it only swaps',
    'Sinkhole': 'only allow it on a tile next to one of yours',
    'Earthquake': 'limit swaps to two adjacent tiles',
    'Underminers': 'limit it to flipping Lands',
    'Heir': 'limit its pick to the 4 adjacent tiles',
    'King': 'leave it alone; the King is a good baseline Family tile'
  };
  if (hot.length) {
    status.push(`Strongest cards: ${hot.map(x => `${x.label} (about ${(x.mean / lm).toFixed(1)}× a Land)`).join(', ')}.`);
    hot.slice(0, 2).forEach(x => suggest.push(`${x.label} is doing ${(x.mean / lm).toFixed(1)}× the work of a Land. To tighten it, ${FIX[x.label] || 'make it rarer (fewer copies) or weaker'}.`));
  } else status.push('No card is wildly stronger than the others. That’s what you want for a tight game.');
  if (swingy.length) { status.push(`Least predictable: ${swingy.slice(0, 3).map(x => `${x.label} (anywhere from ${x.min} to ${x.max})`).join(', ')}.`);
    suggest.push(`${swingy[0].label} is the most luck-dependent card. If you want less swing, cap what it can capture or cut a copy.`); }
  if (deciders.length) status.push(`Cards that tend to decide games: ${deciders.slice(0, 3).map(x => `${x.label} (${pct(x.winWhenPlayed)} win when played)`).join(', ')}.`);
  if (weak.length) { status.push(`Cards that don’t seem to help: ${weak.slice(0, 3).map(x => `${x.label} (${pct(x.winWhenPlayed)} win when played)`).join(', ')}.`);
    suggest.push(`${weak[0].label} rarely leads to a win. It may be too weak, or the AI may be playing it badly. Try it yourself before cutting it.`); }
  const unused = Object.keys(c.specials || {}).filter(k => c.specials[k] > 0 && !s.cards.some(x => x.label === E.SPECIALS[k].name && x.plays >= N * 0.1));
  if (unused.length) { status.push(`Rarely or never played: ${unused.map(k => E.SPECIALS[k].name).join(', ')}.`); suggest.push(`${unused.map(k => E.SPECIALS[k].name).join(', ')} hardly ever gets a legal or useful moment. Loosen what it can target, or drop it.`); }
  // ends
  const stuck = (s.endReasons['No valid play'] || 0) / N;
  if (stuck > 0.04) { status.push(`${pct(stuck)} of games ended because a player had no legal play.`); suggest.push('Players are getting stuck holding cover cards with nothing to cover. Turn off “A player can’t play” so they pass instead, or raise the hand size.'); }
  if (s.unplayedFamilyPerGame > 1) suggest.push(`About ${s.unplayedFamilyPerGame.toFixed(1)} Family tiles go unplayed each game. The board fills before they come out, so add a space or remove a Family member.`);
  status.push(`Games last about ${Math.round(s.turns.mean)} turns (${Math.round(s.turns.mean / 2)} each).`);
  return { status, suggest };
}

function wireTips() {
  const tip = $('#tip'); let cur = null;
  const show = el => {
    cur = el; tip.textContent = el.getAttribute('data-tip'); tip.hidden = false;
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 8);
    let y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el) show(el); else if (cur) hide(); });
  document.addEventListener('click', e => { const el = e.target.closest('[data-tip]'); if (el && el !== cur) show(el); else hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && el.matches(':focus-visible')) show(el); });
  document.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, { passive: true });
}

function swingBar(c, lo, hi) {
  const W = 170, H = 18, x = v => 6 + (W - 12) * (v - lo) / Math.max(1, hi - lo);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); svg.append(e); };
  mk('line', { x1: x(0), x2: x(0), y1: 1, y2: H - 1, stroke: 'var(--line)', 'stroke-width': 1 });
  mk('line', { x1: x(c.min), x2: x(c.max), y1: H / 2, y2: H / 2, stroke: 'var(--muted)', 'stroke-width': 1.5 });
  mk('rect', { x: x(Math.max(c.min, c.mean - c.sd)), y: H / 2 - 4, width: Math.max(2, x(Math.min(c.max, c.mean + c.sd)) - x(Math.max(c.min, c.mean - c.sd))), height: 8, rx: 2, fill: 'color-mix(in srgb, var(--brass) 35%, transparent)' });
  mk('circle', { cx: x(c.mean), cy: H / 2, r: 4, fill: 'var(--brass)' });
  return svg;
}

    h('div', { class: 'field' }, h('label', { for: 'sim-a' }, 'Player A'), pick('sim-a', simState.a, x => { simState.a = x; save(); renderSim(); }), h('span', { class: 'persona-blurb' }, E.PERSONAS[simState.a].blurb)),

    h('div', { class: 'field' }, h('label', null, 'Games'), seg([[100, '100'], [500, '500'], [1000, '1k'], [3000, '3k']], simState.n, x => { simState.n = x; save(); renderSim(); })),
    h('label', { class: 'check', style: 'margin-bottom:12px;font-size:14px' }, h('input', { type: 'checkbox', id: 'sim-alt', checked: simState.alt, onchange: e => { simState.alt = e.target.checked; save(); } }), 'Swap who goes first every game'),
    h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' },
      h('button', { class: 'btn primary', id: 'sim-run', disabled: running, onclick: () => startWorker({ type: 'batch', cfg, personas: [simState.a, simState.b], n: simState.n, seed: Math.floor(Math.random() * 1e9), alt: simState.alt }) }, 'Run'),
      h('button', { class: 'btn', id: 'sim-matrix', disabled: running, title: 'Every persona against every other, 200 games each', onclick: () => startWorker({ type: 'matrix', cfg, keys: Object.keys(E.PERSONAS).filter(k => k !== 'random'), n: 200, seed: Math.floor(Math.random() * 1e9) }) }, 'All matchups')),
    h('div', { class: 'progress' }, h('i', { id: 'sim-bar' })),
    h('div', { id: 'sim-status', style: 'font-size:13px;color:var(--muted)' }, running ? 'Running…' : ' '));

  const res = h('div', { class: 'results' });
  if (!simResult && !matrixResult) res.append(h('div', { class: 'panel empty-results' }, 'Results appear here: win rates, first-player advantage, how games end, and every card’s swing range. Pick two personas and press Run.'));
  if (simResult) {
    const s = simResult.sum, P = simResult.personas;
    const names = Object.keys(s.wins);
    const pct = x => Math.round(100 * x) + '%';
    const colors = ['var(--blue)', 'var(--red)'];
    res.append(h('div', { class: 'panel' },
      h('h2', null, names.map(n => n.replace(/^\w/, c => c.toUpperCase())).join(' vs ')),
      h('p', { class: 'sub' }, `${s.games} games in ${s.seconds.toFixed(1)}s` + (JSON.stringify(simResult.cfg) !== JSON.stringify(cfg) ? ' · Setup has changed since this run' : '')),
      h('div', { class: 'winbar' }, names.map((n, i) => h('span', { style: `flex:${s.wins[n]};background:${colors[i]}` }, `${n} ${pct(s.wins[n] / s.games)}`)),
        s.ties ? h('span', { style: `flex:${s.ties};background:var(--muted)` }, `tie ${pct(s.tieRate)}`) : null),
      h('div', { class: 'summary', style: 'margin-top:12px' },
        [[pct(s.firstSeatWinRate), 'First player wins', TIPS.first], [pct(s.secondSeatWinRate), 'Second player wins', TIPS.second], [pct(s.tieRate), 'Ties', TIPS.ties],
          [s.turns.mean.toFixed(1), 'Turns per game', TIPS.turns], [s.margin.mean.toFixed(1), 'Average margin', TIPS.margin],
          [Object.entries(s.scores).map(([, x]) => x.mean.toFixed(1)).join(' / '), 'Avg kingdom', TIPS.kingdom]].map(([val, k, tip]) => h('div', { class: 'stat', 'data-tip': tip, tabindex: '0' }, h('div', { class: 'v' }, val), h('div', { class: 'k' }, k, h('span', { class: 'q' }, '?'))))),
      h('p', { class: 'sub', style: 'margin:10px 0 0' }, 'Ended by: ' + Object.entries(s.endReasons).map(([k, n]) => `${k} ${pct(n / s.games)}`).join(' · '))));

    const lo = Math.min(0, ...s.cards.map(c => c.min)), hi = Math.max(1, ...s.cards.map(c => c.max));
    const landMean = (s.cards.find(c => c.label === 'Land') || { mean: 1 }).mean;
    res.append(h('div', { class: 'panel' },
      h('h2', null, 'Card swing'),
      h('p', { class: 'sub' }, 'Swing means how far one play moves the race in your favor. If you were behind by 3 and after your play you\u2019re ahead by 1, that play swung 4. A plain Land usually swings about 1. Hover or tap any row or heading for a plain-English read.'),
      h('div', { class: 'legend', style: 'justify-content:flex-start;margin-bottom:6px' },
        h('span', null, h('span', { class: 'flag hot' }, 'hot'), ' far stronger than a Land'), h('span', null, h('span', { class: 'flag hot' }, 'swingy'), ' unpredictable'), h('span', null, h('span', { class: 'flag flat' }, 'flat'), ' same result every time')),
      h('div', { class: 'tbl-wrap' }, h('table', null,
        h('thead', null, h('tr', null, [['Card', TIPS.card], ['Plays/game', TIPS.plays], ['Typical', TIPS.mean], ['Spread', TIPS.sd], ['Worst', TIPS.min], ['Best', TIPS.max], ['Range', TIPS.range], ['Flips', TIPS.flips], ['Win% when played', TIPS.win]]
          .map(([t, tip]) => h('th', { 'data-tip': tip, tabindex: '0' }, t, h('span', { class: 'q' }, '?'))))),
        h('tbody', null, s.cards.map(c => h('tr', { 'data-tip': rowTip(c, landMean), tabindex: '0' },
          h('td', null, c.label, c.mean > landMean * 2.5 && c.mean > 3.5 ? h('span', { class: 'flag hot' }, 'hot') : null,
            c.sd > 2.5 ? h('span', { class: 'flag hot' }, 'swingy') : null,
            c.max - c.min === 0 ? h('span', { class: 'flag flat' }, 'flat') : null),
          h('td', null, c.perGame.toFixed(2)), h('td', null, (c.mean >= 0 ? '+' : '') + c.mean.toFixed(2)), h('td', null, c.sd.toFixed(2)),
          h('td', null, String(c.min)), h('td', null, String(c.max)), h('td', { class: 'rng' }, swingBar(c, lo, hi)), h('td', null, c.flips.toFixed(2)), h('td', null, pct(c.winWhenPlayed))))))),
      h('p', { class: 'sub', style: 'margin:10px 0 0' }, 'Sanctuary mostly protects value rather than gaining it, so its swing reads low. Win% when played is a better signal for it.')));

    const rv = buildReview(s, simResult.cfg, simResult.personas);
    res.append(h('div', { class: 'panel review' }, h('h2', null, 'Review'),
      h('p', { class: 'sub' }, 'A plain-English read of this run, written from the numbers above.'),
      h('h3', null, 'Where things stand'), h('ul', null, rv.status.map(x => h('li', null, x))),
      h('h3', null, 'Suggestions'), rv.suggest.length ? h('ul', null, rv.suggest.map(x => h('li', null, x))) : h('p', null, 'Nothing stands out. This build looks healthy for these players.'),
      h('p', { class: 'sub', style: 'margin:10px 0 0' }, 'These are computer players. They\u2019re good at spotting lopsided cards and seat advantages, but people will find tricks the AI misses. Treat this as a starting point for playtests.')));
    const pre = h('pre', { class: 'report', id: 'sim-report' }, simResult.text);
    res.append(h('div', { class: 'panel' }, h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' },
      h('h2', { style: 'flex:1' }, 'Report'), h('button', { class: 'btn', onclick: () => copyText(simResult.text + '\n\nCONFIG ' + JSON.stringify(simResult.cfg)) }, 'Copy report')),
      h('details', null, h('summary', null, 'Show plain-text report'), pre)));
  }
  if (matrixResult) {
    const { out, keys } = matrixResult;
    const cell = (a, b) => { if (a === b) return h('td', null, '—'); const r = out[a + '|' + b]; if (r) return h('td', null, Math.round(100 * r.a) + '%'); const r2 = out[b + '|' + a]; return h('td', null, Math.round(100 * r2.b) + '%'); };
    res.append(h('div', { class: 'panel' }, h('h2', null, 'Persona matchups'), h('p', { class: 'sub' }, 'Row persona’s win rate against the column persona, 200 games each, seats swapped every game.'),
      h('div', { class: 'tbl-wrap' }, h('table', { class: 'matrix' }, h('thead', null, h('tr', null, h('th', null, ''), keys.map(k => h('th', null, E.PERSONAS[k].name)))),
        h('tbody', null, keys.map(a => h('tr', null, h('th', { style: 'text-align:left' }, E.PERSONAS[a].name), keys.map(b => cell(a, b)))))))));
  }
  v.append(h('div', { class: 'simgrid' }, controls, res));
}

// ---------- tabs ----------
function selectTab(name) {
  for (const t of ['setup', 'play', 'sim']) { $('#tab-' + t).setAttribute('aria-selected', String(t === name)); $('#view-' + t).hidden = t !== name; }
  if (name === 'setup') renderSetup();
  if (name === 'play') { if (!G) newGame(); else renderPlay(); }
  if (name === 'sim') { if (!simWorker) renderSim(); }
  store.set('vyeMicro.tab', name);
}
for (const t of ['setup', 'play', 'sim']) $('#tab-' + t).addEventListener('click', () => selectTab(t));
$('#copy-config').addEventListener('click', () => copyText(JSON.stringify(cfg)));
window.addEventListener('resize', () => { if (!$('#view-play').hidden && G) renderPlay(); });
wireTips();
selectTab(store.get('vyeMicro.tab', 'play'));
window.__vye = { get G() { return G; }, render: () => renderPlay() }; // debug hook for tests
})();
</script>
