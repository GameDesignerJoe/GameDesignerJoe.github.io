<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GASP 2</title>
<link rel="icon" href="favicon-64.png">
<style>
:root{--bg:#141018;--panel:#1c1722;--panel2:#231d2a;--line:#33293b;--ink:#f1ebf4;--muted:#a197ab;--faint:#6f6578;--accent:#ff4d6d;--accent2:#ff8aa0;--good:#4cc38a;--warn:#f0b44c;--bad:#ff6b6b;--r:10px;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.primary:hover{background:var(--accent2)}
.btn.small{padding:3px 9px;font-size:12.5px}.btn.ghost{background:none}.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:none;min-height:44px;line-height:1.4;field-sizing:content;overflow:hidden}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}.spacer{flex:1}
/* header */
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex:none}
header .logo{height:40px;border-radius:8px}
header .ver{font-size:11px;color:var(--faint);margin-left:-6px}
#storySel{width:auto;max-width:280px;font-weight:600}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;background:none}
.pill.update{border-color:var(--good);color:var(--good);font-weight:600}.pill.update:hover{background:rgba(76,195,138,.12)}
.pill.live{border-color:var(--warn);color:var(--warn)}
nav{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);flex:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 14px 8px;color:var(--muted);font-weight:600}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
nav .soon{font-size:10px;color:var(--faint);font-weight:400;margin-left:4px}
main{flex:1;min-height:0;display:flex}
/* shots */
.shots{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,34%);min-height:0}
.left{min-height:0;overflow:auto;padding:14px 16px 40px}
.epbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ep{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;color:var(--muted);font-weight:600}
.ep.on{border-color:var(--accent);color:var(--ink);background:rgba(255,77,109,.08)}
#epTitle{width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.grid.dropping{outline:2px dashed var(--accent);outline-offset:6px;border-radius:12px}
.tile{position:relative;cursor:pointer;user-select:none}
.tile .media{position:relative;aspect-ratio:var(--asp,9/16);border-radius:10px;overflow:hidden;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.tile.sel .media{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,109,.25)}
.tile .media img,.tile .media video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .empty{padding:12px;font-size:12px;color:var(--muted);text-align:center}
.tile .badge{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.tile .badge svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8}
.tile .badge.video{background:var(--accent)}
.tile .num{position:absolute;right:6px;top:6px;font:600 11px var(--mono);background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:1px 5px}
.tile .cap{margin-top:6px;font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .jobov{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:6px 8px}
.tile .jobov .bar{height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-top:4px;position:relative}
.tile .jobov .bar i,.prog .bar i{position:absolute;top:0;bottom:0;width:35%;background:var(--accent);border-radius:2px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
.tile .ins{position:absolute;left:-12px;top:42%;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;line-height:1;opacity:0;padding:0;z-index:2}
.tile:hover .ins{opacity:1}.tile .ins:hover{color:#fff;background:var(--accent);border-color:var(--accent)}
.tile.drag{opacity:.35}.tile.before .media{box-shadow:-5px 0 0 var(--accent)}.tile.after .media{box-shadow:5px 0 0 var(--accent)}
.tile.filedrop .media{border-color:var(--good);border-style:dashed}
.addtile .media{border-style:dashed;color:var(--muted);flex-direction:column;gap:6px;font-size:13px;text-align:center;padding:10px}
.addtile:hover .media{border-color:var(--accent);color:var(--ink)}
.hint{margin-top:22px;color:var(--faint);font-size:12px;max-width:760px}
/* panel */
.panel{border-left:1px solid var(--line);min-height:0;overflow:auto;padding:14px 16px 40px;background:var(--panel)}
.panel h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptitle{font-size:16px;font-weight:600}
.hero{display:grid;justify-items:center;gap:6px;margin:12px 0 4px}
.hero img,.hero video{height:min(46vh,520px);aspect-ratio:var(--asp,9/16);width:auto;max-width:100%;object-fit:contain;background:#000;border-radius:12px;border:1px solid var(--line)}
.hero .ph{height:min(30vh,320px);aspect-ratio:var(--asp,9/16);max-width:100%;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12.5px;padding:14px}
.hero .ph.over{border-color:var(--good);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 10px;font-size:12px;color:var(--muted)}.seg button.on{background:var(--panel2);color:var(--ink)}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.secrow{display:flex;align-items:center;gap:8px}
.kthumb{width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#000}
.prog{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:rgba(255,77,109,.06)}
.prog .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;position:relative;margin-top:6px}
.prog.err{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.4);color:var(--bad)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.take{position:relative;flex:none;width:64px;aspect-ratio:var(--asp,9/16);border-radius:7px;overflow:hidden;border:2px solid var(--line);cursor:zoom-in;background:#000}
.take.use{border-color:var(--accent)}.take img,.take video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.take .t{position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:4px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.take .t svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2}
.take .u{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;text-align:center;background:var(--accent);color:#fff}
.empty-state{margin:auto;text-align:center;max-width:460px;padding:40px}
.empty-state h2{margin:0 0 6px}
/* reference */
.refpage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,36%);min-height:0}
.rsec{margin-bottom:26px;border-radius:12px;padding:4px}
.rsec.dropping{outline:2px dashed var(--accent);outline-offset:4px}
.rsec h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 12px;margin-top:10px}
.rcard{cursor:pointer;user-select:none}
.rcard .rimg,.chk{background-color:#2a2230;background-image:linear-gradient(45deg,#332a3a 25%,transparent 25%,transparent 75%,#332a3a 75%),linear-gradient(45deg,#332a3a 25%,transparent 25%,transparent 75%,#332a3a 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.rcard .rimg{aspect-ratio:3/4;border-radius:10px;border:2px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:0}
.rcard .rimg img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.rcard.sel .rimg{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,109,.25)}
.rcard.filedrop .rimg{border-color:var(--good);border-style:dashed}
.rcard .nm{margin-top:6px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .mt{font-size:11px;color:var(--faint)}
.rcard.sug .rimg{border-style:dashed;flex-direction:column;gap:6px;background:none;padding:8px}.rcard.sug .sgn{font-weight:600;color:var(--ink);font-size:14px}.rcard.sug .sgm{font-size:11px;color:var(--faint)}.rcard.sug{cursor:default}
.rcard.add .rimg{border-style:dashed;flex-direction:column;gap:4px}.rcard.add:hover .rimg{border-color:var(--accent);color:var(--ink)}
.ctabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 12px}.ctabs button{border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer;font:600 13px inherit;border-bottom:2px solid transparent;margin-bottom:-1px}.ctabs button:hover{color:var(--ink)}.ctabs button.on{color:var(--ink);border-bottom-color:var(--accent)}.ctabs .n{color:var(--faint);font-weight:400;margin-left:4px}
.cname{font-size:20px;font-weight:700}
.rib{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:var(--panel2)}
.rib.focus{border-color:var(--accent2)}
.rib .lab{width:auto;flex:1;min-width:80px;font-weight:600;background:none;border-color:transparent;padding:3px 6px}
.rib .lab:hover,.rib .lab:focus{border-color:var(--line)}
.rhero{display:flex;justify-content:center;margin:8px 0 4px}
.rhero img{max-height:340px;max-width:100%;border-radius:8px;cursor:zoom-in}
.rhero .ph{width:100%;height:150px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;cursor:pointer;padding:10px}
.rhero .ph.over{border-color:var(--good);color:var(--ink)}
.gform{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.rtake{width:52px;aspect-ratio:1/1}.rtake img{object-fit:contain!important}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.rchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;cursor:pointer;background:var(--bg)}
.rchip.on{border-color:var(--accent2)}.rchip.off{opacity:.5}
.rchip img{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#2a2230}
.rchip .ni{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:inline-block}
.rchip input{margin:0}.rchip select{width:auto;padding:0 2px;font-size:11px;border:0;background:none}
.refwarn{margin:8px 0 0;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,190,90,.45);background:rgba(255,190,90,.08);color:var(--warn);font-size:12.5px;line-height:1.45}.refwarn b{color:var(--ink)}
.rchip.missing{border-style:dashed;color:var(--muted);padding:2px 9px}.rchip.missing:hover{color:var(--ink);border-color:var(--accent)}
.take.new{border-color:var(--good)}
.take .nw{position:absolute;right:3px;top:3px;font-size:9px;background:var(--good);color:#000;border-radius:3px;padding:0 3px;font-weight:700}
@media (max-width:900px){.refpage{grid-template-columns:1fr}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(8,6,10,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:min(720px,100%);max-height:92vh;overflow:auto}
.box h2{margin:0 0 4px;font-size:18px}
.viewer{flex-direction:column;gap:10px}
.viewer img,.viewer video{max-height:82vh;max-width:94vw;height:82vh;width:auto;object-fit:contain;border-radius:10px;background:#000}
.viewer .vb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
table.t th,table.t td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600}table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.keyrow{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;margin-top:6px}
.keyrow .st{font-size:12px;color:var(--muted)}.keyrow .st.ok{color:var(--good)}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;z-index:80;max-width:80vw;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.soonpage{margin:40px auto;max-width:620px;padding:0 20px}
.soonpage h2{margin:0 0 8px}
.soonpage li{margin:4px 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
/* script */
.scriptwrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}.scriptwrap.noside{grid-template-columns:minmax(0,1fr)}.scriptwrap.noside .sright{display:none}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.fsz button{border:0;background:none;color:var(--muted);padding:3px 9px;cursor:pointer;font:600 12px var(--sans,inherit)}.fsz button:hover{color:var(--ink);background:var(--panel2)}.fsz span{display:block;line-height:26px;padding:0 7px;font-size:12px;color:var(--faint);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.syncst{font-size:12px;color:var(--muted)}.syncst b{color:var(--warn)}
.sleft{display:flex;flex-direction:column;min-height:0;padding:14px 16px 16px;container-type:inline-size}
@container (max-width:860px){.example{display:none}}
.pages{flex:1;min-height:0;display:flex;gap:16px;justify-content:center}
.example{width:min(520px,40%);flex:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px;overflow:auto}
.expage{white-space:pre-wrap;font:12.5px/1.6 "Courier Prime","Courier New",Courier,var(--mono);background:#0f0c12;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0 0;color:var(--ink)}
.exkeys{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}.exkeys li{margin:5px 0}
.h-emptypage{opacity:.32}
.h-flag{border-radius:3px}.h-flag.error{background:rgba(255,107,107,.16);box-shadow:inset 3px 0 0 var(--bad)}.h-flag.warn{background:rgba(240,180,76,.12);box-shadow:inset 3px 0 0 var(--warn)}.h-flag.info{background:rgba(124,196,255,.08)}
.lint{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;max-height:44vh;overflow:auto}
.lint details{margin-bottom:6px;color:var(--good)}.lint details ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.lint .li{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:5px 4px;border-radius:6px;cursor:pointer}.lint .li:hover{background:var(--panel2)}
.lint .ic{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 10px var(--mono);margin-top:1px}
.lint .error .ic{background:var(--bad);color:#000}.lint .warn .ic{background:var(--warn);color:#000}.lint .info .ic{background:#7cc4ff;color:#000}.lint .ok .ic{background:var(--good);color:#000}
.h-ghost{color:var(--faint)}.h-ghostkey{font:600 10px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:8px;vertical-align:1px}
.btn.on{border-color:var(--accent);color:var(--ink)}
.editor{position:relative;flex:1;min-height:0;width:100%;margin:0;border:1px solid var(--line);border-radius:12px;background:#0f0c12;overflow:hidden}
.editor textarea,.editor .mirror{position:absolute;inset:0;margin:0;padding:24px 28px;font:var(--scfont,14.5px)/1.65 "Courier Prime","Courier New",Courier,var(--mono);white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:2;border:0;border-radius:0;overflow:auto;letter-spacing:0;scrollbar-width:none}
.editor textarea::-webkit-scrollbar{display:none}
.editor textarea{background:transparent;color:transparent;caret-color:var(--ink);resize:none;min-height:0;z-index:1;field-sizing:fixed;overflow:auto}
.editor textarea::selection{background:rgba(255,77,109,.35);color:transparent}
.editor textarea::placeholder{color:var(--faint)}
.editor .mirror{color:var(--ink);pointer-events:none;scrollbar-width:none}.editor .mirror::-webkit-scrollbar{display:none}
.h-scene{font-weight:700;text-decoration:underline;color:#fff}
.h-shot{font-weight:700;color:var(--accent2)}
.h-lab{font-weight:700}.h-image{color:#7cc4ff}.h-motion{color:#b9a3ff}.h-sfx,.h-sound{color:#6fd3a4}.h-note{color:var(--warn)}.h-who,.h-frame,.h-location,.h-length{color:var(--muted)}
.h-style{color:#ff9f6e}
.h-name{font-weight:700;color:#ffd27a}.h-dia{color:#f6e7c8}
.h-id{color:var(--faint);font-weight:400}
.sright{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow:auto;min-height:0}
h3.side{margin:18px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.outline{display:grid;gap:2px}
.ol{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:baseline;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.ol:hover{background:var(--panel2)}.ol .n{font:600 11px var(--mono);color:var(--faint)}.ol .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ol .meta{color:var(--faint);font-size:11px}
.ol .st{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--warn)}.ol .st.ok{color:var(--good)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:#ffd27a}
pre.guide{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 var(--mono);max-height:56vh;overflow:auto}
.dl{font-size:13px;margin:3px 0}.dl.sfx{color:#6fd3a4}
/* chat */
#chatBtn.on{border-color:var(--accent)}
body.chatopen main{margin-right:var(--chatw,min(440px,40vw))}
#chat{position:fixed;right:0;top:var(--hdr,57px);bottom:0;width:var(--chatw,min(440px,40vw));background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:30}
body.chatopen #chat{display:flex}
.chead{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cmsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.cmsg{display:flex}.cmsg.u{justify-content:flex-end}
.bub{max-width:92%;border-radius:12px;padding:8px 11px;font-size:13.5px;line-height:1.5;background:var(--panel2);border:1px solid var(--line)}
.cmsg.u .bub{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.35)}

.cpre{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:260px;overflow:auto;margin:6px 0}

.card.applied{border-color:var(--good);background:rgba(76,195,138,.06)}.card.dismissed{border-color:var(--line);opacity:.7}
.card .ck{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent2)}.card.applied .ck{color:var(--good)}
.card .cs{margin-top:2px}.card .ok{color:var(--good);font-size:12.5px}
.card details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:4px}
.cfield{font-size:12.5px;margin-top:4px}.cfield b{color:var(--muted);font-size:11px;margin-right:4px}
.ccomp{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}.ccomp .crow{display:flex;gap:8px;align-items:flex-end}
.ccomp textarea{min-height:42px;max-height:45vh;resize:none;overflow-y:auto;line-height:1.45;field-sizing:fixed}
#chat.dropping{outline:2px dashed var(--accent);outline-offset:-6px}

body.resizing{cursor:col-resize;user-select:none}body.resizing iframe,body.resizing video{pointer-events:none}

.cmsg.u .atts{justify-content:flex-end;margin-bottom:4px}.cmsg.u{flex-direction:column;align-items:flex-end}
.bub.typing .tw{font-size:11px;color:var(--faint);margin-left:8px}
.cempty{color:var(--muted);font-size:13px}.cempty p{margin:0 0 10px}.cstarts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.typing{display:flex;gap:4px;padding:12px 14px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

<body>
<header>
  <img class="logo" src="logo.jpg" alt="GASP">
  <span class="ver" id="ver">2.0</span>
  <select id="storySel" title="Story"></select>
  <button class="btn small" id="newStory">+ New story</button>
  <span class="spacer"></span>
  <button class="pill update" id="updPill" hidden title="Install the latest GASP 2 and restart">Update ready</button>
  <button class="pill" id="jobsPill" hidden></button>
  <button class="btn small" id="chatBtn" title="Talk the story through; it can write into the script and shots">💬 Chat</button>
  <button class="pill" id="spendBtn" title="What each generation cost">$0.00 spent</button>
  <button class="btn small" id="gear" title="Settings">⚙</button>
</header>
<nav id="tabs">
  <button data-tab="script">Script</button>
  <button data-tab="reference">Reference</button>
  <button data-tab="shots">Shots</button>
  <button data-tab="sound">Sound<span class="soon">step 7</span></button>
</nav>
<main id="main"></main>

<script src="script.js"></script>
<script>
/* ============ GASP 2 app ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON={image:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>',video:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>'};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let STATE=null,STORY=null,EP=null,SEL=null,TAB=ls.get("g2-tab","shots");const JOBS={};let REFS=[];
function toast(t,ms=3200){let h=$("#toasts");if(!h){h=document.createElement("div");h.id="toasts";document.body.appendChild(h)}const el=document.createElement("div");el.className="toast";el.textContent=t;h.appendChild(el);setTimeout(()=>el.remove(),ms)}
async function api(path,body){if(body!==undefined&&path!=="/api/shot/update"&&typeof flushPending==="function"&&PENDING.shot)await flushPending();const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const o=await r.json().catch(()=>({error:"The GASP 2 server didn't answer. Is it running?"}));if(!r.ok||o.error)throw new Error(o.error||r.statusText);return o}
const money=v=>"$"+(+v||0).toFixed(2);

/* ---------- boot ---------- */
async function boot(){
  try{STATE=await api("/api/state")}catch(e){$("#main").innerHTML=`<div class="empty-state"><h2>Can't reach the GASP 2 server</h2><p class="sub">${esc(e.message)}</p></div>`;return}
  $("#ver").textContent="2.0"+(STATE.dry?" · dry run":"");
  $("#spendBtn").textContent=money(STATE.spend)+" spent";
  renderStorySel();await loadRefs();
  const want=ls.get("g2-story",null);const pick=STATE.stories.find(s=>s.id===want)||STATE.stories[0];
  if(pick)await openStory(pick.id);else renderMain();
  listenEvents();
  const sizeHdr=()=>document.documentElement.style.setProperty("--hdr",$("header").offsetHeight+"px");sizeHdr();addEventListener("resize",sizeHdr);
  $("#chatBtn").onclick=()=>toggleChat();if(CHAT.open)toggleChat(true);
  if(!Object.values(STATE.keys).some(Boolean))setTimeout(()=>{toast("No keys yet: add your fal key in Settings (⚙) to generate video.",5000)},800);
}
function renderStorySel(){const sel=$("#storySel");sel.innerHTML=STATE.stories.length?STATE.stories.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join(""):`<option value="">No stories yet</option>`;if(STORY)sel.value=STORY.id;sel.disabled=!STATE.stories.length}
$("#storySel").onchange=e=>openStory(e.target.value);
$("#newStory").onclick=async()=>{const t=prompt("Story title","New story");if(!t)return;try{const s=await api("/api/story/new",{title:t});STATE=await api("/api/state");setStory(s);renderStorySel();toast(`Made the folder for "${s.title}" in your library`)}catch(e){toast(e.message)}};
async function openStory(id){try{setStory(await api("/api/story?id="+encodeURIComponent(id)))}catch(e){toast(e.message)}}
function setStory(s){const prevEp=EP&&EP.id,prevStory=STORY&&STORY.id;setTimeout(()=>{if(CHAT.open&&STORY&&(STORY.id!==prevStory||(EP&&EP.id)!==prevEp))renderChat(STORY.id!==prevStory)},0);if(STORY&&STORY.id!==s.id)SCRIPT={ep:null,text:"",saved:"",t:0};STORY=s;ls.set("g2-story",s.id);const keepEp=EP&&s.episodes.find(e=>e.id===EP.id);EP=keepEp||s.episodes.find(e=>e.id===ls.get("g2-ep-"+s.id,null))||s.episodes[0];if(SEL&&!EP.shots.find(x=>x.id===SEL))SEL=null;if(!SEL&&EP.shots[0])SEL=EP.shots[0].id;renderStorySel();renderMain()}
async function reload(){if(STORY)setStory(await api("/api/story?id="+encodeURIComponent(STORY.id)))}

/* ---------- tabs ---------- */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=async()=>{const from=TAB;if(from==="script")await saveScriptNow();await flushPending();TAB=b.dataset.tab;ls.set("g2-tab",TAB);if(from==="script"&&TAB!=="script")await reload();else renderMain()});
function renderMain(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  const m=$("#main");
  if(!STORY){m.innerHTML=`<div class="empty-state"><h2>Start a story</h2><p class="sub">Each story gets its own folder in your GASP Library, with episodes and shots inside it. Everything you make is kept there, so you can browse it without the app.</p><p><button class="btn primary" id="first">+ New story</button></p><p class="sub">Library: <code>${esc(STATE.library)}</code></p></div>`;$("#first").onclick=()=>$("#newStory").click();return}
  if(TAB==="shots")return renderShots();
  if(TAB==="script")return renderScript();
  if(TAB==="reference"){renderReference();loadSuggest().then(()=>{if(TAB==="reference")renderReference()});return}
  const soon={sound:{h:"Sound",step:7,items:["Dialogue with voices and lip-sync","Ambience, effects and music in lanes under the shots","Works on stills first, so timing can be locked before video"],extra:""}}[TAB];
  m.innerHTML=`<div class="soonpage"><h2>${soon.h}</h2><p class="sub">Arrives in step ${soon.step} of the build (see <code>gasp2/PLAN.md</code>). It will hold:</p><ul>${soon.items.map(x=>`<li>${x}</li>`).join("")}</ul><p class="sub">${soon.extra}</p><p><button class="btn" id="reveal">Show this story's folder</button></p></div>`;
  $("#reveal").onclick=()=>reveal({})}
async function reveal(o){try{const r=await api("/api/reveal",Object.assign({story:STORY.id},o));if(!/Windows/.test(navigator.userAgent))toast(r.path)}catch(e){toast(e.message)}}

/* ---------- shots tab ---------- */
const cur=()=>EP&&EP.shots.find(x=>x.id===SEL);
function renderShots(){
  const m=$("#main");
  const asp=(EP.aspect||"9:16").split(":").map(Number);document.documentElement.style.setProperty("--asp",`${asp[0]}/${asp[1]}`);document.documentElement.classList.toggle("wide",asp[0]>asp[1]);
  m.innerHTML=`<div class="shots"><div class="left" id="left"><div class="epbar">${epTabs()}<button class="btn small ghost" id="addEp">+ Episode</button><span class="spacer"></span><button class="btn small ghost" id="epFolder">Show folder</button></div><div class="grid" id="grid"></div><p class="hint">Drop images from ChatGPT or your desktop onto the grid: one new shot per image, in order. Drop an image on a tile to give it a new keyframe. Drag tiles to reorder; hover a tile's left edge for + to insert. <b>Ctrl+V</b> pastes a copied image into the selected shot.</p></div><div class="panel" id="panel"></div></div>`;
  document.querySelectorAll("[data-ep]").forEach(b=>b.onclick=()=>{EP=STORY.episodes.find(e=>e.id===b.dataset.ep);ls.set("g2-ep-"+STORY.id,EP.id);SEL=EP.shots[0]?EP.shots[0].id:null;renderShots()});
  $("#addEp").onclick=async()=>{const s=await api("/api/episode/new",{story:STORY.id});EP=s.episodes[s.episodes.length-1];SEL=null;setStory(s)};
  wireEpRename(()=>renderShots());
  $("#epFolder").onclick=()=>reveal({ep:EP.id});
  renderGrid();renderPanel();wireGridDrop()}
function tileMedia(sh){const m=sh.media||{};if(sh.show==="video"&&m.video)return{type:"video",html:`<video src="${m.video}#t=0.1" muted loop playsinline preload="metadata"></video>`};if(m.keyframe)return{type:"image",html:`<img src="${m.keyframe}" alt="" loading="lazy">`};if(m.video)return{type:"video",html:`<video src="${m.video}#t=0.1" muted loop playsinline preload="metadata"></video>`};return null}
function renderGrid(){
  const g=$("#grid");if(!g)return;
  g.innerHTML=EP.shots.map((sh,i)=>{const tm=tileMedia(sh);const j=JOBS_FOR(sh.id);return`<div class="tile ${sh.id===SEL?"sel":""}" draggable="true" data-id="${sh.id}"><button class="ins" data-ins="${sh.id}" title="Insert a shot before this one">+</button><div class="media">${tm?tm.html:`<div class="empty">${esc(sh.title)}<br><span style="color:var(--faint)">drop a keyframe</span></div>`}${tm?`<span class="badge ${tm.type}" title="${tm.type==="video"?"Showing the video":"Showing the keyframe"}">${ICON[tm.type]}</span>`:""}<span class="num">${String(i+1).padStart(2,"0")}</span>${j&&j.status!=="done"?`<div class="jobov">${j.status==="error"?"✕ failed":esc(j.phase||"working")}${j.status==="running"?`<div class="bar"><i></i></div>`:""}</div>`:""}</div><div class="cap">${esc(sh.title)}</div></div>`}).join("")+`<div class="tile addtile" id="addShot"><div class="media"><span style="font-size:26px;line-height:1">+</span>New shot<span class="sub" style="font-size:11px">or drop images here</span></div></div>`;
  g.querySelectorAll(".tile[data-id]").forEach(t=>{
    t.onclick=e=>{if(e.target.closest(".ins"))return;SEL=t.dataset.id;g.querySelectorAll(".tile").forEach(x=>x.classList.toggle("sel",x===t));renderPanel()};
    const v=t.querySelector("video");if(v){t.onmouseenter=()=>v.play().catch(()=>{});t.onmouseleave=()=>{v.pause();v.currentTime=.1}}
    t.ondragstart=e=>{e.dataTransfer.setData("text/gasp-shot",t.dataset.id);e.dataTransfer.effectAllowed="move";t.classList.add("drag")};
    t.ondragend=()=>{t.classList.remove("drag");g.querySelectorAll(".tile").forEach(x=>x.classList.remove("before","after","filedrop"))};
    t.ondragover=e=>{const files=e.dataTransfer.types.includes("Files");e.preventDefault();e.stopPropagation();g.querySelectorAll(".tile").forEach(x=>x.classList.remove("before","after","filedrop"));if(files){t.classList.add("filedrop");return}const r=t.getBoundingClientRect();t.classList.add(e.clientX<r.left+r.width/2?"before":"after")};
    t.ondragleave=()=>t.classList.remove("before","after","filedrop");
    t.ondrop=async e=>{e.preventDefault();e.stopPropagation();const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));g.querySelectorAll(".tile").forEach(x=>x.classList.remove("before","after","filedrop"));
      if(files.length){await setKeyframe(t.dataset.id,files[0]);if(files.length>1)await addShotsFromFiles(files.slice(1),t.dataset.id);return}
      const id=e.dataTransfer.getData("text/gasp-shot");if(!id||id===t.dataset.id)return;const r=t.getBoundingClientRect();const after=e.clientX>=r.left+r.width/2;
      const order=EP.shots.map(x=>x.id).filter(x=>x!==id);order.splice(order.indexOf(t.dataset.id)+(after?1:0),0,id);
      try{setStory(await api("/api/shot/move",{story:STORY.id,ep:EP.id,order}))}catch(err){toast(err.message)}}});
  g.querySelectorAll("[data-ins]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const r=await api("/api/shot/new",{story:STORY.id,ep:EP.id,before:b.dataset.ins});SEL=r.shot;setStory(r.story);focusTitle()});
  $("#addShot").onclick=async()=>{const r=await api("/api/shot/new",{story:STORY.id,ep:EP.id});SEL=r.shot;setStory(r.story);focusTitle()};
}
function focusTitle(){const t=$("#pTitle");if(t){t.focus();t.select()}}
function wireGridDrop(){
  const left=$("#left"),g=$("#grid");
  left.ondragover=e=>{if(e.dataTransfer.types.includes("Files")){e.preventDefault();g.classList.add("dropping")}};
  left.ondragleave=e=>{if(!left.contains(e.relatedTarget))g.classList.remove("dropping")};
  left.ondrop=async e=>{e.preventDefault();g.classList.remove("dropping");const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"));if(files.length)await addShotsFromFiles(files)};
}
const fileData=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const nameOf=f=>(f.name||"image").replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim().slice(0,50)||"New shot";
async function addShotsFromFiles(files,after){files=[...files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));let last=after||null,r=null;
  for(const f of files){try{r=await api("/api/shot/new",{story:STORY.id,ep:EP.id,after:last,title:nameOf(f),image:await fileData(f),source:/chatgpt|dall|openai/i.test(f.name)?"chatgpt":"upload"});last=r.shot}catch(e){toast(e.message);break}}
  if(r){SEL=r.shot;setStory(r.story);toast(`${files.length} shot${files.length>1?"s":""} added`)}}
async function setKeyframe(shotId,file){try{setStory(await api("/api/keyframe",{story:STORY.id,ep:EP.id,shot:shotId,image:await fileData(file),source:/chatgpt|dall|openai/i.test(file.name||"")?"chatgpt":"upload"}));SEL=shotId;renderGrid();renderPanel();toast("Keyframe in place; the old one stays in History")}catch(e){toast(e.message)}}
document.addEventListener("paste",async e=>{if(TAB==="reference"){if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;const f=[...(e.clipboardData||{}).files||[]].find(x=>x.type.startsWith("image/"));const c=REFS.find(x=>x.id===RSEL);if(f&&c){e.preventDefault();const im=c.images.find(x=>x.id===RFOCUS)||c.images.find(x=>!x.url);if(im)await setRefImage(c,im,f);else await addRefImage(c,f)}return}if(TAB!=="shots"||!cur())return;if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;const f=[...(e.clipboardData||{}).files||[]].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();await setKeyframe(SEL,f)}});

/* ---------- details panel ---------- */
const JOBS_FOR=(id,kind)=>Object.values(JOBS).filter(j=>j.shot===id&&(!kind||j.kind===kind)).sort((a,b)=>b.started-a.started)[0]||null;
const JOBS_IMG=id=>Object.values(JOBS).filter(j=>j.image===id).sort((a,b)=>b.started-a.started)[0]||null;
function renderPanel(){
  const p=$("#panel");if(!p)return;const sh=cur();
  if(!sh){p.innerHTML=`<div class="empty-state" style="padding:30px 10px"><h3>No shot selected</h3><p class="sub">Add a shot, or drop ChatGPT images onto the grid to make one shot per image.</p></div>`;return}
  const idx=EP.shots.indexOf(sh)+1,m=sh.media||{},hasV=!!m.video,hasK=!!m.keyframe,show=sh.show==="video"&&hasV?"video":hasK?"keyframe":hasV?"video":null;
  const models=STATE.models,mk=sh.model&&models[sh.model]?sh.model:STATE.defaultVideo,model=models[mk];const secs=model.durations.includes(+sh.seconds)?+sh.seconds:model.durations.find(d=>d>=5)||model.durations[0];
  const est=model.pricePerSecond*secs+(model.perRequest||0);const j=JOBS_FOR(sh.id,"video");const busy=j&&j.status==="running";
  const kj=JOBS_FOR(sh.id,"keyframe"),kbusy=kj&&kj.status==="running",IM=STATE.imageModels||{},imk=IM[sh.imageModel]?sh.imageModel:STATE.defaultImage,imm=IM[imk]||{pricePerImage:0,maxRefs:4},icount=[1,2,4].includes(+sh.imageCount)?+sh.imageCount:1,picks=refPicks(sh),fresh=kj&&kj.status==="done"?new Set(kj.takes||[]):new Set();
  p.innerHTML=`<div class="row"><h3>Shot ${String(idx).padStart(2,"0")}</h3><span class="spacer"></span><button class="btn small ghost" id="pCopy" title="Copy this shot, its status and the format guide for Claude">Copy Shot for Claude</button><button class="btn small ghost" id="pDup" title="Duplicate this shot and its takes">Duplicate</button><button class="btn small ghost" id="pFolder" title="Open this shot's folder">Folder</button><button class="btn small ghost" id="pDel" title="Move this shot to _Trash">Delete</button></div>
  <input type="text" id="pTitle" class="ptitle" value="${esc(sh.title)}" style="margin-top:8px" title="Shot title (also its folder name)">
  <div class="hero" id="hero">${show==="video"?`<video src="${m.video}" controls playsinline loop></video>`:show==="keyframe"?`<img src="${m.keyframe}" alt="">`:`<div class="ph" id="heroDrop"><div>No keyframe yet.<br>Generate one below, or drop an image here,<br>paste one with Ctrl+V, or <u>choose a file</u>.</div></div>`}${hasV&&hasK?`<div class="seg"><button data-show="keyframe" class="${show==="keyframe"?"on":""}">${ICON.image.replace("<svg",'<svg style="width:13px;height:13px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.8"')} Keyframe</button><button data-show="video" class="${show==="video"?"on":""}">${ICON.video.replace("<svg",'<svg style="width:13px;height:13px;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.8"')} Video</button></div>`:""}</div>

const wordIn=(text,w)=>!!w&&new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(text||"");
// a shot's references: characters on its WHO line, its location, props named in its image prompt, plus anything added by hand
function refCandidates(sh){

  String(sh.who||"").split(/\s*,\s*|\s+and\s+|\s*&\s*|\s*\/\s*/).map(x=>x.trim()).filter(Boolean).forEach(n=>{const c=REFS.find(c=>c.kind==="character"&&cardIs(c,n));if(c)add(c,true);else if(!missing.some(m=>lc(m.name)===lc(n)))missing.push({kind:"character",name:n})});

  REFS.filter(c=>c.kind==="prop"&&[c.name].concat(c.aliases||[]).some(n=>wordIn(sh.imagePrompt,n))).forEach(c=>add(c,true));
  REFS.filter(c=>c.kind==="character"&&[c.name].concat(c.aliases||[]).some(n=>n&&new RegExp("(^|[^A-Za-z])"+n.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"('S)?(?![A-Za-z])").test(sh.imagePrompt||""))).forEach(c=>add(c,true));

    ${others.length||prev&&prev.media&&prev.media.keyframe&&!(pk.add||[]).includes("prev")?`<select id="refAdd" style="width:auto;font-size:12px;padding:2px 6px"><option value="">+ Add…</option>${prev&&prev.media&&prev.media.keyframe&&!(pk.add||[]).includes("prev")?`<option value="prev">Shot ${i}'s keyframe</option>`:""}${["character","location","prop"].map(k=>{const cs=others.filter(c=>c.kind===k);return cs.length?`<optgroup label="${{character:"Characters",location:"Locations",prop:"Props"}[k]}">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</optgroup>`:""}).join("")}</select>`:""}

function md(t){const blocks=[];t=String(t||"").replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>{blocks.push(c);return`\u0000${blocks.length-1}\u0000`});
  let h=esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.split(/\n{2,}/).map(p=>{const L=p.split("\n");if(L.every(l=>/^\s*[-*•]\s+/.test(l)))return"<ul>"+L.map(l=>"<li>"+l.replace(/^\s*[-*•]\s+/,"")+"</li>").join("")+"</ul>";if(L.every(l=>/^\s*\d+[.)]\s+/.test(l)))return"<ol>"+L.map(l=>"<li>"+l.replace(/^\s*\d+[.)]\s+/,"")+"</li>").join("")+"</ol>";return"<p>"+L.map(l=>/^#{1,4}\s/.test(l)?"<b>"+l.replace(/^#+\s/,"")+"</b>":l).join("<br>")+"</p>"}).join("");
  return h.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<pre class="cpre">${esc(blocks[+i])}</pre>`)}

  <div class="ccomp">${CHAT.att.length?`<div class="atts">${CHAT.att.map((a,k)=>attHTML(a,k)).join("")}</div>`:""}<div class="crow"><label class="btn ghost" title="Attach images, PDFs or text files. You can also paste an image, drop files here, or paste a link (Google Docs shared as 'Anyone with the link' work)." style="padding:8px 10px">📎<input type="file" id="cfile" multiple accept="image/*,.pdf,.txt,.md,.fountain,.csv,.json,.html,.htm,text/*" hidden></label><textarea id="cin" rows="1" placeholder="Message… (Enter sends, Shift+Enter for a new line)" ${CHAT.busy?"disabled":""}></textarea><button class="btn primary" id="csend" ${CHAT.busy?"disabled":""}>Send</button></div></div><div class="cgrip" id="cgrip" title="Drag to resize"></div>`;

  d.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{const prev=[...CHAT.msgs].reverse().find(m=>m.role==="user");if(prev){$("#cin").value=prev.text;sendChat()}});
  const box=$("#cmsgs");box.scrollTop=box.scrollHeight;if(!CHAT.busy)cin.focus()}
function msgHTML(m){
  if(m.role==="user")return`<div class="cmsg u">${(m.attachments||[]).length?`<div class="atts">${m.attachments.map(a=>attHTML(a)).join("")}</div>`:""}<div class="bub">${esc(m.text).replace(/\n/g,"<br>")}</div></div>`;
  if(m.error)return`<div class="cmsg a"><div class="bub err">${esc(m.error)}<div style="margin-top:6px"><button class="btn small" data-retry>Try again</button></div></div></div>`;
  return`<div class="cmsg a"><div class="bub">${md(m.text)||"<p class='sub'>(only suggestions)</p>"}${(m.actions||[]).map((a,k)=>cardHTML(m,a,k)).join("")}<div class="cmeta">${esc(m.model||"")}${m.cost!=null?` · ${m.cost<0.01?"<$0.01":"$"+m.cost.toFixed(2)}`:""}</div></div></div>`}
function cardHTML(m,a,k){
  const kind={replace_script:"Rewrite the episode script",append_script:"Add to the end of the script",update_shot:"Change a shot",update_ref:"Save to a reference card",unreadable:"A suggestion GASP couldn't read",cut_off:"Cut off"}[a.action]||a.action;
  if(a.action==="cut_off")return`<div class="card"><div class="ck">${kind}</div><div class="cs">The reply ran out of room before its proposal finished, so there's nothing to apply.</div><div class="row" style="margin-top:6px"><button class="btn small primary" data-resend>Ask for it again, complete</button></div></div>`;
  let body="";
  if(a.action==="update_shot"){const sh=EP.shots.find(x=>x.id===a.shot);body=`<div class="sub">${sh?`Shot ${EP.shots.indexOf(sh)+1}: ${esc(sh.title)}`:"(a shot that isn't in this episode)"}</div>`+Object.entries(a.fields||{}).map(([f,v])=>`<div class="cfield"><b>${esc({imagePrompt:"IMAGE",motionPrompt:"MOTION",title:"Title",notes:"Note"}[f]||f)}</b> ${esc(v)}</div>`).join("")}
  else if(a.action==="update_ref"){const c=REFS.find(x=>x.kind===(a.kind||"character")&&x.name.toLowerCase()===String(a.name||"").toLowerCase());body=`<div class="sub">${esc(a.kind||"character")}: <b>${esc(a.name||"")}</b>${c?"":" · new card"}</div><div class="cfield"><b>LOOK</b> ${esc(a.look||"")}</div>`}
  else if(a.text){const n=GASPScript.parse(a.text).blocks.length;body=`<details><summary>${n} shot${n===1?"":"s"} · show the text</summary><pre class="cpre">${esc(a.text)}</pre></details>`}
  else if(a.raw)body=`<pre class="cpre">${esc(a.raw)}</pre>`;
  const st=a.state;const btns=a.action==="unreadable"?"":st==="applied"?`<span class="ok">Applied ✓</span><button class="btn small ghost" data-act="undo" data-m="${m.i}" data-a="${k}">Undo</button>`:st==="dismissed"?`<span class="sub">Dismissed</span><button class="btn small ghost" data-act="apply" data-m="${m.i}" data-a="${k}">Apply anyway</button>`:`<button class="btn small primary" data-act="apply" data-m="${m.i}" data-a="${k}">Apply</button><button class="btn small ghost" data-act="dismiss" data-m="${m.i}" data-a="${k}">Dismiss</button>`;
  return`<div class="card ${st||""}"><div class="ck">${esc(kind)}</div>${a.summary?`<div class="cs">${esc(a.summary)}</div>`:""}${body}<div class="row" style="margin-top:6px;gap:6px">${btns}</div></div>`}
async function sendChat(){const cin=$("#cin");const t=(cin&&cin.value||"").trim();if((!t&&!CHAT.att.length)||CHAT.busy)return;if(CHAT.att.some(a=>a.loading))return toast("Still reading an attachment…");await flushPending();if(typeof saveScriptNow==="function")await saveScriptNow();
  const att=CHAT.att.filter(a=>!a.error);CHAT.att=[];CHAT.busy=true;CHAT.draft="";CHAT.msgs.push({role:"user",text:t||"(see the attachments)",attachments:att.map(a=>({kind:a.data?"image":"text",name:a.name,url:a.data||null,chars:a.text?a.text.length:0})),i:-1});renderChat();
  const t0=Date.now(),tick=setInterval(()=>{const el=$("#ctw");if(!el)return;const s=Math.round((Date.now()-t0)/1000);el.textContent=s<8?"":s<60?`${s}s`:`${Math.floor(s/60)}m ${String(s%60).padStart(2,"0")}s · whole scripts can take a couple of minutes`},1000);
  try{const r=await api("/api/chat",{story:STORY.id,ep:EP.id,message:t,attachments:att.map(a=>a.data?{name:a.name,data:a.data}:{name:a.name,text:a.text})});CHAT.msgs=r.messages;const last=r.messages[r.messages.length-1];setStat(last&&last.error?{state:"bad",text:last.error}:{state:"ok",text:"Connected"})}
  catch(e){CHAT.msgs.push({role:"assistant",error:e.message,i:-1});setStat({state:"bad",text:e.message})}
  clearInterval(tick);CHAT.busy=false;renderChat();api("/api/state").then(s=>{STATE=s;$("#spendBtn").textContent=money(s.spend)+" spent"}).catch(()=>{})}
async function actCard(mi,ai,op){try{await flushPending();if(typeof saveScriptNow==="function")await saveScriptNow();const r=await api("/api/chat/act",{story:STORY.id,ep:EP.id,msg:mi,action:ai,op});CHAT.msgs=r.chat.messages;await loadRefs();setStory(r.story);renderChat();if(op==="apply")toast("Applied"+(r.note?": "+r.note:""));if(op==="undo")toast("Undone")}catch(e){toast(e.message)}}

function statHTML(){const st=CHAT.stat;return`<i></i><span>${esc(chatModelLabel())}${!st?"":st.state==="checking"?" · checking…":st.state==="ok"?" · "+esc(st.text||"connected"):""}</span>${st&&st.state==="bad"?` · <span title="${esc(st.text)}">${esc(st.text.length>70?st.text.slice(0,70)+"…":st.text)}</span>`:""} · <a data-ctest>test</a> · <a data-cset>change</a>`}
function setStat(st){CHAT.stat=st;const el=$("#cstat");if(el){el.className="cstat "+(st?st.state:"");el.innerHTML=statHTML();wireStat()}}
function wireStat(){const el=$("#cstat");if(!el)return;const t=el.querySelector("[data-ctest]");if(t)t.onclick=()=>testChat();const c=el.querySelector("[data-cset]");if(c)c.onclick=()=>$("#gear").click()}
async function testChat(){setStat({state:"checking"});try{const r=await api("/api/chat/test",{});setStat(r.ok?{state:"ok",text:r.dry?"dry run":`connected (${(r.ms/1000).toFixed(1)}s)`}:{state:"bad",text:r.error})}catch(e){setStat({state:"bad",text:/Failed to fetch|NetworkError|didn't answer/i.test(e.message)?"GASP's local server isn't answering. Close GASP 2 and open it again.":e.message})}}
function wireGrip(){const g=$("#cgrip");if(!g)return;g.onmousedown=e=>{e.preventDefault();g.classList.add("drag");document.body.classList.add("resizing");
  const mv=ev=>{const w=Math.max(320,Math.min(window.innerWidth*.75,window.innerWidth-ev.clientX));document.documentElement.style.setProperty("--chatw",w+"px")};
  const up=()=>{g.classList.remove("drag");document.body.classList.remove("resizing");removeEventListener("mousemove",mv);removeEventListener("mouseup",up);ls.set("g2-chatw",parseInt(getComputedStyle(document.documentElement).getPropertyValue("--chatw"))||0)};
  addEventListener("mousemove",mv);addEventListener("mouseup",up)};g.ondblclick=()=>{document.documentElement.style.removeProperty("--chatw");ls.set("g2-chatw",0)}}
function attHTML(a,k){const isImg=a.kind==="image"||!!a.data,src=a.data||a.url;const size=a.loading?"reading…":a.error?a.error:isImg?"image":a.kind==="link"?`${a.label||"link"}${a.chars?" · "+chars(a.chars):""}`:`${a.pdf?"PDF text":"text"}${a.chars||a.text?" · "+chars(a.chars||a.text.length):""}${a.pages?` · ${a.pages} page${a.pages===1?"":"s"}`:""}`;
  return`<span class="att ${a.error?"err":""}" title="${esc(a.url&&a.kind==="link"?a.url:a.name)}">${isImg&&src?`<img src="${src}" alt="">`:`<span class="ai">${a.kind==="link"?"🔗":a.pdf||/\.pdf$/i.test(a.name||"")?"📄":"📝"}</span>`}<span><span class="an">${esc(a.kind==="link"&&!a.error?(a.name||a.url):a.name)}</span><br><span class="as">${esc(size)}</span></span>${k!=null?`<button data-attx="${k}" title="Remove">✕</button>`:""}</span>`}
let PDFJS=null;const chars=n=>n<1000?`${n} characters`:`${Math.round(n/1000)}k characters`;
// pdf.js ships with GASP (app/vendor/pdfjs), so PDFs read offline
function loadPdfJs(){if(PDFJS)return PDFJS;PDFJS=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="/vendor/pdfjs/pdf.min.js";sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="/vendor/pdfjs/pdf.worker.min.js";ok(window.pdfjsLib)};sc.onerror=()=>{PDFJS=null;no(new Error("Couldn't load the PDF reader. Update GASP 2 and try again."))};document.head.appendChild(sc)});return PDFJS}
async function pdfText(f){const lib=await loadPdfJs();const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let out=[];for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();let line="",lines=[],lastY=null;for(const it of tc.items){const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(line);line=""}line+=it.str;lastY=y}lines.push(line);out.push(lines.join("\n"))}return{text:out.join("\n\n").replace(/[ \t]+\n/g,"\n").trim(),pages:doc.numPages}}
async function addAttachments(files){for(const f of files){const a={name:f.name||"pasted image",loading:true};CHAT.att.push(a);renderChat();
  try{if(f.type.startsWith("image/"))a.data=await fileData(f);
    else if(f.type==="application/pdf"||/\.pdf$/i.test(f.name)){const r=await pdfText(f);if(!r.text)throw new Error("this PDF has no text layer (a scan?): attach page images instead");a.text=r.text;a.pages=r.pages;a.pdf=true}
    else if(/\.docx?$/i.test(f.name))throw new Error("Word files can't be read here: save as PDF and attach that");
    else if(f.type.startsWith("text/")||/\.(txt|md|fountain|csv|json|html?)$/i.test(f.name))a.text=await f.text();
    else throw new Error("GASP can read images, PDFs and text files");
    if(f.size>12e6&&a.data)throw new Error("image is over 12 MB")}
  catch(e){a.error=e.message||String(e)}
  a.loading=false;renderChat();const cin=$("#cin");if(cin)cin.focus()}}

const shotOps=sh=>({use:async t=>setStory(await api("/api/take/use",{story:STORY.id,ep:EP.id,shot:sh.id,take:t.file})),del:async t=>setStory(await api("/api/take/delete",{story:STORY.id,ep:EP.id,shot:sh.id,take:t.file}))});
function viewer(list,i,ops){const ov=document.createElement("div");ov.className="ov viewer";document.body.appendChild(ov);
  const draw=()=>{const t=list[i];ov.innerHTML=`${t.kind==="video"?`<video src="${t.url}" controls autoplay loop playsinline></video>`:`<img src="${t.url}" alt="">`}<div class="vb${t.kind==="image"?" chk":""}" style="${t.kind==="image"?"padding:4px;border-radius:8px":""}">${list.length>1?`<button class="btn" data-v="prev">‹</button><span class="sub">${i+1} / ${list.length}</span><button class="btn" data-v="next">›</button>`:""}${t.inUse?`<span class="pill">in use</span>`:`<button class="btn primary" data-v="use">Use this</button>`}<a class="btn" href="${t.url}" download="${esc(t.file)}">⤓ Download</a><button class="btn" data-v="del">Move to Trash</button><button class="btn" data-v="close">Close</button></div><div class="sub">${esc(t.file)}</div>`};
  const close=()=>{ov.remove();document.removeEventListener("keydown",key,true)};const step=d=>{i=(i+d+list.length)%list.length;draw()};
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)};document.addEventListener("keydown",key,true);
  ov.onclick=async e=>{const v=e.target.dataset&&e.target.dataset.v;if(e.target===ov||v==="close")return close();if(v==="prev")step(-1);if(v==="next")step(1);

    if(v==="del"){if(!confirm("Move this take to _Trash?"))return;try{await ops.del(list[i]);close()}catch(err){toast(err.message)}}};
  draw()}

$("#gear").onclick=async()=>{STATE=await api("/api/state");const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="box"><h2>Settings</h2><p class="sub">Keys are saved in <code>gasp2\\.env</code> on this PC. That file is git-ignored, so keys never go to GitHub. A key marked "from 1.0" is borrowed from GASP 1.0's settings.</p>
  <label class="f">Connections</label>${KEYS.map(([k,n,why])=>`<div class="keyrow"><div><b>${n}</b><div class="sub" style="font-size:11px">${why}</div></div><input type="password" data-key="${k}" placeholder="${STATE.keys[k]==="set"?"saved; type to replace":STATE.keys[k]?"using the key from 1.0; type to replace":"paste key"}" autocomplete="off"><span class="st ${STATE.keys[k]?"ok":""}">${STATE.keys[k]==="set"?"✓ set":STATE.keys[k]?"✓ from 1.0":"not set"}</span></div>`).join("")}
  <label class="f">Chat model</label><select id="sChat">${(STATE.chatModels||[]).map(m=>`<option value="${m.provider}|${esc(m.model)}" ${STATE.chat&&STATE.chat.model===m.model&&STATE.chat.provider===m.provider?"selected":""}>${esc(m.label)}${m.provider==="fal"&&!STATE.keys.FAL_KEY||m.provider==="groq"&&!STATE.keys.GROQ_API_KEY?" · needs key":""}</option>`).join("")}${STATE.chat&&!(STATE.chatModels||[]).some(m=>m.model===STATE.chat.model&&m.provider===STATE.chat.provider)?`<option value="${STATE.chat.provider}|${esc(STATE.chat.model)}" selected>${esc(STATE.chat.model)} (${STATE.chat.provider})</option>`:""}<option value="custom">Other model id…</option></select>
  <div class="row" id="sChatCustom" style="margin-top:6px;display:none"><select id="sChatProv" style="width:110px"><option value="fal">fal</option><option value="groq">Groq</option></select><input type="text" id="sChatModel" placeholder="e.g. anthropic/claude-sonnet-5 or openai/gpt-oss-120b"></div>
  <label class="f">Default video model</label><select id="sDef">${Object.entries(STATE.models).map(([k,v])=>`<option value="${k}" ${k===STATE.defaultVideo?"selected":""}>${esc(v.label)} · $${v.pricePerSecond}/s</option>`).join("")}</select>
  <label class="f">Default keyframe model</label><select id="sImg">${Object.entries(STATE.imageModels||{}).map(([k,v])=>`<option value="${k}" ${k===STATE.defaultImage?"selected":""}>${esc(v.label)} · $${v.pricePerImage}/image${v.note?" · "+esc(v.note):""}</option>`).join("")}</select>
  <label class="f">Background removal</label><select id="sCut">${Object.entries(STATE.cutoutTools||{}).map(([k,v])=>`<option value="${k}" ${k===STATE.defaultCutout?"selected":""}>${esc(v.label)} · about $${v.pricePerImage}</option>`).join("")}</select>
  <label class="f">Library folder</label><input type="text" id="sLib" value="${esc(STATE.library)}"><p class="sub" style="margin:4px 0 0">Where every story, reference and take is kept. Changing it starts using the new folder; it doesn't move the old one.</p>
  <div class="row" style="margin-top:16px"><button class="btn" id="sUpd">Check for updates</button><span class="sub" id="sUpdMsg"></span><span class="spacer"></span><button class="btn" data-x>Cancel</button><button class="btn primary" id="sSave">Save</button></div></div>`;
  document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov||e.target.dataset.x!=null)ov.remove()};
  const sc=ov.querySelector("#sChat");sc.onchange=()=>{ov.querySelector("#sChatCustom").style.display=sc.value==="custom"?"flex":"none"};
  ov.querySelector("#sSave").onclick=async()=>{const keys={};ov.querySelectorAll("[data-key]").forEach(i=>{if(i.value.trim())keys[i.dataset.key]=i.value.trim()});const cv=sc.value==="custom"?ov.querySelector("#sChatProv").value+"|"+ov.querySelector("#sChatModel").value.trim():sc.value;const [cp,...cm]=cv.split("|");try{await api("/api/settings",{keys,library:ov.querySelector("#sLib").value,defaultVideo:ov.querySelector("#sDef").value,defaultImage:ov.querySelector("#sImg").value,defaultCutout:ov.querySelector("#sCut").value,chat:cm.join("|")?{provider:cp,model:cm.join("|")}:null});ov.remove();STATE=await api("/api/state");renderStorySel();toast("Settings saved");if(STORY&&!STATE.stories.find(s=>s.id===STORY.id)){STORY=null;const f=STATE.stories[0];if(f)openStory(f.id);else renderMain()}else renderMain()}catch(e){toast(e.message)}};
  ov.querySelector("#sUpd").onclick=async()=>{const m=ov.querySelector("#sUpdMsg");m.textContent="Checking…";const c=await api("/api/update/check").catch(e=>({error:e.message}));if(c.error){m.textContent=c.error;return}if(!c.behind){m.textContent="You're up to date.";return}m.textContent="Updating…";installUpdate(m)}};
/* ---------- updates: checked on launch and every 30 minutes; one click installs and restarts ---------- */
async function checkUpdate(){try{const c=await api("/api/update/check");const p=$("#updPill");p.hidden=!(c.behind&&c.gasp2)}catch(e){}}
async function installUpdate(msgEl){const say=t=>{if(msgEl)msgEl.textContent=t;else toast(t)};
  if(Object.values(JOBS).some(j=>j.status==="running"))return say("A generation is still running. Update when it finishes.");
  await flushPending();if(typeof saveScriptNow==="function")await saveScriptNow();
  say("Updating…");let r;try{r=await api("/api/update",{})}catch(e){return say(e.message)}
  if(!r.changed){$("#updPill").hidden=true;return say("You're up to date.")}
  say("Updated. Restarting GASP 2…");const was=STATE.pid;await api("/api/restart",{}).catch(()=>{});
  for(let k=0;k<60;k++){await new Promise(z=>setTimeout(z,500));const s=await fetch("/api/state").then(x=>x.json()).catch(()=>null);if(s&&s.pid&&s.pid!==was){location.reload();return}}
  say("Updated. Close GASP 2 and open it again to finish.")}
$("#updPill").onclick=()=>installUpdate();
setTimeout(checkUpdate,4000);setInterval(checkUpdate,30*60e3);

boot();
</script>
</body>
</html>
