<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trailhead</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<style>
/* Layout: a transit map read from the top. The goal is the terminus, three coloured lines (games, tabletop, tools) run up to it through white ringed stations, and everything else is flat paper. */
:root{
  --bg:#F2EFE7; --surface:#FFFFFF; --sunk:#E6E2D8; --ink:#26272B; --muted:#6B6B6B; --line:#D3CEC2;
  --red:#E4372E; --blue:#1F6DB5; --yellow:#F2B705; --green:#2E9E5B; --on-color:#FFFFFF; --on-yellow:#2A2100;
  --display:"Jost","Century Gothic","Avenir Next",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1D1E22; --surface:#292A2F; --sunk:#141518; --ink:#F0EEE8; --muted:#A3A29C; --line:#3D3E44;
  --red:#F0534A; --blue:#4B95DA; --yellow:#F5C431; --green:#44B872; --on-color:#FFFFFF; --on-yellow:#2A2100; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1D1E22; --surface:#292A2F; --sunk:#141518; --ink:#F0EEE8; --muted:#A3A29C; --line:#3D3E44;
  --red:#F0534A; --blue:#4B95DA; --yellow:#F5C431; --green:#44B872; --on-color:#FFFFFF; --on-yellow:#2A2100; color-scheme:dark }

*{box-sizing:border-box; scrollbar-width:none; -webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--body)}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:8px}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; font-weight:600}
p{margin:0}
.wrap{max-width:720px; margin:0 auto; padding-block:18px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:30px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:22px; height:22px; border-radius:50%; background:var(--surface); border:5px solid var(--ink)}
.brand h1{font-size:24px; font-weight:700; letter-spacing:.01em}
.round{width:44px; height:44px; flex:none; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:2.5px solid var(--ink)}
.round svg{width:20px; height:20px}

.label{font:600 12.5px var(--display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.sec{display:flex; flex-direction:column; gap:12px}
.sechead{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.sechead h2{font-size:21px; white-space:nowrap}
.sechead span{color:var(--muted); font-size:14px; text-align:right}

/* GOAL */
.goal{display:flex; flex-direction:column; gap:12px}
.goal ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.goal li{display:flex; gap:12px; align-items:flex-start; font:500 19px/1.3 var(--display); text-wrap:balance}
.goal svg{width:20px; height:20px; flex:none; margin-top:3px}

/* round action buttons, always one row */
.acts{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px}
.act{display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; font:600 12.5px/1.15 var(--display); text-align:center; min-width:0}
.act i{width:50px; height:50px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:3px solid var(--ink); color:var(--ink)}
.act svg{width:22px; height:22px}
.act.go i{background:var(--green); border-color:var(--green); color:var(--on-color)}
.act.on i{background:var(--yellow); border-color:var(--yellow); color:var(--on-yellow)}
.btn{min-height:44px; padding:0 18px; border-radius:999px; font:600 15px var(--display); display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; white-space:nowrap; align-self:flex-start}
.btn.solid{background:var(--ink); color:var(--bg)}
.btn.line{background:var(--surface); border:2.5px solid var(--ink)}

/* NOW */
.now{background:var(--surface); border-radius:var(--r-lg); padding:18px; display:flex; flex-direction:column; gap:14px; border-top:8px solid var(--red)}
.now .label{color:var(--red)}
.now .who{display:flex; align-items:center; gap:10px; font:600 16px var(--display); text-align:left}
.now .task{font:600 24px/1.2 var(--display); text-wrap:balance}
.now .why{font-size:14px; color:var(--muted)}

.tile{width:46px; height:46px; flex:none; border-radius:13px; background:var(--sunk); display:grid; place-items:center; font-size:24px; line-height:1; overflow:hidden}
.tile img{width:100%; height:100%; object-fit:cover; display:block}
.tile.sm{width:38px; height:38px; border-radius:11px; font-size:19px}
.ring{border-radius:14px; padding:2.5px; display:block}
.ring.game{background:var(--red)} .ring.tabletop{background:var(--blue)} .ring.tool{background:var(--yellow)}
.ring .tile{border:2px solid var(--surface)}
.starred{position:relative}
.starred::after{content:""; position:absolute; right:-5px; top:-5px; width:14px; height:14px; border-radius:50%; background:var(--yellow); border:2.5px solid var(--ink)}

/* FOCUS */
.focus{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px}
.slot{border-radius:var(--r-md); padding:14px; min-height:78px; display:flex; gap:12px; align-items:center; text-align:left; width:100%}
.slot.full{background:var(--surface)}
.slot.empty{border:2.5px dashed var(--line); color:var(--muted); font-size:14px}
.slot .txt{min-width:0; display:flex; flex-direction:column; gap:2px}
.slot b{font:600 17px var(--display)}
.slot .sub{font-size:14px; color:var(--muted)}

/* PATH */
.path{position:relative; padding:4px 0}
.path > svg{position:absolute; left:0; top:0; width:56px; height:100%; overflow:visible; pointer-events:none}
.stop{position:relative; padding:12px 0 12px 62px; display:flex; flex-direction:column; gap:8px}
.stop h3{font-size:18px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.stop p{font-size:14px; color:var(--muted)}
.stop.ahead h3{color:var(--muted)}
.stop.goalstop h3{color:var(--ink); font-weight:700}
.count{font:600 13px var(--display); min-width:24px; height:24px; padding:0 7px; border-radius:12px; background:var(--ink); color:var(--bg); display:inline-grid; place-items:center}
.stop.ahead .count{background:var(--line); color:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.how{font-size:14px}
.how summary{cursor:pointer; list-style:none; font:600 13.5px var(--display); min-height:32px; display:flex; align-items:center; gap:6px}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"+"; width:18px; height:18px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-size:13px; line-height:1}
.how[open] summary::before{content:"–"}
.how ul{margin:4px 0 0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:5px}
.lead{display:flex; align-items:center; gap:10px; background:var(--surface); border-radius:var(--r-md); padding:10px 12px; text-align:left; font-size:14px; width:100%}
.lead b{font:600 15px var(--display); display:block}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font:500 13.5px var(--display); color:var(--muted); padding-left:62px}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:20px; height:7px; border-radius:4px}
.srcnote{font-size:13px; color:var(--muted); padding-left:62px}

/* BASICS */
.basics{background:var(--surface); border-radius:var(--r-lg); padding:6px 16px}
.brow{display:grid; grid-template-columns:1fr 96px 44px; gap:10px; align-items:center; padding:9px 0; font-size:15px}
.brow + .brow{border-top:1.5px solid var(--sunk)}
.bar{height:8px; border-radius:4px; background:var(--sunk); overflow:hidden}
.bar i{display:block; height:100%; border-radius:4px; background:var(--green)}
.brow .n{font:600 13.5px var(--display); text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}

/* LIST */
.filters{display:flex; gap:5px; align-items:center; overflow-x:auto}
.chip{height:40px; padding:0 11px; border-radius:20px; background:var(--surface); border:2.5px solid transparent; font:600 14px var(--display); white-space:nowrap; flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.filters .round{margin-left:auto; width:40px; height:40px}
.sortnote{font-size:13px; color:var(--muted)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px}
.card{background:var(--surface); border-radius:var(--r-md); padding:12px 6px 12px 12px; display:flex; gap:6px; align-items:center}
.card .main{flex:1; min-width:0; text-align:left; display:flex; gap:12px; align-items:flex-start}
.card .txt{display:flex; flex-direction:column; gap:3px; min-width:0}
.card b{font:600 17px var(--display)}
.card .tag{font-size:14px; color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.meta .st{color:var(--ink); font-weight:600}
.starbtn{width:44px; height:44px; flex:none; display:grid; place-items:center; color:var(--line)}
.starbtn svg{width:24px; height:24px}
.starbtn.on{color:var(--yellow)}
.more{align-self:center}
details.hid{background:var(--sunk); border-radius:var(--r-md); padding:4px 14px}
details.hid summary{min-height:44px; display:flex; align-items:center; font:600 15px var(--display); color:var(--muted); cursor:pointer; list-style:none}
details.hid summary::-webkit-details-marker{display:none}
.hrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1.5px solid var(--line)}
.hrow span.nm{flex:1; min-width:0}

/* SHEET */
.scrim{position:fixed; inset:0; background:rgba(20,20,22,.55); z-index:20; display:flex; justify-content:center; align-items:flex-end}
.sheet{background:var(--bg); width:100%; max-width:680px; max-height:100%; overflow-y:auto; border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  margin-top:calc(24px + env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; gap:16px}
@media (min-width:720px){ .scrim{align-items:center} .sheet{border-radius:var(--r-lg); max-height:90%} }
.shead{display:flex; gap:12px; align-items:center}
.shead .t{flex:1; min-width:0}
.shead h2{font-size:23px; font-weight:700}
.shead p{color:var(--muted); font-size:14.5px}
.block{background:var(--surface); border-radius:var(--r-md); padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.block p{font-size:15.5px}
.block .hint{font-size:13px; color:var(--muted)}
.mini{display:flex; align-items:center; height:22px; position:relative}
.mini::before{content:""; position:absolute; left:0; right:0; top:50%; height:7px; margin-top:-3.5px; border-radius:4px; background:var(--line)}
.mini .fill{position:absolute; left:0; top:50%; height:7px; margin-top:-3.5px; border-radius:4px}
.mini .fill.game{background:var(--red)} .mini .fill.tabletop{background:var(--blue)} .mini .fill.tool{background:var(--yellow)}
.mini i{position:relative; flex:1; display:flex; justify-content:flex-end}
.mini i:first-child{flex:0}
.mini i::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--surface); border:3px solid var(--line)}
.mini i.done::after{border-color:var(--ink)}
.mini i.here::after{width:20px; height:20px; border-color:var(--ink); border-width:4px}
.mini i.dream::after{background:var(--yellow); border-color:var(--ink)}
.minicap{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; color:var(--muted)}
.minicap b{color:var(--ink)}
textarea.fit{width:100%; border:0; background:transparent; resize:none; overflow:hidden; padding:0; font-size:15.5px; line-height:1.45; field-sizing:content; min-height:1.45em; display:block}
textarea.fit::placeholder, input::placeholder{color:var(--muted)}
textarea.fit:focus{outline:none}
.dreamq{border-top:6px solid var(--yellow)}
.dreamq h3{font-size:19px}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{min-height:44px; text-align:left; padding:8px 14px; border-radius:var(--r-sm); background:var(--bg); border:2.5px solid transparent; font:500 15px var(--display)}
.opt[aria-pressed="true"]{border-color:var(--ink); font-weight:600}
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.list li{display:flex; gap:10px; align-items:flex-start; padding:7px 0}
.list li + li{border-top:1.5px solid var(--sunk)}
.check{width:26px; height:26px; flex:none; border-radius:50%; border:3px solid var(--ink); display:grid; place-items:center; margin-top:1px}
.check svg{width:14px; height:14px; opacity:0}
li.done .check{background:var(--green); border-color:var(--green); color:var(--on-color)}
li.done .check svg{opacity:1}
li.done .tx{color:var(--muted); text-decoration:line-through}
.list .tx{flex:1; min-width:0; font-size:15.5px; text-align:left}
.dot{width:9px; height:9px; border-radius:50%; background:var(--yellow); flex:none; margin:7px 8px 0}
.x{color:var(--muted); width:28px; height:28px; flex:none; font-size:18px; line-height:1}
.add{display:flex; gap:8px; align-items:center; border-top:1.5px solid var(--sunk); padding-top:8px}
.add input{flex:1; min-width:0; border:0; background:transparent; min-height:38px; font-size:15px}
.add input:focus{outline:none}
.add button{width:34px; height:34px; border-radius:50%; border:2.5px solid var(--ink); font-weight:700; font-size:18px; line-height:1}
.bgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 12px}
.bitem{display:flex; align-items:center; gap:8px; min-height:36px; text-align:left; font-size:14.5px}
.bitem i{width:20px; height:20px; flex:none; border-radius:50%; border:2.5px solid var(--line); display:grid; place-items:center}
.bitem i svg{width:11px; height:11px; opacity:0}
.bitem.ok i{background:var(--green); border-color:var(--green); color:var(--on-color)}
.bitem.ok i svg{opacity:1}
.bitem:not(.ok){font-weight:600}
.src{font-size:13px; color:var(--muted)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font:600 14.5px var(--display); z-index:40; max-width:calc(100% - 32px); text-align:center}
.paste{width:100%; background:var(--sunk); border:0; border-radius:var(--r-sm); padding:10px 12px; font:13px/1.4 ui-monospace,Menlo,Consolas,monospace; resize:none; field-sizing:content; min-height:3.2em; max-height:9em; overflow:auto}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px); opacity:.6}} }

.topbtns{display:flex; gap:8px}
.tile svg{width:22px; height:22px}
.msgs{display:flex; flex-direction:column; gap:8px}
.msg{max-width:88%; padding:10px 14px; border-radius:18px; font-size:15.5px; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--ink); color:var(--bg); border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start; background:var(--surface); border-bottom-left-radius:6px}
.msg.err{color:var(--red); font-size:14px}
.keep{display:block; margin-top:8px; font:600 12.5px var(--display); color:var(--muted); text-decoration:underline; min-height:28px}
.chatform{display:flex; gap:8px; align-items:flex-end; background:var(--surface); border-radius:24px; padding:8px 8px 8px 16px; border:2.5px solid var(--ink)}
.chatform textarea{padding:8px 0}
.sendbtn{background:var(--ink); color:var(--bg); width:40px; height:40px}
.chatacts{display:flex; flex-wrap:wrap; gap:8px}
.chatacts .btn svg{width:18px; height:18px}
.field{width:100%; min-height:44px; border:2.5px solid var(--line); border-radius:var(--r-sm); background:var(--bg); padding:0 12px; font-size:15px}
.field:focus{outline:none; border-color:var(--ink)}
</style></head><body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Trailhead</h1></div>
    <div class="topbtns"><button class="round" data-act="chat" data-id="_app" aria-label="Chat about Trailhead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button class="round" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
  </header>
  <section class="goal" id="goal" aria-label="What I'm reaching for"></section>
  <section class="now" id="now" aria-label="One thing right now"></section>
  <section class="sec" aria-label="Focus">
    <div class="sechead"><h2>Focus</h2><span>Two stars, no more</span></div>
    <div class="focus" id="focus"></div>
  </section>
  <section class="sec" aria-label="The grand plan">
    <div class="sechead"><h2>The grand plan</h2><span>One line for everything</span></div>
    <div class="path" id="path"></div>
    <div class="legend"><span><i style="background:var(--red)"></i>Games</span><span><i style="background:var(--blue)"></i>Tabletop</span><span><i style="background:var(--yellow)"></i>Tools</span></div>
    <p class="srcnote" id="srcnote"></p>
  </section>
  <section class="sec" aria-label="The basics">
    <div class="sechead"><h2>The basics</h2><span id="basicsnote"></span></div>
    <div class="basics" id="basics"></div>
    <p class="sortnote">Checked by reading each game's code on the scan date, so treat it as a first pass. You can correct any of them on a project's page.</p>
  </section>
  <section class="sec" aria-label="All projects">
    <div class="sechead"><h2>All projects</h2><span id="count"></span></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="cards"></div>
    <button class="btn line more" id="more" data-act="more"></button>
    <details class="hid" id="hiddenbox"></details>
  </section>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const SCANNED = "2026-11-24";
const SITE = "https://gamedesignerjoe.github.io/";

const STAGES = [
  {n:1, name:"Spark", desc:"An idea, notes, maybe a mockup"},

  {n:5, name:"Polished", desc:"Feels finished, with the basics in place", how:["Orientation locked, and touch controls that feel native","Works offline and saves progress","Sound that unlocks on the first tap","An app icon, a splash screen, and a name check in the stores","Haptics and other native touches"]},
  {n:6, name:"Tested in public", desc:"itch.io and the web portals. For tabletop, a posted print-and-play", how:["itch.io is free and instant. Post with a strong thumbnail and a 10-second GIF","Submit to Poki or CrazyGames (review takes a few weeks) and post on Newgrounds","Watch what people finish and share","Decision point: if people play and share it, go to mobile. If not, improve the game before spending money"]},
  {n:7, name:"Google Play", desc:"The first store, and where the money model gets picked", how:["$25 once for the Play Console","Capacitor wraps the web game, and it builds on Windows","New personal accounts run a closed test with testers for a couple of weeks","Pick the model: free with rewarded ads, or free with a one-time remove-ads purchase"]},

];

const PLAN_SRC = {title:"Publishing web games to app stores", date:"Nov 15", url:"https://claude.ai/chat/bfe6cdb1-4a80-4c4e-977e-ac53ce5fc708"};
const LEAD = "wolf";
const BASICS = [
 ["icon","App icon","A real icon at 192 and 512, plus an Apple touch icon"],
 ["favicon","Tab icon","The small icon in the browser tab"],
 ["install","Add to home screen","A web manifest, so it installs like an app"],
 ["phone","Phone layout","Sized for a phone screen"],
 ["notch","Clears the notch","Respects the phone's safe areas"],

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function lastOf(p){ var l=S.live[p.id]; return (l && l>p.last) ? l : p.last; }
function days(p){ var d=new Date(lastOf(p)+"T12:00:00"); return Math.max(0, Math.round((Date.now()-d.getTime())/864e5)); }
function ago(n){ if(n<=0) return "today"; if(n===1) return "yesterday"; if(n<14) return n+" days ago"; if(n<70) return Math.round(n/7)+" weeks ago"; if(n<365) return Math.round(n/30.4)+" months ago"; var y=Math.round(n/365*10)/10; return (y===1?"a year":y+" years")+" ago"; }
function stageName(n){ return STAGES[n-1].name; }
function href(p){ return !p.url ? "" : (/^https?:/.test(p.url) ? p.url : SITE+p.url); }
function isStar(id){ return S.star.indexOf(id)>=0; }
function isHidden(id){ return S.hidden.indexOf(id)>=0; }
function visible(){ return PROJECTS.filter(function(p){ return !isHidden(p.id); }); }

// lists: what the scan found, minus what was removed, plus what was added on this device
function items(p, kind){
  var rem=S.removed[p.id]||{}, add=(S.added[p.id]||{})[kind]||[];
  var base=(p[kind]||[]).slice();
  if(kind==="steps" && !base.length) base=[ p.url ? (p.kind==="tool" ? "Open it and use it once, start to finish" : "Open it and play for five minutes") : "Open the folder and read the last thing you wrote" ];
  return base.concat(add).map(function(t){ return {t:t, k:p.id+":"+kind+":"+hash(t), mine:add.indexOf(t)>=0}; }).filter(function(o){ return !rem[o.k]; });
}
function openSteps(p){ return items(p,"steps").filter(function(o){ return !S.done[o.k]; }); }
function dream(p){ return S.dream[p.id]||null; }
function gapText(p){
  var d=dream(p); if(!d||!d.dest) return "";
  var g=d.dest-p.stage; if(g<=0) return "You're where you wanted to be";
  return g+(g===1?" stop":" stops")+" from the dream";
}

// what to surface when nothing is starred: recently warm, heavily invested, close to a stated dream
function score(p){
  var n=days(p), s=Math.min(p.commits,150)/150*1.5;
  s += 3.5*Math.exp(-n/12) + (n<=60 ? .8 : n<=180 ? .3 : 0);
  var d=dream(p); if(d&&d.dest&&d.dest>p.stage) s+=1.2;
  if(p.love) s+=.4;
  return s;
}
function nowQueue(){
  var pool=visible().filter(function(p){ return openSteps(p).length && S.skip.indexOf(p.id)<0; });
  var stars=pool.filter(function(p){ return isStar(p.id); });
  var rest=pool.filter(function(p){ return !isStar(p.id); }).sort(function(a,b){ return score(b)-score(a); });
  return stars.concat(rest);
}
function why(p){
  var n=days(p);
  if(isStar(p.id)) return "One of your focus projects. Last touched "+ago(n)+".";
  if(n<=14) return "You were in here "+ago(n)+". The thread is still warm.";
  if(p.commits>=40) return p.commits+" commits in, and untouched for "+(n<70?Math.round(n/7)+" weeks":Math.round(n/30.4)+" months")+".";
  return "Last touched "+ago(n)+".";
}

function prompt(p, step){
  var d=dream(p), L=[];
  L.push("I'm getting back into "+p.name+", one of my side projects. It lives in the "+p.folder+"/ folder of my "+REPO+" repo"+(href(p)?" and runs at "+href(p):"")+".");
  L.push(""); L.push("Where it stands: "+p.status);
  if(p.left) L.push("Where I left off ("+lastOf(p)+"): "+p.left);
  var lv=(S.love[p.id]!=null?S.love[p.id]:p.love); if(lv) L.push("What I love about it: "+lv);
  if(d&&(d.text||d.dest)) L.push("My dream for it: "+[d.text, d.dest?("Destination: "+stageName(d.dest)+"."):""].filter(Boolean).join(" "));
  L.push("It's at the \""+stageName(p.stage)+"\" stage of my usual path ("+STAGES.map(function(s){return s.name;}).join(" > ")+").");
  var st=step||(openSteps(p)[0]||{}).t; if(st){ L.push(""); L.push("The one small thing I want to do right now: "+st); }
  var td=items(p,"todos").filter(function(o){return !S.done[o.k];}).slice(0,8);
  if(td.length){ L.push(""); L.push("Open to-dos:"); td.forEach(function(o){ L.push("- "+o.t); }); }
  var miss=basicsOf(p).filter(function(x){ return !x.ok; }).map(function(x){ return x.name; });
  if(miss.length){ L.push(""); L.push("Basics it's still missing: "+miss.join(", ")+"."); }
  L.push("My bigger goal: "+GOALS.join(" "));
  L.push(""); L.push("Help me start with that one small thing. Keep it small, then tell me the next step after it.");
  return L.join("\n");
}

var toastT;
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; }, 2600); }
function copy(text, ok){
  var done=function(){ toast(ok); };
  var fb=function(){ var ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy from here"); } document.body.removeChild(ta); };
  try{ navigator.clipboard.writeText(text).then(done, fb); }catch(e){ fb(); }
}

function drawTrail(){

     act("button",isStar(p.id)?"on":"",I.star,isStar(p.id)?"Starred":"Star",'data-act="star" data-id="'+p.id+'" aria-pressed="'+isStar(p.id)+'"')+
     act("button","",I.hide,"Hide",'data-act="hide" data-id="'+p.id+'"')+
   '</div>'+
   '<div class="block"><div class="mini">'+mini+'</div><div class="minicap"><span>Now: <b>'+esc(stageName(p.stage))+'</b></span><span>'+(g?esc(g):(d?"":"No destination set"))+'</span></div><p>'+esc(p.status)+'</p></div>'+
   (p.left?'<div class="block"><span class="label">Where you left off · '+ago(n)+'</span><p>'+esc(p.left)+'</p></div>':'')+
   '<div class="block"><span class="label">What you love about it</span><textarea class="fit" id="love" rows="1" data-id="'+p.id+'" placeholder="What pulled you into this one? Write it down so it can pull you back.">'+esc(love)+'</textarea>'+(p.love&&S.love[p.id]==null?'<span class="hint">Pulled from your own docs and notes. Fix it if it\'s off.</span>':'')+'</div>'+
   dq+
   listBlock(p,"steps","Small steps","Fifteen minutes or less. These feed the one-thing pane.",true,"Add a small step")+
   listBlock(p,"todos","To-do","",true,"Add a to-do")+
   listBlock(p,"ideas","Cool ideas","",false,"Add an idea")+
   (bs.length?'<div class="block"><span class="label">The basics · '+basicsCount(p)+'</span><span class="hint">'+(missing.length?"Still to add: "+missing.map(function(x){ return x.name.toLowerCase(); }).join(", ")+".":"All in.")+" Tap one to correct it."+(ik&&ik!=="app icon"?" The picture shown for this project is its "+ik+", not a real app icon.":(!ik?" No icon found, so it shows an emoji.":""))+'</span><div class="bgrid">'+
     bs.map(function(x){ return '<button class="bitem'+(x.ok?" ok":"")+'" data-act="basic" data-id="'+p.id+'" data-k="'+x.k+'" title="'+esc(x.desc)+'" aria-pressed="'+x.ok+'"><i>'+I.check+'</i>'+esc(x.name)+'</button>'; }).join("")+'</div></div>':'')+
   '<p class="src">'+p.commits+" commits · started "+p.first+" · last commit "+lastOf(p)+" · "+esc(p.folder)+"/<br>Read from: "+esc(p.docs)+'</p>'+
  '</div>';
  fitAll();
}
function thread(id){ return S.chat[id]||(S.chat[id]=[]); }
function appContext(){
  var L=["Trailhead is my personal tracker for my side projects. It reads from my "+REPO+" repo and puts every project on one path: "+STAGES.map(function(s){return s.name;}).join(" > ")+"."];
  L.push("What I'm reaching for: "+GOALS.join(" "));
  L.push(""); L.push("My projects right now:");
  visible().forEach(function(p){ var d=dream(p); L.push("- "+p.name+" ("+p.kind+", "+stageName(p.stage)+", last touched "+ago(days(p))+(isStar(p.id)?", starred":"")+"): "+p.tag+(d&&d.text?" Dream: "+d.text:"")); });
  return L.join("\n");
}
function contextFor(id){ return id==="_app" ? appContext() : prompt(BY[id]).replace(/\n\nHelp me start with that one small thing[\s\S]*$/,""); }
function transcript(id){ return thread(id).filter(function(m){ return !m.err; }).map(function(m){ return (m.r==="u"?"Joe: ":"Assistant: ")+m.t; }).join("\n\n"); }
function handoff(id){
  var t=transcript(id);
  return contextFor(id)+(t?"\n\nWhat I've talked through so far in Trailhead:\n\n"+t:"")+"\n\n"+(id==="_app"?"Pick this up with me. If I'm asking for changes to Trailhead itself, help me spec them.":"Pick this up with me from here. Start with one small thing I can do now.");
}
function chatHtml(){
  var id=UI.chat, p=BY[id], th=thread(id), has=!!getKey();
  var ho=handoff(id), link="https://claude.ai/new?q="+encodeURIComponent(ho.length>6000?ho.slice(0,6000)+"\n\n(The rest is on my clipboard. I'll paste it.)":ho);
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Chat">'+
   '<div class="shead">'+(p?tile(p):'<span class="tile" aria-hidden="true">'+I.chat+'</span>')+'<div class="t"><h2>'+(p?esc(p.name):"Trailhead")+'</h2><p>'+(p?"Flesh this one out":"Talk about your projects, or about changes to this app")+'</p></div><button class="round" data-act="chatclose" aria-label="Close">'+I.x+'</button></div>'+
   (th.length?'<div class="msgs">'+th.map(function(m,i){ return '<div class="msg '+(m.r==="u"?"me":"ai")+(m.err?" err":"")+'">'+esc(m.t).replace(/\n/g,"<br>")+(m.r==="a"&&!m.err&&!m.wait&&p?'<button class="keep" data-act="keep" data-i="'+i+'">Save as an idea</button>':'')+'</div>'; }).join("")+'</div>'
     :'<div class="block"><p>'+(has?"Say what's on your mind. The reply knows where this "+(p?"project":"app")+" stands.":"There's no chat key on this device, so nothing answers here yet. You can still write your thoughts down, then carry all of it into Claude with one tap.")+'</p></div>')+
   '<form class="chatform" data-form="chat"><textarea class="fit" id="chatin" rows="1" placeholder="'+(has?"Message":"Write a note to yourself")+'" aria-label="Message">'+esc(UI.seed||"")+'</textarea><button class="round sendbtn" aria-label="Send">'+I.send+'</button></form>'+
   '<div class="chatacts"><a class="btn solid" href="'+esc(link)+'" target="_blank" rel="noopener" data-act="handoff">'+I.arrow+'Continue in Claude</a>'+(th.length?'<button class="btn line" data-act="chatclear">Clear</button>':'')+'</div>'+
   '<p class="src">Continue in Claude opens a new chat with this project\'s status and everything written here already in the box. It is also copied, in case the box comes up empty.'+(has?"":" To get answers here, add a fal key in the menu.")+'</p>'+
  '</div>';
}
function sendChat(){
  var inp=document.getElementById("chatin"), v=inp.value.trim(), id=UI.chat; if(!v) return;
  var th=thread(id); th.push({r:"u", t:v}); UI.seed=""; 
  var key=getKey();
  if(!key){ save(); renderSheet(); return; }
  var hist=transcript(id), wait={r:"a", t:"…", wait:1}; th.push(wait); renderSheet();
  var sys="You are a thinking partner inside Trailhead, Joe's own tracker for his side projects. He gets heavily invested in a project and then drifts to the next one, so your job is to help him get back in and keep going. Be warm and brief: a few sentences, plain words, no headers. Ask one question at a time. Push toward the next small concrete step. "+(id==="_app"?"He may also want to talk about improving Trailhead itself. You cannot change the app, so help him get clear on what he wants and tell him to use Continue in Claude to have it built.":"You cannot edit files or the app. If he needs building done, tell him to use Continue in Claude.")+"\n\nContext:\n"+contextFor(id);
  fetch("https://fal.run/openrouter/router",{method:"POST", headers:{"Authorization":"Key "+key, "Content-Type":"application/json"},
    body:JSON.stringify({model:S.model||MODEL_DEFAULT, system_prompt:sys, prompt:hist+"\n\nAssistant:", max_tokens:900, temperature:0.7})})
  .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; }, function(){ return {ok:r.ok, status:r.status, j:{}}; }); })
  .then(function(o){
    delete wait.wait;
    if(o.ok && o.j && o.j.output){ wait.t=String(o.j.output).replace(/^\s*Assistant:\s*/,"").trim(); }
    else { wait.err=1; wait.t = o.status===401||o.status===403 ? "fal turned the key down. Check it in the menu." : "fal answered with an error"+(o.j&&(o.j.error||o.j.detail)?": "+String(typeof (o.j.error||o.j.detail)==="string"?(o.j.error||o.j.detail):JSON.stringify(o.j.error||o.j.detail)).slice(0,200):" ("+o.status+")")+"."; }
    if(th.length>60) th.splice(0, th.length-60);
    save(); if(UI.chat===id) renderSheet();
  })
  .catch(function(){ delete wait.wait; wait.err=1; wait.t="Couldn't reach fal from this page. That happens inside Claude, where outside calls are blocked. It should work from your own site or a local file."; save(); if(UI.chat===id) renderSheet(); });
}
function menuHtml(){
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">'+
   '<div class="shead"><div class="t"><h2>Trailhead</h2><p>'+PROJECTS.length+' projects, read from your repo on '+SCANNED+'</p></div><button class="round" data-act="close" aria-label="Close">'+I.x+'</button></div>'+
   '<div class="block"><span class="label">Fresh dates</span><p>Ask GitHub when each project last changed. It needs no key, and works when this page runs on your own site.</p><button class="btn solid" data-act="github">Check GitHub now</button><span class="hint" id="ghmsg">'+(S.liveAt?"Last checked "+new Date(S.liveAt).toLocaleString():"Not checked yet")+'</span></div>'+
   '<div class="block"><span class="label">Chat key</span><p>'+(getKey()?"A fal key is saved on this device.":"Paste a fal key to get answers in the chat. It stays in this browser and is sent only to fal.")+'</p>'+
     '<input class="field" id="falkey" type="password" autocomplete="off" placeholder="'+(getKey()?"Paste a new key to replace it":"fal key")+'" aria-label="fal key">'+
     '<input class="field" id="falmodel" type="text" autocomplete="off" value="'+esc(S.model||MODEL_DEFAULT)+'" aria-label="Model">'+
     '<div class="chatacts"><button class="btn solid" data-act="savekey">Save</button>'+(getKey()?'<button class="btn line" data-act="rmkey">Remove key</button>':'')+'</div>'+
     '<span class="hint">The key is never part of a backup, and never in the page or your repo. Any page on the same web address can read it, so set a spending limit on the key at fal.</span></div>'+
   '<div class="block"><span class="label">Your stars, dreams, to-dos and chats</span><p>They are saved in this browser. Copy a backup to move them to another device, or to keep one somewhere safe.</p><button class="btn solid" data-act="backup">Copy backup</button>'+
     '<textarea class="paste" id="restore" rows="2" placeholder="Paste a backup here to restore it"></textarea><button class="btn line" data-act="restore">Restore from pasted backup</button></div>'+
   '<div class="block"><span class="label">Not tracked</span><p class="hint">Folders left out because they hold assets, originals or one-off pages: '+esc(NOT_TRACKED)+'.</p></div>'+
  '</div>';
}

function fit(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }
function fitAll(){ document.querySelectorAll("textarea.fit").forEach(fit); }
function renderAll(){ renderGoal(); renderNow(); renderFocus(); renderPath(); renderBasics(); renderList(); renderSheet(); }

var pendingDest=null;
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-act]");
  if(!t){ if(e.target.id==="scrim"){ UI.open=null; UI.menu=false; UI.chat=null; UI.editDream=false; renderSheet(); } return; }
  var a=t.dataset.act, id=t.dataset.id, p=BY[id];
  if(a==="open"){ UI.chat=null; UI.open=id; UI.editDream=false; pendingDest=null; renderSheet(); document.querySelector(".sheet").scrollTop=0; }
  else if(a==="close"){ UI.open=null; UI.menu=false; UI.editDream=false; renderAll(); }
  else if(a==="menu"){ UI.menu=true; renderSheet(); }
  else if(a==="star"){
    var i=S.star.indexOf(id);
    if(i>=0) S.star.splice(i,1);
    else if(S.star.length>=2){ toast("Two stars is the limit. Unstar "+BY[S.star[0]].name+" or "+BY[S.star[1]].name+" first."); return; }
    else { S.star.push(id); UI.nowIdx=0; }
    save(); renderAll();
  }
  else if(a==="hide"){ if(!isHidden(id)) S.hidden.push(id); var s=S.star.indexOf(id); if(s>=0) S.star.splice(s,1); UI.open=null; save(); renderAll(); toast(p.name+" is hidden. It's at the bottom if you want it back."); }
  else if(a==="unhide"){ S.hidden.splice(S.hidden.indexOf(id),1); save(); renderAll(); }
  else if(a==="kind"){ UI.kind=t.dataset.v; UI.showAll=false; renderList(); }
  else if(a==="sort"){ UI.sort=UI.sort==="recent"?"invested":"recent"; renderList(); }
  else if(a==="more"){ UI.showAll=true; renderList(); }
  else if(a==="tick"){ var k=t.dataset.k; if(S.done[k]) delete S.done[k]; else S.done[k]=Date.now(); save(); renderAll(); }
  else if(a==="rm"){
    var ad=(S.added[id]||{})[t.dataset.kind]||[], ix=ad.indexOf(t.dataset.t);
    if(ix>=0) ad.splice(ix,1); else { (S.removed[id]=S.removed[id]||{})[t.dataset.k]=1; }
    save(); renderAll();
  }
  else if(a==="basic"){ var cur=basicsOf(p).filter(function(x){ return x.k===t.dataset.k; })[0]; (S.basics[id]=S.basics[id]||{})[t.dataset.k]=cur.ok?0:1; save(); var tp=document.querySelector(".sheet").scrollTop; renderAll(); document.querySelector(".sheet").scrollTop=tp; }
  else if(a==="nowdone"){ S.done[t.dataset.k]=Date.now(); UI.justDone++; save(); renderAll(); }
  else if(a==="nownext"){ UI.nowIdx++; UI.justDone=0; renderNow(); }
  else if(a==="chat"){ UI.chat=id; UI.menu=false; UI.seed=t.dataset.step?"Help me start: "+t.dataset.step:""; renderSheet(); }
  else if(a==="chatclose"){ UI.chat=null; UI.seed=""; renderAll(); }
  else if(a==="chatclear"){ S.chat[UI.chat]=[]; save(); renderSheet(); }
  else if(a==="handoff"){ var pend=(document.getElementById("chatin")||{}).value; if(pend&&pend.trim()){ thread(UI.chat).push({r:"u",t:pend.trim()}); UI.seed=""; save(); t.href="https://claude.ai/new?q="+encodeURIComponent(handoff(UI.chat).slice(0,6000)); } copy(handoff(UI.chat), "Copied too. Opening Claude."); }
  else if(a==="keep"){ var m=thread(UI.chat)[+t.dataset.i], pid=UI.chat; if(m&&BY[pid]){ S.added[pid]=S.added[pid]||{}; (S.added[pid].ideas=S.added[pid].ideas||[]).push(m.t.length>280?m.t.slice(0,277)+"…":m.t); save(); toast("Saved to "+BY[pid].name+"'s ideas."); } }
  else if(a==="savekey"){ var kv=document.getElementById("falkey").value.trim(), mv=document.getElementById("falmodel").value.trim(); if(kv) setKey(kv); S.model=mv||MODEL_DEFAULT; save(); renderSheet(); toast(kv?"Key saved on this device.":"Saved."); }
  else if(a==="rmkey"){ setKey(""); renderSheet(); toast("Key removed."); }
  else if(a==="editdream"){ UI.editDream=true; pendingDest=(dream(BY[UI.open])||{}).dest||null; renderSheet(); }
  else if(a==="dest"){ pendingDest=+t.dataset.v; t.parentNode.querySelectorAll(".opt").forEach(function(o){ o.setAttribute("aria-pressed", o===t); }); }
  else if(a==="savedream"){
    var txt=document.getElementById("dreamtext").value.trim(), on=document.querySelector('.opt[aria-pressed="true"]');
    var dest=on?+on.dataset.v:null;
    if(!txt&&!dest){ toast("Write a line or pick how far it should go."); return; }
    S.dream[id]={text:txt, dest:dest, at:Date.now()}; UI.editDream=false; save(); renderAll(); toast("Saved. That's what this one is for.");
  }
  else if(a==="backup"){ copy(JSON.stringify(S), "Backup copied."); }
  else if(a==="restore"){
    try{ var o=JSON.parse(document.getElementById("restore").value); if(!o||typeof o!=="object"||!Array.isArray(o.star)) throw 0; S=o; ["hidden","skip"].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; }); ["dream","love","done","added","removed","live","basics","chat"].forEach(function(k){ if(!S[k]) S[k]={}; }); migrate(); save(); UI.menu=false; renderAll(); toast("Restored."); }
    catch(err){ toast("That doesn't look like a Trailhead backup."); }
  }
  else if(a==="github"){ checkGitHub(true); }
});
document.addEventListener("submit", function(e){
  if(e.target.closest('[data-form="chat"]')){ e.preventDefault(); sendChat(); return; }
  var f=e.target.closest('[data-form="add"]'); if(!f) return; e.preventDefault();
  var inp=f.querySelector("input"), v=inp.value.trim(); if(!v) return;
  var id=f.dataset.id, kind=f.dataset.kind; S.added[id]=S.added[id]||{}; (S.added[id][kind]=S.added[id][kind]||[]).push(v);
  save(); var top=document.querySelector(".sheet").scrollTop; renderAll(); document.querySelector(".sheet").scrollTop=top;
  var again=document.getElementById("add-"+kind); if(again) again.focus();
});
document.addEventListener("input", function(e){
  if(e.target.classList&&e.target.classList.contains("fit")) fit(e.target);
  if(e.target.id==="chatin"){ UI.seed=e.target.value; }
  if(e.target.id==="love"){ S.love[e.target.dataset.id]=e.target.value; save(); }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="chatin"&&window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); sendChat(); return; }
  if(e.key==="Escape"&&UI.chat){ UI.chat=null; renderAll(); return; }
  if(e.key==="Escape"&&(UI.open||UI.menu)){ UI.open=null; UI.menu=false; UI.editDream=false; renderAll(); } });
window.addEventListener("resize", drawTrail);

function checkGitHub(manual){
  var msg=function(m){ var el=document.getElementById("ghmsg"); if(el) el.textContent=m; };
  var list=PROJECTS.slice(), i=0, changed=0, failed=false;
  if(manual) msg("Checking…");
  function next(){
    if(failed) return;
    if(i>=list.length){ S.liveAt=Date.now(); save(); renderAll(); if(manual){ UI.menu=true; renderSheet(); msg(changed?changed+" projects have newer commits than the scan.":"No commits newer than the scan."); } return; }
    var p=list[i++];
    fetch("https://api.github.com/repos/"+REPO+"/commits?per_page=1&path="+encodeURIComponent(p.folder)).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
      var d=j&&j[0]&&j[0].commit&&j[0].commit.committer&&j[0].commit.committer.date;
      if(d){ d=d.slice(0,10); if(d>p.last){ if(S.live[p.id]!==d) changed++; S.live[p.id]=d; } }
      next();
    }).catch(function(){ failed=true; if(manual) msg("Couldn't reach GitHub from here. This works once the page is on your own site."); });
  }
  try{ next(); }catch(e){ if(manual) msg("Couldn't reach GitHub from here."); }
}

renderAll();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawTrail);
if(/github\.io$/.test(location.hostname) && (!S.liveAt || Date.now()-S.liveAt>12*36e5)) checkGitHub(false);
})();
</script></body></html>
