<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1512">
<title>Crunch</title>
<meta name="description" content="Crunch: a cooperative micro card game about shipping a video game. Table playtest build.">
<style>
:root {
  --bg: #0b1512; --felt1: #1f5a47; --felt2: #0f3328; --rail: #08100e;
  --panel: rgba(8, 18, 15, 0.82); --panel2: #16241f; --line: rgba(255, 255, 255, 0.14);
  --ink: #f1efe6; --muted: #a9b5ae; --accent: #ffb224; --accent-ink: #1a1300; --good: #6fe09a; --bad: #ff6b5e;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.d-prod { --dc: #e8b84a; } .d-art { --dc: #ec6fae; } .d-code { --dc: #5cb8ff; } .d-design { --dc: #7ddc8a; } .d-event { --dc: #ff6b5e; }
* { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font-family: inherit; }
#wrap { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#stage { position: absolute; left: 0; top: 0; width: 1000px; height: 460px; transform-origin: 0 0; border-radius: 22px; background: radial-gradient(ellipse at 50% 42%, var(--felt1), var(--felt2) 78%); box-shadow: inset 0 0 0 6px var(--rail), inset 0 0 60px rgba(0, 0, 0, 0.55); user-select: none; -webkit-user-select: none; }
#hud, #cards { position: absolute; inset: 0; }
#hud { pointer-events: none; }
#hud > * { pointer-events: auto; }

/* panels on the table */
.zone { position: absolute; border: 1.5px dashed rgba(255, 255, 255, 0.22); border-radius: 10px; }
.zone .zl { position: absolute; left: 6px; top: -17px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
.zone .zl b { color: var(--ink); font-family: var(--mono); }
.zone.hot { border-color: var(--accent); background: rgba(255, 178, 36, 0.12); }
.zone.danger { border-color: var(--bad); } .zone.danger .zl b { color: var(--bad); }
#dir { position: absolute; left: 12px; top: 10px; width: 214px; height: 116px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 7px 9px; cursor: pointer; overflow: hidden; }
#dir .t { font-weight: 800; font-size: 14px; line-height: 1.15; }
#dir .p { font-size: 11px; color: var(--muted); margin: 2px 0 4px; line-height: 1.2; }
#dir .r { font-size: 11px; line-height: 1.3; }
#dir .r b { color: var(--accent); }
#ship { position: absolute; left: 716px; top: 10px; width: 272px; height: 124px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#ship.hot { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
#ship .hd { position: absolute; right: 8px; top: 3px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
#ship .hd b { font-family: var(--mono); color: var(--ink); font-size: 12px; }
#ship .row { position: absolute; left: 6px; font-size: 10.5px; font-weight: 800; color: var(--dc); letter-spacing: 0.04em; text-transform: uppercase; }
.seat { position: absolute; width: 118px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; cursor: pointer; }
.seat.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.seat .n { font-weight: 800; font-size: 13.5px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.seat .n span { font-size: 9.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; }
.seat .s { font-size: 11.5px; font-weight: 700; color: var(--good); }
.seat.burned .s { color: var(--bad); }
#die { position: absolute; left: 156px; top: 186px; width: 48px; text-align: center; }
#die .f { width: 48px; height: 48px; border-radius: 10px; background: #f2efe6; color: #1a1c22; font-family: var(--mono); font-weight: 800; font-size: 28px; line-height: 48px; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 3px 8px rgba(0, 0, 0, 0.4); }
#die.idle .f { opacity: 0.35; }
#die.fail .f { background: #ffb3ab; } #die.ok .f { background: #b9f3cf; }
#die .l { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-weight: 700; white-space: nowrap; }
#die.shake .f { animation: shake 0.6s ease-out; }
@keyframes shake { 0% { transform: rotate(-200deg) scale(0.6); } 60% { transform: rotate(20deg) scale(1.15); } 100% { transform: none; } }
#ticker { position: absolute; left: 150px; right: 150px; top: 293px; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink); text-shadow: 0 1px 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ticker.good { color: var(--good); } #ticker.bad, #ticker.lose { color: #ffb3ab; } #ticker.score { color: var(--accent); }
#title { position: absolute; left: 300px; right: 300px; top: 439px; text-align: center; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
#title span { color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
#prompt { position: absolute; left: 14px; top: 318px; width: 300px; font-size: 13px; line-height: 1.35; color: var(--ink); text-shadow: 0 1px 2px #000; }
#prompt b { color: var(--accent); }
#prompt .me { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
#actions { position: absolute; right: 14px; top: 326px; width: 282px; display: flex; flex-direction: column; gap: 7px; align-items: stretch; }
#menu { position: absolute; left: 240px; top: 10px; width: 40px; height: 36px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 19px; cursor: pointer; }
#roundtag { position: absolute; left: 290px; top: 14px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
#roundtag b { color: var(--ink); font-family: var(--mono); }

/* buttons */
.btn { display: block; width: 100%; text-align: left; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; font-size: 15px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn .sub { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary .sub { color: #5c4300; }
.btn.center { text-align: center; }
.btn:disabled { opacity: 0.5; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .seg button:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 14px; padding: 8px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* cards */
.card { position: absolute; left: 0; top: 0; width: 96px; height: 134px; transform-origin: 50% 50%; transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s; border-radius: 9px; cursor: pointer; touch-action: none; }
.card.drag { transition: none; z-index: 999 !important; box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55); }
.card .front, .card .back { position: absolute; inset: 0; border-radius: 9px; overflow: hidden; }
.card .front { background: #f4f1e8; color: #1a1c22; border: 1px solid rgba(0, 0, 0, 0.35); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; }
.card .back { background: repeating-linear-gradient(45deg, #2b3350, #2b3350 6px, #343d60 6px, #343d60 12px); border: 3px solid #e9e6dc; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4); display: none; align-items: center; justify-content: center; color: var(--accent); font-family: var(--mono); font-weight: 800; font-size: 11px; letter-spacing: 0.14em; }
.card.down .front { display: none; } .card.down .back { display: flex; }
.card .band { background: var(--dc); color: #111; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 6px; white-space: nowrap; overflow: hidden; }
.card .nm { font-size: 13px; font-weight: 800; line-height: 1.12; padding: 6px 6px 0; }
.card .ow { margin-top: auto; padding: 0 6px 6px; font-size: 9.5px; color: #555; line-height: 1.2; }
.card .pl { position: absolute; right: 4px; bottom: 4px; font-size: 8.5px; font-weight: 800; background: #1a1c22; color: var(--accent); border-radius: 4px; padding: 1px 4px; letter-spacing: 0.06em; }
.card.event .front { background: #2b1614; color: #ffe1dc; }
.card.event .add { margin-top: auto; padding: 0 6px 8px; font-size: 12px; font-weight: 800; color: var(--bad); }
.card.side .front { background: #d9d4c4; }
.card.side .front::after { content: 'HALF-ASSED'; position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 11px; font-weight: 900; color: rgba(160, 30, 20, 0.75); transform: rotate(-18deg); letter-spacing: 0.06em; }
.card.mini .nm, .card.mini .ow, .card.mini .pl, .card.mini .front::after { display: none; }
.card.mini .band { height: 100%; font-size: 0; }
.card.mini.side .band { opacity: 0.45; background: repeating-linear-gradient(45deg, var(--dc), var(--dc) 10px, #333 10px, #333 20px); }
.card.glow .front, .card.glow .back { box-shadow: 0 0 0 3px var(--accent), 0 0 18px 4px rgba(255, 178, 36, 0.65); }
.card.glow { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { margin-top: -4px; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card.glow { animation: none; } #die.shake .f { animation: none; } }

/* overlays (real pixels, not stage pixels) */
.ov { position: fixed; inset: 0; background: rgba(4, 8, 7, 0.72); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 50; }
.ov.on { display: flex; }
.box { background: #131d1a; border: 1px solid var(--line); border-radius: 14px; padding: 14px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; }
.box.wide { max-width: 860px; }
.box h1 { font-family: var(--mono); letter-spacing: 0.18em; color: var(--accent); font-size: 20px; margin: 0 0 2px; }
.box h2 { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
.box p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.4; }
.small { font-size: 13px; } .muted { color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px) { .cols { grid-template-columns: 1fr; } }
.pick { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); cursor: pointer; margin-bottom: 6px; }
.pick.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick .nm { font-weight: 800; font-size: 14.5px; } .pick .tw { font-size: 12.5px; color: var(--muted); } .pick .tg { font-size: 11.5px; color: var(--accent); font-family: var(--mono); margin-top: 2px; }
.rolerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.rolerow:first-child { border-top: 0; }
.rolerow .nm { font-weight: 800; } .rolerow .pw { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; background: #0c1512; border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex: none; }
.seg button { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 7px; cursor: pointer; min-height: 36px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.big { border-radius: 12px; background: #f4f1e8; color: #1a1c22; overflow: hidden; margin-bottom: 10px; }
.big.event { background: #2b1614; color: #ffe1dc; }
.big .band { background: var(--dc); color: #111; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 12px; }
.big .in { padding: 10px 12px 12px; }
.big .nm { font-size: 22px; font-weight: 800; line-height: 1.15; }
.big .ln { font-size: 14.5px; margin-top: 6px; line-height: 1.3; }
.big .ln b { font-weight: 800; }
.big .pts { font-size: 13px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0, 0, 0, 0.18); font-weight: 600; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btns { display: flex; flex-direction: column; gap: 7px; }
.note { font-size: 13.5px; background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin: 8px 0; border-left: 3px solid var(--accent); }
.note.bad { border-left-color: var(--bad); }
.bigscore { font-family: var(--mono); font-size: 54px; font-weight: 800; line-height: 1; color: var(--accent); }
.quote { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--accent); background: rgba(0, 0, 0, 0.3); border-radius: 0 8px 8px 0; font-size: 14px; font-style: italic; }
.quote span { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 3px; }
.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.tabs button { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 11px 4px; border-radius: 9px; cursor: pointer; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.log .e { padding: 2px 0; font-size: 13.5px; color: var(--muted); }
.log .e.turn, .log .e.month, .log .e.head { color: var(--ink); font-weight: 700; margin-top: 4px; }
.log .e.good, .log .e.win { color: var(--good); } .log .e.bad, .log .e.lose { color: var(--bad); } .log .e.score { color: var(--accent); }
.set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.set:first-child { border-top: 0; }
.set .lb b { display: block; font-size: 14.5px; font-weight: 600; } .set .lb span { display: block; font-size: 12.5px; color: var(--muted); }
.set.changed .lb b::after { content: ' \2022'; color: var(--accent); }
.set.stack { display: block; } .set.stack select { margin-top: 8px; width: 100%; }
.step { display: inline-flex; align-items: center; background: #0c1512; border: 1px solid var(--line); border-radius: 9px; flex: none; }
.step button { width: 40px; height: 40px; background: none; border: 0; color: var(--accent); font-size: 21px; font-weight: 700; cursor: pointer; }
.step .v { min-width: 40px; text-align: center; font-family: var(--mono); font-weight: 700; }
select { font: inherit; font-size: 14.5px; color: var(--ink); background: #0c1512; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; appearance: none; -webkit-appearance: none; max-width: 100%; }
.sw { position: relative; width: 50px; height: 30px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; background: #0c1512; border: 1px solid var(--line); border-radius: 15px; }
.sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform 0.15s; }
.sw input:checked + i { background: var(--accent); border-color: var(--accent); }
.sw input:checked + i::after { transform: translateX(20px); background: var(--accent-ink); }
.hb { display: grid; grid-template-columns: minmax(96px, 36%) 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; padding: 3px 0; }
.hb .tr { height: 12px; background: #0c1512; border-radius: 3px; overflow: hidden; }
.hb .tr i { display: block; height: 100%; background: var(--accent); }
.hb .tr i.g { background: var(--good); } .hb .tr i.r { background: var(--bad); } .hb .tr i.m { background: #6f7786; }
.hb .val { font-family: var(--mono); font-size: 13px; min-width: 40px; text-align: right; }
.headline { font-size: 20px; font-weight: 800; line-height: 1.2; } .headline .num { color: var(--accent); font-family: var(--mono); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 5px 4px; text-align: right; border-top: 1px solid var(--line); font-family: var(--mono); }
table.t th { font-family: var(--sans); font-size: 11px; text-transform: uppercase; color: var(--muted); border-top: 0; }
table.t td:first-child, table.t th:first-child { text-align: left; font-family: var(--sans); }
.prog { height: 8px; background: #0c1512; border-radius: 4px; overflow: hidden; margin-top: 8px; } .prog i { display: block; height: 100%; background: var(--accent); width: 0; }
.rules li { margin-bottom: 6px; } .rules ol, .rules ul { padding-left: 20px; margin: 4px 0 10px; font-size: 14.5px; line-height: 1.4; }
#rotate { z-index: 80; text-align: center; }
#rotate .box { max-width: 320px; }

#zoom { z-index: 55; } #sheet { z-index: 60; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cards"></div><div id="hud"></div></div></div>
<div class="ov" id="modal"></div>
<div class="ov" id="zoom"></div>
<div class="ov" id="sheet"></div>
<div class="ov" id="rotate"><div class="box"><p><b>Turn your phone sideways.</b></p><p class="small muted">Crunch is laid out like a table, so it plays in landscape.</p><button class="btn center" data-act="rotateok">Play this way anyway</button></div></div>
<noscript><p style="padding:16px">Crunch needs JavaScript to run.</p></noscript>
<script>
/* Crunch (table version) — rules engine, AI players and simulator. No dependencies. */
(function (root) {
  'use strict';

  const ROLE_ORDER = ['producer', 'artist', 'engineer', 'designer'];
  const ROLE_DISC = { producer: 'prod', artist: 'art', engineer: 'code', designer: 'design' };
  const DISC_KEYS = ['prod', 'art', 'code', 'design'];
  const DISC = {
    prod: { name: 'Production', role: 'producer' }, art: { name: 'Art', role: 'artist' },
    code: { name: 'Code', role: 'engineer' }, design: { name: 'Design', role: 'designer' }
  };
  const ROLES = { producer: { name: 'Producer', short: 'PRD' }, artist: { name: 'Artist', short: 'ART' }, engineer: { name: 'Engineer', short: 'ENG' }, designer: { name: 'Designer', short: 'DES' } };

  // ------------------------------------------------------------ review quotes and log export
  const OUTLETS = ['IGM', 'GameSpotty', 'Polygoon', 'Kotakoo', 'Eurogamist', 'PC Gamut', 'Destructible', 'Rock Paper Shogun', 'Game Informant'];
  const HEAD = [
    [90, ['A masterpiece. We have no notes, and we tried.', 'Clear your calendar. Then clear it again.', 'The rare game that ships finished.']],
    [80, ['Confident, polished, and only slightly on fire.', 'You can feel the crunch, but you can also feel the craft.', 'Buy it. Then apologise to your backlog.']],
    [70, ['A good game with a great game trapped somewhere inside it.', 'Solid. Wait for the first patch.', 'Fun, in the way that leftovers are dinner.']],
    [55, ['Ambitious. We mean that the way your manager means it.', 'There are ideas here. Several of them even work.', 'You will finish it. You will not mention it.']],
    [0, ['We finished it so you do not have to.', 'Technically a video game.', 'It has a main menu. We will give it that.']]
  ];
  const CANCELLED = ['The trailer was incredible. We will always have the trailer.', 'Sources say the team is exploring new opportunities.', 'Cancelled, which makes it the most polished thing the studio announced this year.'];
  const WEAK = { art: 'It looks like it was drawn during the meeting about how it should look.', code: 'It runs at a cinematic frame rate, if your favourite film is a slideshow.', design: 'We are still not sure what you are supposed to do, and neither is the game.', prod: 'It shipped with the energy of a group project finished on the bus.' };
  const STRONG = { art: 'Every screenshot is a desktop wallpaper.', code: 'We could not make it crash, and we were being paid to.', design: 'One more turn became four in the morning.', prod: 'It came out on the day they said it would. We checked twice.' };
  const DIRQ = {
    gtu: ['The unicycle physics alone are worth the price.', 'An open world with nothing in it but a unicycle and regret.'],
    starblo: ['I have not seen my family in days. The loot is that good.', 'The numbers go up. That is all that happens.'],
    dookie: ['Exactly what you expected, exactly when you expected it.', "Last year's game with this year's number on it."],
    pinch: ['I cried at a staircase.', 'A two-hour walk to nowhere in particular.'],
    crossfit: ['Finally, a raccoon that respects my deadlift.', 'Cozy the way a waiting room is cozy.']
  };
  function reviews() {
    if (!st || !st.over) return [];
    const seed = Math.abs(st.seed), pick = (a, k) => a[(seed + k) % a.length], by = (k, sc) => pick(OUTLETS, k * 3) + (sc == null ? '' : ', ' + Math.max(1, Math.min(100, sc)) + '/100');
    if (st.cancelled) return [{ text: pick(CANCELLED, 0), by: by(0) }, { text: pick(CANCELLED, 1), by: by(1) }];
    const sc = st.result.score, out = [], comp = {}, right = {};
    out.push({ text: pick(HEAD.find(h => sc >= h[0])[1], 0), by: by(0, sc + 2) });
    for (const x of st.shipped) { const m = x.how === 'comp' ? comp : right; m[x.card.disc] = (m[x.card.disc] || 0) + 1; }
    const pillarsBad = st.dir.pillars.reduce((s, d) => s + (comp[d] || 0), 0);
    if (DIRQ[st.dir.key]) out.push({ text: DIRQ[st.dir.key][pillarsBad >= 2 ? 1 : 0], by: by(1, sc - 3) });
    const fakes = st.shipped.filter(x => x.how === 'comp' && x.card.disc !== C.ROLE_DISC[x.by]);
    const worst = C.DISC_KEYS.filter(d => d !== st.dir.free).sort((a, b) => (comp[b] || 0) - (comp[a] || 0))[0];
    const best = C.DISC_KEYS.slice().sort((a, b) => (right[b] || 0) - (right[a] || 0))[0];
    if (fakes.length && sc < 90) { const x = pick(fakes, 2); out.push({ text: 'Asked about ' + x.card.name + ', the studio said: "' + x.card.comp[C.ROLE_DISC[x.by]] + '" We respect the honesty.', by: by(2, sc) }); }
    else if ((comp[worst] || 0) >= 2) out.push({ text: WEAK[worst], by: by(2, sc - 1) });
    else out.push({ text: STRONG[best], by: by(2, sc + 1) });
    return out;
  }
  function exportText() {
    const L = [], S = st.S, D = C.DEFAULTS, ch = [];
    L.push('CRUNCH playtest log, build ' + BUILD, 'Saved: ' + new Date().toString(), 'Project: ' + st.title + ' (' + st.dir.pitch + ') ' + dirRule(st.dir), 'Seed: ' + st.seed);
    L.push('Team, in turn order: ' + st.players.map((p, i) => (i + 1) + ' ' + C.ROLES[p.role].name + (p.human ? ' (human)' : ' (AI)')).join(', '));
    for (const k in D) if (k !== 'ai' && S[k] !== D[k]) ch.push(k + '=' + S[k]);
    L.push('Settings changed from default: ' + (ch.length ? ch.join(', ') : 'none'));
    const r = st.result || C.score(st);
    L.push('Status: ' + (st.over ? (st.cancelled ? 'CANCELLED' : 'SHIPPED, review ' + r.score + ' (' + C.verdict(r.score) + '), target ' + S.target) : 'in progress, round ' + st.round) + '. ' + r.right + ' right, ' + r.comp + ' half-assed, ' + r.unfinished + ' unfinished, ' + r.features + ' Features.');
    for (const q of reviews()) L.push('Review: "' + q.text + '" (' + q.by + ')');
    L.push('Shipped: ' + (st.shipped.map(x => x.card.name + (x.how === 'right' ? (x.fixed ? ' [right, ' + x.fixed + ']' : ' [right]') : ' [half-assed]') + ' by ' + C.ROLES[x.by].name).join('; ') || 'nothing'));
    L.push('Still Behind Schedule: ' + (st.behind.map(c => c.name).join(', ') || 'nothing'), '');
    for (const e of st.log) {
      if (e.kind === 'month' || e.kind === 'head') L.push('', '===== ' + e.text + ' =====');
      else if (e.kind === 'turn') L.push('', '--- ' + e.text);
      else if (e.kind === 'state') L.push('    [' + e.text + ']');
      else if (e.kind === 'choice') L.push('      > ' + e.text);
      else L.push('    ' + e.text);
    }
    L.push('', 'Totals:');
    for (const p of st.players) { const x = st.stats.role[p.role]; L.push('  ' + C.ROLES[p.role].name + ': ' + x.turns + ' turns, ' + x.right + ' right, ' + x.comp + ' half-assed, ' + x.idle + ' turns with no task done, ' + x.crunches + ' crunches, ' + x.burnouts + ' burnouts, ' + x.rests + ' rests, ' + x.power + ' power uses.'); }
    return L.join('\n');
  }
  function flash(msg) { copyMsg = msg; renderOverlays(); setTimeout(() => { if (copyMsg === msg) { copyMsg = ''; renderOverlays(); } }, 3000); }
  function copyLog() {

    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } document.body.removeChild(ta); flash(ok ? 'Copied' : 'Could not copy'); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => flash('Copied'), fallback); else fallback();
  }
  function saveLog() {
    try {
      const d = new Date(), z = n => String(n).padStart(2, '0'), name = 'crunch-log-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + '.txt';
      const url = URL.createObjectURL(new Blob([exportText()], { type: 'text/plain' })), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { flash('Could not save'); }
  }

  // ------------------------------------------------------------ simulate
  let simN = 500, simRunning = false, simLast = null, simToken = 0;
  function hb(label, value, max, text, cls) { return '<div class="hb"><span>' + esc(label) + '</span><span class="tr"><i class="' + (cls || '') + '" style="width:' + (max ? Math.max(0, Math.min(100, 100 * value / max)) : 0) + '%"></i></span><span class="val">' + text + '</span></div>'; }
  function simPanel() {
    let h = '<p class="small muted">Four AI players play the game over and over with your current Settings, once playing carefully and once just doing the obvious thing. The gap between the two is how much your choices matter.</p>' +
      '<div class="set"><div class="lb"><b>Games</b></div><div class="seg">' + [100, 500, 1000, 5000].map(n => '<button data-n="' + n + '" class="' + (simN === n ? 'on' : '') + '">' + (n >= 1000 ? n / 1000 + 'k' : n) + '</button>').join('') + '</div></div>' +
      '<button class="btn primary center" data-act="run"' + (simRunning ? ' disabled' : '') + '>' + (simRunning ? 'Running&hellip;' : 'Run ' + simN.toLocaleString() + ' games') + '</button><div class="prog" id="simprog" style="' + (simRunning ? '' : 'display:none') + '"><i></i></div>';
    if (simLast) {
      const a = simLast.a, b = simLast.b, g = a.games, avg = x => x.shipSum / Math.max(1, x.games - x.cancelled), gap = avg(a) - avg(b);
      h += '<h2>Result</h2><div class="headline">Careful teams hit the target in <span class="num">' + pct(a.wins, g) + '%</span> of ' + g.toLocaleString() + ' games.</div><p class="small muted" style="margin-top:6px">The target is a review of ' + simLast.target + '. Shipped games averaged ' + Math.round(avg(a)) + '. ' + pct(a.cancelled, g) + '% of projects were cancelled (' + pct(a.quits, g) + '% because someone quit).</p>';
      h += '<h2>Do choices matter?</h2>' + hb('Careful play', avg(a), 100, Math.round(avg(a)), 'g') + hb('Obvious play', avg(b), 100, Math.round(avg(b)), 'm') + '<p class="small muted">"Obvious" players deal with whatever they draw and only crunch when cancellation is close. Careful players beat them by ' + Math.round(gap) + ' review points. Obvious teams hit the target ' + pct(b.wins, b.games) + '% of the time and were cancelled ' + pct(b.cancelled, b.games) + '%.</p>';
      h += '<h2>How careful games ended</h2>' + ['Game of the Year (90+)', 'A hit (80s)', 'Solid (70s)', 'Mixed (55 to 69)', 'A flop (under 55)', 'Cancelled'].map((nm, i) => hb(nm, a.bands[i], g, pct(a.bands[i], g) + '%', i < 2 ? 'g' : i >= 4 ? 'r' : '')).join('');
      h += '<h2>Hit the target, by direction</h2>' + C.DIRECTIONS.map(d => hb(d.name, a.dirs[d.key].wins, a.dirs[d.key].games, pct(a.dirs[d.key].wins, a.dirs[d.key].games) + '%')).join('');
      h += '<h2>Tasks, per game</h2>' + hb('Done right', a.right / g, 20, f1(a.right / g), 'g') + hb('Half-assed', a.comp / g, 20, f1(a.comp / g)) + hb('Unfinished', a.unfinished / g, 20, f1(a.unfinished / g), 'r') + hb('Features', a.features / g, 5, f1(a.features / g), 'g');
      const roles = C.ROLE_ORDER.filter(r => a.role[r].games), row = (label, k) => '<tr><td>' + label + '</td>' + roles.map(r => '<td>' + f1(a.role[r][k] / a.role[r].games) + '</td>').join('') + '</tr>';
      h += '<h2>Roles, per game</h2><table class="t"><tr><th></th>' + roles.map(r => '<th>' + C.ROLES[r].short + '</th>').join('') + '</tr>' + row('Done right', 'right') + row('Half-assed', 'comp') + row('Crunches', 'crunches') + row('Burnouts', 'burnouts') + row('Rests', 'rests') + row('Power uses', 'power') + '</table>';
    }
    return h;
  }
  function runSim() {
    if (simRunning) return;
    simRunning = true;
    const tk = ++simToken, n = simN, base = JSON.parse(JSON.stringify(settings)), seed = (Math.random() * 1e9) | 0;
    const runs = [{ ai: 'thoughtful', agg: C.newAgg() }, { ai: 'obvious', agg: C.newAgg() }];
    let done = 0;
    renderOverlays();
    const chunk = () => {
      if (tk !== simToken) return;
      const which = done < n ? 0 : 1, from = done % n, to = Math.min(n, from + 50);
      try { C.simulateInto(runs[which].agg, Object.assign({}, base, { ai: runs[which].ai }), from, to, { seed: seed }); } catch (err) { simRunning = false; info = 'Simulation error: ' + err.message; renderOverlays(); return; }
      done += to - from;
      const bar = document.querySelector('#simprog i'); if (bar) bar.style.width = Math.round(100 * done / (2 * n)) + '%';
      if (done < 2 * n) setTimeout(chunk, 0); else { simRunning = false; simLast = { a: runs[0].agg, b: runs[1].agg, target: base.target }; renderOverlays(); }
    };
    setTimeout(chunk, 30);
  }

  // ------------------------------------------------------------ settings
  const SCHEMA = [
    { group: 'The deck', items: [
      { k: 'perDisc', t: 'num', min: 2, max: 5, step: 1, label: 'Tasks per discipline', help: 'Four disciplines, so 5 makes 20 tasks.' },
      { k: 'events', t: 'num', min: 0, max: 3, step: 1, label: 'Event cards', help: 'They add 3, 2 and 1 tasks to Behind Schedule.' },
      { k: 'directions', t: 'bool', label: 'Game Direction cards' },
      { k: 'finalRound', t: 'bool', label: 'Launch week', help: 'One last turn each after the deck runs out.' }
    ] },
    { group: 'The publisher', items: [
      { k: 'behindLimit', t: 'num', min: 0, max: 9, step: 1, label: 'Behind Schedule limit', help: 'This many cancels the project. 0 means the project can never be cancelled this way.' },
      { k: 'cancelCheck', t: 'sel', label: 'The publisher checks', opts: [['round', 'At the end of each round'], ['instant', 'All the time (instant cancel)']] },
      { k: 'monthSlip', t: 'num', min: 0, max: 3, step: 1, label: 'Tasks that slide in after each round', help: 'From the bottom of the deck, straight Behind Schedule.' }
    ] },
    { group: 'Crunch and burnout', items: [
      { k: 'crunch', t: 'bool', label: 'Crunch' },
      { k: 'crunchChain', t: 'bool', label: 'Keep crunching', help: 'Off: one crunch per turn.' },
      { k: 'crunchRedo', t: 'bool', label: 'Crunch can fix a half-assed task', help: 'Your own discipline only.' },
      { k: 'roundRamp', t: 'num', min: 0, max: 2, step: 1, label: 'Die gets harder each round by' },
      { k: 'stressLimit', t: 'num', min: 1, max: 3, step: 1, label: 'Failed rolls before Burned Out' },
      { k: 'burnoutQuits', t: 'bool', label: 'Burned Out players can crunch', help: 'Fail again and they quit, which cancels the project.' },
      { k: 'restAction', t: 'bool', label: 'Rest', help: 'Skip a turn to recover.' }
    ] },
    { group: 'Role powers', items: [
      { k: 'producerPeek', t: 'num', min: 0, max: 3, step: 1, label: 'Producer: cards to schedule', help: '0 or 1 switches it off.' },
      { k: 'engLook', t: 'bool', label: 'Engineer: look at two, take one' },
      { k: 'artistPolish', t: 'bool', label: 'Artist: Polish' },
      { k: 'designerFree', t: 'bool', label: 'Designer: first crunch needs no roll' }
    ] },
    { group: 'The review', items: [
      { k: 'ptsRight', t: 'num', min: 1, max: 8, step: 1, label: 'Points for done right' },
      { k: 'ptsComp', t: 'num', min: 0, max: 8, step: 1, label: 'Points for half-assed' },
      { k: 'ptsFeature', t: 'num', min: 0, max: 12, step: 1, label: 'Points for a Feature' },
      { k: 'target', t: 'num', min: 40, max: 95, step: 5, label: 'Review score to win' }
    ] }
  ];
  const findItem = k => { for (const g of SCHEMA) for (const it of g.items) if (it.k === k) return it; return null; };
  function settingsPanel() {
    const D = C.DEFAULTS;
    let h = '<p class="small muted">Changes apply to the next game you deal and the next simulation you run. A dot marks anything you have changed.</p>';
    for (const g of SCHEMA) {
      h += '<h2>' + esc(g.group) + '</h2>';
      for (const it of g.items) {
        const v = settings[it.k], changed = v !== D[it.k], lb = '<div class="lb"><b>' + esc(it.label) + '</b>' + (it.help ? '<span>' + esc(it.help) + '</span>' : '') + '</div>';
        if (it.t === 'bool') h += '<div class="set' + (changed ? ' changed' : '') + '">' + lb + '<label class="sw"><input type="checkbox" data-k="' + it.k + '"' + (v ? ' checked' : '') + ' aria-label="' + esc(it.label) + '"><i></i></label></div>';
        else if (it.t === 'num') h += '<div class="set' + (changed ? ' changed' : '') + '">' + lb + '<div class="step"><button data-k="' + it.k + '" data-d="-1" aria-label="Less">&minus;</button><span class="v">' + v + '</span><button data-k="' + it.k + '" data-d="1" aria-label="More">+</button></div></div>';
        else h += '<div class="set stack' + (changed ? ' changed' : '') + '">' + lb + '<select data-k="' + it.k + '" aria-label="' + esc(it.label) + '">' + it.opts.map(o => '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></div>';
      }
    }
    return h + '<button class="btn center" style="margin-top:12px" data-act="reset">Put everything back to the tuned defaults</button>';
  }

  // ------------------------------------------------------------ input
  function onButton(b) {
    if (b.dataset.opt != null && cur) { answer(cur.options[+b.dataset.opt]); return; }
    if (b.dataset.dir) { setup.direction = b.dataset.dir; lsSet('crunchtable.setup.v1', setup); renderOverlays(); return; }
    if (b.dataset.role) { setup.roles[b.dataset.role] = b.dataset.val; lsSet('crunchtable.setup.v1', setup); renderOverlays(); return; }
    if (b.dataset.speed) { setup.speed = b.dataset.speed; lsSet('crunchtable.setup.v1', setup); renderOverlays(); return; }
    if (b.dataset.sheet) { sheet = true; sheetTab = b.dataset.sheet; renderOverlays(); return; }
    if (b.dataset.tab) { sheetTab = b.dataset.tab; renderOverlays(); return; }
    if (b.dataset.n) { simN = +b.dataset.n; renderOverlays(); return; }
    if (b.dataset.k && b.dataset.d) { const it = findItem(b.dataset.k); settings[it.k] = Math.max(it.min, Math.min(it.max, settings[it.k] + (+b.dataset.d) * it.step)); lsSet('crunchtable.settings.v1', settings); const box = b.closest('.box'), y = box.scrollTop; renderOverlays(); $('#sheet .box').scrollTop = y; return; }
    if (b.dataset.seat != null) { const p = st.players[+b.dataset.seat]; info = C.ROLES[p.role].name + ': ' + powerText(p.role, st.S); render(); return; }
    switch (b.dataset.act) {
      case 'start': startGame(); break;
      case 'quit': quitGame(); break;
      case 'menu': sheet = true; sheetTab = st ? 'log' : 'rules'; renderOverlays(); break;
      case 'closesheet': sheet = null; renderOverlays(); break;
      case 'dir': dirOpen = true; renderOverlays(); break;
      case 'closedir': dirOpen = false; renderOverlays(); break;
      case 'closezoom': zoomUid = null; renderOverlays(); break;
      case 'hideres': resultHidden = true; render(); break;
      case 'showres': resultHidden = false; render(); break;
      case 'copylog': copyLog(); break;
      case 'savelog': saveLog(); break;
      case 'run': runSim(); break;
      case 'reset': settings = C.mergeSettings(null); lsSet('crunchtable.settings.v1', settings); renderOverlays(); break;
      case 'rotateok': rotateOk = true; fit(); break;
    }
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('button, [data-act], [data-seat]');
    if (b && !b.closest('.card')) { onButton(b); return; }
    if (e.target.classList && e.target.classList.contains('ov') && e.target.id === 'zoom') { zoomUid = null; renderOverlays(); }
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    settings[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    lsSet('crunchtable.settings.v1', settings);
    const y = $('#sheet .box').scrollTop; renderOverlays(); $('#sheet .box').scrollTop = y;
  });

  // tap and drag on cards
  function stagePt(e) { return { x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale }; }
  function inRect(p, x, y, w, h) { return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; }
  function tapCard(uid) {
    if (!st) return;
    const c = cardBy(uid);
    if (cur && cur.type === 'draw' && st.players[cur.player].human && st.deck.indexOf(c) >= 0) { answer(cur.options[0]); return; }
    if (st.deck.indexOf(c) >= 0) { info = st.deck.length + ' cards left in the deck.'; render(); return; }
    zoomUid = uid; renderOverlays();
  }
  cardsEl.addEventListener('pointerdown', e => {
    const el = e.target.closest('.card'); if (!el || !st) return;
    const uid = +el.dataset.uid, p = stagePt(e);
    const can = cur && st.players[cur.player].human && (optsFor(uid).length > 0 || (cur.type === 'draw' && st.deck.length && st.deck[st.deck.length - 1].uid === uid));
    drag = { uid: uid, el: el, sx: p.x, sy: p.y, moved: false, can: can, ship: false, behind: false };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
  });
  cardsEl.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = stagePt(e);
    if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) < 9) return;
    if (!drag.can) return;
    if (!drag.moved) { drag.moved = true; drag.el.classList.add('drag'); }
    drag.el.style.transform = 'translate(' + (p.x - CW / 2) + 'px,' + (p.y - CH / 2) + 'px) scale(1.05)';
    const ship = inRect(p, SHIP.x - 20, SHIP.y - 10, SHIP.w + 40, SHIP.h + 30), behind = inRect(p, BEHIND.x - 20, BEHIND.y - 20, BEHIND.w + 40, CH + 40);
    if (ship !== drag.ship || behind !== drag.behind) { drag.ship = ship; drag.behind = behind; const s = $('#ship'), z = $('#zbehind'); if (s) s.classList.toggle('hot', ship); if (z) z.classList.toggle('hot', behind); }
  });
  function endDrag(e) {
    if (!drag) return;
    const d = drag; drag = null;
    d.el.classList.remove('drag');
    if (!d.moved) { tapCard(d.uid); return; }
    const mine = optsFor(d.uid);
    if (cur && cur.type === 'draw') { answer(cur.options[0]); return; }
    if (d.ship) { const o = mine.find(x => x.id === 'do' || x.id === 'redo' || x.id === 'polish'); if (o) { if (cur.type === 'crunch') { zoomUid = d.uid; render(); return; } answer(o); return; } }
    if (d.behind && cur && cur.type === 'act' && st.turn.hand && st.turn.hand.uid === d.uid) { answer(cur.options.find(o => o.id === 'none')); return; }
    render();
  }
  cardsEl.addEventListener('pointerup', endDrag);
  cardsEl.addEventListener('pointercancel', () => { if (drag) { drag.el.classList.remove('drag'); drag = null; render(); } });

  render();
  window.__crunchUI = { state: () => st, current: () => cur, exportText: () => exportText(), answer: i => answer(cur.options[i]) };
})();

</script>
</body>
</html>
