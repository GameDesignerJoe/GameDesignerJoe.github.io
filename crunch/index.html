    } else if (cur) {
      h += '<div class="prompt" id="prompt"><div class="q">' + questionFor(cur) + '</div>';
      cur.options.forEach((o, i) => {
        const primary = o.id === 'roll' || o.id === 'crunch';
        const sub = subFor(cur, o);
        h += '<button class="btn' + (primary ? ' primary' : '') + '" data-opt="' + i + '">' + esc(o.label) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</button>';
      });
      h += '</div>';
    } else {
      h += '<div class="prompt wait" id="prompt"><div class="q muted" style="margin:0">' + (t ? C.ROLES[st.players[t.pi].role].name + (st.players[t.pi].human ? '' : ' (AI)') + ' is working&hellip;' : 'Setting up&hellip;') + '</div></div>';
    }
    // log
    const entries = st.log.slice().reverse();
    const shown = logOpen ? entries : entries.slice(0, 7);
    h += '<div class="log">' + shown.map(e => '<div class="e ' + e.kind + '">' + esc(e.text) + '</div>').join('') + '</div>';
    h += '<div class="gctl"><button class="linkbtn" data-act="log">' + (logOpen ? 'Show less' : 'Show the whole log') + '</button>' +
      '<div class="seg" role="group" aria-label="AI speed"><button data-speed="normal" class="' + (setup.speed !== 'fast' ? 'on' : '') + '">Normal</button><button data-speed="fast" class="' + (setup.speed === 'fast' ? 'on' : '') + '">Fast</button></div></div>';
    if (!st.over) h += '<div style="margin-top:10px"><button class="btn danger center" data-act="quit">Abandon this project</button></div>';
    return h;
  }

  $('#v-play').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.opt != null && cur) {
      const o = cur.options[+b.dataset.opt];
      cur = null; infoUid = null;
      advance(token, o);
      return;
    }
    if (b.dataset.chip) { const u = +b.dataset.chip; infoUid = infoUid === u ? null : u; renderPlay(); return; }
    if (b.dataset.proj) { setup.project = b.dataset.proj; lsSet('crunch.setup.v1', setup); renderPlay(); return; }
    if (b.dataset.role) { setup.roles[b.dataset.role] = b.dataset.val; lsSet('crunch.setup.v1', setup); renderPlay(); return; }
    if (b.dataset.speed) { setup.speed = b.dataset.speed; lsSet('crunch.setup.v1', setup); renderPlay(); return; }
    switch (b.dataset.act) {
      case 'start': case 'again': startGame(); window.scrollTo(0, 0); break;
      case 'setup': case 'quit': quitGame(); window.scrollTo(0, 0); break;
      case 'log': logOpen = !logOpen; renderPlay(); break;
    }
  });

  // ============================================================ SIMULATE
  let simN = 500, simProject = 'all', simRunning = false, simLast = null, simPrev = null, simToken = 0;

  function renderSimControls() {
    const el = $('#v-sim');
    let h = '<h2>Simulate</h2><div class="panel"><p class="small muted">Four AI players run the game over and over with your current Settings. Use it to see what a rule change does before you playtest it.</p>' +
      '<div class="set"><div class="lb"><b>Games</b></div><div class="seg" role="group" aria-label="Games">' + [100, 500, 1000, 5000].map(n => '<button data-n="' + n + '" class="' + (simN === n ? 'on' : '') + '">' + (n >= 1000 ? n / 1000 + 'k' : n) + '</button>').join('') + '</div></div>' +
      '<div class="set stack"><div class="lb"><b>Project</b></div><select id="simproj"><option value="all">All projects, evenly</option>' + C.PROJECT_KEYS.map(k => '<option value="' + k + '"' + (simProject === k ? ' selected' : '') + '>' + esc(C.PROJECTS[k].name) + '</option>').join('') + '</select></div>' +
      '<div style="margin-top:10px"><button class="btn primary center" data-act="run"' + (simRunning ? ' disabled' : '') + '>' + (simRunning ? 'Running&hellip;' : 'Run ' + simN.toLocaleString() + ' games') + '</button></div>' +
      '<div class="prog" id="simprog" style="' + (simRunning ? '' : 'display:none') + '"><i></i></div></div>';
    h += '<div id="simout">' + (simLast ? simResultHtml(simLast, simPrev) : '') + '</div>';
    el.innerHTML = h;
  }

  function runSim() {
    if (simRunning) return;
    simRunning = true;
    const tk = ++simToken, n = simN, project = simProject, S = JSON.parse(JSON.stringify(settings));
    const agg = C.newAgg();
    const seed = (Math.random() * 1e9) | 0;
    let done = 0;
    renderSimControls();
    const chunk = () => {
      if (tk !== simToken) return;
      const to = Math.min(n, done + 40);
      try { C.simulateInto(agg, S, done, to, { project: project, seed: seed }); }
      catch (err) { simRunning = false; renderSimControls(); $('#simout').innerHTML = '<div class="panel">The simulation hit an error: ' + esc(err.message) + '</div>'; return; }
      done = to;
      const bar = document.querySelector('#simprog i');
      if (bar) bar.style.width = Math.round(100 * done / n) + '%';
      if (done < n) setTimeout(chunk, 0);
      else { simRunning = false; simPrev = simLast; simLast = { agg: agg, project: project, n: n }; renderSimControls(); }
    };
    setTimeout(chunk, 30);
  }

  function hb(label, value, max, text, cls) {
    return '<div class="hb"><span>' + esc(label) + '</span><span class="tr"><i class="' + (cls || '') + '" style="width:' + (max ? Math.max(0, Math.min(100, 100 * value / max)) : 0) + '%"></i></span><span class="val">' + text + '</span></div>';
  }

  function simResultHtml(res, prev) {
    const a = res.agg, g = a.games;
    const wr = pct(a.wins, g);
    let h = '<h2>Result</h2><div class="panel"><div class="headline">Shipped <span class="num">' + a.wins.toLocaleString() + '</span> of ' + g.toLocaleString() + ' games (<span class="num">' + wr + '%</span>).</div>';
    let verdict;
    if (wr >= 45 && wr <= 55) verdict = 'That is the coin-flip difficulty we are aiming for.';
    else if (wr > 55 && wr <= 70) verdict = 'A bit easy. Raise Pace in Settings to tighten it.';
    else if (wr > 70) verdict = 'Much too easy. The team ships almost every time.';
    else if (wr >= 30) verdict = 'A bit hard. Lower Pace in Settings to loosen it.';
    else verdict = 'Much too hard. The team rarely ships.';
    h += '<p class="small muted" style="margin-top:6px">' + verdict + (prev ? ' The run before this one shipped ' + pct(prev.agg.wins, prev.agg.games) + '%.' : '') + (g < 500 ? ' With only ' + g + ' games, expect this to wobble by several points between runs.' : '') + '</p></div>';

    h += '<h2>How games ended</h2><div class="panel">' +
      hb('Shipped', a.wins, g, pct(a.wins, g) + '%', 'g') +
      hb('Ran out of time', a.reasons.deadline, g, pct(a.reasons.deadline, g) + '%', 'r') +
      hb('Someone quit', a.reasons.quit, g, pct(a.reasons.quit, g) + '%', 'r') +
      (a.reasons.milestone ? hb('Missed a milestone', a.reasons.milestone, g, pct(a.reasons.milestone, g) + '%', 'r') : '') +
      '<p class="small muted" style="margin:8px 0 0">When the clock ran out, the team was ' + Math.round(a.shortfallSum / Math.max(1, a.shortfallN)) + ' dev points short on average. Winning teams finished with ' + f1(a.winMonthSlack / Math.max(1, a.wins)) + ' months to spare. Average burnout at the end: ' + f1(a.finalBurnout / Math.max(1, a.finalBurnoutN)) + ' steps per player.</p></div>';

    const pk = C.PROJECT_KEYS.filter(k => a.projects[k].games);
    if (pk.length > 1) {
      h += '<h2>By project</h2><div class="panel">';
      for (const k of pk) h += hb(C.PROJECTS[k].name, a.projects[k].wins, a.projects[k].games, pct(a.projects[k].wins, a.projects[k].games) + '%');
      h += '</div>';
    }
    h += '<h2>Milestones hit on time</h2><div class="panel">' + ['Prototype', 'Alpha', 'Gold'].map((nm, i) => hb(nm, a.msOnTime[i], g, pct(a.msOnTime[i], g) + '%')).join('') + '</div>';

    const roles = C.ROLE_ORDER.filter(r => a.role[r].turns);
    h += '<h2>Roles</h2><div class="panel"><table class="t"><tr><th></th>' + roles.map(r => '<th>' + C.ROLES[r].short + '</th>').join('') + '</tr>';
    const row = (label, fn) => '<tr><td>' + label + '</td>' + roles.map(r => '<td>' + fn(a.role[r], r) + '</td>').join('') + '</tr>';
    h += row('Points per turn', x => f1(x.points / x.turns));
    h += row('Dice per turn', x => f1(x.rolls / x.turns));
    h += row('Turns that bust', x => pct(x.busts, x.turns) + '%');
    h += row('Burnout taken per game', x => f1(x.burnoutGained / x.games));
    h += row('Burnout at the end', x => f1(x.finalBurnout / x.games));
    h += row('Vacations per game', x => f1(x.vacations / x.games));
    h += row('Power uses per game', x => f1(x.powerUses / x.games));
    h += row('Games they quit', (x, r) => pct(a.quitters[r], g) + '%');
    h += '</table></div>';

    const dt = a.diceHist.reduce((s, v) => s + v, 0);
    h += '<h2>Dice rolled in a turn</h2><div class="panel">';
    for (let i = 1; i <= 6; i++) h += hb(i + (i === 1 ? ' die' : ' dice'), a.diceHist[i], dt, pct(a.diceHist[i], dt) + '%', 'm');
    h += '</div>';

    h += '<h2>Cards, per game</h2><div class="panel"><table class="t"><tr><th>Card</th><th>Drawn</th><th>Played</th></tr>';
    for (const k of C.CARD_KEYS) {
      const c = a.cards[k];
      if (!c.drawn && !c.played) continue;
      h += '<tr><td class="' + C.CARDS[k].type + '">' + esc(C.CARDS[k].name) + '</td><td>' + f1(c.drawn / g) + '</td><td>' + (C.CARDS[k].type === 'tool' ? f1(c.played / g) : '&mdash;') + '</td></tr>';
    }
    h += '</table></div>';

    // plain-English notes
    const notes = [];
    if (roles.length > 1) {
      const sorted = roles.slice().sort((x, y) => a.role[y].points / a.role[y].turns - a.role[x].points / a.role[x].turns);
      const top = sorted[0], bot = sorted[sorted.length - 1];
      const ratio = (a.role[top].points / a.role[top].turns) / Math.max(0.1, a.role[bot].points / a.role[bot].turns);
      notes.push('The ' + C.ROLES[top].name + ' banks the most (' + f1(a.role[top].points / a.role[top].turns) + ' a turn) and the ' + C.ROLES[bot].name + ' the least (' + f1(a.role[bot].points / a.role[bot].turns) + '). That is ' + f1(ratio) + ' times as much.');
      const sponge = roles.slice().sort((x, y) => a.role[y].burnoutGained / a.role[y].games - a.role[x].burnoutGained / a.role[x].games)[0];
      notes.push('The ' + C.ROLES[sponge].name + ' soaks up the most Burnout: ' + f1(a.role[sponge].burnoutGained / a.role[sponge].games) + ' steps a game.');
    }
    const unplayed = C.CARD_KEYS.filter(k => C.CARDS[k].type === 'tool' && a.cards[k].drawn > g * 0.2 && a.cards[k].played < a.cards[k].drawn * 0.5);
    if (unplayed.length) notes.push('The AI plays ' + unplayed.map(k => C.CARDS[k].name).join(' and ') + ' less than half the time it draws ' + (unplayed.length > 1 ? 'them' : 'it') + '. Either the price is too high or the card is too situational.');
    if (pct(a.reasons.quit, g) >= 20) notes.push('A lot of losses come from someone quitting. If that feels cheap at the table, try the gentler Toast rule in Settings.');
    if (a.msOnTime[0] < g * 0.5) notes.push('Prototype is missed more often than it is hit, so most teams start the game already burned out.');
    notes.push('The AI is a decent but not expert player. A table that talks well will probably beat these numbers by a few points.');
    h += '<h2>What stands out</h2><div class="panel"><ul class="notes">' + notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></div>';
    return h;
  }

  $('#v-sim').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.n) { simN = +b.dataset.n; renderSimControls(); return; }
    if (b.dataset.act === 'run') runSim();
  });
  $('#v-sim').addEventListener('change', e => { if (e.target.id === 'simproj') simProject = e.target.value; });

  // ============================================================ SETTINGS
  const SCHEMA = [
    { group: 'Schedule and difficulty', items: [
      { k: 'pace', t: 'num', min: 6, max: 16, step: 0.5, label: 'Pace', help: 'Dev points the game demands per turn. This is the main difficulty dial. Half a point moves the win rate by about ten.' },
      { k: 'months', t: 'num', min: 3, max: 8, step: 1, label: 'Months to ship', help: 'Milestones fall a third, two thirds and all the way through.' },
      { k: 'missPenalty', t: 'sel', label: 'When a milestone is missed', opts: [['burnout', 'Everyone takes a Burnout'], ['none', 'Nothing happens'], ['lose', 'The game is over']] },
      { k: 'overflowCarries', t: 'bool', label: 'Extra points carry over', help: 'Points past a milestone count toward the next one.' }
    ] },
    { group: 'Dice and burnout', items: [
      { k: 'bustKeepsPoints', t: 'bool', label: 'A bust keeps your points', help: 'Off: a bust wipes the whole turn.' },
      { k: 'bustDieWasted', t: 'bool', label: 'The die that busts is wasted', help: 'Off: the matching die still scores.' },
      { k: 'deadMode', t: 'sel', label: 'Which numbers go dead', opts: [['role', 'Producer loses 1, 2, 3; others lose 6, 5, 4'], ['top', 'Everyone loses 6, 5, 4']] },
      { k: 'toastBust', t: 'sel', label: 'Busting while Toast', opts: [['lose', 'They quit and the team loses'], ['out', 'They quit; the team plays on'], ['floor', 'Nothing more happens']] },
      { k: 'cardBurnoutCanQuit', t: 'bool', label: 'Cards can make someone quit', help: 'Off: only a bust can push a Toast player out.' }
    ] },
    { group: 'Artist', items: [
      { k: 'artistFaces', t: 'sel', label: 'Inspiration counts on', opts: [['low', '1s and 2s'], ['one', '1s only'], ['high', '5s and 6s'], ['odd', 'Odd numbers']] },
      { k: 'artistMult', t: 'num', min: 1, max: 3, step: 1, label: 'Inspiration multiplier', help: '1 switches the power off.' }
    ] },
    { group: 'Engineer', items: [
      { k: 'engMinRun', t: 'num', min: 2, max: 4, step: 1, label: 'Shortest run that counts', help: '2 means 3-4 is a run. 3 means it takes 2-3-4.' },
      { k: 'engMult', t: 'num', min: 1, max: 3, step: 1, label: 'Run multiplier', help: '1 switches the power off.' }
    ] },
    { group: 'Designer', items: [
      { k: 'designerTeamNudge', t: 'sel', label: 'Tuning a teammate\'s die', opts: [['card', 'Costs the Designer a card'], ['free', 'Free'], ['off', 'Not allowed']] }
    ] },
    { group: 'Producer', items: [
      { k: 'producerHit', t: 'bool', label: 'Take the Hit', help: 'May take a teammate\'s Burnout when they bust.' },
      { k: 'producerHitContinues', t: 'bool', label: 'Take the Hit keeps them rolling', help: 'The bust does not end the teammate\'s turn.' },
      { k: 'producerPass', t: 'bool', label: 'Move cards between hands', help: 'One card per turn, on anyone\'s turn.' },
      { k: 'producerHandLimit', t: 'num', min: 1, max: 8, step: 1, label: 'Producer hand limit' },
      { k: 'producerSteady', t: 'bool', label: 'Producer\'s dice never go dead', help: 'Burnout still counts toward quitting.' },
      { k: 'producerDraw', t: 'num', min: 0, max: 2, step: 1, label: 'Extra cards the Producer draws' }
    ] },
    { group: 'Cards', items: [
      { k: 'handLimit', t: 'num', min: 1, max: 6, step: 1, label: 'Hand limit' },
      { k: 'startHand', t: 'num', min: 0, max: 3, step: 1, label: 'Starting Tools each' },
      { k: 'drawPerTurn', t: 'num', min: 0, max: 3, step: 1, label: 'Cards drawn per turn' },
      { k: 'assetPts', t: 'num', min: 1, max: 12, step: 1, label: 'Asset Store points' },
      { k: 'scopeCut', t: 'num', min: 1, max: 20, step: 1, label: 'Scope Cut size' },
      { k: 'creepAmt', t: 'num', min: 0, max: 15, step: 1, label: 'Feature Creep size' },
      { k: 'engineLoss', t: 'num', min: 0, max: 15, step: 1, label: 'Engine Update loss' },
      { k: 'slipOneShot', t: 'bool', label: 'Slip the Date is single-use', help: 'It leaves the game once played.' }
    ] },
    { group: 'AI players', items: [
      { k: 'aiRisk', t: 'sel', label: 'How much the AI gambles', opts: [['cautious', 'Cautious'], ['balanced', 'Balanced'], ['reckless', 'Reckless']] }
    ] }
  ];

  function saveSettings() { lsSet('crunch.settings.v1', settings); }
  function findItem(k) { for (const g of SCHEMA) for (const it of g.items) if (it.k === k) return it; return null; }

  function renderSettings() {
    const el = $('#v-settings'), D = C.DEFAULTS;
    let h = '<h2>Settings</h2><p class="small muted">These are the rules we are still arguing about. Changes apply to the next game you start and the next simulation you run. A dot marks anything you have changed.</p>';
    // targets preview
    h += '<div class="panel"><div class="small" style="font-weight:700;margin-bottom:4px">Milestone targets with these settings</div>';
    for (const k of C.PROJECT_KEYS) {
      const cm = C.computeMilestones(settings, C.PROJECTS[k], C.ROLE_ORDER);
      h += '<div class="tgt"><b>' + esc(C.PROJECTS[k].name) + '</b><span>' + cm.milestones.map(m => m.target).join(' / ') + ' in ' + cm.months + ' mo</span></div>';
    }
    h += '</div>';
    for (const g of SCHEMA) {
      h += '<h2>' + esc(g.group) + '</h2><div class="panel">';
      for (const it of g.items) {
        const v = settings[it.k], changed = v !== D[it.k];
        const lb = '<div class="lb"><b>' + esc(it.label) + '</b>' + (it.help ? '<span>' + esc(it.help) + '</span>' : '') + '</div>';
        if (it.t === 'bool') h += '<div class="set' + (changed ? ' changed' : '') + '">' + lb + '<label class="sw"><input type="checkbox" data-k="' + it.k + '"' + (v ? ' checked' : '') + ' aria-label="' + esc(it.label) + '"><i></i></label></div>';
        else if (it.t === 'num') h += '<div class="set' + (changed ? ' changed' : '') + '">' + lb + '<div class="step"><button data-k="' + it.k + '" data-d="-1" aria-label="Less">&minus;</button><span class="v">' + v + '</span><button data-k="' + it.k + '" data-d="1" aria-label="More">+</button></div></div>';
        else h += '<div class="set stack' + (changed ? ' changed' : '') + '">' + lb + '<select data-k="' + it.k + '" aria-label="' + esc(it.label) + '">' + it.opts.map(o => '<option value="' + o[0] + '"' + (v === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></div>';
      }
      h += '</div>';
    }
    // deck
    let tools = 0, trouble = 0;
    for (const k of C.CARD_KEYS) { if (C.CARDS[k].type === 'tool') tools += settings.counts[k]; else trouble += settings.counts[k]; }
    h += '<h2>The deck</h2><div class="panel"><p class="small muted">' + (tools + trouble) + ' cards: ' + tools + ' Tools and ' + trouble + ' Trouble. With four role cards and five project cards that is ' + (tools + trouble + 9) + ' cards to print.</p>';
    for (const k of C.CARD_KEYS) {
      const c = C.CARDS[k], v = settings.counts[k];
      h += '<div class="set' + (v !== D.counts[k] ? ' changed' : '') + '"><div class="lb"><b class="' + c.type + '">' + esc(c.name) + '</b><span>' + esc(cardText(k)) + '</span></div><div class="step"><button data-c="' + k + '" data-d="-1" aria-label="Fewer">&minus;</button><span class="v">' + v + '</span><button data-c="' + k + '" data-d="1" aria-label="More">+</button></div></div>';
    }
    h += '</div><div style="margin-top:16px"><button class="btn center" data-act="reset">Put everything back to the tuned defaults</button></div>';
    el.innerHTML = h;
  }

  $('#v-settings').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const y = window.scrollY;
    if (b.dataset.act === 'reset') { settings = C.mergeSettings(null); saveSettings(); renderSettings(); return; }
    if (b.dataset.k) {
      const it = findItem(b.dataset.k);
      let v = settings[it.k] + (+b.dataset.d) * it.step;
      v = Math.max(it.min, Math.min(it.max, Math.round(v * 100) / 100));
      settings[it.k] = v;
    } else if (b.dataset.c) {
      settings.counts[b.dataset.c] = Math.max(0, Math.min(6, settings.counts[b.dataset.c] + (+b.dataset.d)));
    } else return;
    saveSettings(); renderSettings(); window.scrollTo(0, y);
  });
  $('#v-settings').addEventListener('change', e => {
    const k = e.target.dataset.k;
    if (!k) return;
    const y = window.scrollY;
    settings[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    saveSettings(); renderSettings(); window.scrollTo(0, y);
  });

  // ------------------------------------------------------------ go
  showView('play');
  window.__crunchUI = { state: () => st, current: () => cur };
})();

</script>
</body>
</html>
