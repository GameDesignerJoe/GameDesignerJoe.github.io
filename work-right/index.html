<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Deliverables</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f5f4 0%, #efefee 100%);
    color: #0b0b0b;
    padding: 2rem;
    line-height: 1.6;
    font-size: 18px;
  }
  body.dark-mode {
    background: linear-gradient(135deg, #1a1a19 0%, #242423 100%);
    color: #ffffff;
  }

  button { color: inherit; font-family: inherit; }

  .container { max-width: 1280px; margin: 0 auto; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2rem; padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }
  body.dark-mode .header { border-bottom-color: rgba(255,255,255,0.1); }
  .header-content h1 { font-size: 32px; font-weight: 600; margin-bottom: 0.4rem; }
  .header-content .sub1 { font-size: 20px; opacity: 0.7; }
  .header-content .sub2 { font-size: 16px; opacity: 0.55; font-style: italic; margin-top: 0.3rem; }

  .theme-toggle {
    background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1);
    border-radius: 6px; padding: 8px 14px; cursor: pointer;
    font-size: 16px; font-weight: 500; transition: all 0.2s;
  }
  body.dark-mode .theme-toggle { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
  .theme-toggle:hover { background: rgba(0,0,0,0.1); }
  body.dark-mode .theme-toggle:hover { background: rgba(255,255,255,0.15); }

  .gear-wrap { position: relative; }
  .gear-menu {
    display: none; position: absolute; right: 0; top: calc(100% + 8px);
    background: white; border: 1px solid rgba(0,0,0,0.12); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 6px; z-index: 50;
    min-width: 280px;
  }
  body.dark-mode .gear-menu { background: #2c2c2b; border-color: rgba(255,255,255,0.15); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .gear-menu.open { display: block; }
  .gear-item {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; font-size: 16px; padding: 10px 14px; border-radius: 6px; cursor: pointer;
  }
  .gear-item:hover { background: rgba(0,0,0,0.06); }
  body.dark-mode .gear-item:hover { background: rgba(255,255,255,0.08); }

  .config-badge {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 8px;
    font-size: 14px; font-weight: 600; opacity: 0.75;
  }
  .config-badge .lock-pill {
    background: rgba(214,69,69,0.12); border: 1px solid rgba(214,69,69,0.45);
    color: #d64545; border-radius: 10px; padding: 1px 10px; font-size: 13px;
  }
  .lock-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e3a5f; color: #d4a574; border: 1px solid #d4a574;
    border-radius: 10px; padding: 10px 20px; font-size: 15px; font-weight: 600;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .lock-toast.show { opacity: 1; }

  .tab-nav {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 2rem;
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }
  body.dark-mode .tab-nav { border-bottom-color: rgba(255,255,255,0.1); }
  .tab-button {
    padding: 12px 16px; background: transparent; border: none;
    border-bottom: 3px solid transparent; cursor: pointer;
    font-size: 18px; font-weight: 500; opacity: 0.6; transition: all 0.2s;
  }
  .tab-button:hover { opacity: 0.85; }
  .tab-button.active { opacity: 1; border-bottom-color: #3987e5; color: #3987e5; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .category { margin-bottom: 3rem; }
  .category-title {
    font-size: 16px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; opacity: 0.6; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 8px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }

  .card {
    background: white; border: 1px solid rgba(0,0,0,0.08);
    border-radius: 8px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    transition: all 0.2s;
  }
  body.dark-mode .card { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .card:hover { box-shadow: 0 6px 14px rgba(0,0,0,0.10); }
  body.dark-mode .card:hover { box-shadow: 0 6px 14px rgba(0,0,0,0.35); }
  .card.inactive { opacity: 0.4; }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title { font-size: 22px; font-weight: 600; }
  .card-desc { font-size: 17px; opacity: 0.7; line-height: 1.45; }

  .active-toggle {
    font-size: 13px; font-weight: 600; padding: 4px 12px;
    border-radius: 12px; cursor: pointer; white-space: nowrap;
    border: 1px solid #1baf7a; background: rgba(27,175,122,0.12); color: #1baf7a;
  }
  .active-toggle.off {
    border-color: rgba(120,120,120,0.5); background: transparent; color: inherit; opacity: 0.6;
  }

  .prio-toggle {
    font-size: 13px; font-weight: 700; padding: 4px 12px;
    border-radius: 12px; cursor: pointer; white-space: nowrap;
    border: 1px solid; background: transparent; letter-spacing: 0.3px;
  }
  .prio-toggle.p-wont   { border-color: rgba(120,120,120,0.5); color: #8a8a8a; }
  .prio-toggle.p-could  { border-color: rgba(120,120,120,0.4); color: inherit; opacity: 0.65; }
  .prio-toggle.p-should { border-color: #d97706; color: #d97706; background: rgba(217,119,6,0.10); }
  .prio-toggle.p-must   { border-color: #bf6a6a; color: #bf6a6a; background: rgba(191,106,106,0.10); }

  .card.prio-wont, .napkin-row.prio-wont { opacity: 0.22; filter: grayscale(0.7); }
  .card.prio-should, .napkin-row.prio-should { border-color: rgba(217,119,6,0.5); }
  .card.prio-must, .napkin-row.prio-must { border-color: rgba(191,106,106,0.55); }

  .card-toggles { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.06); }
  body.dark-mode .card-toggles { border-top-color: rgba(255,255,255,0.06); }

  .need-toggle {
    font-size: 14px; font-weight: 500; padding: 4px 10px; border-radius: 4px;
    border: 1px dashed rgba(0,0,0,0.25); background: transparent;
    cursor: pointer; opacity: 0.45; transition: all 0.15s;
  }
  body.dark-mode .need-toggle { border-color: rgba(255,255,255,0.3); }
  .need-toggle:hover { opacity: 0.8; }
  .need-toggle.on {
    background: #1e3a5f;
    border: 1px solid #d4a574;
    color: #d4a574;
    opacity: 1;
  }
  .need-toggle.on.d2 { border-width: 2px; font-weight: 600; }
  .need-toggle.on.d3 { border-width: 3px; font-weight: 700; }
  .need-toggle.on.d4 { border-width: 3px; font-weight: 700; box-shadow: 0 0 0 1px #d4a574; }
  .need-toggle.on.d5 { border-width: 3px; font-weight: 800; box-shadow: 0 0 0 2px #d4a574; }

  .cat-bar { width: 5px; border-radius: 3px; flex: 0 0 5px; align-self: stretch; }

  .effort-key {
    font-size: 14px; opacity: 0.6; margin-bottom: 1.25rem; line-height: 1.5;
  }

  /* Boards */
  .totals-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.75rem; }
  .load-details { margin-top: 1.5rem; }
  .load-details summary {
    cursor: pointer; font-size: 16px; font-weight: 600; opacity: 0.7;
    padding: 8px 0;
  }
  .total-chip {
    background: white; border: 1px solid rgba(0,0,0,0.08);
    border-radius: 16px; padding: 6px 14px; font-size: 15px;
  }
  body.dark-mode .total-chip { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .total-chip strong { font-weight: 600; }
  .total-chip .total-num { color: #3987e5; font-weight: 600; }
  .total-chip.hot { border-color: rgba(214,69,69,0.5); }
  .total-chip.hot .total-num { color: #d64545; }
  .total-chip .overhead { opacity: 0.6; font-style: italic; }

  .roster-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 1.25rem; }
  .roster-card {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 10px 16px; min-width: 130px; text-align: center;
  }
  body.dark-mode .roster-card { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .roster-name { font-size: 16px; font-weight: 600; }
  .roster-skill-grid { display: flex; justify-content: center; gap: 12px; margin: 6px 0; flex-wrap: wrap; }
  .roster-skill { display: flex; flex-direction: column; align-items: center; }
  .roster-skill-count { font-size: 18px; font-weight: 600; color: #d4a574; line-height: 1.2; }
  .roster-skill-name { font-size: 11px; opacity: 0.55; max-width: 130px; line-height: 1.2; }
  .verdict-banner {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 1.5rem 2rem; margin-bottom: 1.5rem;
  }
  body.dark-mode .verdict-banner { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .verdict-line { font-size: 22px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
  .verdict-sub { font-size: 16px; opacity: 0.7; line-height: 1.5; }
  .verdict-nums { font-size: 17px; margin-top: 12px; }

  .group-cards { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 2rem; }
  .group-card {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 12px 18px; text-align: center; min-width: 130px;
  }
  body.dark-mode .group-card { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .group-card .g-emoji { font-size: 32px; }
  .group-card .g-name { font-size: 15px; font-weight: 600; }
  .group-card .g-nums { font-size: 14px; opacity: 0.65; }
  .group-card .g-pct { font-size: 20px; font-weight: 700; }

  .sum-team { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 2rem; }
  .sum-person {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 12px 16px; text-align: center; min-width: 120px;
  }
  body.dark-mode .sum-person { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .sum-person .p-emoji { font-size: 36px; }
  .sum-person .p-name { font-size: 16px; font-weight: 600; }
  .sum-person .p-title { font-size: 12px; opacity: 0.6; line-height: 1.3; }

  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 1rem; }
  .filter-label { font-size: 13px; font-weight: 600; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; margin-left: 10px; }
  .filter-chip {
    font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 12px;
    border: 1px solid rgba(128,128,128,0.4); background: transparent; cursor: pointer; opacity: 0.45;
  }
  .filter-chip.on { border-color: #3987e5; color: #3987e5; opacity: 1; background: rgba(57,135,229,0.08); }

  .sum-row {
    display: flex; align-items: center; gap: 10px;
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px;
    padding: 6px 12px; margin-bottom: 6px;
  }
  body.dark-mode .sum-row { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .sum-row.inactive { opacity: 0.4; }
  .sum-row .cat-bar { align-self: stretch; }
  .sum-title { flex: 1; font-size: 17px; font-weight: 500; cursor: help; }
  .sum-weeks { font-size: 14px; opacity: 0.45; min-width: 44px; text-align: right; }

  .staff-title-line { font-size: 13px; opacity: 0.6; margin-top: -2px; }

  .skill-pair { display: inline-flex; align-items: center; gap: 1px; margin-right: 18px; position: relative; }
  .skill-pair::after {
    content: '|'; position: absolute; right: -12px;
    opacity: 0.2; font-weight: 300; pointer-events: none;
  }
  .skill-pair:last-child::after { content: ''; }

  .card-digest {
    font-size: 13.5px; opacity: 0.8; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  body.dark-mode .card-digest { border-top-color: rgba(255,255,255,0.06); }
  .card-details { border-top: 1px solid rgba(0,0,0,0.06); }
  body.dark-mode .card-details { border-top-color: rgba(255,255,255,0.06); }
  .card-details summary {
    cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; opacity: 0.45; padding: 8px 0 4px;
  }
  .card-details summary:hover { opacity: 0.8; }
  .detail-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; opacity: 0.5; margin: 8px 0 4px;
  }

  .capacity-banner {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 14px 18px; margin-bottom: 1.25rem; font-size: 17px; line-height: 1.5;
  }
  body.dark-mode .capacity-banner { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .capacity-pct { font-size: 22px; font-weight: 700; }
  .capacity-fine { font-size: 13px; opacity: 0.5; font-style: italic; margin-top: 4px; }

  .roster-breakdown { font-size: 12px; opacity: 0.55; margin-bottom: 2px; }
  .roster-count { font-size: 20px; font-weight: 600; color: #3987e5; }
  .roster-count.hot { color: #d64545; }

  .gaps-banner {
    background: rgba(214,69,69,0.08); border: 1px solid rgba(214,69,69,0.3);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 1rem;
    font-size: 16px; line-height: 1.5;
  }

  .staff-section {
    background: rgba(30,58,95,0.06); border: 1px solid rgba(30,58,95,0.35);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 1.25rem;
    font-size: 16px; line-height: 1.5;
  }
  body.dark-mode .staff-section { background: rgba(212,165,116,0.06); border-color: rgba(212,165,116,0.35); }
  .staff-title { font-weight: 600; margin-bottom: 8px; }
  .staff-note { font-size: 13px; opacity: 0.55; font-style: italic; margin-top: 8px; }

  /* Needed Staff person cards */
  .person-card {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
    padding: 20px 18px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  body.dark-mode .person-card { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .person-role {
    font-size: 18px; font-weight: 700; color: #d4a574;
    background: #1e3a5f; border: 1px solid #d4a574; border-radius: 8px;
    padding: 4px 14px;
  }
  .person-emoji { font-size: 64px; line-height: 1.1; }
  .person-need { font-size: 16px; font-weight: 600; color: #d64545; }
  .person-tasks { text-align: left; width: 100%; margin-top: 8px; font-size: 14px; line-height: 1.55; opacity: 0.8; }
  .person-tasks li { margin-left: 18px; margin-bottom: 3px; }
  .person-tasks .offload { font-style: italic; opacity: 0.85; }

  .napkin-reset {
    font-size: 14px; background: transparent; border: 1px solid rgba(0,0,0,0.15);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; opacity: 0.6; margin-bottom: 1rem;
  }
  body.dark-mode .napkin-reset { border-color: rgba(255,255,255,0.2); }

  .napkin-row {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 10px;
    display: flex; align-items: stretch; gap: 14px;
  }
  body.dark-mode .napkin-row { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .napkin-row.inactive { opacity: 0.35; }
  .napkin-row-body { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .napkin-row-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .napkin-row-title { font-size: 19px; font-weight: 600; }
  .napkin-toggles { display: flex; flex-wrap: wrap; gap: 5px; }
  .napkin-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .napkin-head-right { display: flex; align-items: center; gap: 10px; }

  .person-chip {
    font-size: 14px; font-weight: 500; padding: 4px 12px; border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.15); background: transparent;
    cursor: pointer; opacity: 0.5; transition: all 0.15s;
  }
  body.dark-mode .person-chip { border-color: rgba(255,255,255,0.2); }
  .person-chip:hover { opacity: 0.85; }
  .person-chip.assigned { background: #3987e5; border-color: #3987e5; color: white; opacity: 1; }

  .napkin-needs { font-size: 14px; font-weight: 600; color: #d64545; text-align: right; }
  .napkin-needs.covered { color: #1baf7a; }
  .napkin-needs.muted { color: inherit; opacity: 0.35; }

  /* Timeline */
  .timeline-highlights {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 2rem; padding: 1.5rem 2rem;
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
  }
  body.dark-mode .timeline-highlights { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .highlight-item { display: block; }
  .highlight-item summary { cursor: pointer; list-style: none; }
  .highlight-item summary::-webkit-details-marker { display: none; }
  .highlight-item summary .expand-hint { font-size: 11px; opacity: 0.4; }
  .highlight-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.6; }
  .highlight-value { font-size: 24px; font-weight: 600; color: #3987e5; }
  .hl-detail { margin-top: 10px; font-size: 14px; line-height: 1.5; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .mini-table th, .mini-table td { padding: 3px 8px; text-align: left; border-bottom: 1px solid rgba(128,128,128,0.18); }
  .mini-table th { font-weight: 600; opacity: 0.65; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  .core-badge { font-size: 11px; font-weight: 700; color: #d4a574; background: #1e3a5f; border-radius: 3px; padding: 1px 6px; margin-left: 6px; }
  .fine-print { grid-column: 1 / -1; font-size: 13px; opacity: 0.55; line-height: 1.5; border-top: 1px solid rgba(0,0,0,0.07); padding-top: 10px; margin-top: 4px; }
  body.dark-mode .fine-print { border-top-color: rgba(255,255,255,0.07); }

  .lessons {
    background: white; border: 1px solid rgba(0,0,0,0.08); border-radius: 8px;
    padding: 1.5rem 2rem; margin-bottom: 2rem;
  }
  body.dark-mode .lessons { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .lessons h3 { font-size: 20px; font-weight: 600; margin-bottom: 1rem; }
  .lessons p { font-size: 16px; line-height: 1.6; opacity: 0.85; margin-bottom: 0.9rem; }
  .lessons p strong { opacity: 1; }

  .timeline { position: relative; padding: 0 0 0 60px; }
  .timeline::before {
    content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(to bottom, rgba(57,135,229,0.3), #3987e5);
  }
  .timeline-event {
    margin-bottom: 1.5rem; padding: 14px 18px; background: white;
    border: 1px solid rgba(0,0,0,0.08); border-radius: 8px; position: relative;
  }
  body.dark-mode .timeline-event { background: #2c2c2b; border-color: rgba(255,255,255,0.1); }
  .timeline-event::before {
    content: ''; position: absolute; left: -48px; top: 22px;
    width: 16px; height: 16px; background: #3987e5;
    border: 3px solid white; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
  }
  body.dark-mode .timeline-event::before { border-color: #2c2c2b; box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
  .timeline-date { font-size: 14px; font-weight: 600; color: #3987e5; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .timeline-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .timeline-desc { font-size: 16px; opacity: 0.7; line-height: 1.5; margin-bottom: 6px; }
  .timeline-source { font-size: 13px; opacity: 0.5; font-style: italic; }

  .chart-line { stroke: #3987e5; stroke-width: 2.5; fill: none; }
  .chart-dot { fill: #d4a574; }
  .chart-label { font-size: 11px; fill: currentColor; opacity: 0.6; }
  .chart-val { font-size: 11px; fill: #3987e5; font-weight: 600; }

  /* Hire builder */

  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }

  function freshApp() {
    return {
      boards: [],
      goals: [],

      staff: [],
      hires: [],

  function normTiers(v) {
    if (Array.isArray(v)) { const o = {}; v.forEach(s => o[s] = 2); return o; }
    return v || {};
  }

  function migrateLegacy(get, needDotScale) {
    const scale = needDotScale ? { 1: 1, 2: 3, 3: 4 } : null;
    const deletedSkills = get('deletedSkills') || [];

    function buildNeeds(raw, primary) {
      let o = {};
      if (!raw) { (primary || []).forEach(s => o[s] = 1); }
      else if (Array.isArray(raw)) { raw.forEach(s => o[s] = 1); }
      else {
        Object.keys(raw).forEach(s => { o[s] = scale ? (scale[raw[s]] || raw[s]) : raw[s]; });
      }
      const f = {};
      Object.keys(o).forEach(s => { if (!deletedSkills.includes(s)) f[s] = o[s]; });
      return f;
    }

    const nameMap = { napkin: 'World', narrative: 'Narrative' };
    const boardsOut = ['napkin','narrative'].map(k => {
      const lb = LEGACY_BOARDS[k];
      const deleted = get(k + 'DeletedItems') || [];
      const ov = get(k + 'ItemOverrides') || {};
      const custom = get(k + 'CustomItems') || [];
      const needsRaw = get(k + 'Needs') || {};
      const asg = get(k + 'Assignments') || {};
      const dis = get(k + 'Disabled') || {};
      const prio = get(k + 'Priority') || {};
      const base = lb.items.filter(i => !deleted.includes(i.id))
        .map(i => ov[i.id] ? Object.assign({}, i, ov[i.id]) : i);
      const items = base.concat(custom).map(i => ({
        id: i.id, title: i.title, desc: i.desc || '', groupId: i.cat,
        needs: buildNeeds(needsRaw[i.id], i.primary),
        people: (asg[i.id] || []).slice(),
        off: !!dis[i.id],
        prio: prio[i.id] || 'could'
      }));
      const gov = get(k + 'GroupOverrides') || {};
      const groups = lb.groups.map(g => ({ id: g.cat, label: gov[g.cat] || g.label, color: LEGACY_COLORS[g.cat] || '#3987e5' }));
      const disciplines = ((get(k + 'Disciplines') || lb.disciplines).slice()).filter(s => !deletedSkills.includes(s));
      return { id: k, name: nameMap[k], disciplines: disciplines, groups: groups, items: items };
    });

    // Skill pool
    const legacyGroupOf = function(s) {
      const core = CORE_SKILLS.find(c => c.name === s);
      return core ? core.group : 'Other';
    };
    const pool = [];
    CORE_SKILLS.forEach(c => { if (!deletedSkills.includes(c.name)) pool.push({ name: c.name, group: c.group }); });
    boardsOut.forEach(b => b.disciplines.forEach(s => {
      if (!pool.some(p => p.name === s)) pool.push({ name: s, group: legacyGroupOf(s) });
    }));
    (get('customSkills') || []).forEach(c => {
      if (deletedSkills.includes(c.name)) return;
      const ex = pool.find(p => p.name === c.name);
      if (ex) ex.group = c.group || ex.group;
      else pool.push({ name: c.name, group: c.group || 'Other' });
    });

    // Staff
    const ovr = get('staffSkillOverrides') || {};
    const merged = {};
    ['napkin','narrative'].forEach(k => LEGACY_BOARDS[k].roster.forEach(p => {
      if (!merged[p.name]) merged[p.name] = [];
      p.skills.forEach(s => { if (!merged[p.name].includes(s)) merged[p.name].push(s); });
    }));
    const staff = Object.keys(merged).map(name => {
      let tiers;
      if (ovr[name]) tiers = normTiers(ovr[name]);
      else {
        tiers = {};
        merged[name].forEach(s => tiers[s] = LEGACY_TIERS[name] || 2);
      }
      const t2 = {};
      Object.keys(tiers).forEach(s => { if (!deletedSkills.includes(s)) t2[s] = tiers[s]; });
      return { name: name, title: LEGACY_TITLES[name] || '', overhead: LEGACY_OVERHEAD[name] || '', tiers: t2 };
    });

    const hires = (get('customHires') || []).map(h => ({
      id: h.id, name: h.name, emoji: h.emoji || null, skills: normTiers(h.skills)
    }));

    const m = get('configMeta') || {};
    return {
      boards: boardsOut, skills: pool, staff: staff, hires: hires,
      meta: { name: m.name || '', locked: !!m.locked, weeks: parseInt(m.weeks) || 28, padding: parseInt(m.padding) || 0 }
    };
  }

  function getNeeds(b, item) {
    const f = {};
    Object.keys(item.needs || {}).forEach(s => { if (b.disciplines.includes(s)) f[s] = item.needs[s]; });

  function rosterFor(b) {
    const out = [];
    app.staff.forEach(p => {
      const skills = Object.keys(p.tiers || {}).filter(s => b.disciplines.includes(s));
      if (skills.length) out.push({ name: p.name, skills: skills, tiers: p.tiers });

    app.hires.forEach(h => {

      if (skills.length) out.push({ name: h.name, skills: skills, tiers: h.skills, isHire: true });

  function importConfig(file) {
    if (!file) return;

    reader.onload = function() {
      let payload;
      try { payload = JSON.parse(reader.result); }
      catch (e) { alert('That file is not valid JSON.'); return; }
      if (!payload || payload.app !== 'worlds-team-deliverables' || !payload.data) {
        alert('That file does not look like a Work Deliverables configuration export.');
        return;
      }
      const when = payload.exported ? new Date(payload.exported).toLocaleString() : 'unknown date';
      if (!confirm('Import this configuration (exported ' + when + ')?\n\nThis REPLACES your current pages, features, dots, staffing, team, and hires.')) return;
      let next;
      if ((payload.version || 1) >= 3 && payload.data.boards) {
        next = payload.data;
      } else {
        const get = function(k) { return payload.data[k] !== undefined ? payload.data[k] : null; };
        next = migrateLegacy(get, (payload.version || 1) < 2);
      }
      localStorage.setItem('appV3', JSON.stringify(next));
      location.reload();
    };
    reader.readAsText(file);
  }

  // ===================== MATH =====================
  const loadsByBoard = {};
  let capSnapshot = null;

  function totalActiveWorkWeeks() {
    let t = 0;
    app.boards.forEach(b => b.items.forEach(item => {
      if (item.off) return;
      const needs = getNeeds(b, item);
      Object.keys(needs).forEach(d => { t += DOT_WEEKS[needs[d]] || 0; });
    }));
    return t;
  }

  function computeBoardLoads(b) {
    const personWeeks = {}, personSkillWeeks = {}, gaps = {};
    const roster = rosterFor(b);
    b.items.forEach(item => {
      if (item.off) return;
      const needs = getNeeds(b, item);
      Object.keys(needs).forEach(disc => {
        const wks = DOT_WEEKS[needs[disc]] || 0;
        if (!wks) return;
        const coverers = (item.people || []).filter(name => {
          const p = roster.find(r => r.name === name);
          return p && p.skills.includes(disc);
        });
        if (coverers.length === 0) {
          if (!gaps[disc]) gaps[disc] = { weeks: 0, items: [] };
          gaps[disc].weeks += wks;
          gaps[disc].items.push({ boardId: b.id, id: item.id, title: item.title, weeks: wks });
        } else {
          // Speed-proportional split: everyone spends wks / sum(multipliers)
          const sumMult = coverers.reduce((sum, name) => {
            const p = roster.find(r => r.name === name);
            return sum + (TIER_MULT[(p && p.tiers && p.tiers[disc]) || 2] || 1);
          }, 0);
          const t = wks / sumMult;
          coverers.forEach(name => {
            personWeeks[name] = (personWeeks[name] || 0) + t;
            if (!personSkillWeeks[name]) personSkillWeeks[name] = {};
            personSkillWeeks[name][disc] = (personSkillWeeks[name][disc] || 0) + t;
          });
        }
      });
    });
    return { personWeeks: personWeeks, personSkillWeeks: personSkillWeeks, gaps: gaps };
  }

  function computeSnapshot() {
    Object.keys(loadsByBoard).forEach(k => delete loadsByBoard[k]);
    app.boards.forEach(b => { loadsByBoard[b.id] = computeBoardLoads(b); });

    const people = [];
    app.staff.forEach(p => { if (Object.keys(p.tiers || {}).length) people.push({ name: p.name, tiers: p.tiers, title: p.title, overhead: p.overhead }); });
    app.hires.forEach(h => { if (Object.keys(h.skills || {}).length) people.push({ name: h.name, tiers: h.skills, isHire: true }); });

    const isSharedSeat = n => n.includes('(support)') || n.includes('(external)');
    const capPeople = people.filter(p => !isSharedSeat(p.name));
    const capacity = capPeople.length * WEEKS_AVAILABLE;
    const work = totalActiveWorkWeeks();
    const pct = capacity > 0 ? Math.round(work / capacity * 100) : 0;

    const groupWork = {}, groupCap = {};
    app.boards.forEach(b => b.items.forEach(item => {
      if (item.off) return;
      const needs = getNeeds(b, item);
      Object.keys(needs).forEach(d => {
        const g = skillGroup(d);
        groupWork[g] = (groupWork[g] || 0) + (DOT_WEEKS[needs[d]] || 0);
      });
    }));
    people.forEach(p => {
      const gs = [...new Set(Object.keys(p.tiers).map(s => skillGroup(s)))];
      gs.forEach(g => { groupCap[g] = (groupCap[g] || 0) + WEEKS_AVAILABLE / gs.length; });
    });

    capSnapshot = { work: work, capacity: capacity, capCount: capPeople.length, pct: pct, groupWork: groupWork, groupCap: groupCap, people: people };
  }

  // ===================== ACTIONS: FEATURES =====================
  function cycleNeed(bid, iid, skill) {
    if (guardLocked()) return;
    const b = boardById(bid); const item = itemById(b, iid);
    if (!item.needs) item.needs = {};
    const next = ((item.needs[skill] || 0) + 1) % 6;
    if (next === 0) delete item.needs[skill]; else item.needs[skill] = next;
    saveApp(); renderAll();
  }
  function toggleAssign(bid, iid, name) {
    if (guardLocked()) return;
    const item = itemById(boardById(bid), iid);
    if (!item.people) item.people = [];
    const i = item.people.indexOf(name);
    if (i >= 0) item.people.splice(i, 1); else item.people.push(name);
    saveApp(); renderAll();
  }
  function toggleActive(bid, iid) {
    if (guardLocked()) return;
    const item = itemById(boardById(bid), iid);
    item.off = !item.off;
    saveApp(); renderAll();
  }
  function cyclePriority(bid, iid) {
    if (guardLocked()) return;
    const item = itemById(boardById(bid), iid);
    const cur = item.prio || 'could';
    item.prio = PRIORITIES[(PRIORITIES.indexOf(cur) + 1) % PRIORITIES.length];
    saveApp(); renderAll();
  }

  function openItemModal(bid, groupId, itemId) {
    if (guardLocked()) return;

    itemModalCtx = { bid: bid, itemId: itemId };

    sel.innerHTML = b.groups.map(g => '<option value="' + g.id + '">' + g.label + '</option>').join('');

  // Split attribution: an item's weeks divide evenly among its goals; untagged -> Orphans.
  function computeGoalStats() {
    const perGoal = {};
    app.goals.forEach(g => { perGoal[g.id] = { split: 0, touch: 0, count: 0, mustSplit: 0, top: null }; });
    const orphan = { split: 0, count: 0, items: [] };
    let total = 0, mustTotal = 0;
    app.boards.forEach(b => b.items.forEach(item => {
      if (item.off) return;
      const needs = getNeeds(b, item);
      let w = 0;
      Object.keys(needs).forEach(d => { w += DOT_WEEKS[needs[d]] || 0; });
      if (!w) return;
      total += w;
      const isMust = (item.prio || 'could') === 'must';
      if (isMust) mustTotal += w;
      const gs = getItemGoals(item);
      if (!gs.length) {
        orphan.split += w; orphan.count++;
        orphan.items.push({ title: item.title, weeks: w });
        return;
      }
      const share = w / gs.length;
      gs.forEach(gid => {
        const pg = perGoal[gid];
        pg.split += share; pg.touch += w; pg.count++;
        if (isMust) pg.mustSplit += share;
        if (!pg.top || share > pg.top.share) pg.top = { title: item.title, share: share };
      });
    }));
    return { perGoal: perGoal, orphan: orphan, total: total, mustTotal: mustTotal };
  }

  function goalTensions(stats) {
    const notes = [];
    if (!app.goals.length || stats.total === 0) return notes;
    const pctOf = (w, t) => t > 0 ? Math.round(w / t * 100) : 0;
    if (stats.orphan.split > 0) {
      const op = pctOf(stats.orphan.split, stats.total);
      if (op >= 10) notes.push('\u26a0 <strong>' + op + '% of all work is orphaned</strong> \u2014 ' + stats.orphan.count + ' feature(s) serve no stated goal. Either tag them or ask why they\u2019re being built.');
    }
    app.goals.forEach(g => {
      const pg = stats.perGoal[g.id];
      const share = pctOf(pg.split, stats.total);
      if (g.type === 'Foundation' || g.type === 'Vibe') {
        if (pg.count === 0) notes.push('\ud83d\udc7b <strong>' + g.name + '</strong> has no features tagged to it at all.');
        return;
      }
      if ((g.type === 'Pillar' || g.type === 'Sub-Pillar') && share > 0 && share < 5) {
        notes.push('\ud83e\ude97 <strong>' + g.name + '</strong> is nearly starved \u2014 only ' + share + '% of work serves it despite being a pillar.');
      }
      if ((g.type === 'Pillar' || g.type === 'Sub-Pillar') && pg.count > 0 && pg.split === 0) {
        notes.push('\ud83e\ude97 <strong>' + g.name + '</strong> is tagged on features but none carry effort dots yet.');
      }
      if (stats.mustTotal > 0 && share >= 15) {
        const mustShare = pctOf(pg.mustSplit, stats.mustTotal);
        if (mustShare < share / 2) {
          notes.push('\u2696\ufe0f <strong>' + g.name + '</strong>: ' + share + '% of all work but only ' + mustShare + '% of MUST work \u2014 the rhetoric and the commitments disagree.');
        }
      }
      if (pg.split > 0 && pg.top && pg.top.share / pg.split >= 0.7 && pg.count > 1) {
        notes.push('\ud83e\uddca <strong>' + g.name + '</strong> is fragile \u2014 ~' + Math.round(pg.top.share / pg.split * 100) + '% of its effort lives in one feature (' + pg.top.title + '). Cut that feature and the goal collapses.');
      }
      if (pg.count === 0) {
        notes.push('\ud83d\udc7b <strong>' + g.name + '</strong> has no features tagged to it at all.');
      }
    });
    return notes;
  }

  function buildEvalBrief() {
    const stats = computeGoalStats();
    const snap = capSnapshot;
    const pctOf = (w, t) => t > 0 ? Math.round(w / t * 100) : 0;
    const L = [];
    L.push('# Plan Evaluation Brief \u2014 ' + (app.meta.title || 'Work Deliverables'));
    L.push('Generated ' + new Date().toLocaleString() + '. All effort in \u2605\u2605-equivalent weeks.');
    L.push('');
    L.push('## Capacity');
    L.push('- Active work: ' + fmtWeeks(snap.work) + ' | Team capacity: ' + (weeksSet() ? fmtWeeks(snap.capacity) + ' (' + snap.capCount + ' people \u00d7 ' + WEEKS_AVAILABLE + 'w)' : 'not set') + (weeksSet() ? ' | ' + snap.pct + '% loaded' : ''));
    L.push('');
    L.push('## Goals');
    app.goals.forEach(g => {
      const pg = stats.perGoal[g.id];
      L.push('- [' + (g.type || 'Other') + '] ' + g.name + ' \u2014 ' + pctOf(pg.split, stats.total) + '% of work (' + fmtWeeks(pg.split) + ' split share, touches ' + pg.count + ' features). ' + (g.desc || ''));
    });
    L.push('- [Orphans] ' + pctOf(stats.orphan.split, stats.total) + '% of work (' + fmtWeeks(stats.orphan.split) + ', ' + stats.orphan.count + ' features) has no goal.');
    L.push('');
    L.push('## Features (active only: title | weeks | priority | goals)');
    app.boards.forEach(b => {
      L.push('### ' + b.name);
      b.items.forEach(item => {
        if (item.off) return;
        const needs = getNeeds(b, item);
        let w = 0;
        Object.keys(needs).forEach(d => { w += DOT_WEEKS[needs[d]] || 0; });
        const gs = getItemGoals(item).map(id => goalById(id).name);
        L.push('- ' + item.title + ' | ' + fmtWeeks(w) + ' | ' + PRIO_LABEL[item.prio || 'could'] + ' | ' + (gs.length ? gs.join(', ') : 'ORPHAN'));
      });
    });
    L.push('');
    const tensions = goalTensions(stats);
    if (tensions.length) {
      L.push('## Computed tensions');
      tensions.forEach(t => L.push('- ' + t.replace(/<[^>]+>/g, '')));
      L.push('');
    }
    L.push('## Your task');
    L.push('You are evaluating a game team\u2019s scope plan against its stated goals. Please assess:');
    L.push('Note: goals typed [Foundation] are enablers (pipelines, tooling, performance) \u2014 judge them on whether their size is proportionate to what they unblock, not on direct goal contribution.');
    L.push('1. Alignment \u2014 does the distribution of effort match the stated priorities of the goals? Which goals are over/under-funded relative to their rhetorical weight?');
    L.push('2. Semantic conflicts \u2014 which goals are in tension with each other (e.g. scale vs. density, breadth vs. replayability)? Which features serve one goal at the expense of another?');
    L.push('3. Orphans \u2014 for each orphaned feature, either propose which goal it plausibly serves or flag it as a candidate to cut.');
    L.push('4. The three biggest risks in this plan, and the single highest-leverage change you would recommend.');
    L.push('Be direct and specific. Reference features by name.');
    return L.join('\n');
  }

  function copyEvalBrief() {
    const text = buildEvalBrief();
    function done() { showToast('\ud83d\udccb Evaluation brief copied \u2014 paste it into a Claude chat.'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function() { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

        });
        const neededDiscs = Object.keys(needs).filter(sk => needs[sk] > 0);
        const stillNeeds = neededDiscs.filter(sk => !coveredSkills.has(sk));

        const bits = [];
        if (itemWeeks > 0) bits.push('<strong>' + fmtWeeks(itemWeeks) + '</strong> \u00b7 ' + pct + '% of all work');
        if (assigned.length) bits.push(assigned.slice(0, 2).join(', ') + (assigned.length > 2 ? ' +' + (assigned.length - 2) : ''));
        let status;
        if (!active) status = '';
        else if (neededDiscs.length && stillNeeds.length) status = '<span style="color:#d64545; font-weight:600;">\u26a0 needs ' + stillNeeds.join(', ') + '</span>';
        else if (neededDiscs.length && assigned.length) status = '<span style="color:#1baf7a; font-weight:600;">\u2713 covered</span>';
        else if (neededDiscs.length) status = '<span style="opacity:0.55;">unassigned</span>';
        else status = '<span style="opacity:0.55;">no effort set</span>';
        if (status) bits.push(status);
        const gdots = goalDotsHtml(d);
        const digest = (bits.length || gdots) ? '<div class="card-digest">' + bits.join(' &nbsp;\u00b7&nbsp; ') + gdots + '</div>' : '';

        const chips = roster.map(p =>
          '<button class="person-chip' + (assigned.includes(p.name) ? ' assigned' : '') + '" ' +
          'onclick="toggleAssign(\'' + b.id + '\',\'' + d.id + '\',\'' + esc(p.name) + '\')">' + p.name + '</button>'
        ).join('') || '<span style="opacity:0.5; font-size:14px;">Nobody on this page yet \u2014 give people these skills on the Team tab, or add skills below.</span>';

        const isOpen = openDetails.has(b.id + ':' + d.id);
        return '<div class="card' + (active ? '' : ' inactive') + prioClass(d.prio || 'could') + '" style="border-left: 5px solid ' + (g.color || '#3987e5') + ';">' +
          '<div class="card-head"><div class="card-title">' + d.title + '</div>' +
          '<div style="display:flex; align-items:center; gap:4px;">' +
          '<button class="icon-btn" title="Edit" onclick="openItemModal(\'' + b.id + '\',null,\'' + d.id + '\')">\u270e</button>' +
          '<button class="icon-btn" title="Delete" onclick="deleteItem(\'' + b.id + '\',\'' + d.id + '\')">\ud83d\uddd1</button>' +
          prioToggleHtml(b.id, d.id, d.prio || 'could') +
          activeToggleHtml(b.id, d.id, active) + '</div></div>' +
          '<div class="card-desc">' + d.desc + '</div>' +
          digest +
          '<details class="card-details"' + (isOpen ? ' open' : '') + '>' +
          '<summary onclick="return cardDetailsClick(\'' + b.id + '\',\'' + d.id + '\')">Details \u2014 skills &amp; staffing</summary>' +
          '<div class="detail-label">Required skills</div>' +
          '<div class="card-toggles" style="border-top:none; padding-top:0;">' + (b.disciplines.length ? needToggleHtml(b, d) : '<span style="opacity:0.5; font-size:14px;">No skills on this page yet \u2014 turn some on in the Skill Builder below.</span>') + '</div>' +
          '<div class="detail-label">Staffing</div>' +
          '<div class="napkin-chips">' + chips + '</div>' +
          '<div class="detail-label">Goals</div>' +
          '<div class="napkin-chips">' + goalChipsHtml(b.id, d) + '</div>' +
          '</details></div>';
      }).join('');
      return '<div class="category"><div class="category-title"><span style="display:inline-block; width:12px; height:12px; border-radius:3px; background:' + (g.color || '#3987e5') + ';"></span>' + g.label +
        '<button class="icon-btn" title="Edit section" style="font-size:13px;" onclick="openSectionModal(\'' + b.id + '\',\'' + g.id + '\')">\u270e</button>' +
        '<button class="add-item-btn" onclick="openItemModal(\'' + b.id + '\',\'' + g.id + '\',null)">+ ADD</button></div>' +
        '<div class="cards-grid">' + (cards || '<div class="board-hint">No features yet \u2014 use + ADD.</div>') + '</div></div>';
    }).join('') || '<div class="board-hint">This page is empty. Use <strong>+ Add Section</strong> above to create your first section, then + ADD features into it.</div>';

    // skill builder
    const chips = app.skills.map(s => {
      const on = b.disciplines.includes(s.name);
      return '<span class="skill-pair">' +
        '<button class="need-toggle' + (on ? ' on' : '') + '" onclick="toggleBoardDiscipline(\'' + b.id + '\',\'' + esc(s.name) + '\')">' + s.name + '</button>' +
        '<button class="icon-btn" style="font-size:12px; padding:2px;" title="Edit skill" onclick="openSkillEditor(\'' + esc(s.name) + '\')">\u270e</button></span>';
    }).join('');
    const skillBuilder = '<div class="category"><div class="category-title">\ud83e\uddf0 Skill Builder' +
      '<button class="add-item-btn" onclick="openSkillModal(\'' + b.id + '\')">+ ADD SKILL</button></div>' +
      '<div class="effort-key">Skills toggled on appear on every feature card on this page. Toggling one off hides (doesn\u2019t delete) any effort already set in it \u2014 flip it back on and the numbers return. New skills also become available on Team character sheets.</div>' +
      '<div class="card-toggles" style="border-top:none; padding-top:0;">' + chips + '</div></div>';

    return '<div id="board-' + b.id + '" class="tab-content">' +
      '<div class="capacity-banner">' + capacityBannerHtml() + '</div>' +
      gapsHtml + rosterDetails + key + controls + sections + skillBuilder + '</div>';
  }

  // ===================== RENDER: TEAM TAB =====================
  function staffTabHtml() {
    const snap = capSnapshot;

    const staffCards = app.staff.map(p => {
      let booked = 0;
      const taskList = [];
      app.boards.forEach(b => {
        booked += (loadsByBoard[b.id] && loadsByBoard[b.id].personWeeks[p.name]) || 0;
        b.items.forEach(item => {
          if (item.off) return;
          if ((item.people || []).includes(p.name)) taskList.push('<li>' + item.title + '</li>');
        });
      });
      const hot = weeksSet() && booked > WEEKS_AVAILABLE;
      const skillChips = app.skills.map(sk => {
        const t = p.tiers[sk.name] || 0;
        const stars = t ? ' ' + '\u2605'.repeat(t) : '';
        return '<button class="need-toggle' + (t ? ' on d' + t : '') + '" ' +
          'onclick="cycleStaffSkill(\'' + esc(p.name) + '\',\'' + esc(sk.name) + '\')">' + sk.name + stars + '</button>';
      }).join('');
      const oh = p.overhead ? '<div class="staff-overhead">+ ' + p.overhead + '</div>' : '';
      return '<div class="person-card">' +
        '<div class="person-role" style="background:transparent;border:none;color:inherit;">' + p.name +
        ' <button class="icon-btn" style="font-size:12px;" title="Rename" onclick="renameStaffPrompt(\'' + esc(p.name) + '\')">\u270e</button></div>' +
        '<div class="staff-title-line">' + (p.title || '<span style="opacity:0.4;">no title</span>') +
        ' <button class="icon-btn" style="font-size:11px;" title="Edit title" onclick="editStaffTitle(\'' + esc(p.name) + '\')">\u270e</button></div>' +
        '<div class="person-emoji">' + personEmoji(p.tiers, false) + '</div>' +
        '<div class="person-need" style="color:' + (hot ? '#d64545' : '#3987e5') + ';">booked ' + fmtWeeks(booked) + ' / ' + capStr() + '</div>' +
        '<div class="hire-skills">' + skillChips + '</div>' + oh +
        (taskList.length ? '<ul class="person-tasks">' + taskList.join('') + '</ul>' : '<div class="staff-note">Nothing assigned yet.</div>') +
        '<button class="remove-hire" onclick="removeStaff(\'' + esc(p.name) + '\')">remove from team</button>' +
        '</div>';
    }).join('');

    const hireCards = app.hires.map(h => {
      const skillChips = app.skills.map(sk => {
        const t = h.skills[sk.name] || 0;
        const stars = t ? ' ' + '\u2605'.repeat(t) : '';
        return '<button class="need-toggle' + (t ? ' on d' + t : '') + '" ' +
          'onclick="toggleHireSkill(\'' + h.id + '\',\'' + esc(sk.name) + '\')">' + sk.name + stars + '</button>';
      }).join('');
      let booked = 0;
      const taskList = [];
      app.boards.forEach(b => {
        booked += (loadsByBoard[b.id] && loadsByBoard[b.id].personWeeks[h.name]) || 0;
        b.items.forEach(item => {
          if (item.off) return;
          if ((item.people || []).includes(h.name)) taskList.push('<li>' + item.title + '</li>');
        });
      });
      const hot = weeksSet() && booked > WEEKS_AVAILABLE;
      return '<div class="person-card hire-card">' +
        '<button class="hire-name-btn" onclick="renameHire(\'' + h.id + '\')" title="Click to rename">' + h.name + ' \u270e</button>' +
        '<button class="icon-btn" style="font-size:64px; opacity:1; line-height:1.1; padding:0;" title="Click to change icon" onclick="cycleHireEmoji(\'' + h.id + '\')">' + (h.emoji || '\ud83c\udd95') + '</button>' +
        '<div class="person-need" style="color:' + (hot ? '#d64545' : '#1baf7a') + ';">booked ' + fmtWeeks(booked) + ' / ' + capStr() + '</div>' +
        '<div class="hire-skills">' + skillChips + '</div>' +
        (taskList.length ? '<ul class="person-tasks">' + taskList.join('') + '</ul>' : '<div class="staff-note">No tasks yet \u2014 claim gaps below or assign inside a feature\u2019s Details.</div>') +
        '<button class="remove-hire" onclick="removeHire(\'' + h.id + '\')">remove</button>' +
        '</div>';
    }).join('');

    // Seats to fill: gaps + overflow
    const roleData = {};
    app.boards.forEach(b => {
      const loads = loadsByBoard[b.id];
      Object.entries(loads.gaps).forEach(([disc, g]) => {
        const role = ROLE_MAP[disc] || disc;
        if (!roleData[role]) roleData[role] = { weeks: 0, tasks: [] };
        roleData[role].weeks += g.weeks;
        g.items.forEach(t => {
          const claimers = app.hires.filter(h => h.skills[disc]).map(h =>
            '<button class="claim-btn" onclick="assignHireToItem(\'' + h.id + '\',\'' + t.boardId + '\',\'' + t.id + '\')">\u2192 ' + h.name + '</button>'
          ).join('');
          roleData[role].tasks.push(t.title + ' \u2014 ' + disc + ' (' + fmtWeeks(t.weeks) + ')' + claimers);
        });
      });
    });
    const combined = {};
    snap.people.forEach(p => {
      let total = 0; const skillWeeks = {};
      app.boards.forEach(b => {
        const loads = loadsByBoard[b.id];
        total += (loads.personWeeks[p.name] || 0);
        const sw = loads.personSkillWeeks[p.name] || {};
        Object.keys(sw).forEach(s => { skillWeeks[s] = (skillWeeks[s] || 0) + sw[s]; });
      });
      combined[p.name] = { total: total, skillWeeks: skillWeeks };
    });
    Object.entries(combined).forEach(([name, c]) => {
      if (!weeksSet()) return;
      const overflow = c.total - WEEKS_AVAILABLE;
      if (overflow <= 0) return;
      Object.entries(c.skillWeeks).forEach(([disc, wks]) => {
        const share = overflow * (wks / c.total);
        if (share < 0.5) return;
        const role = ROLE_MAP[disc] || disc;
        if (!roleData[role]) roleData[role] = { weeks: 0, tasks: [] };
        roleData[role].weeks += share;
        roleData[role].tasks.push('<span class="offload">Offload ~' + fmtWeeks(share) + ' of ' + disc + ' from ' + name +
          ' (booked ' + fmtWeeks(c.total) + ' / ' + WEEKS_AVAILABLE + 'w)</span>');
      });
    });
    const roles = Object.entries(roleData).sort((a, b) => b[1].weeks - a[1].weeks);
    const seatCards = roles.map(([role, d]) => {
      const months = Math.round(d.weeks / 4.3 * 10) / 10;
      const tasks = d.tasks.map(t => '<li>' + t + '</li>').join('');
      return '<div class="person-card">' +
        '<div class="person-role">' + role + '</div>' +
        '<div class="person-emoji">' + (ROLE_EMOJI[role] || '\ud83e\uddd1\u200d\ud83d\ude80') + '</div>' +
        '<div class="person-need">~' + fmtWeeks(d.weeks) + ' of work (\u2248 ' + months + ' months)</div>' +
        '<ul class="person-tasks">' + tasks + '</ul></div>';
    }).join('');

    const perBoard = app.boards.map(b => {
      const entries = Object.entries(loadsByBoard[b.id].gaps).sort((a, bb) => bb[1].weeks - a[1].weeks);
      if (!entries.length) return '';
      return '<div class="staff-section"><div class="staff-title">' + b.name + ' \u2014 unstaffed work</div>' +
        '<div style="font-size:16px;">' + entries.map(e => e[0] + ' \u00d7 ' + fmtWeeks(e[1].weeks)).join(' &nbsp;\u2022&nbsp; ') + '</div></div>';
    }).join('');

    return '<div id="staff" class="tab-content">' +
      '<div class="effort-key">Window: ' + (weeksSet() ? '\u2248 <strong>' + WEEKS_AVAILABLE + ' weeks</strong> per person.' : '<strong>not set</strong> \u2014 set it in \u2699\ufe0f to unlock overload detection.') + ' ' +
      'Seats to Fill covers work that is either <strong>unstaffed</strong> (no assigned person covers it) or <strong>overflow</strong> (assigned people are booked past capacity). ' +
      'Skill tiers: click a skill to cycle \u2605 (0.5\u00d7 speed) \u2192 \u2605\u2605 (1\u00d7 \u2014 estimates assume this) \u2192 \u2605\u2605\u2605 (2\u00d7). Seat estimates assume a \u2605\u2605 hire.</div>' +
      '<div class="category"><div class="category-title">\ud83d\udc65 Current Staff' +
      '<button class="add-item-btn" onclick="addStaff()">+ ADD TEAM MEMBER</button></div>' +
      '<div class="cards-grid">' + (staffCards || '<div class="board-hint">No team yet \u2014 add your first team member, then tap skills onto their card.</div>') + '</div></div>' +
      '<div class="category"><div class="category-title">\ud83d\udd28 Needed Staff</div>' +
      '<div class="hire-bar"><button class="add-hire-btn" onclick="addHire()">\u2795 Add a Hire</button>' +
      '<span class="staff-note" style="margin:0;">Build a hire: name the role, tap skills onto them, then claim gap tasks below (\u2192 buttons) or assign them inside any feature\u2019s Details. Co-assign them next to an overbooked person to split that load.</span></div>' +
      (hireCards ? '<div class="cards-grid">' + hireCards + '</div>' : '') + '</div>' +
      '<div class="category"><div class="category-title">\ud83e\uddd1\u200d\ud83e\udd1d\u200d\ud83e\uddd1 Seats to Fill</div>' +
      '<div class="cards-grid">' + (seatCards || '<div class="board-hint">All work staffed within capacity \u2713</div>') + '</div></div>' +
      perBoard +
      '<div class="staff-note">Hire, borrow, or contract. Effort attribution: each discipline\u2019s dots convert to weeks and split in proportion to each person\u2019s tier speed (\u2605\u2605\u2605 carries the bulk; a \u2605 assist lightens the load instead of halving it). Adjust dots and staffing inside each feature\u2019s Details on the page tabs.</div>' +
      '</div>';
  }

  // ===================== RENDER: SUMMARY TAB =====================
  function summaryTabHtml() {
    const snap = capSnapshot;
    const padding = parseInt(app.meta.padding) || 0;

    let mustWork = 0, uncovered = 0;
    app.boards.forEach(b => {
      b.items.forEach(item => {
        if (item.off || (item.prio || 'could') !== 'must') return;
        const needs = getNeeds(b, item);
        Object.keys(needs).forEach(d => { mustWork += DOT_WEEKS[needs[d]] || 0; });
      });
      Object.values(loadsByBoard[b.id].gaps).forEach(g => uncovered += g.weeks);
    });

    let v1, color, levers = '';
    if (app.boards.length && snap.work > 0 && !weeksSet()) {
      color = '#3987e5';
      v1 = 'There is ' + fmtWeeks(snap.work) + ' of work scoped. Set your available weeks (\u2699\ufe0f \u2192 \ud83d\udcc5) to see whether it fits your team.';
    } else if (!app.boards.length) {
      color = '#3987e5';
      v1 = 'Nothing here yet. Add a page from the tab bar, create sections and features, then build your team on the Team tab.';
    } else if (snap.pct > 100) {
      const over = snap.work - snap.capacity;
      const ppl = Math.max(1, Math.ceil(over / WEEKS_AVAILABLE));
      const slip = Math.ceil((snap.work / Math.max(snap.capCount, 1) - WEEKS_AVAILABLE) * 10) / 10;
      const speed = Math.ceil(snap.work / snap.capacity * 100) / 100;
      color = '#d64545';
      v1 = 'We can deliver this scope \u2014 if at least one of these becomes true:';
      levers = '<div class="verdict-sub" style="margin-bottom:8px;">' +
        '<div>\u2702\ufe0f &nbsp;We trim ~<strong>' + fmtWeeks(over) + '</strong> of scope (a WON\u2019T pass on the Features list below)</div>' +
        '<div>\ud83e\udd1d &nbsp;We add ~<strong>' + ppl + ' ' + (ppl === 1 ? 'person' : 'people') + '</strong> for the window (see Seats to Fill on the Team tab)</div>' +
        '<div>\ud83d\udcc5 &nbsp;We extend the window by ~<strong>' + slip + 'w</strong> per person</div>' +
        '<div>\u26a1 &nbsp;The team outruns the estimates by ~<strong>' + speed + '\u00d7</strong> across the board (for scale: \u2605\u2605 \u2192 \u2605\u2605\u2605 is 2\u00d7 \u2014 this lever is real but it\u2019s the only one that isn\u2019t a decision)</div>' +
        '<div style="margin-top:4px; opacity:0.8;">\u2026or a blend: e.g. one hire plus a light trim.</div></div>';
    } else if (snap.pct > 85) {
      const slack = snap.capacity - snap.work;
      color = '#eda100';
      v1 = 'We can hold this scope \u2014 if nothing new lands and the estimates hold. There\u2019s only ~' + fmtWeeks(slack) + ' of slack (' + (100 - snap.pct) + '%); one surprise eats it.';
    } else {
      const slack = snap.capacity - snap.work;
      color = '#1baf7a';
      v1 = 'We can deliver this scope as currently staffed, with ~' + fmtWeeks(slack) + ' of slack in hand.';
    }
    const notes = [];
    if (weeksSet() && mustWork > 0 && snap.capacity > 0) notes.push('MUST-priority work alone is ' + Math.round(mustWork / snap.capacity * 100) + '% of capacity.');
    const hotGroups = Object.keys(snap.groupWork).filter(g => (snap.groupCap[g] || 0) > 0 && snap.groupWork[g] / snap.groupCap[g] > 1);
    if (hotGroups.length) notes.push('Pressure is concentrated in ' + hotGroups.join(', ') + '.');
    if (uncovered > 0) notes.push('~' + fmtWeeks(uncovered) + ' of work has no assigned owner yet.');
    if (app.goals.length) {
      const gstats = computeGoalStats();
      if (gstats.total > 0 && gstats.orphan.split / gstats.total >= 0.1) {
        notes.push(Math.round(gstats.orphan.split / gstats.total * 100) + '% of work serves no stated goal (see Goals tab).');
      }
    }
    if (app.boards.length) {
      notes.push(padding ? 'Numbers include ' + padding + '% schedule padding.' : 'No schedule padding is allocated \u2014 these are best-case numbers.');
      notes.push('All figures are ballpark estimates for planning conversation, not commitments.');
    }

    const verdict = '<div class="verdict-banner">' +
      '<div class="verdict-line" style="color:' + color + ';">' + v1 + '</div>' +
      levers +
      '<div class="verdict-sub">' + notes.join(' ') + '</div>' +
      (app.boards.length && weeksSet() ? '<div class="verdict-nums"><strong>Active work:</strong> ' + fmtWeeks(snap.work) +
      ' &nbsp;\u2022&nbsp; <strong>Team capacity:</strong> ' + fmtWeeks(snap.capacity) +
      ' &nbsp;\u2022&nbsp; <span class="capacity-pct" style="color:' + color + ';">' + snap.pct + '% loaded</span></div>' : '') +
      '</div>';

    const groupCards = GROUP_LIST
      .filter(g => (snap.groupWork[g] || 0) > 0 || (snap.groupCap[g] || 0) > 0)
      .map(g => {
        const gw = snap.groupWork[g] || 0, gc = snap.groupCap[g] || 0;
        const gp = gc > 0 ? Math.round(gw / gc * 100) : (gw > 0 ? 999 : 0);
        const gcol = gp > 100 ? '#d64545' : (gp > 85 ? '#eda100' : '#1baf7a');
        return '<div class="group-card"><div class="g-emoji">' + (GROUP_EMOJI[g] || '') + '</div>' +
          '<div class="g-name">' + g + '</div>' +
          '<div class="g-nums">' + fmtWeeks(gw) + (weeksSet() ? ' / ' + fmtWeeks(gc) : ' work') + '</div>' +
          '<div class="g-pct" style="color:' + gcol + ';">' + (weeksSet() && gc > 0 ? gp + '%' : '\u2014') + '</div></div>';
      }).join('');

    const teamCards = snap.people.map(p => {
      const title = p.isHire ? 'Proposed hire' : (p.title || '');
      const hireEmoji = p.isHire ? (app.hires.find(h => h.name === p.name) || {}).emoji : null;
      return '<div class="sum-person"' + (p.isHire ? ' style="border-style:dashed; border-color:#d4a574;"' : '') + '>' +
        '<div class="p-emoji">' + personEmoji(p.tiers, p.isHire, hireEmoji) + '</div>' +
        '<div class="p-name">' + p.name + '</div>' +
        '<div class="p-title">' + title + '</div></div>';
    }).join('');

    // Lenses panel: filters grouped into labeled rows by kind
    const lensRow = (label, chips) => chips
      ? '<div class="filter-bar" style="margin-bottom:4px;"><span class="filter-label" style="margin-left:0; min-width:100px;">' + label + '</span>' + chips + '</div>'
      : '';
    let deviations = 0;
    let boardChips = '';
    if (app.boards.length > 1) {
      boardChips = app.boards.map(b => {
        const on = summaryFilters.boards[b.id] !== false;
        if (!on) deviations++;
        return '<button class="filter-chip' + (on ? ' on' : '') + '" onclick="sumToggleBoard(\'' + b.id + '\')">' + b.name + '</button>';
      }).join('');
    }
    const prioChips = ['must','should','could','wont'].map(p => {
      const on = summaryFilters.prio[p];
      if (!on) deviations++;
      return '<button class="filter-chip' + (on ? ' on' : '') + '" onclick="sumTogglePrio(\'' + p + '\')">' + PRIO_LABEL[p] + '</button>';
    }).join('');
    const TYPE_ROW_LABEL = { Vibe: 'Vibe', Pillar: 'Game Pillars', 'Sub-Pillar': 'Sub-Pillars', Quality: 'Quality bars', Milestone: 'Milestones', Foundation: 'Foundations', Other: 'Other goals' };
    const goalRows = GOAL_TYPES.map(t => {
      const gs = app.goals.filter(g => (g.type || 'Other') === t);
      if (!gs.length) return '';
      const chips = gs.map(g => {
        const on = summaryFilters.goals[g.id] !== false;
        if (!on) deviations++;
        return '<button class="filter-chip' + (on ? ' on' : '') + '"' + (on ? ' style="border-color:' + g.color + '; color:' + g.color + ';"' : '') + ' onclick="sumToggleGoal(\'' + g.id + '\')">' + g.name + '</button>';
      }).join('');
      return lensRow(TYPE_ROW_LABEL[t], chips);
    }).join('');
    let auditChips = '';
    if (app.goals.length) {
      const orphOn = summaryFilters.goals['__orphan'] !== false;
      if (!orphOn) deviations++;
      auditChips = '<button class="filter-chip' + (orphOn ? ' on' : '') + '" onclick="sumToggleGoal(\'__orphan\')">\ud83d\udc7b Orphans</button>';
    }
    const sortChips = [['priority','Priority'],['size','Size'],['alpha','A\u2013Z']].map(s =>
      '<button class="filter-chip' + (summaryFilters.sort === s[0] ? ' on' : '') + '" onclick="sumSetSort(\'' + s[0] + '\')">' + s[1] + '</button>'
    ).join('');
    const lensPanel = '<details class="load-details" style="margin:0 0 1rem 0;"' + (lensOpen ? ' open' : '') + '>' +
      '<summary onclick="return lensClick()">\ud83d\udd0d Lenses &amp; Filters' + (deviations ? ' \u2014 <span style="color:#3987e5;">' + deviations + ' applied</span>' : '') + '</summary>' +
      '<div style="margin-top:8px;">' +
      lensRow('Show', boardChips) +
      lensRow('Priority', prioChips) +
      goalRows +
      lensRow('Audit', auditChips) +
      lensRow('Sort', sortChips) +
      '</div></details>';

    const rows = [];
    app.boards.forEach(b => {
      if (summaryFilters.boards[b.id] === false) return;
      b.items.forEach(item => {
        const prio = item.prio || 'could';
        if (!summaryFilters.prio[prio]) return;
        const needs = getNeeds(b, item);
        let w = 0;
        Object.keys(needs).forEach(d => { w += DOT_WEEKS[needs[d]] || 0; });
        const gs = getItemGoals(item);
        if (app.goals.length) {
          const pass = gs.length
            ? gs.some(id => summaryFilters.goals[id] !== false)
            : summaryFilters.goals['__orphan'] !== false;
          if (!pass) return;
        }
        const g = b.groups.find(x => x.id === item.groupId);
        rows.push({ bid: b.id, id: item.id, item: item, title: item.title, desc: item.desc || '', color: (g && g.color) || '#3987e5', weeks: w, prio: prio, active: !item.off });
      });
    });
    const prioOrder = { must: 0, should: 1, could: 2, wont: 3 };
    if (summaryFilters.sort === 'priority') rows.sort((a, b) => (prioOrder[a.prio] - prioOrder[b.prio]) || (b.weeks - a.weeks));
    else if (summaryFilters.sort === 'size') rows.sort((a, b) => b.weeks - a.weeks);
    else rows.sort((a, b) => a.title.localeCompare(b.title));

    const featureRows = rows.map(r =>
      '<div class="sum-row' + (r.active ? '' : ' inactive') + prioClass(r.prio) + '">' +
      '<div class="cat-bar" style="background:' + r.color + '"></div>' +
      prioToggleHtml(r.bid, r.id, r.prio) +
      activeToggleHtml(r.bid, r.id, r.active) +
      '<div class="sum-title" title="' + attr(r.desc) + '">' + r.title + goalDotsHtml(r.item) + '</div>' +
      '<div class="sum-weeks">' + (r.weeks ? fmtWeeks(r.weeks) : '') + '</div></div>'
    ).join('');

    return '<div id="summary" class="tab-content">' + verdict +
      (groupCards ? '<div class="category-title">\ud83d\udcca Load by Discipline</div><div class="group-cards">' + groupCards + '</div>' : '') +
      (teamCards ? '<div class="category-title">\ud83d\udc65 The Team</div><div class="sum-team">' + teamCards + '</div>' : '') +
      (rows.length || app.boards.length ? '<div class="category-title">\ud83d\udccb The Features</div>' +
        lensPanel + featureRows : '') +
      '</div>';
  }

  // ===================== RENDER ALL =====================
  function renderAll() {
    computeWeeks();
    computeSnapshot();

    const nav = ['<button class="tab-button" data-tab="summary" onclick="switchTab(\'summary\')">Summary</button>'];
    nav.push('<button class="tab-button" data-tab="goals" onclick="switchTab(\'goals\')">Goals</button>');
    nav.push('<button class="tab-button" data-tab="staff" onclick="switchTab(\'staff\')">Team</button>');
    app.boards.forEach(b => {
      nav.push('<button class="tab-button" data-tab="board-' + b.id + '" onclick="switchTab(\'board-' + b.id + '\')">' + b.name + '</button>');
    });
    nav.push('<button class="tab-button add-page" onclick="addBoard()">\uff0b Page</button>');
    document.getElementById('tabNav').innerHTML = nav.join('');

    document.getElementById('tabHost').innerHTML =
      summaryTabHtml() + app.boards.map(b => boardTabHtml(b)).join('') + goalsTabHtml() + staffTabHtml();

    applyActiveTab();
    updateConfigBadge();
    renderHeader();
  }

  // ===================== INIT =====================
  window.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeMenuItem').textContent = '\u2600\ufe0f Light Mode';
    }
    loadApp();
    renderAll();
  });
</script>

</body>
</html>
