<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d1c">
<title>Buzzers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone full" id="phone"></div>

<script type="module">
// Buzzers — the real phone. The game runs on the PartyKit room server; this page sends actions up,
// gets its own copy of the state down, and renders it. Rules and timings: game.js. Views: ui.js.
import { CONFIG, newId } from './game.js';
import { renderPhone, wirePhone, paint, tickSig, generateClues, sound, esc } from './ui.js';

// ============================ CLIENT CONFIG ============================
const qs = new URLSearchParams(location.search);
const isLocal = /^(localhost|127\.0\.0\.1|\d+\.\d+\.\d+\.\d+)$/.test(location.hostname);
const CLIENT = {
  // Deployed PartyKit host. Override with ?party=host:port. On localhost or a LAN IP it uses that machine's :1999.
  partyHost: qs.get('party') || (isLocal ? `${location.hostname}:1999` : 'buzzers.gamedesignerjoe.partykit.dev'),
  clockPings: 6,          // pings per sync burst; the lowest round trip wins
  resyncEveryMs: 15000,
  reconnectMs: [400, 5000],
};
const wsProto = /^(localhost|127\.0\.0\.1|\d+\.\d+\.\d+\.\d+)(:\d+)?$/.test(CLIENT.partyHost) ? 'ws' : 'wss';

// ============================ LOCAL STATE ============================
const store = {
  get: (k, d = '') => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  sget: k => { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } },
  sset: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} },
};
let deviceKey = store.get('bz.key'); if (!deviceKey) { deviceKey = newId('d') + newId(); store.set('bz.key', deviceKey); }
let pid = store.sget('bz.pid') || newId('p');           // per tab: two tabs on one laptop = two players
let room = null, ws = null, S = null, conn = 'offline';
let offset = 0, samples = [], syncTimer = null, retryMs = CLIENT.reconnectMs[0], retryTimer = null;
let hold = false, revealedRound = -1, lockUntil = 0;
let lastSfx = null, dingFor = null, timeoutFor = null;
const generating = new Set();
const syncedNow = () => Date.now() + offset;
const $ = s => document.querySelector(s);
const phone = $('#phone');

// ============================ JOIN SCREEN ============================
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
const randomCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
let joinColor = store.get('bz.color', CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)]);
let joinError = '';

function showJoin() {
  phone._html = null;
  const code = cleanCode(qs.get('room') || store.get('bz.lastRoom'));
  phone.innerHTML = `
    <div class="grow" style="justify-content:flex-start;padding-top:8vh">
      <h1 style="font-size:56px;line-height:.9">Buzzers</h1>
      <div class="alts">Everyone adds a category. The phones are the buzzers. Someone reads each clue out loud.</div>
      <div class="eyebrow">Your name</div>
      <input class="input" id="name" maxlength="${CONFIG.maxNameLen}" autocomplete="off" autocapitalize="words" value="${esc(store.get('bz.name'))}" placeholder="Name">
      <div class="eyebrow">Your color</div>
      <div class="swatches">${CONFIG.colors.map(c => `<button class="swatch ${c === joinColor ? 'on' : ''}" data-color="${c}" style="background:${c}" aria-label="color ${c}"></button>`).join('')}</div>
      <div class="eyebrow">Room code</div>
      <form class="field" id="joinform"><input class="input code" id="code" value="${esc(code)}" placeholder="ABCD" maxlength="12" autocomplete="off" autocapitalize="characters"><button class="btn gold" type="submit">Join</button></form>
      <button class="btn ghost wide" id="newroom">Start a new room</button>
      <div class="err" id="joinerr">${esc(joinError)}</div>
      <div class="foot">Use the same room code next time and the room remembers which clues your group has already seen.</div>
    </div>`;
  phone.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { joinColor = b.dataset.color; phone.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === b)); });
  const go = code => {
    const name = $('#name').value.trim();
    if (!name) { $('#joinerr').textContent = 'Pick a name first.'; $('#name').focus(); return; }
    if (!code) { $('#joinerr').textContent = 'Type a room code, or start a new room.'; $('#code').focus(); return; }
    sound.unlock(); // iOS: audio only unlocks inside a tap
    store.set('bz.name', name); store.set('bz.color', joinColor);
    join(code);
  };
  $('#joinform').onsubmit = e => { e.preventDefault(); go(cleanCode($('#code').value)); };
  $('#newroom').onclick = () => go(randomCode());
}

function join(code) {
  room = code; joinError = '';
  store.set('bz.lastRoom', code);
  const u = new URL(location.href); u.searchParams.set('room', code); history.replaceState(null, '', u);
  connect();
  draw();
}

function leave() {
  room = null; S = null;
  clearTimeout(retryTimer); clearInterval(syncTimer);
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  const u = new URL(location.href); u.searchParams.delete('room'); history.replaceState(null, '', u);
  conn = 'offline'; showJoin();
}

// ============================ SOCKET ============================
function connect() {
  clearTimeout(retryTimer);
  if (ws) { ws.onclose = null; try { ws.close(); } catch {} }
  conn = S ? 'reconnecting' : 'connecting';
  const sock = ws = new WebSocket(`${wsProto}://${CLIENT.partyHost}/parties/main/${encodeURIComponent(room)}`);
  sock.onopen = () => {
    retryMs = CLIENT.reconnectMs[0];
    send({ type: 'hello', pid, key: deviceKey, name: store.get('bz.name'), color: store.get('bz.color') });
    syncClock(CLIENT.clockPings);
    clearInterval(syncTimer); syncTimer = setInterval(() => syncClock(3), CLIENT.resyncEveryMs);
  };
  sock.onmessage = e => onMessage(JSON.parse(e.data));
  sock.onclose = e => {
    if (sock !== ws) return;
    clearInterval(syncTimer);
    if (e.code === 4000) { conn = 'opened elsewhere'; draw(); return; } // this seat was taken over by another tab
    conn = 'reconnecting'; draw();
    retryTimer = setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, CLIENT.reconnectMs[1]);
  };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
const act = action => send({ type: 'action', action });

// iPhones freeze the socket when the screen locks; come straight back when the page is visible.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && room && (!ws || ws.readyState > 1)) connect(); });
window.addEventListener('pageshow', e => { if (e.persisted && room) connect(); });

// Clock sync: each ping measures round trip; keep the offset from the fastest recent sample.
function syncClock(n) { for (let i = 0; i < n; i++) setTimeout(() => send({ type: 'ping', t0: Date.now() }), i * 120); }
function onPong(m) {
  const t1 = Date.now(), rtt = t1 - m.t0;
  samples.push({ rtt, offset: m.ts + rtt / 2 - t1 });
  samples = samples.slice(-12);
  const best = samples.reduce((a, b) => (b.rtt < a.rtt ? b : a));
  offset = best.offset;
  if (samples.length % 3 === 0) act({ type: 'clock', offset: best.offset, rtt: best.rtt });
}

function onMessage(m) {
  if (m.type === 'pong') return onPong(m);
  if (m.type === 'you') { pid = m.pid; store.sset('bz.pid', pid); return; }
  if (m.type === 'err') {
    if (m.fatal) { joinError = m.msg; leave(); return; }
    return toast(m.msg);
  }
  if (m.type === 'state') {
    if (!samples.length) offset = m.now - Date.now(); // rough until the first pong
    const first = !S; S = m.S; conn = 'live';
    if (S.phase !== 'reading') hold = false;
    effects(first);
    draw();
  }
}

// ============================ SIDE EFFECTS OF NEW STATE ============================
function effects(first) {
  // stings
  if (lastSfx !== null && S.sfx.n !== lastSfx && S.sfx.kind) sound.play(S.sfx.kind);
  lastSfx = S.sfx.n;
  // the ding lands at the synced open time on every phone
  if (S.phase === 'buzz' && S.buzz.openAt && dingFor !== S.buzz.openAt) {
    dingFor = S.buzz.openAt;
    const ms = S.buzz.openAt - syncedNow();
    if (!first && ms > -400) setTimeout(() => { sound.play('ding'); draw(); }, Math.max(0, ms));
  }
  // my category: go get clues (also picks up a search interrupted by a refresh)
  S.categories.filter(c => c.by === pid && c.status === 'generating' && !generating.has(c.id)).forEach(async c => {
    generating.add(c.id);
    const avoid = S.memory.used.filter(id => id.startsWith(c.name.toLowerCase() + '|')).map(id => id.slice(c.name.length + 1));
    const r = await generateClues(c.name, avoid);
    act({ type: 'generated', catId: c.id, clues: r.clues, source: r.source, note: r.note });
  });
}

// ============================ RENDER ============================
function ctx() {
  return { now: syncedNow(), hold, revealed: S && revealedRound === S.round, lockUntil: Math.max(lockUntil, S?.buzz?.lockedUntil?.[pid] || 0), room, conn, muted: sound.muted, showLeave: true };
}
function draw() {
  if (!room) return;
  if (!S) { phone._html = null; phone.innerHTML = `<div class="grow center"><div class="eyebrow">Room ${esc(room)}</div><div class="big" style="font-size:34px">${conn === 'opened elsewhere' ? 'Opened in another tab' : 'Connecting…'}</div><div class="alts">${esc(CLIENT.partyHost)}</div><button class="btn ghost" id="back">Back</button></div>`; $('#back').onclick = leave; return; }
  if (conn === 'opened elsewhere') { phone._html = null; phone.innerHTML = `<div class="grow center"><div class="big" style="font-size:34px">You opened this seat somewhere else</div><button class="btn gold" id="rejoin">Use it here</button></div>`; $('#rejoin').onclick = connect; return; }
  if (paint(phone, renderPhone(S, pid, ctx()))) wirePhone(phone, S, pid, handlers);
}

const handlers = {
  send: act,
  addCategory: name => act({ type: 'addCategory', id: newId('c'), name }),
  press: () => {
    const at = syncedNow();
    // show the early lockout immediately; the server makes the real call
    if (S.phase === 'reading' || (S.phase === 'buzz' && at < S.buzz.openAt)) { if (lockUntil <= at) lockUntil = at + CONFIG.earlyLockoutMs; draw(); }
    act({ type: 'press', at });
  },
  hold: down => {
    if (down === hold) return;
    hold = down;
    act(down ? { type: 'holdStart' } : { type: 'holdEnd', at: syncedNow() });
    draw();
  },
  reveal: () => { revealedRound = S.round; draw(); },
  mute: () => { sound.unlock(); sound.toggle(); draw(); },
  leave,
};

// 100 ms tick: countdown, buzzers arming at the open time, lockout ending, out-of-time sting.
let lastSig = '';
setInterval(() => {
  if (!S || !room) return;
  const c = ctx();
  if (S.phase === 'answering' && timeoutFor !== S.answerDeadline && c.now >= S.answerDeadline) { timeoutFor = S.answerDeadline; sound.play('timeout'); }
  const sig = tickSig(S, pid, c);
  if (sig !== lastSig) { lastSig = sig; draw(); }
}, 100);

let toastTimer;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3000);
}

// any tap unlocks audio (covers a refresh, where nobody tapped Join)
window.addEventListener('pointerdown', () => sound.unlock(), { once: true });

// Refresh or shared link with ?room= and a saved name → straight back in.
const startCode = cleanCode(qs.get('room'));
if (startCode && store.get('bz.name')) join(startCode); else showJoin();
</script>
</body>
</html>
