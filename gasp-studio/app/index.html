<title>GASP Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: writers'-room split — script editor left, the "doctor" panel right with a 9:16 timeline ruler; stacks on phones. */
:root{
  --bg:#f6f2f4; --paper:#fffdfe; --ink:#231a20; --muted:#6f5f68; --line:#e4d9df;
  --accent:#d7305f; --accent-ink:#fff; --accent-soft:#fbe4ea;
  --good:#1f8a5a; --warn:#b7791f; --bad:#c62f3b; --tip:#4a5fc1;
  --good-soft:#dcf2e6; --warn-soft:#fbeed3; --bad-soft:#f9dcdf; --tip-soft:#e0e5fb;
  --display:"Syne",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17121a; --paper:#201923; --ink:#f2e9ee; --muted:#a893a0; --line:#3a2d36;
  --accent:#ff5c87; --accent-ink:#1b0810; --accent-soft:#3a1824;
  --good:#5fd39a; --warn:#f0b64a; --bad:#ff7079; --tip:#8fa3ff;
  --good-soft:#163726; --warn-soft:#3b2d12; --bad-soft:#3f1a1f; --tip-soft:#202a4e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121a; --paper:#201923; --ink:#f2e9ee; --muted:#a893a0; --line:#3a2d36;
  --accent:#ff5c87; --accent-ink:#1b0810; --accent-soft:#3a1824;
  --good:#5fd39a; --warn:#f0b64a; --bad:#ff7079; --tip:#8fa3ff;
  --good-soft:#163726; --warn-soft:#3b2d12; --bad-soft:#3f1a1f; --tip-soft:#202a4e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:none;line-height:1.45;overflow:hidden;min-height:38px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f[data-tip],summary[data-tip] h2,[data-tip]{cursor:help}
label.f[data-tip]{text-decoration:underline dotted var(--line);text-underline-offset:3px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
label.f>*{font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}

header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
header.top h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
.save{font-size:12px;color:var(--muted);font-family:var(--mono)}

nav.tabs{display:flex;flex-wrap:wrap;gap:4px 3px;padding-block:10px 0;border-bottom:1px solid var(--line)}
nav.tabs button{white-space:nowrap;border:1px solid transparent;border-bottom:none;background:transparent;color:var(--muted);padding:6px 9px;border-radius:8px 8px 0 0;font-weight:500;position:relative;font-size:13px}
nav.tabs button.ep{padding:6px 7px;font-family:var(--mono);font-size:12px}
nav.tabs button .pip{margin-left:4px;width:7px;height:7px}
nav.tabs button.active{background:var(--paper);color:var(--ink);border-color:var(--line);margin-bottom:-1px}
nav.tabs button .pip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
nav.tabs button.add{color:var(--accent);font-weight:600}

.wrap{display:block;padding-block:16px}
.editor{max-width:980px}
.editor{min-width:0}
aside.doctor{position:fixed;top:calc(var(--hh,70px) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(400px,100vw);min-width:0;background:var(--paper);border-left:1px solid var(--line);padding:14px max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) 14px;overflow:auto;z-index:14;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
aside.doctor[hidden]{display:none}
@media (min-width:901px){body.doc-open .wrap{margin-right:420px}body.chat-open .wrap{margin-right:calc(var(--cw,420px) + 20px)}body.doc-open.chat-open .chatpanel{right:400px}body.doc-open.chat-open .wrap{margin-right:calc(var(--cw,420px) + 420px)}}
.chatgrip{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:col-resize;background:transparent}
.chatgrip:hover,.chatgrip.on{background:var(--accent-soft)}
@media (max-width:900px){.chatgrip{display:none}}
.docfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(64px,calc(64px + env(safe-area-inset-bottom,0px)));z-index:15;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.15);display:flex;gap:8px;align-items:center}
.docfab .cnt{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px}
.docfab .cnt.ok{background:var(--good)}
.docfab[hidden]{display:none}
.dochead{display:flex;align-items:center;gap:8px}
.dochead button{margin-left:auto}
aside.doctor h2{font-size:15px;display:flex;align-items:center;gap:8px}
.score{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl{margin:10px 0 12px}
.tl svg{width:100%;height:auto;display:block}
.findings{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.findings li{display:grid;grid-template-columns:8px 1fr;gap:8px;padding:7px 9px;border-radius:7px;font-size:13px;line-height:1.4;background:var(--tip-soft)}
.findings li::before{content:"";width:8px;border-radius:4px;background:var(--tip);align-self:stretch}
.findings li.bad{background:var(--bad-soft)}.findings li.bad::before{background:var(--bad)}
.findings li.warn{background:var(--warn-soft)}.findings li.warn::before{background:var(--warn)}
.findings li.good{background:var(--good-soft)}.findings li.good::before{background:var(--good)}
.findings li b{font-weight:600}
.findings li .at{font-family:var(--mono);font-size:11px;color:var(--muted);display:block}
.findings li a{color:inherit;text-decoration:underline dotted;cursor:pointer}
.doc-sec{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.doc-sec h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.claude-out{font-size:13px;white-space:pre-wrap}
.claude-out .iss{border-left:3px solid var(--warn);padding:4px 8px;margin:6px 0;background:var(--warn-soft);border-radius:0 6px 6px 0}
.claude-out .iss.high{border-color:var(--bad);background:var(--bad-soft)}
.claude-out .iss.low{border-color:var(--tip);background:var(--tip-soft)}
.claude-out .rw{font-family:var(--mono);font-size:12px;margin:6px 0;padding:6px 8px;background:var(--bg);border-radius:6px}
.claude-out .rw s{color:var(--muted)}
.claude-out .rw b{display:block;color:var(--accent)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px}
.card .hint{color:var(--muted);font-size:12px;margin:-4px 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid .wide{grid-column:1/-1;max-width:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cast{display:flex;flex-direction:column;gap:8px}
.cast .member{display:grid;gap:12px 16px;grid-template-columns:200px minmax(0,1fr);align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;position:relative}
.cast .member .port{display:flex;flex-direction:column;gap:6px;width:200px}
.cast .member .port img,.cast .member .port .ph{width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.cast .member .port .ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;border-style:dashed;text-align:center;padding:10px}
.cast .member .port .pl{display:flex;gap:10px;justify-content:center}
.cast .member .port label{font-size:11px;color:var(--accent);cursor:pointer}
.cast .member .port input{display:none}
.cast .member .fields{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr));min-width:0}
.cast .member .fields .w2{grid-column:span 2}
.cast .member .fields .w4{grid-column:1/-1}
.cast .member .pp{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px}
.cast .member .pp details.vp{border-top:none;padding-top:0;margin-top:0}
@media (max-width:760px){.cast .member{grid-template-columns:1fr}.cast .member .port{width:100%;flex-direction:row;align-items:flex-start}.cast .member .port img,.cast .member .port .ph{width:140px}.cast .member .port .pl{flex-direction:column;justify-content:flex-start}.cast .member .fields{grid-template-columns:1fr 1fr}.cast .member .fields .w2{grid-column:span 2}}
.cast .member textarea{min-height:34px}


.blocks{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.blk.flag{border-color:var(--warn)}
.blk.flagbad{border-color:var(--bad)}
.blk .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:6px}
.blk .t b{display:block;color:var(--ink);font-size:13px}
.blk .kind{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.blk .body{display:grid;gap:8px;min-width:0}
.blk .body .r2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.blk .body .r3{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
.blk .body .r4{display:grid;gap:8px;grid-template-columns:1.4fr .8fr 1fr 1fr .7fr}
.blk .body .r2 .sub b{color:var(--accent)}
@media (max-width:600px){.blk{grid-template-columns:44px 1fr}.blk .ops{grid-column:1/-1;flex-direction:row}.blk .body .r3,.blk .body .r4{grid-template-columns:1fr 1fr}}
.blk .ops{display:flex;flex-direction:column;gap:4px}
.blk .ops button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;width:28px;height:26px;padding:0;font-size:12px}
.blk .ops button:hover{color:var(--accent);border-color:var(--accent)}
.blk.line .dlg{font-family:var(--mono);font-size:14px}
.blk .wc{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.blk .wc.over{color:var(--bad)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.beatsel{font-size:12px}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--paper);border-radius:12px;padding:16px;max-width:720px;width:100%;max-height:85vh;overflow:auto}
.modal .box h2{font-size:16px;margin-bottom:8px}
.modal textarea{font-family:var(--mono);font-size:12px;min-height:260px}
.toast{position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
.chatpanel{position:fixed;top:calc(var(--hh,70px) + env(safe-area-inset-top,0px));right:0;bottom:0;width:min(var(--cw,420px),100vw);background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:15;padding:10px max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) 12px;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.chatpanel[hidden],.chatfab[hidden]{display:none}
.chathead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.chathead b{font-family:var(--display);font-size:15px}
.chathead .sub{flex-basis:100%;font-size:11px}
.chathead button{margin-left:auto}
.chat{display:flex;flex-direction:column;gap:8px;flex:1;overflow:auto;padding:8px 2px;min-height:0}
.chatfoot{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.chatfoot textarea{max-height:140px;overflow:auto}
.chatfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}

.msg{max-width:94%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.msg span{display:block}
.msg.user{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px}
.lib{width:230px;border-right:1px solid var(--line);padding:12px 12px 12px 0;align-self:start;position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow:auto}
.lib.closed{width:auto;padding-right:8px}
.lib h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lib h2 .spacer{flex:1}
.lib ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lib li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.lib li:hover{border-color:var(--line)}
.lib li.active{background:var(--accent-soft);border-color:var(--accent)}
.lib li img{width:28px;height:38px;object-fit:cover;border-radius:3px;background:var(--line);flex:none}
.lib li .ph{width:28px;height:38px;border-radius:3px;background:var(--line);flex:none}
.lib li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}
.lib li .ct{font-family:var(--mono);font-size:10px;color:var(--muted)}
.lib li .del{opacity:0;border:none;background:transparent;color:var(--muted);padding:0 2px}
.lib li:hover .del{opacity:1}
.mbar{display:none}
@media (max-width:900px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .shell{display:block}
  header.top{gap:8px;padding-block:10px 8px}
  header.top h1{font-size:19px}
  header.top .sub{display:none}
  header.top .btn{padding:6px 9px;font-size:12px}
  #btnReview,#btnChat,#btnDoc,#btnKey{display:none}
  #btnGuide{padding:6px 8px}
  .save{font-size:11px}
  .lib{position:fixed;inset:0 auto 0 0;height:100dvh;align-self:auto;width:min(300px,86vw);max-height:none;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:14px 12px calc(70px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:18;box-shadow:8px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s}
  .lib.closed{transform:translateX(-105%)}
  body.lib-open .lib{transform:none}
  .lib.closed>#libToggle{display:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:17}
  .wrap{display:block;padding-block:10px}
  aside.doctor{display:none;position:static;max-height:none;border:none;padding:0;background:transparent;box-shadow:none;width:auto}
  .docfab{display:none}
  body.pane-doctor main.editor{display:none}
  body.pane-doctor aside.doctor{display:block!important}
  body.pane-doctor nav.tabs{display:flex}
  .chatpanel{top:auto;height:calc(100dvh - 64px - env(safe-area-inset-bottom,0px));width:100vw;border-left:none;box-shadow:none;padding-bottom:10px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .chatfab{display:none}
  .mbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line);z-index:19}
  .mbar button{border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
  .mbar button b{font-size:18px;line-height:1;font-weight:400}
  .mbar button.active{color:var(--accent);background:var(--accent-soft)}
  .mbar button .cnt{position:absolute;margin-left:28px;margin-top:-4px;font-size:9px;background:var(--bad);color:#fff;border-radius:999px;padding:0 5px;font-family:var(--mono)}
  .blk{grid-template-columns:40px 1fr}
  .blk .ops{grid-column:1/-1;flex-direction:row}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.cover{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cover img{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);max-width:100%}
.cover .ph{width:120px;aspect-ratio:2/3;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:8px}
.vp{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.vp summary{cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.vp summary .spacer{flex:1}
.vp textarea{font-family:var(--mono);font-size:12px;margin-top:6px}
.vp .row{margin-top:6px}
.gal{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.gal summary{cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
.gal summary::-webkit-details-marker{display:none}
.gal .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gal .th{position:relative;width:84px;height:112px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.gal .th img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gal .th button{position:absolute;top:2px;right:2px;border:none;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:20px;height:20px;font-size:11px;padding:0;cursor:pointer}
.gal .th .star{left:2px;right:auto}
.gal .add{width:84px;height:112px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:12px;cursor:pointer}
.gal .add input{display:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:40;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:94vh;object-fit:contain}
.locs{display:flex;flex-direction:column;gap:8px}
.loc{display:grid;gap:12px 16px;grid-template-columns:200px minmax(0,1fr);align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px}

 choice:{label:"Choice (stance)",subs:["two-way","three-way","timed (auto-picks on expiry)"],dur:8,tip:"The meaningful layer. Options set flags and move meters; a premium third option is the bolder version of a free one and sets the same story flag."},

 choice:"A full-screen pause on the last frame. Two or three option cards slide up from the bottom third, each one line of text; a premium card shows a gem icon and price. A thin timer bar runs across the top if a window is set; on expiry the first option auto-selects. Selection plays a short confirm animation, sets the option's flag and meter delta, then the next shot plays. The option taken is logged for the collection screen and the flowchart.",
 premium:"Identical presentation to a choice, with the premium card highlighted (gem icon, price, a subtle glow). Tapping it opens the spend confirm; a successful spend plays the premium shot sequence and sets the same story flag as its free sibling plus a heat/status flag. If the player cancels, the free cards remain and nothing is lost.",
 outfit:"A wardrobe overlay on the current frame: three look cards, the character re-rendered in each. One is free; the others show a gem price. The chosen look persists for the rest of the season on every shot that character appears in (one extra costume state per look). Other characters may comment on the chosen look via a conditioned line.",

/* ---------- state ---------- */
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
let LIB=null, S=null, active="premise", db=null, sampleFn=null, downloads=null, saveTimer=null, libOpen=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=t=>(String(t||"").trim().match(/\S+/g)||[]).length;
const lineDur=t=>Math.max(1.5,words(t)/2.6+0.6);
const blockDur=b=>b.kind==="line"?lineDur(b.text):b.kind==="sfx"?(+b.dur||1):b.kind==="ix"?(+b.dur||(MECH[b.mech]||{}).dur||8):(+b.dur||4);
const fmt=s=>s.toFixed(0)+"s";

function beats(){if(!S.beats)S.beats={};return S.beats}
function epByNum(n){return S.episodes.find(e=>e.num===n)}
function getBeat(n){const ep=epByNum(n);if(ep)return{logline:ep.summary||"",hook:ep.hookType||"",ep};const b=beats()[n]||{};return{logline:b.logline||"",hook:b.hook||"",ep:null}}
function setBeat(n,patch){const ep=epByNum(n);if(ep){if(patch.logline!=null)ep.summary=patch.logline;if(patch.hook!=null)ep.hookType=patch.hook}else{const b=beats()[n]||(beats()[n]={});Object.assign(b,patch)}}
function createEpisodeFromBeat(n){const b=getBeat(n);const id=Date.now()+n;S.episodes.push({id,num:n,title:"",hookType:b.hook||"",music:"",summary:b.logline||"",blocks:[]});delete beats()[n];return id}
function game(){if(!S.game)S.game={flags:{},meters:[],currencies:[],collectibles:[],sim:[],notes:""};const g=S.game;g.flags=g.flags||{};g.meters=g.meters||[];g.currencies=g.currencies||[];g.collectibles=g.collectibles||[];g.sim=g.sim||[];return g}
function newIx(mech){return{kind:"ix",mech:mech||"choice",sub:"",prompt:"",window:"",fail:"",dur:(MECH[mech||"choice"]||{}).dur||8,beat:"",opts:[{label:"",cost:"free",amt:0,flag:"",meter:"",delta:0,buff:"",outcome:""},{label:"",cost:"free",amt:0,flag:"",meter:"",delta:0,buff:"",outcome:""}]}}
function allIx(){const out=[];[...S.episodes].sort((a,b)=>a.num-b.num).forEach(ep=>ep.blocks.forEach((b,i)=>{if(b.kind==="ix")out.push({ep,i,b})}));return out}
function flagUses(){const m={};allIx().forEach(({ep,i,b})=>(b.opts||[]).forEach(o=>{if(o.flag){const k=o.flag.trim().toUpperCase();(m[k]=m[k]||{set:[],ref:[]}).set.push(`Ep ${ep.num} #${i+1}`)}}));[...S.episodes].forEach(ep=>ep.blocks.forEach((b,i)=>{if(b.cond){const k=b.cond.replace(/^!/,"").trim().toUpperCase();if(k){(m[k]=m[k]||{set:[],ref:[]}).ref.push(`Ep ${ep.num} #${i+1}`)}}}));return m}
function gemTotal(ep){return ep.blocks.filter(b=>b.kind==="ix").reduce((n,b)=>n+(b.opts||[]).filter(o=>o.cost==="gems").reduce((m,o)=>m+(+o.amt||0),0),0)}
function castByRole(role){return (S.premise.cast||[]).filter(c=>c.role===role).map(c=>c.name.trim()).filter(Boolean)}
function mentions(text,names){const t=String(text||"").toLowerCase();return names.some(n=>n&&t.includes(n.toLowerCase()))}

/* ---------- analysis ---------- */
function timeline(ep){let t=0;return ep.blocks.map(b=>{const d=blockDur(b);const r={start:t,end:t+d,b};t+=d;return r})}

function analyzeEpisode(ep,idx){
  const out=[];const F=(level,text,at,bi)=>out.push({level,text,at,bi});
  const tl=timeline(ep);const total=tl.length?tl[tl.length-1].end:0;
  const isEp1=ep.num===1;const g=S.premise.gates||{};
  const FL=castByRole("FL"),ML=castByRole("ML"),VIL=castByRole("villain");
  const castNames=(S.premise.cast||[]).map(c=>c.name.trim().toLowerCase()).filter(Boolean);
  const spoken=ep.blocks.filter(b=>b.kind==="line").reduce((n,b)=>n+words(b.text),0);
  if(!ep.blocks.length){F("tip","Empty episode. Start with the shot the ad will be cut from: the most outrageous image of this episode, inside the first 3 seconds.");return {out,total,spoken,tl}}
  // first conflict
  const firstConf=tl.find(r=>["provocation","threat"].includes(r.b.beat)||(r.b.kind==="line"&&mentions(r.b.speaker,VIL)));
  if(!firstConf)F("bad","No conflict yet. The villain's provocation goes in the first 15 seconds (first 6 seconds in Episode 1).");
  else if(firstConf.start>(isEp1?6:15))F("bad",`Villain established too late (first provocation at ${fmt(firstConf.start)}). Move it inside the first ${isEp1?6:15} seconds.`,fmt(firstConf.start),tl.indexOf(firstConf));
  else F("good",`Conflict lands at ${fmt(firstConf.start)}.`);
  if(isEp1){
    const first=tl[0].b;
    if(first.kind!=="shot"||["calm","exposition",""].includes(first.beat||""))F("bad","Episode 1 must open on the season's most outrageous image. No establishing shot, no calm: a slap, a bed, a coffin.",fmt(0),0);
    const flIn=ep.blocks.some(b=>mentions(b.speaker,FL)||mentions(b.chars,FL));
    const mlIn=ep.blocks.some(b=>mentions(b.speaker,ML)||mentions(b.chars,ML));
    if(!flIn)F("bad","The female lead has not appeared. Both leads are on screen in Episode 1.");
    if(!mlIn)F("bad","The male lead has not appeared. Both leads are on screen in Episode 1, and his power is hinted, not explained.");
    const q=tl.find(r=>r.start<=10&&(["threat","realize","choice"].includes(r.b.beat)||(r.b.kind==="line"&&/\?/.test(r.b.text))));
    if(!q)F("warn","No central question by 10 seconds. Who is he? What is she hiding? What happens at midnight?");
    const sat=tl.find(r=>PAY_BEATS.has(r.b.beat));
    if(!sat)F("bad","No satisfaction beat. Episode 1 pays a small reversal by the 60-second mark.");
    else if(sat.start>60)F("warn",`First reversal at ${fmt(sat.start)}. Aim for a small payout by 60s.`,fmt(sat.start),tl.indexOf(sat));
    const hid=tl.find(r=>r.b.beat==="hidden"||r.b.beat==="reveal");
    if(!hid)F("warn","No flash of hidden power (a black card, wolf eyes, a phone call: 'Sir, the board is waiting').");
  }
  // turns every 30s
  let lastBeat=null,lastT=0;
  tl.forEach(r=>{const b=r.b.beat||"";if(b&&b!==lastBeat){if(lastBeat!==null&&r.start-lastT>35)F("warn",`No turn between ${fmt(lastT)} and ${fmt(r.start)}. Something changes hands every ~30 seconds.`,fmt(lastT));lastBeat=b;lastT=r.start}});
  if(lastBeat!==null&&total-lastT>40)F("warn",`Last ${fmt(total-lastT)} run on one beat. Add a turn before the button.`);
  // ending
  const last=ep.blocks[ep.blocks.length-1];
  if(!HOOK_BEATS.has(last.beat||"")||["calm","exposition"].includes(last.beat))F("bad","Episode ends on a resolved or calm beat. Cut one beat earlier: end on the question, never on the answer.",fmt(total),ep.blocks.length-1);
  else F("good","Ends on an unresolved hook.");
  if(!ep.hookType)F("warn","Pick the end-hook type for the outline (identity / emotion / realization / threat).");
  if(idx>0){const prev=S.episodes[idx-1];if(prev.hookType&&prev.hookType===ep.hookType)F("warn",`Same hook type as Episode ${prev.num} (${ep.hookType}). Rotate: no two consecutive episodes end the same way.`)}
  // length
  if(total<60)F("warn",`Running ${fmt(total)}. Episodes run 60–120 seconds.`);
  else if(total>120)F("warn",`Running ${fmt(total)}. Over 120 seconds: split it or cut.`);
  if(spoken&&spoken<180)F("tip",`${spoken} spoken words. The format runs 180–500.`);
  if(spoken>500)F("warn",`${spoken} spoken words. Over 500: trim.`);
  // dialogue
  ep.blocks.forEach((b,i)=>{
    if(b.kind==="line"){
      const w=words(b.text);
      if(w>20)F("warn",`${w}-word line for ${b.speaker||"?"}. Lines stay under 20 words, one idea each.`,`#${i+1}`,i);
      if(HEDGES.test(b.text))F("warn",`Hedge in ${b.speaker||"?"}'s line ("${(b.text.match(HEDGES)||[""])[0]}"). Characters say what they feel, without modifiers.`,`#${i+1}`,i);
      if(b.speaker&&!castNames.includes(b.speaker.trim().toLowerCase()))F("tip",`${b.speaker} is not in the cast bible. Add them so every shot generates the same face.`,`#${i+1}`,i);
      if(!b.voice)F("tip",`No voice direction on ${b.speaker||"?"}'s line. Emotion, pace and intensity drive the TTS.`,`#${i+1}`,i);
    }
    if(b.beat==="exposition")F("warn","Exposition beat. Deliver it inside conflict: an insult that states the backstory, a document slapped on a desk, an overheard call.",`#${i+1}`,i);
    if(b.beat==="calm"&&ep.blocks[i-1]&&ep.blocks[i-1].beat==="calm")F("warn","Two calm beats in a row. If two people agree for more than two lines, someone walks in.",`#${i+1}`,i);
    if(b.kind==="shot"&&(b.loc||"").trim()&&!locMatch(b.loc))F("tip",`"${b.loc}" isn't one of the locations. Add it, or add it as an alias or sub-area on the Locations card.`,`#${i+1}`,i);
    if(b.kind==="shot"&&!b.frame)F("tip","Shot has no framing. 9:16 wants faces: ECU/CU/MCU, depth-stacked 2-shots, prop inserts.",`#${i+1}`,i);
    if(b.beat==="heat"&&COERCE.test((b.action||"")+" "+(b.text||"")))F("warn","Coerced heat (drugged or unconscious). The only hard limit on heat is that it is chosen and mutual; keep the steam, change the consent.",`#${i+1}`,i);
    if(b.kind==="shot"&&KNEEL.test(b.action||"")&&mentions(b.action,FL.concat(ML))&&b.beat!=="reversal")F("tip","Lead kneeling or begging. The hero is never truly beaten; only the disguise is humiliated.",`#${i+1}`,i);
  });
  // reaction shot + idiot logic after every reveal
  ep.blocks.forEach((b,i)=>{if(b.beat!=="reveal"&&b.beat!=="reversal")return;if(i>=ep.blocks.length-2)return;const nxt=ep.blocks.slice(i+1,i+4);
    if(b.kind==="line"&&!nxt.some(x=>x.kind==="shot"))F("warn",`Reveal at #${i+1} has no reaction shot after it. Write the face receiving the news; reactions are half the format.`,`#${i+1}`,i);
    if(b.beat==="reveal"&&VIL.length&&!nxt.some(x=>x.kind==="line"&&mentions(x.speaker,VIL)))F("tip",`Reveal at #${i+1}: let a villain refuse to believe it. Idiot logic is what lets the slap repeat.`,`#${i+1}`,i)});
  // mini payout / near-miss window
  if(total>=70&&!tl.some(r=>r.start>=40&&r.start<=80&&["reversal","reveal","hidden","threat","heat"].includes(r.b.beat||"")))F("tip","Nothing lands between 40s and 80s. Every episode pays a mini slap or a near-miss in that window.");
  // cold re-entry
  if(!isEp1&&["exposition","calm"].includes(ep.blocks[0].beat||""))F("warn","Opens on exposition or calm. Resume inside the last cliff or on a new provocation; never recap.",fmt(0),0);
  if(isEp1&&ep.blocks[0].kind==="shot"&&(+ep.blocks[0].dur||4)>3)F("warn",`Opening shot runs ${ep.blocks[0].dur}s. The ad image lands in 3 seconds; cut faster.`,fmt(0),0);
  // emotions at 11
  {const ls=ep.blocks.filter(b=>b.kind==="line"&&b.intensity);if(ls.length>=4){const avg=ls.reduce((a,b)=>a+(+b.intensity||0),0)/ls.length;if(avg<6)F("tip",`Average line intensity ${avg.toFixed(1)}/10. Emotions run at 11 here; raise the stakes in the lines.`)}}
  // villain downfall scheduled on this episode
  (S.premise.cast||[]).filter(c=>c.role==="villain"&&+c.downfall===ep.num).forEach(c=>{const named=ep.blocks.some(b=>mentions(b.chars,[c.name])||mentions(b.speaker,[c.name])||mentions(b.action,[c.name]));if(!named)F("warn",`${c.name}'s downfall is scheduled here but they are not in the episode.`);else if(!ep.blocks.some(b=>b.beat==="reversal"))F("warn",`${c.name}'s downfall episode has no reversal beat. Public, witnessed, visible collapse.`)});
  // finale
  if(ep.num===g.total){F("tip","Finale: one arena, every villain's public collapse biggest last, the secret spoken by the strongest doubter, then the reward, one thread left open.");
    VIL.forEach(v=>{if(!ep.blocks.some(b=>mentions(b.chars,[v])||mentions(b.speaker,[v])||mentions(b.action,[v])))F("warn",`${v} is missing from the finale. No villain survives unslapped.`)})}
  // ---- playable checks
  {const ixs=ep.blocks.map((b,i)=>({b,i,t:tl[i]})).filter(x=>x.b.kind==="ix");const hasIx=ixs.length>0;
   if(!hasIx)F("tip","No interactions. A playable episode wants a stance choice inside 20s and 2–4 interactions in all.");
   else{const first=ixs[0];if(first.t.start>20)F("warn",`First interaction at ${fmt(first.t.start)}. Put a choice inside the first 20 seconds; it teaches that choices matter before skill is asked for.`,fmt(first.t.start),first.i);
     if(first.b.mech!=="choice"&&first.b.mech!=="premium")F("tip","First interaction is not a stance choice. Lead with a choice, then ask for skill.",`#${first.i+1}`,first.i);
     ixs.forEach(({b,i,t})=>{const opts=b.opts||[];
       if(opts.length<2&&!["collect","clue","sim"].includes(b.mech))F("warn",`Interaction #${i+1} has fewer than two options.`,`#${i+1}`,i);
       if(opts.some(o=>!o.label))F("tip",`Interaction #${i+1} has an unnamed option.`,`#${i+1}`,i);
       const prem=opts.filter(o=>o.cost==="gems");const free=opts.filter(o=>o.cost==="free");
       if(prem.length&&!free.length)F("bad",`Interaction #${i+1}: every option costs gems. The free path must always continue.`,`#${i+1}`,i);
       prem.forEach(o=>{if(o.flag&&!free.some(f=>f.flag===o.flag))F("warn",`Premium option "${o.label||"?"}" sets ${o.flag} but no free sibling does. Gems buy more of the fantasy, never the plot.`,`#${i+1}`,i);if(!o.amt)F("tip",`Premium option "${o.label||"?"}" has no gem amount.`,`#${i+1}`,i)});
       if((b.mech==="qte"||b.mech==="minigame")&&!b.fail&&!opts.some(o=>/fail|tier c|spook|miss|black/i.test(o.label+" "+o.outcome)))F("warn",`#${i+1} ${MECH[b.mech].label} has no fail-forward outcome. Failure is a scene, never a retry wall.`,`#${i+1}`,i);
       if(opts.some(o=>!o.outcome))F("tip",`#${i+1}: give every option a one-line "what happens".`,`#${i+1}`,i);
       if(t.start>total-10&&ep.num!==g.g1&&i<ep.blocks.length-1)F("warn",`Interaction #${i+1} sits in the last 10 seconds. Only the paywall choice belongs there.`,`#${i+1}`,i)});
     for(let k=1;k<ixs.length;k++){const between=ep.blocks.slice(ixs[k-1].i+1,ixs[k].i);if(!between.some(x=>x.kind==="line"||x.kind==="shot"))F("warn",`Interactions #${ixs[k-1].i+1} and #${ixs[k].i+1} are back to back. Put a consequence line or shot between choices.`,`#${ixs[k].i+1}`,ixs[k].i)}
     ixs.forEach(({b,i})=>(b.opts||[]).forEach(o=>{if(!o.flag)return;const echoed=ep.blocks.slice(i+1).some(x=>x.cond&&x.cond.replace(/^!/,"").trim().toUpperCase()===o.flag);const later=S.episodes.some(e=>e.num>ep.num&&e.blocks.some(x=>x.cond&&x.cond.replace(/^!/,"").trim().toUpperCase()===o.flag));if(!echoed&&!later)F("tip",`${o.flag} (set at #${i+1}) is never used. Condition a shot or line on it within 60s and again in a later episode.`,`#${i+1}`,i)}));
     const gems=gemTotal(ep);if(gems>120)F("warn",`${gems} gems of options in one episode. Keep an episode's sinks under ~120.`);
     if(ep.num===g.g1){const last=ixs[ixs.length-1];if(!last||!last.b.opts.some(o=>o.cost==="gems")||total-last.t.start>30)F("warn","Paywall episode: the premium choice should land about 20s before the cut.")}
     if(isEp1&&ixs.length>seasonModel().maxIx1)F("tip",`Episode 1 has more than ${seasonModel().maxIx1} interactions. Two or three teach the grammar; save the rest.`)}}

  for(let i=0;i<ep.blocks.length;i++){if(ep.blocks[i].kind!=="shot")continue;const sp=new Set();for(let j=i+1;j<ep.blocks.length&&ep.blocks[j].kind!=="shot";j++){if(ep.blocks[j].kind==="line"&&ep.blocks[j].speaker)sp.add(ep.blocks[j].speaker.trim())}if(sp.size>1)F("tip",`Shot #${i+1} covers ${sp.size} speakers. For lip sync, one speaker per shot: cut on the line change.`,`#${i+1}`,i)}
  // locations
  const locs=new Set(ep.blocks.filter(b=>b.kind==="shot"&&b.loc).map(b=>b.loc.trim().toLowerCase()));
  if(locs.size>2)F("warn",`${locs.size} locations in one episode. Keep it to one or two.`);
  if(!ep.music)F("tip","No music cue. Sting on the slap, drone under the threat, swell on the kiss.");
  if(!ep.summary)F("tip","Write the one-line outline: 'Villain does X to FL in front of Y; FL answers with Z; cut on Q.'");
  // gates
  if(ep.num===g.g1){F("tip",`This is the paywall episode. Biggest cliff of the season, cut mid-motion: the secret about to be exposed to the person who matters most, an impossible choice, or heat interrupted by the worst possible person.`);
    if(!["reveal","heat","realize","choice"].includes(last.beat||""))F("bad","Paywall episode must end on a reveal-in-motion, a choice, or interrupted heat.");
    if(!ep.blocks.some(b=>b.beat==="reversal"))F("warn","Paywall episode has no face slap. Villain's most arrogant public claim lands here, right before the cut.")}
  if(ep.num===g.g2)F("tip","Second gate: change the board. ML tied to the original wound, a pregnancy, the villain gains leverage, or the secret goes public.");
  if(ep.num===g.g3)F("tip","Third gate / all-is-lost: the villain wins a round that looks total. Only the disguise falls.");
  // payout cadence
  if(idx>=2){const recent=S.episodes.slice(idx-2,idx+1);if(!recent.some(e=>e.blocks.some(b=>PAY_BEATS.has(b.beat||""))))F("warn","No slap or reveal in three episodes. Pay a small beat every 2–3 episodes.")}
  if(ep.num>=2&&ep.num<=9){const n=S.episodes.filter(e=>e.num<=ep.num).reduce((c,e)=>c+e.blocks.filter(b=>b.beat==="reversal").length,0);if(ep.num>=5&&n<2)F("tip",`${n} reversals so far. At least three by Episode 9, each bigger than the last.`)}
  if(ep.num>=5&&ep.num<=7&&!S.episodes.filter(e=>e.num<=ep.num).some(e=>e.blocks.some(b=>b.beat==="heat")))F("tip","No heat beat yet. The interrupted near-kiss lands by Episode 5–7.");
  return {out,total,spoken,tl};
}

function seasonModel(){const g=S.premise.gates||{};const total=+g.total||60;
  if(total<=15)return{kind:"pilot",label:"pilot / short playable (≤15 eps)",g1:[2,4],g2:[Math.round(total*.45),Math.round(total*.6)],g3:[Math.round(total*.7),Math.round(total*.9)],nearKiss:Math.max(2,Math.round(total*.3)),night:[Math.round(total*.5),Math.round(total*.8)],revBy:Math.max(3,Math.round(total*.35)),revN:2,maxIx1:3};
  if(total<=30)return{kind:"short",label:"short season (16–30 eps)",g1:[4,8],g2:[Math.round(total*.45),Math.round(total*.6)],g3:[Math.round(total*.75),Math.round(total*.9)],nearKiss:Math.round(total*.25),night:[Math.round(total*.45),Math.round(total*.7)],revBy:Math.round(total*.3),revN:3,maxIx1:4};
  return{kind:"full",label:"full season (40–100 eps)",g1:[8,16],g2:[Math.round(total*.4),Math.round(total*.55)],g3:[Math.round(total*.8),Math.round(total*.93)],nearKiss:7,night:[15,25],revBy:9,revN:3,maxIx1:4}}
function analyzeSeason(){const out=[];const F=(l,t)=>out.push({level:l,text:t});const g=S.premise.gates||{};const total=+g.total||60;
  let empty=[],lastHook="",same=0,sincePay=0;const PAYH=new Set(["reversal","identity"]);
  for(let n=1;n<=total;n++){const b=getBeat(n);if(!b.logline){empty.push(n);continue}
    if(b.hook&&b.hook===lastHook)same++;lastHook=b.hook||lastHook;
    if(PAYH.has(b.hook)||/slap|kneel|reveal|exposed|stammer|humiliat/i.test(b.logline))sincePay=0;else sincePay++;
    if(sincePay===4)F("warn",`No slap or reveal in the lines around Ep ${n}. Pay a small beat every 2–3 episodes.`);
    if(words(b.logline)>40)F("tip",`Ep ${n} line is ${words(b.logline)} words. Keep it to one breath.`)}
  if(empty.length)F(empty.length>total/2?"bad":"warn",`${empty.length} episodes have no line${empty.length<=8?" ("+empty.join(", ")+")":""}.`);
  if(same)F("warn",`${same} place${same>1?"s":""} where consecutive episodes end on the same hook type. Rotate.`);
  [["g1","paywall"],["g2","gate 2"],["g3","gate 3"]].forEach(([k,nm])=>{const n=g[k];if(n&&!getBeat(n).logline)F("bad",`Ep ${n} (${nm}) has no line. Gates carry the biggest cliffs.`)});
  if(!getBeat(1).logline)F("bad","Ep 1 has no line. It is the ad.");
  if(!getBeat(total).logline)F("warn",`Ep ${total} (finale) has no line.`);
  const vil=(S.premise.cast||[]).filter(c=>c.role==="villain"&&c.name.trim());vil.forEach(c=>{const d=+c.downfall;if(d&&getBeat(d).logline&&!getBeat(d).logline.toLowerCase().includes(c.name.toLowerCase()))F("tip",`${c.name}'s downfall is scheduled for Ep ${d} but the line doesn't mention them.`)});
  const L=n=>getBeat(n).logline.toLowerCase();const any=(a,b,re)=>{for(let n=a;n<=b&&n<=total;n++)if(re.test(L(n)))return true;return false};
  if(g.g1&&getBeat(g.g1+1).logline&&!/slap|kneel|reveal|exposed|collapse|stammer|humiliat|pays|drag/i.test(L(g.g1+1)))F("warn",`Ep ${g.g1+1} should pay the paywall cliff fully and publicly before raising the next threat.`);
  const M=seasonModel();
  if(getBeat(M.nearKiss).logline&&!any(2,M.nearKiss,/kiss|almost|near|lips|interrupt/))F("tip",`No near-kiss by Ep ${M.nearKiss} (${M.label}). The heat ladder: glance, touch, interrupted near-kiss early.`);
  if(g.g1&&getBeat(g.g1+2).logline&&!any(g.g1-2,g.g1+3,/kiss/))F("tip",`No kiss around the paywall (Ep ${g.g1-2}–${g.g1+3}).`);
  if(getBeat(M.night[1]).logline&&!any(M.night[0],M.night[1],/night|bed|morning|stay|sleep|together|furs|hide bed/))F("tip",`No night together in Ep ${M.night[0]}–${M.night[1]}; the consequence (pregnancy, photo, witness) is the mid-season engine.`);
  {let rev=0;for(let n=1;n<=M.revBy;n++)if(/slap|kneel|reveal|exposed|stammer|humiliat|card|turns out|secretly|kills|frees|saves/i.test(L(n)))rev++;if(getBeat(M.revBy).logline&&rev<M.revN)F("warn",`${rev} reversals in Ep 1–${M.revBy}. At least ${M.revN} by Ep ${M.revBy}, each bigger than the last.`)}
  if(g.g2&&getBeat(g.g2).logline&&!/pregnan|reveal|exposed|turns out|arrives|returns|leverage|secret|discover|wound|father|mother|family/i.test(L(g.g2)))F("tip",`Ep ${g.g2} (gate 2) should change the board: ML tied to the wound, a pregnancy, the villain gains leverage, the secret goes public.`);
  if(getBeat(total).logline){vil.forEach(c=>{if(!L(total).includes(c.name.toLowerCase()))F("tip",`${c.name} is not in the finale line. Every villain collapses in one arena.`)})}
  const scripted=S.episodes.filter(e=>e.blocks.length).length;F("tip",`${scripted} of ${total} episodes scripted.`);
  return out}
function analyzePremise(){
  const out=[];const F=(level,text)=>out.push({level,text});const p=S.premise;
  if(!p.logline)F("bad","Write the logline. One sentence with the secret, the clock and the witness.");
  if(!p.engine)F("bad","Pick one primary engine. Novelty goes in the skin, never the loop.");
  else if(!ENGINES.includes(p.engine))F("tip",`Engine "${p.engine}" is not in the current list. Re-pick it from the menu.`);
  if(p.title&&!/\b(my|secret|secretly|billionaire|ceo|alpha|luna|mate|reborn|rebirth|divorce|divorced|married|marriage|bride|wife|husband|heiress|boss|don|mafia|ex|revenge|return|forbidden|contract|fake|hidden)\b/i.test(p.title))F("tip","Title isn't in house style. Name the secret or the reversal: \"My [X] Is Secretly a [Y]\", \"Never Divorce a Secret [Y]\", \"Reborn as ___\".");
  if(p.wound&&words(p.wound)<6)F("tip","Make the wound specific and visual (patched but spotless clothes, not just \"poor\"). Contrast is the fuel for the reversal.");
  if(!p.skin)F("warn","Pick one skin (billionaire, alpha, rebirth, system...). One, not three.");
  if(!p.wound)F("warn","State the heroine's wound. It is said out loud in Episode 1.");
  if(!p.asset)F("warn","Give the heroine a hidden asset (identity, skill, foreknowledge, a power).");
  if(!p.mlpower)F("warn","State the male lead's power. He is forbidden and he chooses her.");
  if(!p.mlsecret)F("tip","Give the male lead a secret of his own for the mid-season board change.");
  if(!p.clock)F("warn","Add the ticking clock.");
  if(!p.witness)F("tip","Name the witness character who reacts on camera. Reactions are half the format.");
  const cast=p.cast||[];const roles=r=>cast.filter(c=>c.role===r&&c.name.trim());
  if(!roles("FL").length)F("bad","Cast bible has no female lead (FL).");
  if(!roles("ML").length)F("bad","Cast bible has no male lead (ML).");
  const v=roles("villain");
  if(!v.length)F("bad","No villain in the cast. Pure malice, trouble-making logic, refuses to believe the reveal.");
  else if(v.length<2)F("tip","One villain. Each defeat should reveal a bigger one: plan at least two.");
  v.forEach(c=>{if(!c.downfall)F("warn",`${c.name} has no scheduled public downfall episode. No villain survives unslapped.`)});
  cast.forEach(c=>{if(c.name.trim()&&!c.look)F("tip",`${c.name}: add a locked look (face, hair, wardrobe, prop) so generation stays consistent.`);
    const n=(c.costumes||"").split(",").map(s=>s.trim()).filter(Boolean).length;if(n>5)F("warn",`${c.name} has ${n} costume states. Keep it under five per character.`)});
  if(cast.filter(c=>c.name.trim()).length>8)F("warn","More than 8 principals. Cut: fewer recurring faces, better consistency.");
  const arenas=(p.arenas||"").split(",").map(s=>s.trim()).filter(Boolean).length;
  if(arenas>4)F("warn",`${arenas} locations. Two to four hub sets.`);
  if(arenas===0)F("tip","List 2–4 hub locations (ballroom, suite, rooftop). Reuse angles.");
  const g=p.gates||{};
  {const M=seasonModel();const inR=(v,r)=>v>=r[0]&&v<=r[1];
   if(!inR(g.g1,M.g1))F("warn",`Gate 1 (paywall) for a ${M.label} normally sits at episode ${M.g1[0]}–${M.g1[1]}.`);
   if(g.g2&&!inR(g.g2,M.g2))F("tip",`Gate 2 for a ${M.label} usually lands around episode ${M.g2[0]}–${M.g2[1]}.`);
   if(g.g3&&!inR(g.g3,M.g3))F("tip",`Gate 3 for a ${M.label} usually lands around episode ${M.g3[0]}–${M.g3[1]}.`);
   if(!(g.g2>g.g1&&g.g3>g.g2&&g.total>=g.g3))F("warn","Gates must climb: gate 1 < gate 2 < gate 3 ≤ total episodes.");
   if(M.kind==="pilot")F("tip","Pilot model: the paywall is the chapter unlock after the free taste; the biggest cliff still goes there, and a premium choice sits 20s before it. Gates 2 and 3 are chapter unlocks, not separate monetization beats.");
   else if(g.total&&(g.total<40||g.total>100))F("tip","Full seasons run 60–100 episodes (some newer titles 40).")}
  if(p.engine2&&p.engine2===p.engine)F("tip","Secondary engine is the same as the primary. Pick a different one for the mid-season turn.");
  return out;
}
function loglineChecks(){const l=(S.premise.logline||"").toLowerCase();return{

  clock:/before|until|in (one|two|three|\d+) (day|hour|week|night)|by (midnight|dawn|the wedding)|deadline|days|hours|tonight|countdown/.test(l),
  witness:/in front of|public|everyone|watch|wedding|gala|banquet|board|town|crowd|live|stream|on camera/.test(l)}}

const TIPS={
"Title":"House style names the secret or the reversal so the thumbnail sells the hook: \"My [X] Is Secretly a [Y]\", \"Never Divorce a Secret [Y]\", \"Reborn as ___\".",
"Written by":"The byline on the export title page. Set per story, so a pen name can differ between projects.",
"Logline":"One sentence with three parts: the SECRET (what inverts her status or his), the CLOCK (the deadline that forces the reveal), and the WITNESS (the public arena where it blows up). If you can't say it in one breath, it isn't ready.",
"Primary engine":"The emotional loop the whole season repeats: humiliation → hidden power → public reversal. Pick one. Everything new goes in the skin, never the loop.",
"Secondary engine":"A second engine that takes over around the mid-season board change (~Ep 30) so the back half feels new without changing the show.",
"Skin":"The genre costume on top of the engine: billionaire, alpha/Luna, mafia, rebirth, system… One skin. Novelty is allowed here because the reward loop underneath stays classical.",
"Ticking clock":"The deadline that makes the secret unstable: the wedding in 3 days, the will read at midnight, the full moon. The clock is why she can't just walk away.",
"Heroine's wound":"The injustice she carries, said OUT LOUD by a villain in Episode 1 (\"You're the maid's daughter and you always will be\"). Make it specific and visual: patched-but-spotless clothes beats \"poor\". The lower and more sympathetic the start, the bigger the reversal pays.",
"Heroine's hidden asset":"What she secretly has that inverts her status: a bloodline, foreknowledge, a skill, a document, a power. The audience learns it before the villain does.",
"Male lead's power":"Why he is forbidden and formidable: CEO, alpha, don, heir. He chooses her over everyone, and it costs him something visible.",
"Male lead's secret":"His own hidden thing, held back for the mid-season board change: he's tied to her original wound, he was reborn too, he's the real heir.",
"Witness character":"The friend, assistant or kid who is on camera when reveals land and reacts for the audience. Reactions are half the format; this is who supplies them. Can also be threatened or turned in the back half.",
"Locked look (architecture":"What makes this set recognizable shot to shot: layout, materials, dressing, light source, the one close-up detail. Pulled into every video prompt set there.",
"Item":"A prop that carries plot: proof, clue, gift, key, keepsake. Locked look goes into every shot prompt that mentions it.",
"Who has it / where it lives":"Track custody: who holds it, where it is lost or found, which option moves it.",
"What it does in the story":"Its job in the loop: what it proves, unlocks or pays off, and when.",
"Cutouts for compositing":"A character image with the background removed (or on a flat green/magenta background the Studio keys out), one per costume state. Full body is required for wide and two-shots and can be cropped; chest-up gives sharper close-ups. The Studio composites these over the location setting for a free animatic.",
"Costume state in this shot":"Which cutout to use for each character here, e.g. Mara: torn dress. Leave blank for the first costume state.",
"Render plan":"How this shot gets made: a composite (cutout over setting, free, no AI), a still, a still with a slow push, animated from the approved still, or animated with lip-sync. Auto picks lip-sync for close-up dialogue, animate for reveal/reversal/heat beats, and still+push for the rest. Approve at the still before animating.",
"Shot audio":"SFX, a sting or silence on this shot, layered over the location ambience.",
"TTS provider":"Where this character's lines are voiced. Stored with the voice id and settings so every line goes to the same voice.",
"Voice id / name":"The provider's voice identifier. Audition a few and lock one.",
"Voice settings":"Stability, style, speed, accent notes: whatever the provider needs to make the voice consistent.",
"Ambience bed":"The background sound of this place, looped under every shot set here. Settings can override it (rain on the deck).",
"Ambience override":"Episode-wide ambience that beats the location bed, for a storm or a party that lasts the whole episode.",
"Weather / condition":"Rain, fog, firelit, after the explosion. With Time it defines a setting of the location, which gets its own reference image on the Locations card and in the video prompt.",
"Settings used in the script":"Every Time + Weather combination the script uses for this location, with the shots that use it. Each gets its own prompt, main image and gallery so night-rain and dawn-clear don\u2019t share a reference.",
"Also called":"Other names the script uses for this place. A shot whose location is an alias, or starts with the name (Yacht stern), files here.",
"Hub locations":"Two to four reusable sets (ballroom, bridal suite, rooftop bar). AI video needs the same room to look the same; every extra set costs consistency.",
"Cover image":"Key art, 2:3 portrait. Shows here, in the story list and on the export title page.",
"Cover image prompt":"An image prompt built from the leads' locked looks, the villain, the first hub location and the skin's mood. Edit it, then paste it into your image generator and upload the result as the cover.",
"Name":"The character's name as it appears in dialogue and shot descriptions. Keep it unique and easy to say.",
"Role":"FL = heroine. ML = the forbidden love interest. Villain = purely malicious, refuses to believe the reveal. Witness = reacts on camera. Other = everyone else.",
"Locked look":"The description pasted into every video prompt so the same face generates every shot: age, face, hair, skin, build, signature outfit, one prop.",
"Voice":"How the TTS should read them: pitch, pace, a tell (\"nasal when scared\"). Used in voice direction and lip-sync prompts.",
"Costume states":"Each distinct outfit, comma-separated, max five. Shots sharing a state can be generated together.",
"Downfall ep":"Villains only: the episode where they collapse in public. No villain survives unslapped; the season doctor checks the line and the script.",
"Reference gallery":"Extra reference images: angles, outfits, expressions, or alternate takes. Click ★ on one to make it the main image. Images are stored with the story, so keep them modest in number.",
"Portrait":"The main reference image for this character. Generate the prompt, make the image, upload it. The gallery below holds more references. Used as the visual anchor for every shot they're in.",
"Gate 1":"The paywall: the last free episode. Usually 8–16 in a full season, 4–8 in a short one, 2–4 in a pilot; the doctor scales its checks to Total episodes. Conversion here decides whether the show lives, so it carries the season's biggest cliff, cut mid-motion.",
"Gate 2":"Second pay point (~Ep 30). Change the board: ML tied to the wound, a pregnancy, the villain gains leverage, the secret goes public.",
"Gate 3":"Third pay point (~Ep 50–55): all is lost. The villain wins a round that looks total. Only the disguise falls; her core stays intact.",
"Total episodes":"Season length. 60–100 is standard; some newer titles run 40.",
"Beat sheet":"One line per episode: Villain does X to FL in front of Y; FL answers Z; cut on Q. Rotate hook types; pay a slap every 2–3 episodes; biggest cliff on the paywall.",
"Number":"Episode position. Gate tags (paywall, gate 2, gate 3, finale) follow the number.",
"Episode title":"Short and hooky; often the button line of the episode.",
"End-hook type":"How the episode cuts: identity (someone kneels, a name is said), emotion (kiss, betrayal, confession), realization (she overhears, finds the document), threat (new villain, deadline, weapon). Rotate so no two consecutive episodes end the same way.",
"Music cue":"Sting on the slap, drone under the threat, swell on the kiss. One line for the composer or music generator.",
"One-line outline":"Same field as the beat sheet line for this episode.",
"Location":"One of the hub sets. One or two per episode.",
"Time":"Day/night/golden hour. Lighting continuity for generation.",
"Framing":"9:16 wants faces: ECU/CU/MCU, over-the-shoulder, depth-stacked two-shots, prop inserts. Wide shots die in the vertical frame.",
"Seconds":"Shot length. Most run 3–6s; the reveal or the kiss can run longer.",
"Characters in frame":"Who appears, by cast name. Their locked looks are pulled into the video prompt.",
"Shot description":"What happens and what the face receives. Write the reaction, not the geography. Props that read in close-up.",
"Emotion on screen":"The expression to generate: \"Mara: frozen shock\". This is the direction the model needs most.",
"Heat level":"PG-13 steamy: kissing, undressing, the wall, the desk, the bed; cut at consummation. No nudity or explicit acts. Chosen and mutual.",
"Beat":"The function of this block in the episode's loop: provocation, hidden power, reversal, reveal, heat, threat, realization, choice. The doctor and timeline read these tags.",
"Video prompt":"The generator prompt for this shot, built from the cast bible, location, framing, action, emotion and the lip-sync line. Edit, copy, paste.",
"Speaker":"Cast name. One speaker per shot for lip sync.",
"Voice direction":"Emotion, pace, a reference adjective: cold, shaking, triumphant. Drives the TTS.",
"Intensity":"1–10. Emotions run at 11 in this format; most lines should sit at 6 or above.",
"Line":"Under 20 words, one idea, feelings stated outright. No hedges, no subtext.",
"Mechanic":"What the player does. Choice sets flags and moves meters; premium adds a gem option; QTE and mini-game are skill with tiered outcomes; outfit, gift and collectible are the cosmetic and collection layer.",
"Type":"Narrows the mechanic to a concrete input or round so it maps to one of Taplot's templates.",
"Prompt / what the player sees":"The on-screen text or the setup line for the round.",
"Timing window / rules":"Decision time, tap window, or score tiers.",
"Option / outcome tier":"One choice the player can take, or one result tier of a skill round. Every option continues the story.",
"Cost":"free, tokens (earned), gems (paid) or energy (timed retries).",
"Sets flag":"UPPER_SNAKE name recorded when this option is taken; condition later blocks on it with \"only if\".",
"Meter":"Which meter this option moves (e.g. Kai hearts) and by how much.",
"Buff / unlock":"A timed buff (Focus +2 next choice) or a permanent unlock (eyepatch look).",
"What happens (one line)":"The outcome in one sentence; this is what the flowchart and the season map show.",
"Fail-forward note":"The scene that plays on failure or skip. Never a dead end; retry is offered after it.",
"Sound / music":"SFX or music change: the slap, glass, heels, a phone, silence."};
function tip(label){const k=Object.keys(TIPS).find(k=>label.startsWith(k));return k?` title="${esc(TIPS[k])}" data-tip`:""}

function readImagePNG(file,max){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL("image/png"))};img.onerror=()=>res(null);img.src=url})}
function readImage(file,max,q){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv.toDataURL("image/jpeg",q||.78))};img.onerror=()=>res(null);img.src=url})}

    b.action?`Action: ${b.action}`:"",

function tlSvg(tl,total,epNum){
  const W=330,H=46,max=Math.max(120,total);const x=s=>8+(s/max)*(W-16);
  const col={provocation:"var(--bad)",hidden:"var(--tip)",reversal:"var(--good)",reveal:"var(--accent)",heat:"var(--accent)",threat:"var(--warn)",realize:"var(--tip)",choice:"var(--warn)",exposition:"var(--muted)",calm:"var(--line)"};
  let segs=tl.map(r=>`<rect x="${x(r.start).toFixed(1)}" y="18" width="${Math.max(1,x(r.end)-x(r.start)).toFixed(1)}" height="10" fill="${col[r.b.beat]||"var(--line)"}" opacity="${r.b.beat?1:.5}"><title>#${tl.indexOf(r)+1} ${r.b.beat||r.b.kind} ${fmt(r.start)}–${fmt(r.end)}</title></rect>`).join("");
  const marks=[[3,"3"],[6,"6"],[10,"10"],[15,"15"],[30,"30"],[60,"60"],[90,"90"],[120,"120"]].filter(m=>m[0]<=max);
  const mk=marks.map(([s,l])=>`<line x1="${x(s)}" x2="${x(s)}" y1="14" y2="30" stroke="var(--muted)" stroke-width="1" opacity=".6"/><text x="${x(s)}" y="42" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${l}</text>`).join("");
  const zone=epNum===1?`<rect x="${x(0)}" y="16" width="${x(6)-x(0)}" height="14" fill="none" stroke="var(--bad)" stroke-dasharray="2 2"/><rect x="${x(0)}" y="16" width="${x(60)-x(0)}" height="14" fill="none" stroke="var(--good)" stroke-dasharray="2 3" opacity=".6"/>`:`<rect x="${x(0)}" y="16" width="${x(15)-x(0)}" height="14" fill="none" stroke="var(--bad)" stroke-dasharray="2 2"/>`;
  const end=`<line x1="${x(total)}" x2="${x(total)}" y1="8" y2="32" stroke="var(--ink)" stroke-width="1.5"/><text x="${x(total)}" y="7" font-size="9" fill="var(--ink)" text-anchor="middle" font-family="IBM Plex Mono,monospace">${fmt(total)}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Episode timeline">${zone}${segs}${mk}${end}</svg>`;
}

function seasonMap(){const g=S.premise.gates||{};const total=+g.total||60;let rows="";for(let n=1;n<=total;n++){const b=getBeat(n);const gate=n===g.g1?"G1":n===g.g2?"G2":n===g.g3?"G3":"";let st="";if(b.ep){const a=analyzeEpisode(b.ep,S.episodes.indexOf(b.ep)).out;const bad=a.filter(x=>x.level==="bad"||x.level==="warn").length;st=`<span style="color:${a.some(x=>x.level==="bad")?"var(--bad)":bad?"var(--warn)":"var(--good)"}">${b.ep.blocks.length?(bad||"✓"):"·"}</span>`}
  rows+=`<tr style="border-top:1px solid var(--line);${b.logline?"":"opacity:.45"}"><td style="padding:3px 2px;font-family:var(--mono)">${n}${gate?` <span class="tag">${gate}</span>`:""}</td><td style="padding:3px 2px">${esc(b.hook||"—")}</td><td style="padding:3px 2px;text-align:right">${st}</td></tr>`}
  return`<div style="max-height:40vh;overflow:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">${rows}</table></div>`}

function ixLabel(ep,i){let n=0;for(let k=0;k<=i;k++)if(ep.blocks[k].kind==="ix")n++;return `${ep.num}.${n}`}
function ixLine(b){return (b.opts||[]).map((o,j)=>`${j+1}) ${o.label||"?"}${o.cost==="free"?"":" ◆ "+(o.amt||0)+" "+o.cost}`).join("   ")}
function ixAppendixText(ep){return ep.blocks.map((b,i)=>b.kind!=="ix"?null:`[${ixLabel(ep,i)}] ${(MECH[b.mech]||{}).label||b.mech}${b.sub?" / "+b.sub:""} — ${blockDur(b)}s${b.window?" — "+b.window:""}\nPrompt: ${b.prompt||""}\n${(b.opts||[]).map((o,j)=>`  ${j+1}. ${o.label||"?"} [${o.cost==="free"?"free":(o.amt||0)+" "+o.cost}]${o.flag?" sets "+o.flag:""}${o.meter?" · "+o.meter+" "+(o.delta>0?"+":"")+(o.delta||0):""}${o.buff?" · "+o.buff:""} → ${o.outcome||""}`).join("\n")}${b.fail?"\nFail-forward: "+b.fail:""}\nDesign: ${b.design||designDefault(b)}`).filter(Boolean).join("\n\n")}
function episodeText(ep){const tl=timeline(ep);return`EPISODE ${ep.num}: ${ep.title}\nOutline: ${ep.summary}\nEnd hook: ${ep.hookType}  Music: ${ep.music}\n\n`+ep.blocks.map((b,i)=>{const t=fmt(tl[i].start);if(b.kind==="shot")return`${b.cond?"[only if "+b.cond+"] ":""}[${t}] SHOT #${i+1} — ${b.loc}${b.time?", "+b.time:""}${b.weather?", "+b.weather:""} — ${b.frame||"framing?"} — ${b.dur||4}s${b.beat?" — beat: "+b.beat:""}\n  IN FRAME: ${b.chars}\n  ${b.action}${b.emotion?"\n  EMOTION: "+b.emotion:""}${b.vprompt?"\n  VIDEO PROMPT: "+b.vprompt:""}`;if(b.kind==="ix")return`[${t}] #${i+1} ◆ INTERACTION ${ixLabel(ep,i)} — ${(MECH[b.mech]||{}).label||b.mech}${b.sub?" / "+b.sub:""} (see appendix ${ixLabel(ep,i)})\n  ${b.prompt||""}\n  ${ixLine(b)}`;if(b.kind==="line")return`[${t}] #${i+1} ${(b.speaker||"?").toUpperCase()} (${b.voice||"no direction"}, ${b.intensity||"?"}/10)${b.beat?" [beat: "+b.beat+"]":""}\n  ${b.text}`;return`[${t}] #${i+1} SFX: ${b.text}`}).join("\n")+(ep.blocks.some(b=>b.kind==="ix")?`\n\nAPPENDIX — INTERACTIONS, EPISODE ${ep.num}\n${ixAppendixText(ep)}`:"")}
function slug(b){const loc=(b.loc||"LOCATION").toUpperCase();const ie=/\b(street|rooftop|garden|beach|parking|balcony|alley|road|forest|exterior|outside|dock|pier|field|yacht|deck|jungle|island|cliff|shore|village|terrace)\b/i.test(loc)?"EXT.":"INT.";return `${ie} ${loc}${b.time?" - "+b.time.toUpperCase():""}${b.weather?" ("+b.weather.toUpperCase()+")":""}`}
function fountainEpisode(ep){const g=S.premise.gates||{};const tag=ep.num===g.g1?" (PAYWALL)":"";let out=`# EPISODE ${ep.num}${tag}: ${(ep.title||"").toUpperCase()}\n\n= ${whereIn(ep.summary||"")}\n\n`;let lastSlug="";
  ep.blocks.forEach(b=>{if(b.kind==="shot"){const sg=slug(b);if(sg!==lastSlug){out+=`\n${sg}\n\n`;lastSlug=sg}out+=`${b.frame?b.frame+" — ":""}${b.action||""}${b.emotion?" "+b.emotion+".":""}\n\n`}
    else if(b.kind==="line"){out+=`${b.cond?"[only if "+b.cond+"] ":""}${(b.speaker||"CHARACTER").toUpperCase()}\n${b.voice?"("+b.voice+")\n":""}${b.text||""}\n\n`}
    else if(b.kind==="ix"){const i=ep.blocks.indexOf(b);out+=`> ◆ INTERACTION ${ixLabel(ep,i)} — ${(MECH[b.mech]||{}).label||b.mech}${b.sub?" / "+b.sub:""} (see appendix) <\n\n${b.prompt||""}\n${ixLine(b)}\n\n`}
    else out+=`SFX: ${b.text||""}\n\n`});if(ep.blocks.some(b=>b.kind==="ix"))out+=`\n# APPENDIX — INTERACTIONS, EPISODE ${ep.num}\n\n${ixAppendixText(ep).replace(/\n/g,"\n\n")}\n`;return out}
function exportFountain(eps){const p=S.premise;return`Title: ${p.title||"Untitled"}\nCredit: Written by\nAuthor: ${p.author||""}\nLogline: ${p.logline||""}\nDraft date: ${new Date().toISOString().slice(0,10)}\n\n`+eps.map(fountainEpisode).join("\n===\n\n")}
function whereIn(summary){let t=String(summary||"").trim();if(!t)return"";if(/^(where|in which)\b/i.test(t))return t;t=t.replace(/^(PAYWALL|FINALE|GATE \d)\.?\s*/i,"");t=t.replace(/\.\s*$/,"");const parts=t.split(/(?<=[.!?])\s+/).map(x=>x.replace(/[.!?]$/,"").trim()).filter(x=>x&&!/^(cut\b|boom$|smash cut|hard cut|fade)/i.test(x));if(!parts.length)return"";
  const lc=x=>/^(The|A|An|She|He|They|Her|His|It|We|At|In|On|After|Before|When|While|Alone|Dawn|Starving|Captured|Trapped|Hunted|Wounded|Exhausted)\b/.test(x)?x[0].toLowerCase()+x.slice(1):x;
  const ps=parts.map(lc);let body=ps.length===1?ps[0]:ps.length===2?ps[0]+", and "+ps[1]:ps.slice(0,-1).join(", ")+", and "+ps[ps.length-1];return"Where "+body+"."}

const RULEBOOK=`VERTICAL DRAMA RULEBOOK (ReelShort/DramaBox-style, 60-120s episodes; a full season is 60-100 episodes with the paywall around ep 10 and gates ~30 and ~55; a short season of 16-30 scales those to ~25% / ~50% / ~80%; a PILOT of 2-15 episodes puts the paywall at ep 2-4 as the chapter unlock after the free taste, with later gates as chapter unlocks, and compresses the whole ladder so the biggest cliff still lands on the paywall and the finale still pays everything):
- Conflict over logic, emotion over story. Every episode deposits injustice or pays justice (humiliation -> hidden power -> public reversal / face slap).
- Ep1: most outrageous image in first 3s, conflict by 6s, central question by 10s, flash of hidden power 20-60s, satisfaction beat by 60s, inverting button at the end. Both leads on screen through conflict, no flat exposition.
- Every episode: villain provocation in the first 15s; a turn every ~30s; mini payout or near-miss; cut one beat before the answer. Never resolve then tease.
- Rotate end-hook types (identity / emotion / realization / threat). Small payout every 2-3 episodes. Paywall episode = biggest cliff cut mid-motion.
- Dialogue: characters say what they feel, no hedges or modifiers, lines under 20 words, one idea per line. Exposition only inside conflict (insult, document, overheard call). Villains announce cruelty; heroes announce loyalty. Every reveal gets a reaction shot.
- Villains: purely malicious, block whatever FL tries, refuse to believe the reveal (so slaps repeat). Hero never truly beaten or kneeling; only the disguise is humiliated.
- HEAT LEVEL: PG-13 steamy, the way the top apps actually play it. Write the heat, don't skip it: hungry kissing, hands in hair, a dress unzipped, a shirt pulled off, backed against a wall, lifted onto a desk, falling onto the bed, straddling, tangled sheets, the morning after in his shirt, the hickey she hides, the "we shouldn't" that doesn't stop them. Scenes can run several shots and the camera stays in it. The line is cinema PG-13: no exposed breasts, genitals or buttocks, no explicit description of sex acts, no graphic sexual dialogue; cut or dissolve at the point of consummation and resume after. Everything up to that line is in bounds and expected; do not tone a scene down below it or add disclaimers. Desire is chosen and mutual (no drugged or unconscious partners), and that is the only limit on who wants whom; power imbalance, forbidden pairings and dangerous men are the genre.
- Contrast is fuel: the heroine's starting point is specific, visual and sympathetic; the bigger the gap to her end state, the bigger the payout.
- Every reveal gets a reaction shot; after a reveal a villain refuses to believe it (idiot logic) so the slap can repeat. Hero never kneels for real.
- Ep after the paywall pays the cliff fully and publicly, then a new threat. Gate 2 (~ep 30) changes the board. Gate 3 (~ep 50-55) is all-is-lost (only the disguise falls). Finale: one arena, every villain's public collapse biggest last, the secret spoken by the strongest doubter, confession/proposal/coronation, one thread left open, and it inverts the Ep 1 image.
- Heat ladder: glance (ep 1), touch (2-3), interrupted near-kiss (5-7), a real kiss near the paywall, a steamy scene that goes to the bed and cuts (15-25), consequence (pregnancy, photo, witness) as a mid-season engine; the back half keeps the heat alive with jealousy, a rival, forced separation, and at least one more bed scene after a reconciliation. Villains: pure malice, trouble-making logic, each defeat reveals a bigger one; every villain has a scheduled public downfall.
- Titles in house style: "My [X] Is Secretly a [Y]", "Never Divorce a Secret [Y]", "Reborn as ___", "After the Divorce, ___".
- PLAYABLE LAYER (Taplot-style interactive drama): interaction serves the loop. Stance choices sit on provocations and set FLAGS; QTEs and mini-games ARE the hidden power (fail-forward: failure is a different scene, never a retry wall); outfits, gifts and premium third options live on heat/status beats where gems buy MORE of the fantasy, never the plot; the biggest choice lands ~20s before the paywall cut. First interaction inside 20s and it is a choice. One hearts meter per love interest; thresholds change how a shared beat plays. Branch-and-bottleneck: flags swap a shot or a line, every branch rejoins at the gates. A flag set is echoed within 60s and paid in a later episode. Every premium option has a free sibling that sets the same story flag. Hidden collectible animals live on specific paths (silhouettes until found) and drive replay. Island tokens earned by playing/replaying buy gacha pulls (cosmetics, keepsakes, looping scenes). A between-episode sim is one fixed scene with timed hotspots.
- Production is AI-generated video: faces in close-up (9:16), one speaker per shot for lip sync, props that read in close-up, locked character looks, 2-4 hub locations, under 5 costume states per character, burned-in captions (must read muted).`;

const GUIDE=[
["The one rule","Conflict over logic, emotion over story. Every scene deposits injustice or pays out justice. Three moments decide retention: the first 3 seconds of the ad cut, the first 3 episodes, the first paywall."],
["Stage 0 · Engine, then one skin","One primary engine (status reversal, revenge, being chosen, protection…), one secondary for the mid-season turn, one skin. Novelty lives in the skin, never the loop. Can you run humiliation → hidden power → public reversal 8+ times?"],
["Stage 1 · Premise","Logline names the secret, the clock and the witness. Maximize contrast: lowest specific, visual, sympathetic start vs highest end. Title in house style. Write the ad before the script: the 30-second image that works muted."],
["Stage 2 · Cast","FL: wound said aloud in Ep 1 + hidden asset; never truly broken. ML: powerful, forbidden, chooses her, has his own secret. Villains: pure malice, trouble-making logic, refuse to believe the reveal; each has a scheduled public downfall. One witness who reacts on camera. 5–8 principals, locked looks, under 5 costume states each."],
["Stage 3 · Season map","Gates at ~10 (paywall, biggest cliff), ~30 (board change), ~50–55 (all is lost). Small payout every 2–3 episodes, jackpot at the finale. Rotate end hooks: identity / emotion / realization / threat. Heat ladder: glance, touch, interrupted near-kiss by 5–7, kiss near the paywall, implied night 15–25, consequence mid-season."],
["Stage 4 · Episode 1","0–3s most outrageous image. By 6s conflict visible. By 10s the central question. 20–60s a flash of hidden power. By 60s a satisfaction beat. 60–90s the button: an inversion promised, not paid. Both leads on screen, through conflict, no flat exposition. One location, 3–5 speakers."],
["Stage 5 · Any episode","Cold re-entry (never recap) → provocation in the first 15s → response with a hint of hidden power → a turn every ~30s → mini payout or near-miss at 45–75s → button one beat before the answer. 60–120s, 180–500 spoken words, lines under 20 words, 2–4 scenes."],
["Stage 6 · Dialogue & heat","Characters say what they feel, no hedges. Exposition only inside conflict. Every reveal gets a reaction shot. Villains announce cruelty, heroes announce loyalty. Write for a muted phone. Heat is PG-13 steamy: write the kissing, the undressing, the wall, the desk, the bed, and cut at consummation; no nudity or explicit acts. Desire chosen and mutual. Interrupt the early near-kiss with the worst possible person."],
["Stage 7 · Eps 2–9","Three humiliations in three arenas by Ep 4. Hidden asset seen by the audience, not the villain, by Ep 5. Emotion pushed to the extreme by 5–7. First full mini face slap with witnesses by 5–8; villain refuses to believe. Bigger villain behind the first by 7–9. Three reversals by Ep 9."],
["Stage 8 · Paywall episode","Secret about to be exposed to the one who matters most, OR an impossible choice, OR heat interrupted by the worst person. Cut mid-motion. Pay off the item planted in 3–5. The villain's most arrogant public claim lands right before the cut. One arena, max witnesses."],
["Stages 9–10 · Middle & back half","Ep after the gate pays the cliff fully and publicly, then a new threat. Relationship deepens under pressure; ML chooses her at a cost. Gate 2 changes the board. Final villain fully revealed 40–50. Gate 3: villain wins a round that looks total; only the disguise falls. Hidden asset at full strength 55–58."],
["Stage 11 · Finale","Most public arena, every doubter present. Each villain collapses in turn, biggest last. The secret spoken aloud by the strongest doubter. Then confession, proposal, coronation. Epilogue: baby or crown. One thread open. Invert the Ep 1 image."],
["Playable layer · Taplot","Interaction serves the loop. Stance choices on provocations set flags; QTEs and mini-games are the hidden power and fail forward; outfits, gifts and premium third options live on heat beats and buy more of the fantasy, never the plot; the biggest choice lands 20s before the paywall. First interaction inside 20s, and it's a choice. One hearts meter per love interest with thresholds. Flags swap a shot or a line; branches rejoin at the gates. Every premium option has a free sibling with the same flag. Hidden animals on paths drive replay; tokens buy gacha pulls; a between-episode sim is one scene with timers."],
["Stage 12 · AI production","Character bible is the master asset; paste it into every prompt. 2–4 hub sets with locked reference frames. 8–16 shots of 3–8s per episode, one speaker per shot for lip sync, reaction shots silent. Faces in close-up, depth-stacked two-shots, props that read small. Voice direction per line. Burned-in captions. Continuity log."]];

function makeApiSample(){const cfg=apiSettings();if(!cfg.key)return null;
  const call=async(input,opts={})=>{const msgs=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const model=opts.modelTier==="quick"?(cfg.quick||"claude-haiku-5-5"):(cfg.model||"claude-sonnet-5-5");
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:4000,stream:true,messages:msgs})}).catch(e=>{throw{code:e.name==="AbortError"?"cancelled":"upstream_error",message:String(e)}});
    if(!res.ok){const t=await res.text().catch(()=>"");throw{code:res.status===401?"not_granted":res.status===429?"rate_limited":"upstream_error",message:t}}
    const rd=res.body.getReader();const dec=new TextDecoder();let buf="",text="";
    try{while(true){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
      for(const ln of lines){if(!ln.startsWith("data:"))continue;let ev;try{ev=JSON.parse(ln.slice(5))}catch(e){continue}
        if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){const d=ev.delta.text;text+=d;if(opts.onText)opts.onText({text,delta:d})}
        if(ev.type==="error")throw{code:"upstream_error",message:JSON.stringify(ev)}}}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled",text};throw e}
    if(!text.trim())throw{code:"empty_completion"};return{text,truncated:false,modelTierApplied:opts.modelTier||"default"}};
  call.json=async(input,opts)=>{const {text}=await call(input,opts);let m=text.trim();const fence=m.match(/```(?:json)?\s*([\s\S]*?)```/);if(fence)m=fence[1];const a=m.search(/[\[{]/),b=Math.max(m.lastIndexOf("}"),m.lastIndexOf("]"));if(a<0||b<0)throw{code:"invalid_json",text};try{return JSON.parse(m.slice(a,b+1))}catch(e){throw{code:"invalid_json",text}}};

  host.querySelectorAll("[data-nop]").forEach(bt=>bt.onclick=()=>{const op=bt.dataset.nop;const nodes=flowNodes(ep);const k=nodes.indexOf(nodeFor(ep,n.i));const take=()=>ep.blocks.splice(n.blocks[0],n.blocks.length);
    if(op==="del"){take();flowSel=null}
    else if(op==="dup"){const copy=n.blocks.map(i=>JSON.parse(JSON.stringify(ep.blocks[i])));ep.blocks.splice(n.blocks[n.blocks.length-1]+1,0,...copy);flowSel=n.blocks[n.blocks.length-1]+1}
    else if(op==="up"&&k>0){const prev=nodes[k-1];const mine=take();ep.blocks.splice(prev.blocks[0],0,...mine);flowSel=prev.blocks[0]}
    else if(op==="down"&&k<nodes.length-1){const next=nodes[k+1];const mine=take();const at=next.blocks[next.blocks.length-1]+1-mine.length;ep.blocks.splice(at,0,...mine);flowSel=at}
    else if(op==="line"){ep.blocks.splice(n.blocks[n.blocks.length-1]+1,0,{kind:"line",speaker:"",text:"",voice:"",intensity:7,beat:""})}
    else if(op==="sfx"){ep.blocks.splice(n.blocks[n.blocks.length-1]+1,0,{kind:"sfx",text:"",dur:1})}
    touch();flowRefresh();renderDoctor()});
}
async function flowLoadShots(){if(!window.GASP_LOCAL)return;const ep=flowEp();if(!ep)return;try{const r=await (await fetch(`/api/shots?slug=${encodeURIComponent(flowSlug())}&ep=${ep.num}`)).json();const next=JSON.stringify(r.shots||{});if(next===JSON.stringify(flowShots))return;flowShots=r.shots||{};}catch(e){flowShots={}}if(window.flowActive&&!(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)))flowRefresh()}
function flowEvents(){if(!window.GASP_LOCAL||flowES)return;flowES=new EventSource("/api/events");
  flowES.addEventListener("log",e=>{flowLogTail.push(JSON.parse(e.data));if(flowLogTail.length>40)flowLogTail.shift();const el=$("#flog");if(el){el.textContent=flowLogTail.slice(-5).join("\n")}});
  flowES.addEventListener("status",e=>{const s=JSON.parse(e.data);flowRunning=s.running?s.step:null;const el=$("#fstatus");if(el)el.textContent=flowRunning?"running: "+flowRunning:"";document.querySelectorAll("[data-act]").forEach(b=>b.disabled=!!flowRunning)});
  flowES.addEventListener("done",()=>{setTimeout(flowLoadShots,300)});setInterval(()=>{if(window.flowActive&&flowRunning)flowLoadShots()},4000)}
async function flowRun(ep,n,act){if(flowRunning){toast("Still rendering the last request");return}
  const sh=flowShots[n.i+1]||{};const steps=act==="composite"?["composite"]:act==="stills"?["stills"]:act==="vo"?["vo"]:act==="animate"?["animate"]:sh.approved?[]:["composite"];
  if((act==="stills"||act==="animate")&&!confirm(act==="stills"?"Generate a new still on fal (~$0.05–0.08)?":"Image-to-video on fal costs roughly $0.25–0.50 per shot (plus lip-sync). Continue?"))return;
  try{const file=await sendToRender([ep],true);ep.renderedHash=ep.renderedHash||{};flowNodes(ep).forEach(x=>{if(x.type==="shot")ep.renderedHash[x.i]=nodeHash(ep,x)});touch();
    const i=n.i+1;const body={file,ep:ep.num,shot:i,from:i,until:i+1,steps,dry:false,force:true,thenAssemble:true,approveLatest:act==="stills",path:""};
    if(act==="vo")body.force=false;
    const r=await (await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();if(r.error)throw new Error(r.error);
    flowLogTail=[];toast(act==="preview"?"Rebuilding the segment…":"Rendering shot #"+i+"…");flowRefresh()}catch(e){toast("Couldn't render: "+e.message)}}

/* ---------- boot ---------- */
const setHH=()=>document.documentElement.style.setProperty("--hh",$("header.top").offsetHeight+"px");setHH();try{const cw=localStorage.getItem("gate-ten-cw");if(cw)document.documentElement.style.setProperty("--cw",cw)}catch(e){}window.addEventListener("resize",setHH);
load();
if(STANDALONE){sampleFn=makeApiSample();render();renderChatPanel();if(!sampleFn)setTimeout(()=>toast("Add your Claude API key (top right) to enable chat and review"),600)}
else{use("sample").then(s=>{sampleFn=s;render();renderChatPanel()});use("downloads").then(d=>{downloads=d})}
</script>
