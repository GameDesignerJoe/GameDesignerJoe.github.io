    </div>
    <div class="finding ${income >= sinks * 1.5 ? "warn" : "info"}">
      <span class="fi">${income >= sinks * 1.5 ? "⚠️" : "ℹ️"}</span>
      <div>
        <span class="sev">the headline number</span>
        <h5>One full campaign pays about ${num(income)} ⭐ against ${num(sinks)} ⭐ of things to buy</h5>
        <p>That is <strong>${(income / sinks).toFixed(1)}×</strong> everything in the game, before Good Name
          compounds it${wageMax ? ` (up to ${num(income + rooms * wageMax * wageEach)} ⭐ maxed)` : ""}.
          The design note in <code>upgrades.json</code> prices the shop against “a first run through the whole
          campaign is in the low hundreds — enough to unlock most of the cast <em>or</em> max two or three
          upgrades, not both”, and choosing is stated to be the point.</p>
        <p>The reason a real first run <em>is</em> in the low hundreds is that the campaign is not open: only
          ${A.filter(a => !a.client.cost).length} of ${A.length} clients are free, so you cannot reach most of
          those rows until you have paid for the person who owns them. The arc table below is the honest
          version — income unlocked per client, banked as you go.</p>
        <span class="src">js/main.js — afterMutation() · data/upgrades.json — _homeNote</span>
      </div>
    </div>
    <h4 style="margin:18px 0 8px">What each client is worth, in board order</h4>
    <div class="wrapscroll"><table class="grid">
      <thead><tr><th>Client</th><th class="num">Listed</th><th class="num">You pay</th>
        <th class="num">Jobs</th><th class="num">Picks</th><th class="num">⭐ in their arc</th><th class="num">Running total</th></tr></thead>
      <tbody>${arcRows}</tbody>
    </table></div>
    <p class="lede" style="margin-top:8px"><em>You pay</em> applies the ×0.6 referral discount where the
      client has a <code>needs</code> and you followed the chain. Running total assumes you clear every arc
      in board order.</p>
    ${cardRows ? `<h4 style="margin:22px 0 8px">Does Business Cards pay for itself?</h4>
    <div class="wrapscroll"><table class="grid">
      <thead><tr><th>Level</th><th class="num">Discount</th><th class="num">Costs</th>
        <th class="num">Saves on the whole cast</th><th class="num">Net</th></tr></thead>
      <tbody>${cardRows}</tbody>
    </table></div>
    <p class="lede" style="margin-top:8px">Best case: bought before you hire anyone, following every referral.
      Bought later it saves only on whoever is left, so treat these as ceilings.</p>` : ""}
  </section>`;
}

/* ---------- draft odds ---------- */
function renderDraft(){
  const U = UPG();
  const ups = U.upgrades || [];
  const cards = U.draftCards ?? 3;
  const weightRows = ups.map(u => `<tr>
    <td>${esc(u.icon)} ${esc(u.name)}</td>
    <td class="num">${maxLevel(u)}</td>
    <td class="num">3</td>
    <td class="num">${(3 / (ups.length * 3) * 100).toFixed(1)}%</td>
    <td class="num">${(1 / (ups.length * 3 - 2) * 100).toFixed(1)}%</td>
  </tr>`).join("");

  return `<section id="draft">
    <h2>Draft odds <span class="count">pick one of ${cards}</span></h2>
    <p class="lede">A draft weights each <strong>unowned</strong> talent ×3 and each owned one ×1, shuffles,
      then takes the first ${cards} distinct ids. So a first draft is heavily biased toward showing you
      something new, and the bias decays as you collect. If fewer than ${cards} talents are left unmaxed,
      the grid back-fills with consumables rather than showing a degraded one-card draft.</p>
    <div class="wrapscroll"><table class="grid">
      <thead><tr><th>Talent</th><th class="num">Levels</th><th class="num">Weight unowned</th>
        <th class="num">Share, nothing owned</th><th class="num">Share, this one owned</th></tr></thead>
      <tbody>${weightRows}</tbody>
    </table></div>
    <p class="lede" style="margin-top:8px">Share is that talent's slice of the weighted bag on a single
      draw — the real chance of appearing in a grid is higher, since ${cards} distinct ids are taken.
      With ${ups.length} talents and ${ups.reduce((n,u)=>n+maxLevel(u),0)} levels between them, the deepest
      house in the game (${Math.max(...(state.json.levels.levels||[]).map(l=>l.rewards??0))} picks +
      Reputation) still cannot drain the pool, so the consumable back-fill should never be seen in the
      campaign.</p>
    <details class="code" open><summary>The draft, read live</summary>
      ${SYSTEM_ANCHORS._draft.map(a => renderAnchor("_draft", a)).join("")}</details>
    <details class="code"><summary>How locks are generated — the ground truth behind Skeleton Key and Spare Set</summary>
      ${SYSTEM_ANCHORS._locks.map(a => renderAnchor("_locks", a)).join("")}</details>
    <details class="code"><summary>The cascade both One Trip and Magnet Fingers run inside</summary>
      ${SYSTEM_ANCHORS._cascade.map(a => renderAnchor("_cascade", a)).join("")}</details>
  </section>`;
}

function renderSources(){
  const rows = Object.entries(FILES).map(([k, p]) => `<tr>
    <td class="mono">${esc(p)}</td>
    <td class="num mono muted">${(state.raw[k].length / 1024).toFixed(1)} kB</td>
    <td class="num mono">${state.hashes[k]}</td>
    <td>${state.changed.includes(k) ? '<span style="color:var(--gold)">changed on this read</span>' : '<span class="muted">—</span>'}</td>
  </tr>`).join("");
  return `<section id="sources">
    <h2>Files being watched <span class="count">${Object.keys(FILES).length} files</span></h2>
    <p class="lede">Every file this page makes a claim about, re-fetched with <code>cache: "no-store"</code>
      and a fresh query string on each check. The hash is FNV-1a over the raw text — if it moves, the page
      repaints. A claim that depends on a file not listed here would be a claim this page cannot keep true.</p>
    <div class="wrapscroll"><table class="grid">
      <thead><tr><th>File</th><th class="num">Size</th><th class="num">Hash</th><th>Last read</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="lede" style="margin-top:10px">Game version <code>${esc(conf("VERSION","?"))}</code> ·
      <code>DATA_VERSION ${esc(conf("DATA_VERSION","?"))}</code> ·
      <code>INV_SIZE ${esc(conf("INV_SIZE","?"))}</code> ·
      TALENT_IDS <code>${confList("TALENT_IDS").join(", ")}</code> ·
      HOME_IDS <code>${confList("HOME_IDS").join(", ")}</code></p>
  </section>`;
}

function render(){
  const U = UPG();
  const ctx = { invSize: conf("INV_SIZE", 5) };
  document.getElementById("gameVer").textContent =
    "v" + conf("VERSION", "?") + " · data v" + conf("DATA_VERSION", "?");
  /* The button's label is derived here rather than set by whoever toggled it —
     there are two ways out of edit mode and one of them was leaving the header
     saying "Reading" while the page was back to reading. */
  document.getElementById("editBtn").textContent = EDIT.on ? "📖 Done editing" : "✏️ Edit";

  const talents = (U.upgrades || []).map((u, i) => renderEntry(u, "talent", i, ctx)).join("");
  const home = (U.home || []).map((u, i) => renderEntry(u, "home", i, ctx)).join("");
  const cons = (U.consumables || []).map((u, i) => renderEntry(u, "consumable", i, ctx)).join("");

  document.getElementById("out").innerHTML = `
    ${work != null ? `<div class="workbanner">
      <b>You are reading unsaved changes.</b> Everything below — the level tables, the star economy, the
      health check — is derived from your edited <code>data/upgrades.json</code>, not from the file on
      disk. Watching is paused so a poll cannot overwrite your work. <em>Save</em> writes it;
      <em>Discard</em> puts the file back.</div>` : ""}
    ${EDIT.on ? `<div class="workbanner" style="background:color-mix(in srgb,var(--gold) 14%,var(--panel));border-color:color-mix(in srgb,var(--gold) 45%,var(--wall))">
      <b>Edit mode.</b> Editable fields are the boxed ones: name, emoji, description, level count, prices
      and params — <code>data/upgrades.json</code> only. Ids, adding or removing entries, and every other
      data file are read-only here, because each of those needs a matching change in
      <code>js/config.js</code> that this page cannot check. Nothing is written until you press Save.</div>` : ""}
    ${renderFindings()}
    <section id="talents">
      <h2>In-level talents <span class="count">${(U.upgrades||[]).length} talents · ${(U.upgrades||[]).reduce((n,u)=>n+maxLevel(u),0)} levels · drafted, then gone</span></h2>
      <p class="lede">Drafted during a run and lost when it ends. The line these sit on: a talent changes
        <strong>what you know</strong> about the house in front of you, where a permanent upgrade changes
        <strong>how you play</strong>. Only the second is safe to make permanent — carrying Sixth Sense
        between levels would gut the taxonomy the game is about.</p>
      ${talents}
    </section>
    <section id="home">
      <h2>Permanent upgrades <span class="count">${(U.home||[]).length} upgrades · ${num((U.home||[]).reduce((n,u)=>n+totalCost(u),0))} ⭐ to max everything</span></h2>
      <p class="lede">Bought at the main menu with ⭐ and kept forever. <code>cost</code> is per level taken:
        an array prices each level separately, a number prices them all the same.</p>
      ${home}
    </section>
    <section id="consumables">
      <h2>Consumables <span class="count">${(U.consumables||[]).length} one-offs · back-fill only</span></h2>
      <p class="lede">Not a third catalogue so much as padding: these appear in a draft only when there are
        not enough unmaxed talents left to fill the grid.</p>
      ${cons}
    </section>
    ${renderWhen()}
    ${renderEconomy()}
    ${renderDraft()}
    ${renderSources()}`;

  if (state.changed.length){
    const nav = document.getElementById("out");
    nav.classList.remove("flash"); void nav.offsetWidth; nav.classList.add("flash");
  }
  wireEditors();
  renderSaveBar();
}

/* ============================================================
   8b. THE SAVE BAR

   Four ways out, in the order they escalate:

     Apply in page  patch in memory and repaint. NOTHING is written, and every
                    derived number on the page now reflects the change — which
                    is the actual point of the whole exercise: see what moving
                    a price does to the economy panel before committing to it.
     Preview        the exact lines that would change.
     Copy / Download  for when the browser cannot write to the repo.
     Save to file   File System Access. You pick data/upgrades.json once and
                    it writes in place after that.

   The file is in git, so the real undo is `git diff` and `git checkout`. That
   is said on screen rather than assumed, because a tool that writes to a
   source tree owes the reader that sentence.
============================================================ */
function renderSaveBar(){
  const old = document.getElementById("savebar");
  if (old) old.remove();
  document.body.classList.toggle("editing", EDIT.on);
  if (!EDIT.on) return;

  const canWrite = "showOpenFilePicker" in window;
  const bar = el("div");
  bar.id = "savebar";
  bar.className = "savebar";
  bar.innerHTML = `
    <span class="n" id="saveCount"></span>
    <button id="applyBtn">Apply in page</button>
    <button id="previewBtn">Preview diff</button>
    <button id="copyBtn">Copy JSON</button>
    <button id="dlBtn">Download</button>
    <button id="saveBtn" class="primary"
      title="${canWrite ? "Write data/upgrades.json in place" : "This browser has no File System Access API — use Copy or Download"}">Save to file</button>
    <button id="discardBtn">Discard</button>
    <button id="exitBtn">Done editing</button>
    <span class="msg" id="saveMsg">${canWrite
      ? "The file is in git — <code>git diff</code> shows exactly what a save changed."
      : "No File System Access API here. Copy or Download, then paste over the file."}</span>
    <div id="previewHost" style="flex-basis:100%"></div>`;
  document.body.appendChild(bar);
  updateSaveBar();

  const built = () => {
    if (!edits.size) return { text: work, json: workJson, errors: [] };
    return applyEdits();
  };

  document.getElementById("applyBtn").addEventListener("click", () => {
    const r = applyEdits();
    if (r.errors.length) return msg(r.errors.map(esc).join("<br>"), "bad");
    work = r.text; workJson = r.json; edits.clear();
    render();                                   /* rebuilds the bar, so msg() after */
    msg("Applied in the page. Every number above is now derived from your edit — including the health " +
        "check and the economy. Nothing has been written to disk.", "good");
  });

  document.getElementById("previewBtn").addEventListener("click", () => {
    const r = built();
    if (r.errors && r.errors.length) return msg(r.errors.map(esc).join("<br>"), "bad");
    const v = validateEdit(r.json);
    const host = document.getElementById("previewHost");
    host.innerHTML =
      `<div class="diffbox">${diffLines(state.raw[EDIT.target], r.text)}</div>` +
      (v.errors.length || v.warnings.length
        ? `<ul class="vlist">${v.errors.map(e => `<li class="e">${esc(e)}</li>`).join("")}
           ${v.warnings.map(w => `<li class="w">${esc(w)}</li>`).join("")}</ul>`
        : `<ul class="vlist"><li>✅ Nothing to flag — it parses, the patch landed where it was aimed, and every check passes.</li></ul>`);
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const r = built();
    if (r.errors && r.errors.length) return msg(r.errors.map(esc).join("<br>"), "bad");
    try { await navigator.clipboard.writeText(r.text); msg("Whole file copied — paste it over <code>data/upgrades.json</code>.", "good"); }
    catch (e){ msg("Clipboard refused (" + esc(e.message) + "). Use Download.", "bad"); }
  });

  document.getElementById("dlBtn").addEventListener("click", () => {
    const r = built();
    if (r.errors && r.errors.length) return msg(r.errors.map(esc).join("<br>"), "bad");
    const a = el("a");
    a.href = URL.createObjectURL(new Blob([r.text], { type: "application/json" }));
    a.download = "upgrades.json";
    a.click(); URL.revokeObjectURL(a.href);
    msg("Downloaded as <code>upgrades.json</code> — move it over <code>data/upgrades.json</code>.", "good");
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    const r = built();
    if (r.errors && r.errors.length) return msg(r.errors.map(esc).join("<br>"), "bad");
    const v = validateEdit(r.json);
    if (v.errors.length)
      return msg("Not saved — " + v.errors.length + " thing" + (v.errors.length === 1 ? "" : "s") +
        " would break the game:<br>" + v.errors.map(esc).join("<br>"), "bad");
    try {
      if (!fileHandle){
        /* The picker IS the permission model: the browser cannot write
           anywhere the user has not personally pointed at. */
        [fileHandle] = await window.showOpenFilePicker({
          id: "tidy-upgrades",
          types: [{ description: "upgrades.json", accept: { "application/json": [".json"] } }],
        });
      }
      const name = fileHandle.name;
      if (name !== "upgrades.json" && !confirm(
        `That file is called “${name}”, not upgrades.json. Write to it anyway?`)) return;
      const w = await fileHandle.createWritable();
      await w.write(r.text); await w.close();
      work = null; workJson = null; edits.clear();
      msg(`Written to <code>${esc(name)}</code>. Watching resumes — the next read will show it back from
        disk, which is the round trip proving it landed. <code>git diff</code> to see it.`, "good");
      tick(true);
    } catch (e){
      if (e.name === "AbortError") return msg("Save cancelled — nothing written.");
      msg("Could not write (" + esc(e.message) + "). Nothing written; use Copy or Download.", "bad");
    }
  });

  document.getElementById("discardBtn").addEventListener("click", () => {
    if (!confirm("Throw away every unsaved change and read the file back from disk?")) return;
    work = null; workJson = null; edits.clear();
    render();
  });

  document.getElementById("exitBtn").addEventListener("click", () => {
    if (dirty() && !confirm("You have unsaved changes. Leave edit mode and throw them away?")) return;
    work = null; workJson = null; edits.clear();
    EDIT.on = false;
    render(); schedule();
  });
}

/* The bar's live half. Kept separate from building it so a keystroke updates
   a count instead of replacing the element the user is looking at — rebuilding
   it on every input threw away the diff preview and stole focus. */
function msg(t, cls){
  const m = document.getElementById("saveMsg");
  if (!m) return;
  m.className = "msg" + (cls ? " " + cls : "");
  m.innerHTML = t;
}
function updateSaveBar(){
  const bar = document.getElementById("savebar");
  if (!bar) return;
  const n = edits.size, has = n > 0 || work != null;
  const canWrite = "showOpenFilePicker" in window;
  bar.querySelector("#saveCount").textContent =
    n ? n + " field" + (n === 1 ? "" : "s") + " changed"
      : work != null ? "changes applied, not saved" : "no changes";
  const set = (id, ok) => { const b = bar.querySelector("#" + id); if (b) b.disabled = !ok; };
  set("applyBtn", n > 0);
  set("previewBtn", has);
  set("copyBtn", has);
  set("dlBtn", has);
  set("saveBtn", has && canWrite);
  set("discardBtn", has);
}

/* Inputs record straight into `edits` — no debounce, because a keystroke here
   costs a Map.set and nothing else. Deriving the page from it is a separate,
   explicit act (Apply in page), so typing never fights a repaint for focus.

   An edit typed back to the value it started at is REMOVED rather than stored
   as a no-op, so "3 fields changed" is a count of real changes and the diff
   never shows a line replaced by itself. */
function wireEditors(){
  /* EVERY PATH MUST ADDRESS EXACTLY ONE INPUT. Two inputs on one key is a bug
     that hides — both look right, and whichever you did not type into silently
     wins on the next repaint. Cheap to check, so checked. */
  const seen = new Map();
  for (const inp of document.querySelectorAll("#out [data-path]"))
    seen.set(inp.dataset.path, (seen.get(inp.dataset.path) || 0) + 1);
  const dupes = [...seen].filter(([, n]) => n > 1).map(([p]) => p);
  if (dupes.length){
    console.error("[talents editor] duplicate data-path:", dupes);
    setTimeout(() => msg("Editor bug — " + dupes.length +
      " key(s) are bound to more than one input: " + dupes.map(esc).join(", ") +
      ". Editing those is unsafe; fix the call site before saving.", "bad"), 0);
  }
  for (const inp of document.querySelectorAll("#out .fe")){
    inp.addEventListener("input", () => {
      const path = inp.dataset.path;
      const current = String(readPath(baseText(), path) ?? "");
      if (inp.value === current) edits.delete(path);
      else edits.set(path, inp.value);
      inp.classList.toggle("dirty", edits.has(path));
      updateSaveBar();
    });
  }
}
/* Read a path's current value out of a raw text, for the "did it actually
   change" test above. Cheap enough to parse each time; the file is 8 kB. */
function readPath(raw, path){
  try {
    const m = path.match(/^upgrades\.(upgrades|home|consumables)\[(\d+)\]\.(.+)$/);
    if (!m) return undefined;
    const o = JSON.parse(raw);
    const entry = (o[m[1]] || [])[Number(m[2])];
    if (!entry) return undefined;
    const rest = m[3];
    let mm;
    if ((mm = rest.match(/^params\.(\w+)$/))) return (entry.params || {})[mm[1]];
    if ((mm = rest.match(/^cost\[(\d+)\]$/)))
      return Array.isArray(entry.cost) ? entry.cost[Number(mm[1])] : entry.cost;
    return entry[rest];
  } catch (e){ return undefined; }
}

function showError(e){
  document.getElementById("out").innerHTML = `<div class="err">
    <h2>Could not read the game's files</h2>
    <p>${esc(e.message)}</p>
    <p style="margin-top:10px">This page fetches <code>../data/*.json</code> and <code>../js/*.js</code>,
      which needs a web server — <code>fetch()</code> is blocked under <code>file://</code>, exactly like the
      game itself.</p>
    <pre>python -m http.server 8000
http://localhost:8000/tidy-adventures/tools/talents.html</pre>
  </div>`;
}

/* ============================================================
   9. THE WATCH LOOP
============================================================ */
const dot = document.getElementById("watchDot");
const txt = document.getElementById("watchTxt");
const lastRead = document.getElementById("lastRead");
let timer = null, busy = false, lastChange = null;

async function tick(manual){
  if (busy) return;
  /* UNSAVED WORK WINS OVER A FRESH READ. A poll that repainted the page would
     throw away whatever is half-typed in an input, which is the one way this
     tool could lose work that was never on disk. So while anything is dirty
     the loop stops entirely rather than reading and not rendering — reading
     would also move the change baseline out from under the diff. */
  if (dirty() && !manual){
    dot.className = "dot off";
    txt.innerHTML = "watching paused — <b>unsaved changes</b>";
    return;
  }
  busy = true;
  try {
    await readAll();
    if (state.firstLoad || state.changed.length || manual){
      render();
      state.firstLoad = false;
    }
    lastRead.textContent = state.lastRead.toLocaleTimeString();
    /* THE NOTE IS STICKY. It used to clear on the next clean tick, which meant
       a change you did not happen to be looking at left no trace — the whole
       point of watching is that you can look away. */
    if (state.changed.length){
      lastChange = {
        at: state.lastRead,
        files: state.changed.map(k => FILES[k].split("/").pop()),
      };
    }
    dot.className = "dot" + (state.changed.length ? " hit" : Number(sel.value) ? "" : " off");
    txt.innerHTML = lastChange
      ? `reloaded <b>${lastChange.at.toLocaleTimeString()}</b> — ${lastChange.files.join(", ")}`
      : (Number(sel.value) ? "watching for changes" : "manual refresh only");
  } catch (e){
    dot.className = "dot off";
    txt.textContent = "read failed";
    if (state.firstLoad) showError(e);
    else console.error("[talents report]", e);
  } finally { busy = false; }
}

const sel = document.getElementById("ivl");
function schedule(){
  if (timer) clearInterval(timer);
  const ms = Number(sel.value);
  if (ms) timer = setInterval(() => tick(false), ms);
  if (lastChange) return;                       /* don't wipe a change note */
  dot.className = "dot" + (ms ? "" : " off");
  txt.textContent = ms ? "watching for changes" : "manual refresh only";
}
sel.addEventListener("change", schedule);
document.getElementById("refresh").addEventListener("click", () => {
  if (dirty() && !confirm("A refresh reads the file back and throws away your unsaved changes. Go ahead?")) return;
  work = null; workJson = null; edits.clear();
  tick(true);
});
document.getElementById("editBtn").addEventListener("click", () => {
  if (EDIT.on){
    if (dirty() && !confirm("You have unsaved changes. Leave edit mode and throw them away?")) return;
    work = null; workJson = null; edits.clear();
    EDIT.on = false;
    render(); schedule();
  } else {
    EDIT.on = true;
    render();
  }
});
/* Coming back to the tab is the other moment you want a fresh read: you have
   almost certainly just been editing a file in the other window. Not while
   dirty — tick() guards that, and this is the path that would hit it most. */
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(false); });
/* The browser's own last line of defence for work that is only in this tab. */
window.addEventListener("beforeunload", e => {
  if (!dirty()) return;
  e.preventDefault(); e.returnValue = "";
});

tick(true).then(schedule);
</script>
