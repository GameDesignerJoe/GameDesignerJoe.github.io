<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5fa630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Can you find the wolf in sheep's clothing? Spot the disguise, collect pelts, grow your farm.">
<title>Catch the Wolf</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Catch Wolf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage" role="img" aria-label="A field of sheep. One is a wolf in disguise. Use the arrow keys and Enter, or tap, to pick it."></canvas>
<div id="ui"></div>
<div id="boot">Rounding up the flock…</div>
<script type="module" src="js/main.js"></script>

</html>
