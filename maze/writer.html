<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Maze Script</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root {
  --ground:#f2f0ea; --surface:#e7e4dc; --edge:#cdc8bc; --stone:#6e6a62; --quiet:#8a857b;
  --ink:#23211d; --line-ink:#33302b; --gold:#9a7328; --rust:#a0553f; --focus:#3f6b7a;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground:#0f1113; --surface:#191d1f; --edge:#2b3134; --stone:#6e6a62; --quiet:#7d786d;
  --ink:#ece7da; --line-ink:#e4ded0; --gold:#d8b36a; --rust:#b07a6a; --focus:#7fb3c4;
} }
:root[data-theme="dark"] {
  --ground:#0f1113; --surface:#191d1f; --edge:#2b3134; --stone:#6e6a62; --quiet:#7d786d;
  --ink:#ece7da; --line-ink:#e4ded0; --gold:#d8b36a; --rust:#b07a6a; --focus:#7fb3c4;
}
* { box-sizing:border-box; }
body { background:var(--ground); color:var(--ink); margin:0;
  font-family:Jost,"Avenir Next","Gill Sans",system-ui,sans-serif; font-weight:300;
  -webkit-text-size-adjust:100%; }
.wrap { max-width:820px; margin:0 auto; padding-inline:20px; padding-block:28px 80px; }

header { display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
h1 { font-size:27px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; margin:0;
  text-wrap:balance; }
.sub { color:var(--quiet); font-size:14px; line-height:1.5; max-width:60ch; }
.mono { font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; }

.bar { position:sticky; top:0; z-index:5; background:var(--ground); border-bottom:1px solid var(--edge);
  padding-block:12px; margin-block:18px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.bar input[type=search] { flex:1 1 190px; min-width:0; background:var(--surface); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; padding:7px 10px; font:inherit; font-size:14px; }
.chip { background:none; color:var(--quiet); border:1px solid var(--edge); border-radius:3px;
  padding:6px 11px; font:inherit; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
  cursor:pointer; }
.chip[aria-pressed="true"] { color:var(--ground); background:var(--ink); border-color:var(--ink); }
.chip:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
.saved { margin-left:auto; font-size:12px; color:var(--quiet); letter-spacing:.06em; }

h2 { font-size:13px; font-weight:400; letter-spacing:.2em; text-transform:uppercase; color:var(--stone);
  margin:34px 0 0; padding-bottom:7px; border-bottom:1px solid var(--edge); }
.count { color:var(--quiet); letter-spacing:normal; text-transform:none; font-size:12px; }

.group { display:flex; flex-wrap:wrap; gap:4px 11px; align-items:baseline; margin:20px 0 2px;
  font-size:12px; color:var(--quiet); letter-spacing:.04em; }
.group .id { color:var(--stone); }
.group .chip.add { padding:3px 9px; font-size:11px; margin-left:auto; }
.row { border-bottom:1px solid var(--edge); padding:15px 0 13px 13px; border-left:2px solid transparent; }
.row.edited { border-left-color:var(--gold); }
.row.dead { opacity:.72; }
.row textarea { width:100%; background:none; color:var(--line-ink); border:none; padding:0; resize:none;
  font-family:Spectral,"Iowan Old Style",Palatino,Georgia,serif; font-style:italic; font-weight:300;
  font-size:18px; line-height:1.5; overflow:hidden; }
.row.card textarea, .row.page textarea { font-style:normal; }
.meta { display:flex; flex-wrap:wrap; gap:5px 12px; align-items:baseline; margin-top:9px;
  font-size:11.5px; color:var(--quiet); letter-spacing:.04em; }
.meta .id { color:var(--stone); }
.tag { text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; }
.tag.voice { color:var(--ink); }
.tag.warn { color:var(--gold); }
.tag.dead { color:var(--rust); }
.act { margin-left:auto; display:flex; gap:10px; }
.act button { background:none; border:none; color:var(--quiet); font:inherit; font-size:11.5px;
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:2px; }
.act button:hover { color:var(--ink); }
.act button.del:hover { color:var(--rust); }
.row.gone textarea { text-decoration:line-through; opacity:.45; }
.addline { margin:12px 0 0 13px; }
.empty { color:var(--quiet); font-size:14px; padding:26px 0; }
.note { display:none; width:100%; margin-top:8px; background:var(--surface); color:var(--ink);
  border:1px solid var(--edge); border-radius:3px; padding:7px 9px; font:inherit; font-size:13px; }
.note.show { display:block; }
@media (max-width:560px) { h1 { font-size:22px; } .row textarea { font-size:17px; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>The Maze Script</h1>
    <p class="sub">Every line the player can read, in the order they meet it. Edit in place — it saves
    as you type. <span class="mono" id="stat"></span></p>
  </header>

  <div class="bar">
    <input type="search" id="find" placeholder="Find a line…" aria-label="Find a line">
    <button class="chip" id="fEdited" aria-pressed="false">Edited</button>
    <button class="chip" id="fDead" aria-pressed="false">Never fires</button>
    <button class="chip" id="fLong" aria-pressed="false">Long</button>
    <button class="chip" id="copyOut" title="Put every change on the clipboard, to paste into the chat">Copy changes</button>
    <span class="saved" id="saved"></span>
  </div>

  <main id="script"></main>
</div>

,"chars":12,"pool":"TURN_LINES[\"The Child\"].hall","canAdd":false,"poolNote":"this list is not in POOL_RULES — I have not checked how the game picks from it"}]},{"name":"Chapter II — The Cartographer","lines":[{"id":"ROOM_LINES[\"The Cartographer\"].shelf[0]","text":"Shelving. Someone indexed this place before me.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":47,"pool":"ROOM_LINES[\"The Cartographer\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Cartographer\"].shelf[1]","text":"The spines are ordered. Not by author — by need.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":48,"pool":"ROOM_LINES[\"The Cartographer\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Cartographer\"].shelf[2]","text":"These are surveys of the same territory. Mine included. All of them wrong in the same way.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":90,"pool":"ROOM_LINES[\"The Cartographer\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Cartographer\"].basin[0]","text":"Seven stones. Weight, catalogued.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":33,"pool":"ROOM_LINES[\"The Cartographer\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Cartographer\"].basin[1]","text":"A stone for each survey that failed. That is a reading, not a fact.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":67,"pool":"ROOM_LINES[\"The Cartographer\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Cartographer\"].basin[2]","text":"I have been carrying the map's mistakes as if they were mine.","block":"ROOM_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter II — The Cartographer","dead":false,"chars":61,"pool":"ROOM_LINES[\"The Cartographer\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The Cartographer\"][0]","text":"Grid holds. For now.","block":"SELF_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":20,"pool":"SELF_LINES[\"The Cartographer\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Cartographer\"][1]","text":"This corridor was not here yesterday. I am confident in the instruments.","block":"SELF_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":72,"pool":"SELF_LINES[\"The Cartographer\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Cartographer\"][2]","text":"A map is a promise the ground doesn't have to keep.","block":"SELF_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":51,"pool":"SELF_LINES[\"The Cartographer\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Cartographer\"][3]","text":"I have indexed this junction twice. It has two different numbers.","block":"SELF_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":65,"pool":"SELF_LINES[\"The Cartographer\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Cartographer\"][4]","text":"If I cannot map it, I can at least describe how it refuses.","block":"SELF_LINES","kind":"prose","voice":"The Cartographer","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":59,"pool":"SELF_LINES[\"The Cartographer\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[1].name","text":"The Cartographer","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":16,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[1].summary","text":"Hope she found the map she was looking for.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":43,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[1].wake","text":"This is a solvable place.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":25,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[1].pages[0]","text":"Day 1. Grid established from the entrance. Every corridor can be indexed. Every index can be walked. This is a solvable place.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":126,"pool":"CAST[1].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[1].pages[1]","text":"Day 4. Sector C does not match yesterday's survey. I have checked my instruments twice. I am confident in the instruments.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":122,"pool":"CAST[1].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[1].pages[2]","text":"Day 9. I followed someone's twine for an hour. It led back to my own first marks. The handwriting was not mine. It was very nearly mine.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":136,"pool":"CAST[1].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[1].pages[3]","text":"Day 16. The map is finished. It is beautiful. It is wrong. I am no longer certain which of those matters.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":105,"pool":"CAST[1].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[1].pages[4]","text":"I have stopped correcting it. Whoever comes next: the map is a portrait, not a plan. Read it that way.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter II — The Cartographer","dead":false,"chars":102,"pool":"CAST[1].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"TUTORIALS.charcoal.title","text":"Charcoal","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":8,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.charcoal.why","text":"Someone drew with this. Perhaps it was me.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":42,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.charcoal.how","text":"When I take it up it draws what my light touches — the floor, the walls, the turns — until it wears down to nothing. I can set it down and pick it up again. The map I'm making is beside it, when I want to look.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":210,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.door.title","text":"A key","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":5,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.door.why","text":"Somewhere in here is a door with this shape on it. I've passed it, or I will.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":77,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.door.how","text":"Doors like that don't open for anyone without the matching key. When I find one I can't open, I should leave a mark — I'll be coming back to it.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter II — The Cartographer","dead":false,"chars":144,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Chapter III — The Soldier","lines":[{"id":"ROOM_LINES[\"The Soldier\"].shelf[0]","text":"Inventory: shelves, five. Contents, unknown.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":44,"pool":"ROOM_LINES[\"The Soldier\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Soldier\"].shelf[1]","text":"Field notes from other units. Same terrain.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":43,"pool":"ROOM_LINES[\"The Soldier\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Soldier\"].shelf[2]","text":"Every one of them was me on a different rotation. I would follow any of them.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":77,"pool":"ROOM_LINES[\"The Soldier\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Soldier\"].basin[0]","text":"Ballast. Something to steady a hand.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":36,"pool":"ROOM_LINES[\"The Soldier\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Soldier\"].basin[1]","text":"You don't put down what keeps you upright. That's what I was taught.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":68,"pool":"ROOM_LINES[\"The Soldier\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Soldier\"].basin[2]","text":"What I was taught was wrong. These aren't ballast. They're what I couldn't set down in front of anyone.","block":"ROOM_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter III — The Soldier","dead":false,"chars":103,"pool":"ROOM_LINES[\"The Soldier\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The Soldier\"][0]","text":"Water, half. Light, failing. Discipline, holding.","block":"SELF_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":49,"pool":"SELF_LINES[\"The Soldier\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Soldier\"][1]","text":"Mark the junction. Move. Don't think about the count.","block":"SELF_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":53,"pool":"SELF_LINES[\"The Soldier\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Soldier\"][2]","text":"Rooms make you feel found. Keep moving.","block":"SELF_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":39,"pool":"SELF_LINES[\"The Soldier\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Soldier\"][3]","text":"The place isn't the enemy. That's harder.","block":"SELF_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":41,"pool":"SELF_LINES[\"The Soldier\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Soldier\"][4]","text":"Things I will see again: nothing yet. Keep walking.","block":"SELF_LINES","kind":"prose","voice":"The Soldier","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":51,"pool":"SELF_LINES[\"The Soldier\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[2].name","text":"The Soldier","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":11,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[2].summary","text":"He counted everything. Hope the count came out.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":47,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[2].wake","text":"Mark every junction. Move at first light.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":41,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[2].pages[0]","text":"Inventory: water, four days. Rations, six. Chalk, one stick. Discipline, sufficient. Mark every junction. Move at first light.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":126,"pool":"CAST[2].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[2].pages[1]","text":"Rations, two. The chalk ran out before the corridors did. I have started marking with what I have. I do not recommend it.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":121,"pool":"CAST[2].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[2].pages[2]","text":"Rested in a wide room. Rooms are dangerous; they make you feel found. Kept moving.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":82,"pool":"CAST[2].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[2].pages[3]","text":"No supplies. Learned something: this place is not the enemy. It does not want anything. That is harder.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":103,"pool":"CAST[2].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[2].pages[4]","text":"Things I will not see again: the river behind the barracks. My mother's kitchen. Rain on a tent. Whoever reads this — see them for me.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter III — The Soldier","dead":false,"chars":134,"pool":"CAST[2].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"TUTORIALS.pointer.title","text":"A compass needle","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter III — The Soldier","dead":false,"chars":16,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.pointer.why","text":"It knows where the way out is. It doesn't know the way.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter III — The Soldier","dead":false,"chars":55,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.pointer.how","text":"It will point for a while, straight as a bird flies, and then it will stop. The corridors don't care where it points.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter III — The Soldier","dead":false,"chars":117,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Chapter IV — The Archivist","lines":[{"id":"ROOM_LINES[\"The Archivist\"].shelf[0]","text":"The shelving is sound. I know because I built it.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":49,"pool":"ROOM_LINES[\"The Archivist\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Archivist\"].shelf[1]","text":"Filed by hand. Not my hand. Nearly.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":35,"pool":"ROOM_LINES[\"The Archivist\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Archivist\"].shelf[2]","text":"I have read every page in this room. I know whose they are. I am not ready to file that.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":88,"pool":"ROOM_LINES[\"The Archivist\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Archivist\"].basin[0]","text":"Seven items, stone, unlabelled. Unusual for me.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":47,"pool":"ROOM_LINES[\"The Archivist\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Archivist\"].basin[1]","text":"I have never catalogued these. I think I refused to.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":52,"pool":"ROOM_LINES[\"The Archivist\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Archivist\"].basin[2]","text":"Entry: each stone is a thing I recorded instead of felt.","block":"ROOM_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter IV — The Archivist","dead":false,"chars":56,"pool":"ROOM_LINES[\"The Archivist\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The Archivist\"][0]","text":"Entry: corridor, unremarkable. Cross-reference pending.","block":"SELF_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":55,"pool":"SELF_LINES[\"The Archivist\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Archivist\"][1]","text":"I have not read them for meaning. I keep telling myself that.","block":"SELF_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":61,"pool":"SELF_LINES[\"The Archivist\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Archivist\"][2]","text":"Procedure is a way of not standing still long enough to notice.","block":"SELF_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":63,"pool":"SELF_LINES[\"The Archivist\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Archivist\"][3]","text":"Note to file: I stood here longer than the entry required.","block":"SELF_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":58,"pool":"SELF_LINES[\"The Archivist\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Archivist\"][4]","text":"Everything is catalogued. Nothing is understood.","block":"SELF_LINES","kind":"prose","voice":"The Archivist","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":48,"pool":"SELF_LINES[\"The Archivist\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[3].name","text":"The Archivist","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":13,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[3].summary","text":"He wrote everything down. Hope he read it back.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":47,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[3].wake","text":"Item: one man, waking. Condition: unknown.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":42,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[3].pages[0]","text":"Catalogue, entry 1. Five shelves in the first room. I built them. Whoever comes after will need somewhere to put what they find.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":128,"pool":"CAST[3].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[3].pages[1]","text":"Entry 40. The Cartographer's sheets, 31 pages, water-damaged. The Soldier's list, one page, folded eleven times. Filed by author. I have not read them for meaning. Meaning is not my department.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":193,"pool":"CAST[3].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[3].pages[2]","text":"Entry 112. A child's marks in chalk, corridor C-9 through C-14. Cross-referenced. Note: I stood at C-14 for some time. This is not procedure.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":141,"pool":"CAST[3].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[3].pages[3]","text":"Last entry. I have read them. All of them. I know whose they are now. I am going to put this pen down and sit with that for as long as it takes.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter IV — The Archivist","dead":false,"chars":144,"pool":"CAST[3].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"TUTORIALS.scrap.title","text":"A scrap of map","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter IV — The Archivist","dead":false,"chars":14,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.scrap.why","text":"Torn from something larger. The hand that drew it was steady.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter IV — The Archivist","dead":false,"chars":61,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.scrap.how","text":"It shows the halls around where it lay — a fifth of this place, near enough — and I've laid it into my own map. The rest is still mine to walk.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter IV — The Archivist","dead":false,"chars":143,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter I — The Child","lines":[{"id":"POOLS[0].who","text":"Father","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":6,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[0].stone","text":"Sight","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":5,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[0].approach[0]","text":"He said wait here. I waited. That is the whole of what I did wrong.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":67,"pool":"POOLS[0].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[0].approach[1]","text":"If he's at the water I don't know if I'll go to him or hit him.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":63,"pool":"POOLS[0].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[0].open","text":"I told you to wait. I was going to come back. I want to say that first, because it's true, and it doesn't matter.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":113,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[0].ex[0].say","text":"You did nothing wrong. Hear me. Nothing. I left a child in the dark and called it a minute.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":91,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[0].ex[0].choices[0]","text":"I hate you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":11,"pool":"POOLS[0].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[0].choices[1]","text":"Why didn't you come back?","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":25,"pool":"POOLS[0].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[0].reply[0]","text":"Good. Say it as long as you need. I'll still be here when you're done.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":70,"pool":"POOLS[0].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[0].reply[1]","text":"Because I was a coward, and then because I was ashamed, and then because too much time had gone. None of those were you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":120,"pool":"POOLS[0].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[1].say","text":"You've been standing where I put you for a very long time.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":58,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[0].ex[1].choices[0]","text":"I thought if I moved you'd never find me.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":41,"pool":"POOLS[0].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[1].choices[1]","text":"I stopped waiting for you years ago.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":36,"pool":"POOLS[0].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[1].reply[0]","text":"I know. That's the part I'll carry. Not you. Me.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":48,"pool":"POOLS[0].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].ex[1].reply[1]","text":"Then you were the brave one. Let me be the one who came anyway.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":63,"pool":"POOLS[0].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[0].close","text":"It was never you. It was me. You can see a little further now.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter I — The Child","dead":false,"chars":62,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter II — The Cartographer","lines":[{"id":"POOLS[1].who","text":"Wife","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":4,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[1].stone","text":"Pace","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":4,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[1].approach[0]","text":"Every plan I drew for us had a line through it by the second year.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":66,"pool":"POOLS[1].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[1].approach[1]","text":"She is going to ask why I needed the map. I don't have an answer that isn't the map.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":84,"pool":"POOLS[1].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[1].open","text":"You drew me a map once, of how our life would go. It was beautiful. It was wrong.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":81,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[1].ex[0].say","text":"Every turn you couldn't plan, you took as a failure. Mine too.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":62,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[1].ex[0].choices[0]","text":"I wanted it to hold still.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":26,"pool":"POOLS[1].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[0].choices[1]","text":"I was afraid of getting it wrong.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":33,"pool":"POOLS[1].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[0].reply[0]","text":"Nothing holds still. You knew that. You loved that, before.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":59,"pool":"POOLS[1].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[0].reply[1]","text":"You did get it wrong. So did I. We were still here.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":51,"pool":"POOLS[1].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[1].say","text":"What would you do if you didn't have the map?","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":45,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[1].ex[1].choices[0]","text":"Walk anyway.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":12,"pool":"POOLS[1].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[1].choices[1]","text":"Ask you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":8,"pool":"POOLS[1].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[1].reply[0]","text":"Then walk. I'll keep up.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":24,"pool":"POOLS[1].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].ex[1].reply[1]","text":"Then ask. I've been waiting to be asked.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":40,"pool":"POOLS[1].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[1].close","text":"Slower isn't safer. You can move now.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter II — The Cartographer","dead":false,"chars":37,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter III — The Soldier","lines":[{"id":"POOLS[2].who","text":"Brother","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":7,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[2].stone","text":"Memory","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":6,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[2].approach[0]","text":"I put him on the list. Things I won't see again. He was alive when I wrote it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":78,"pool":"POOLS[2].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[2].approach[1]","text":"Rations, none. Discipline, none. Just this hall and whatever's at the end.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":74,"pool":"POOLS[2].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[2].open","text":"You made a list of everything you'd never see again. I was on it. I'm right here.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":81,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[2].ex[0].say","text":"You rationed everything. Even the parts of you I wanted.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":56,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[2].ex[0].choices[0]","text":"I thought discipline would get me out.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":38,"pool":"POOLS[2].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[0].choices[1]","text":"I didn't know how else to be.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":29,"pool":"POOLS[2].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[0].reply[0]","text":"It got you far. It didn't get you home.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":39,"pool":"POOLS[2].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[0].reply[1]","text":"You knew once. You were the kid who laughed too loud.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":53,"pool":"POOLS[2].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[1].say","text":"Tell me one thing you'd put back on the list. The good one.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":59,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[2].ex[1].choices[0]","text":"Rain on a tent.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":15,"pool":"POOLS[2].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[1].choices[1]","text":"Mom's kitchen.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":14,"pool":"POOLS[2].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[1].reply[0]","text":"I'll take you camping. Bring nothing.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":37,"pool":"POOLS[2].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].ex[1].reply[1]","text":"Sunday. She's already cooking.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":30,"pool":"POOLS[2].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[2].close","text":"You don't have to hold it all in your head. Some of it we hold for you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter III — The Soldier","dead":false,"chars":71,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter IV — The Archivist","lines":[{"id":"POOLS[3].who","text":"Daughter","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":8,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[3].stone","text":"Fear","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":4,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[3].approach[0]","text":"Entry: the year she stopped calling. I filed it. I did not call back.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":69,"pool":"POOLS[3].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[3].approach[1]","text":"I have every fact about her and I could not tell you what she wanted from me.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":77,"pool":"POOLS[3].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[3].open","text":"Dad. You wrote everything down and read none of it. I read it. All of it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":73,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[3].ex[0].say","text":"You catalogued me too. Height, grades, the year I stopped calling.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":66,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[3].ex[0].choices[0]","text":"I didn't know what else to do with it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":38,"pool":"POOLS[3].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[0].choices[1]","text":"I was afraid of what it meant.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":30,"pool":"POOLS[3].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[0].reply[0]","text":"You could have asked me what it meant.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":38,"pool":"POOLS[3].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[0].reply[1]","text":"It meant I missed you. That's all it ever meant.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":48,"pool":"POOLS[3].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[1].say","text":"What's the one entry you never filed?","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":37,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[3].ex[1].choices[0]","text":"That I was proud of you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":24,"pool":"POOLS[3].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[1].choices[1]","text":"That I was sorry.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":17,"pool":"POOLS[3].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[1].reply[0]","text":"File it now. Out loud.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":22,"pool":"POOLS[3].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].ex[1].reply[1]","text":"Filed. Received. Come on.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":25,"pool":"POOLS[3].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[3].close","text":"It's less dark than you kept telling yourself.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter IV — The Archivist","dead":false,"chars":46,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Chapter V — The Priest","lines":[{"id":"ROOM_LINES[\"The Priest\"].shelf[0]","text":"Scripture, or something like it. Written by the lost.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":53,"pool":"ROOM_LINES[\"The Priest\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Priest\"].shelf[1]","text":"Each of these gave themselves to something. Only one of them to God.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":68,"pool":"ROOM_LINES[\"The Priest\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Priest\"].shelf[2]","text":"The same soul on every shelf, praying in different words.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":57,"pool":"ROOM_LINES[\"The Priest\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Priest\"].basin[0]","text":"An offering bowl. The offerings were never made.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":48,"pool":"ROOM_LINES[\"The Priest\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Priest\"].basin[1]","text":"I fasted rather than set these down. It felt like devotion.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":59,"pool":"ROOM_LINES[\"The Priest\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Priest\"].basin[2]","text":"What I called devotion was a way to keep holding on.","block":"ROOM_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter V — The Priest","dead":false,"chars":52,"pool":"ROOM_LINES[\"The Priest\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The Priest\"][0]","text":"I take each turning as it is given.","block":"SELF_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter V — The Priest","dead":false,"chars":35,"pool":"SELF_LINES[\"The Priest\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Priest\"][1]","text":"The dark has a texture. Like cloth.","block":"SELF_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter V — The Priest","dead":false,"chars":35,"pool":"SELF_LINES[\"The Priest\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Priest\"][2]","text":"I believe I am being held. I have to believe it.","block":"SELF_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter V — The Priest","dead":false,"chars":48,"pool":"SELF_LINES[\"The Priest\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Priest\"][3]","text":"To mark is to doubt. I have marked anyway.","block":"SELF_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter V — The Priest","dead":false,"chars":42,"pool":"SELF_LINES[\"The Priest\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Priest\"][4]","text":"There is a room at the center. I feel it the way the blind feel a window.","block":"SELF_LINES","kind":"prose","voice":"The Priest","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter V — The Priest","dead":false,"chars":73,"pool":"SELF_LINES[\"The Priest\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[4].name","text":"The Priest","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":10,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[4].summary","text":"Hope the emptiness was worth it.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":32,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[4].wake","text":"I came here to be emptied.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":26,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[4].pages[0]","text":"I came here to be emptied. The corridors are patient teachers. I take each turning as it is given.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":98,"pool":"CAST[4].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[4].pages[1]","text":"Fasted three days. The dark has a texture now, like cloth. I believe I am being held.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":85,"pool":"CAST[4].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[4].pages[2]","text":"Marked no junctions today. To mark is to doubt. To doubt is to carry. I have put down the chalk.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":96,"pool":"CAST[4].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[4].pages[3]","text":"There is a room at the center. I have not found it. I feel it the way the blind feel a window.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":94,"pool":"CAST[4].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[4].pages[4]","text":"And the walls said: you were never lost, only unwilling. And I said yes. And the way was open.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter V — The Priest","dead":false,"chars":94,"pool":"CAST[4].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"TUTORIALS.path.title","text":"A spool of thread","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":17,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.path.why","text":"Somebody measured this place once and left the measure on the floor.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":68,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.path.how","text":"I can see it now, laid along the stones wherever my light falls — the shortest way out. It won't stay visible long. It never does.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":130,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.lamp.title","text":"A lamp","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":6,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.lamp.why","text":"There are places here the walls have swallowed the light entirely.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":66,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.lamp.how","text":"Lit, it throws a cone ahead of me, the way I'm facing, and a little warmth at my feet. I can douse it and light it again from the lamp beside my tools. In the dark, without it, I would see only myself.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter V — The Priest","dead":false,"chars":201,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Chapter VI — The Criminal","lines":[{"id":"ROOM_LINES[\"The Criminal\"].shelf[0]","text":"Books. Somebody's confession, probably. Everyone's got one.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":59,"pool":"ROOM_LINES[\"The Criminal\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Criminal\"].shelf[1]","text":"I read a page. Kid's handwriting. I put it back fast.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":53,"pool":"ROOM_LINES[\"The Criminal\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Criminal\"].shelf[2]","text":"They're all mine. Every shelf. I don't know how to be sorry to that many people.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":80,"pool":"ROOM_LINES[\"The Criminal\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Criminal\"].basin[0]","text":"Rocks. Fine. I'll carry rocks.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":30,"pool":"ROOM_LINES[\"The Criminal\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Criminal\"].basin[1]","text":"Heavier than they look. Like most things I did.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":47,"pool":"ROOM_LINES[\"The Criminal\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The Criminal\"].basin[2]","text":"Nobody handed me these. I picked every one of them up myself.","block":"ROOM_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VI — The Criminal","dead":false,"chars":61,"pool":"ROOM_LINES[\"The Criminal\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The Criminal\"][0]","text":"Walked in on purpose. Remember that.","block":"SELF_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":36,"pool":"SELF_LINES[\"The Criminal\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Criminal\"][1]","text":"Wall won. Wall always wins.","block":"SELF_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":27,"pool":"SELF_LINES[\"The Criminal\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Criminal\"][2]","text":"Kid's marks again. Whoever left a child down here.","block":"SELF_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":50,"pool":"SELF_LINES[\"The Criminal\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Criminal\"][3]","text":"Nobody's coming. Good. Nobody should.","block":"SELF_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":37,"pool":"SELF_LINES[\"The Criminal\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The Criminal\"][4]","text":"Tired. Not the sleeping kind.","block":"SELF_LINES","kind":"prose","voice":"The Criminal","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":29,"pool":"SELF_LINES[\"The Criminal\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[5].name","text":"The Criminal","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":12,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[5].summary","text":"Hope he made peace with it. Hope that was enough.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":49,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[5].wake","text":"Don't know who built this. Don't care.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":38,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[5].pages[0]","text":"Don't know who built this. Don't care. Walked in on purpose. Better than what was behind me.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":92,"pool":"CAST[5].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[5].pages[1]","text":"Found a kid's chalk marks. Dozens of them. Whoever left a child down here deserves worse than this place.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":105,"pool":"CAST[5].pages","canAdd":true,"poolNote":"one mor
