e page to find before this chapter ends"},{"id":"CAST[5].pages[2]","text":"Kicked a wall for an hour. Wall won. Everything wins against me eventually. That's the whole story.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":99,"pool":"CAST[5].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[5].pages[3]","text":"Tired. Not the sleeping kind. The kind where you stop arguing with the floor about who's right.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":95,"pool":"CAST[5].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[5].pages[4]","text":"If anyone finds this: I did it. All of it. Nobody put me here. That's the first true thing I've written.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VI — The Criminal","dead":false,"chars":104,"pool":"CAST[5].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"TUTORIALS.key.title","text":"A key","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter VI — The Criminal","dead":false,"chars":5,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.key.why","text":"The way out was barred long before I arrived.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter VI — The Criminal","dead":false,"chars":45,"pool":null,"canAdd":false,"poolNote":null},{"id":"TUTORIALS.key.how","text":"There's a gate over the exit, a ring in one of the far corners. I carry this to it and push through.","block":"TUTORIALS","kind":"prose","voice":"everyone","surface":"card","fires":"once ever","when":"The first time you find one, in whichever chapter that is","chapter":"Chapter VI — The Criminal","dead":false,"chars":100,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Chapter VII — The One Who Stayed","lines":[{"id":"ROOM_LINES[\"The One Who Stayed\"].shelf[0]","text":"I dust these. I have for years.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":31,"pool":"ROOM_LINES[\"The One Who Stayed\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The One Who Stayed\"].shelf[1]","text":"I know the order they go in. I know why.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":40,"pool":"ROOM_LINES[\"The One Who Stayed\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The One Who Stayed\"].shelf[2]","text":"I have read them so many times I could have written them. I did write them.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":75,"pool":"ROOM_LINES[\"The One Who Stayed\"].shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The One Who Stayed\"].basin[0]","text":"I keep the stones here. It's tidy.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":34,"pool":"ROOM_LINES[\"The One Who Stayed\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The One Who Stayed\"].basin[1]","text":"Some days I take one out and hold it. Then I put it back.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":57,"pool":"ROOM_LINES[\"The One Who Stayed\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES[\"The One Who Stayed\"].basin[2]","text":"There is no reason to keep them except that keeping them means staying.","block":"ROOM_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":71,"pool":"ROOM_LINES[\"The One Who Stayed\"].basin","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"SELF_LINES[\"The One Who Stayed\"][0]","text":"I know this turn. I know the next one.","block":"SELF_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":38,"pool":"SELF_LINES[\"The One Who Stayed\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The One Who Stayed\"][1]","text":"It's quiet. Nothing asked of me. That used to be the point.","block":"SELF_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":59,"pool":"SELF_LINES[\"The One Who Stayed\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The One Who Stayed\"][2]","text":"Someone is still waiting. I have made a room out of their waiting.","block":"SELF_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":66,"pool":"SELF_LINES[\"The One Who Stayed\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The One Who Stayed\"][3]","text":"I sweep these halls. Whose halls did I think they were?","block":"SELF_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":55,"pool":"SELF_LINES[\"The One Who Stayed\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES[\"The One Who Stayed\"][4]","text":"The way out is that way. It has always been that way.","block":"SELF_LINES","kind":"prose","voice":"The One Who Stayed","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":53,"pool":"SELF_LINES[\"The One Who Stayed\"]","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"CAST[6].name","text":"The One Who Stayed","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":18,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[6].summary","text":"He knew the way out. He knew everyone here.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":43,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[6].wake","text":"I have been here longer than I have been anywhere.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":50,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[6].pages[0]","text":"I know where the exit is. I have known for a long time. The child, the mapmaker, the soldier, the clerk, the monk, the thief — I've read them all. I sweep their halls.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":167,"pool":"CAST[6].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[6].pages[1]","text":"It is quiet here and the walls ask nothing. Out there someone is still waiting, and I have made them wait so long that the waiting has become a room of its own.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":160,"pool":"CAST[6].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"},{"id":"CAST[6].pages[2]","text":"I am going to write my name. Not here. At the door.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VII — The One Who Stayed","dead":false,"chars":51,"pool":"CAST[6].pages","canAdd":true,"poolNote":"one more page to find before this chapter ends"}]},{"name":"Chapter VIII — You","lines":[{"id":"CAST[7].name","text":"You","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VIII — You","dead":false,"chars":3,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[7].summary","text":"","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VIII — You","dead":false,"chars":0,"pool":null,"canAdd":false,"poolNote":null},{"id":"CAST[7].wake","text":"I know this room.","block":"CAST","kind":"prose","voice":"per self","surface":"page","fires":"once ever","when":"The journal pages, and the lines on waking and leaving a chapter","chapter":"Chapter VIII — You","dead":false,"chars":17,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter V — The Priest","lines":[{"id":"POOLS[4].who","text":"Father","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":6,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[4].stone","text":"Direction","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":9,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[4].approach[0]","text":"I prayed for an hour every night in the room next to his and never once knocked.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":80,"pool":"POOLS[4].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[4].approach[1]","text":"He taught me the kneeling. I taught myself the silence.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":55,"pool":"POOLS[4].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[4].open","text":"You gave yourself to everything but the people in the room. I know. I taught you that.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":86,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[4].ex[0].say","text":"I prayed instead of talking too. You learned it from watching.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":62,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[4].ex[0].choices[0]","text":"I thought it made me good.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":26,"pool":"POOLS[4].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[0].choices[1]","text":"It was easier than looking at you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":34,"pool":"POOLS[4].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[0].reply[0]","text":"It made you quiet. Those aren't the same.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":41,"pool":"POOLS[4].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[0].reply[1]","text":"I know. I'm looking at you now.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":31,"pool":"POOLS[4].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[1].say","text":"If you could ask for one thing and have it, right here.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":55,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[4].ex[1].choices[0]","text":"To be told I'm enough.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":22,"pool":"POOLS[4].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[1].choices[1]","text":"To go home.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":11,"pool":"POOLS[4].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[1].reply[0]","text":"You're enough. You always were. I should have said it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":54,"pool":"POOLS[4].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].ex[1].reply[1]","text":"Then go. The way's shorter than you think.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":42,"pool":"POOLS[4].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[4].close","text":"You'll hold a direction a little longer now.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter V — The Priest","dead":false,"chars":44,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter VI — The Criminal","lines":[{"id":"POOLS[5].who","text":"Oldest friend","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":13,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[5].stone","text":"Shame","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":5,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[5].approach[0]","text":"He knows what I did. He knew before the others. He's the one I never let say it back.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":85,"pool":"POOLS[5].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[5].approach[1]","text":"There is a sentence I have been serving that no one handed down. I set the term myself.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":87,"pool":"POOLS[5].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[5].open","text":"Nobody put you here. I know. You've said it. Now hear the rest.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":63,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[5].ex[0].say","text":"You did the thing. It's done. You've been serving a sentence no one else handed down.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":85,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[5].ex[0].choices[0]","text":"Someone should have.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":20,"pool":"POOLS[5].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[0].choices[1]","text":"I couldn't forgive it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":22,"pool":"POOLS[5].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[0].reply[0]","text":"Maybe. But not forever. Not this.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":33,"pool":"POOLS[5].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[0].reply[1]","text":"Then let me. I do. I did years ago.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":35,"pool":"POOLS[5].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[1].say","text":"What do you want, if you stop carrying it?","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":42,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[5].ex[1].choices[0]","text":"To be let back in.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":18,"pool":"POOLS[5].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[1].choices[1]","text":"I don't know how to stop.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":25,"pool":"POOLS[5].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[1].reply[0]","text":"You were never out. You just wouldn't come to the door.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":55,"pool":"POOLS[5].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].ex[1].reply[1]","text":"You put it down. Like anything else. Like this.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":47,"pool":"POOLS[5].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[5].close","text":"Fewer doors will be locked against you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VI — The Criminal","dead":false,"chars":39,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"After Chapter VII — The One Who Stayed","lines":[{"id":"POOLS[6].who","text":"Wife","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":4,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[6].stone","text":"Scale","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":5,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[6].approach[0]","text":"I have known the way out for years. I have known she was standing at it for years.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":82,"pool":"POOLS[6].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[6].approach[1]","text":"It's not that I couldn't leave. It's that leaving meant admitting how long I stayed.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":84,"pool":"POOLS[6].approach","canAdd":true,"poolNote":"one more line on the walk down to the water"},{"id":"POOLS[6].open","text":"You know the way out. You've known for years. I've been standing at it.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":71,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[6].ex[0].say","text":"It got comfortable in there. I understand. Quiet. Nothing asked of you.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":71,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[6].ex[0].choices[0]","text":"I made you wait too long.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":25,"pool":"POOLS[6].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[0].choices[1]","text":"I didn't think you'd still be there.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":36,"pool":"POOLS[6].ex[0].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[0].reply[0]","text":"You did. I'm still here. Both are true.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":39,"pool":"POOLS[6].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[0].reply[1]","text":"I'm here. Let's not make it a habit.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":36,"pool":"POOLS[6].ex[0].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[1].say","text":"How big does it have to be, this place, before it's enough?","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":59,"pool":null,"canAdd":false,"poolNote":null},{"id":"POOLS[6].ex[1].choices[0]","text":"It was never going to be enough.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":32,"pool":"POOLS[6].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[1].choices[1]","text":"It can be small now.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":20,"pool":"POOLS[6].ex[1].choices","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[1].reply[0]","text":"No. Come home instead.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":22,"pool":"POOLS[6].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].ex[1].reply[1]","text":"Small enough to walk out of.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":28,"pool":"POOLS[6].ex[1].reply","canAdd":false,"poolNote":"a choice and its reply are a pair — adding one needs the other, so this is a code change"},{"id":"POOLS[6].close","text":"The place is smaller than it was. Small enough.","block":"POOLS","kind":"prose","voice":"per self","surface":"pool","fires":"once ever","when":"The exchange at the water, between chapters","chapter":"After Chapter VII — The One Who Stayed","dead":false,"chars":47,"pool":null,"canAdd":false,"poolNote":null}]},{"name":"Any chapter","lines":[{"id":"ROOM_LINES.You.shelf[0]","text":"I wrote these.","block":"ROOM_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":null,"dead":false,"chars":14,"pool":"ROOM_LINES.You.shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES.You.shelf[1]","text":"I wrote these.","block":"ROOM_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":null,"dead":false,"chars":14,"pool":"ROOM_LINES.You.shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES.You.shelf[2]","text":"I wrote these.","block":"ROOM_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":null,"dead":false,"chars":14,"pool":"ROOM_LINES.You.shelf","canAdd":true,"poolNote":"spread across the chapter as you gather pages — one more line makes the steps finer"},{"id":"ROOM_LINES.You.basin[0]","text":"It's empty. It's just water.","block":"ROOM_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"once a run","when":"Standing at the shelves or the basin in the start room","chapter":null,"de se,"chars":38,"pool":"EMPTY_SHELF","canAdd":true,"poolNote":"picked at random"},{"id":"EMPTY_SHELF[2]","text":"A shelf built for something. I don't know what.","block":"EMPTY_SHELF","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At a shelf with nothing on it","chapter":null,"dead":false,"chars":47,"pool":"EMPTY_SHELF","canAdd":true,"poolNote":"picked at random"},{"id":"EMPTY_SHELF[3]","text":"Dust, and the shape of where books would go.","block":"EMPTY_SHELF","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At a shelf with nothing on it","chapter":null,"dead":false,"chars":44,"pool":"EMPTY_SHELF","canAdd":true,"poolNote":"picked at random"},{"id":"SHELF_LINES[0]","text":"A collection of notes. Where did these come from?","block":"SHELF_LINES","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At the shelves","chapter":null,"dead":false,"chars":49,"pool":"SHELF_LINES","canAdd":true,"poolNote":"played once each, then the set starts over"},{"id":"SHELF_LINES[1]","text":"Someone has been keeping these. I don't remember starting.","block":"SHELF_LINES","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At the shelves","chapter":null,"dead":false,"chars":58,"pool":"SHELF_LINES","canAdd":true,"poolNote":"played once each, then the set starts over"},{"id":"SHELF_LINES[2]","text":"Five shelves. I know the hands that filled them, and I don't.","block":"SHELF_LINES","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At the shelves","chapter":null,"dead":false,"chars":61,"pool":"SHELF_LINES","canAdd":true,"poolNote":"played once each, then the set starts over"},{"id":"SHELF_LINES[3]","text":"Pages stacked with care. Not mine. Almost mine.","block":"SHELF_LINES","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At the shelves","chapter":null,"dead":false,"chars":47,"pool":"SHELF_LINES","canAdd":true,"poolNote":"played once each, then the set starts over"},{"id":"SHELF_LINES[4]","text":"The books are arranged the way I would arrange them. That should worry me more than it does.","block":"SHELF_LINES","kind":"prose","voice":"everyone","surface":"narrator","fires":"once a run","when":"At the shelves","chapter":null,"dead":false,"chars":92,"pool":"SHELF_LINES","canAdd":true,"poolNote":"played once each, then the set starts over"},{"id":"SELF_LINES.You[0]","text":"I know this room.","block":"SELF_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":null,"dead":false,"chars":17,"pool":"SELF_LINES.You","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES.You[1]","text":"I know these halls. I walked them as everyone.","block":"SELF_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":null,"dead":false,"chars":46,"pool":"SELF_LINES.You","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES.You[2]","text":"There is nothing left to carry.","block":"SELF_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":null,"dead":false,"chars":31,"pool":"SELF_LINES.You","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"SELF_LINES.You[3]","text":"The door is open. It has been for a while.","block":"SELF_LINES","kind":"prose","voice":"per self","surface":"narrator","fires":"rotation","when":"While wandering, every couple of minutes, in this self’s chapter","chapter":null,"dead":false,"chars":42,"pool":"SELF_LINES.You","canAdd":true,"poolNote":"shuffled and played through, so a new line joins the rotation"},{"id":"NARRATOR[0]","text":"How did I get here?","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":true,"chars":19,"pool":"NARRATOR","canAdd":false,"poolNote":"nothing in the game fires this block at all"},{"id":"NARRATOR[1]","text":"Why is this so familiar?","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":true,"chars":24,"pool":"NARRATOR","canAdd":false,"poolNote":"nothing in the game fires this block at all"},{"id":"NARRATOR[2]","text":"This maze — is it real?","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":true,"chars":23,"pool":"NARRATOR","canAdd":false,"poolNote":"nothing in the game fires this block at all"},{"id":"NARRATOR[3]","text":"The Labyrinth shifts for those who move through it, molding itself to the mind of the visitor.","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":true,"chars":94,"pool":"NARRATOR","canAdd":false,"poolNote":"nothing in the game fires this block at all"},{"id":"NARRATOR[4]","text":"I have counted these halls before. The number is never the same.","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":true,"chars":64,"pool":"NARRATOR","canAdd":false,"poolNote":"nothing in the game fires this block at all"},{"id":"NARRATOR[5]","text":"The walls are patient. They have outlasted everyone who tried to remember them.","block":"NARRATOR","kind":"prose","voice":"everyone","surface":"narrator","fires":"rotation","when":"Unreferenced — see the dead column","chapter":null,"dead":tr nd its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.spouse.steps[3].a[1]","text":"Come out. Not all the way. A hand. Stop making me guess whether you're in there.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":80,"pool":"EXCHANGES.spouse.steps[3].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.spouse.done","text":"I'm still here. I don't know how long. Neither do you. That's what a marriage is.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":81,"pool":null,"canAdd":false,"poolNote":null},{"id":"EXCHANGES.friend.steps[0].q[0]","text":"Did I pull you down?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":20,"pool":"EXCHANGES.friend.steps[0].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[0].q[1]","text":"Why didn't you follow the rules?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":32,"pool":"EXCHANGES.friend.steps[0].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[0].a[0]","text":"Yes. I was already going. You made it faster and then you made it lonelier.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At lNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[1].a[1]","text":"I did. For a long time. Blame got heavy. I put it down before you did.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":70,"pool":"EXCHANGES.friend.steps[1].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[2].q[0]","text":"Why would you help me?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":22,"pool":"EXCHANGES.friend.steps[2].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[2].q[1]","text":"Don't you think I deserve this?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":31,"pool":"EXCHANGES.friend.steps[2].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[2].a[0]","text":"Because someone did it for me and I didn't deserve it either. That's how it works. It isn't earned.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":99,"pool":"EXCHANGES.friend.steps[2].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[2].a[1]","text":"I think deserve is a word you use to stay where you are.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":56,"pool":"EXCHANGES.friend.steps[2].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[3].q[0]","text":"What do I say to you?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":21,"pool":"EXCHANGES.friend.steps[3].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[3].q[1]","text":"Can it go back?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":15,"pool":"EXCHANGES.friend.steps[3].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[3].a[0]","text":"You already said it. You're here.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":33,"pool":"EXCHANGES.friend.steps[3].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.steps[3].a[1]","text":"No. It goes forward or it doesn't go. I'd take forward.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":55,"pool":"EXCHANGES.friend.steps[3].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.friend.done","text":"The hand's still out. It's not going anywhere. You know where I am.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":67,"pool":null,"canAdd":false,"poolNote":null},{"id":"EXCHANGES.teen.steps[0].q[0]","text":"Are you angry at me?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":20,"pool":"EXCHANGES.teen.steps[0].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.teen.steps[0].q[1]","text":"Do you know I love you?","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":23,"pool":"EXCHANGES.teen.steps[0].q","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.teen.steps[0].a[0]","text":"Yeah. Obviously. Are you going to do anything about it or is this another one of the talks.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once ever","when":"At a statue, after the offering goes in","chapter":null,"dead":false,"chars":91,"pool":"EXCHANGES.teen.steps[0].a","canAdd":false,"poolNote":"a question and its answer are paired by position — adding one needs the other, so this is a code change"},{"id":"EXCHANGES.teen.steps[0].a[1]","text":"I know you say it. I know you think it. I don't know what it's for if you won't let me near you.","block":"EXCHANGES","kind":"prose","voice":"per self","surface":"shrine","fires":"once  dead ends","chapter":null,"dead":true,"chars":12,"pool":"WALL_WORDS._","canAdd":false,"poolNote":"this list is not in POOL_RULES — I have not checked how the game picks from it"},{"id":"WALL_WORDS._[4]","text":"turn back","block":"WALL_WORDS","kind":"prose","voice":"per self","surface":"wall","fires":"every maze","when":"First person: written on the far wall of a few dead ends","chapter":null,"dead":true,"chars":9,"pool":"WALL_WORDS._","canAdd":false,"poolNote":"this list is not in POOL_RULES — I have not checked how the game picks from it"},{"id":"WALL_WORDS._[5]","text":"keep the light on your left","block":"WALL_WORDS","kind":"prose","voice":"per self","surface":"wall","fires":"every maze","when":"First person: written on the far wall of a few dead ends","chapter":null,"dead":true,"chars":27,"pool":"WALL_WORDS._","canAdd":false,"poolNote":"this list is not in POOL_RULES — I have not checked how the game picks from it"}]}],"room":{"narrator":100,"card":280,"page":400,"pool":200,"shrine":90,"map":80,"unknown":200},"stamp":"194c553d","total":516};
const $ = (id) => document.getElementById(id);
let edits = {};            // id -> {text, note, deleted}
let added = [];            // {id, block, chapter, after, text}
let db = null, saveTimer = null, dirty = false;

const roomFor = (s) => DATA.room[s] || DATA.room.unknown;
const liveText = (l) => (edits[l.id] && typeof edits[l.id].text === 'string') ? edits[l.id].text : l.text;
const isEdited = (l) => { const e = edits[l.id]; return !!e && (e.deleted || (typeof e.text === 'string' && e.text !== l.text)); };

function setSaved(msg) { $('saved').textContent = msg; }

const LOCAL = 'maze.writer.v1';
function saveLocal() { try { localStorage.setItem(LOCAL, JSON.stringify({ edits, added, updatedAt: new Date().toISOString() })); return true; } catch (e) { return false; } }
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL) || 'null'); } catch (e) { return null; } }

// Two homes. Opened from claude.ai the page has a store I can read from my end, which is the whole
// loop. Opened from gamedesignerjoe.github.io it has no such thing — so rather than pretend, it
// keeps your work in this browser and gives you a button to hand it over.
function queueSave() {
  dirty = true; setSaved('saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!db) {
      const ok = saveLocal();
      dirty = !ok;
      setSaved(ok ? 'kept on this device — press Copy changes when you want them in the game'
                  : 'this browser will not let me save — copy your changes out now');
      return;
    }
    try {
      await db.doc('writer/edits').set({ edits, added, updatedAt: new Date().toISOString() });
      saveLocal();                         // a spare copy, in case the network was lying
      dirty = false;
      setSaved('saved ' + new Date().toLocaleTimeString());
    } catch (e) { saveLocal(); setSaved('could not reach the store — kept on this device'); }
  }, 700);
}

async function copyChanges() {
  const n = Object.keys(edits).length + added.length;
  if (!n) { setSaved('nothing changed yet'); return; }
  const out = JSON.stringify({ edits, added, from: 'The Maze Script', at: new Date().toISOString() }, null, 1);
  try { await navigator.clipboard.writeText(out); setSaved('copied ' + n + ' change' + (n === 1 ? '' : 's') + ' — paste them to me'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = out;
    ta.style.cssText = 'position:fixed;inset:10% 5%;z-index:99;width:90%;height:70%';
    document.body.appendChild(ta); ta.select();
    setSaved('select all and copy, then tap outside');
    ta.addEventListener('blur', () => ta.remove());
  }
}

function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

// The event a line belongs to: the list it is picked from, or — for a line that stands alone —
// whatever holds it (the chalk card, one moment, one page).
function groupKey(l) { return l.pool || l.id.replace(/[.[][^.[]*$/, ''); }

function groupHead(l, key) {
  const g = document.createElement('p'); g.className = 'group';
  const add = (cls, txt) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = txt; g.appendChild(s); return s; };
  add('', l.when);
  add('tag', l.fires);
  add('id mono', key);
  if (l.dead) add('tag dead', 'nothing fires this');

  if (l.pool && l.canAdd) {
    const b = document.createElement('button'); b.className = 'chip add';
    b.textContent = '+ line';
    b.title = l.poolNote || '';
    b.addEventListener('click', () => {
      added.push({ id: 'added.' + key + '.' + (added.length + 1), pool: l.pool, block: l.block,
                   chapter: l.chapter || 'Any chapter', text: '', why: l.poolNote });
      queueSave(); render();
    });
    g.appendChild(b);
  } else if (l.pool) {
    add('tag dead', 'cannot take another line');
    if (l.poolNote) add('', l.poolNote);
  }
  return g;
}

function rowFor(l) {
  const row = document.createElement('div');
  const e = edits[l.id] || {};
  row.className = 'row ' + l.surface + (isEdited(l) ? ' edited' : '') + (l.dead ? ' dead' : '') + (e.deleted ? ' gone' : '');
  row.dataset.id = l.id;

  const ta = document.createElement('textarea');
  ta.value = liveText(l); ta.spellcheck = true; ta.rows = 1;
  ta.id = 'ta-' + btoa(unescape(encodeURIComponent(l.id))).replace(/=/g, '');
  ta.setAttribute('aria-label', 'Line ' + l.id);
  ta.addEventListener('input', () => {
    grow(ta);
    edits[l.id] = Object.assign({}, edits[l.id], { text: ta.value });
    row.classList.toggle('edited', isEdited(l));
    chars.textContent = ta.value.length + '/' + roomFor(l.surface);
    chars.className = 'tag' + (ta.value.length > roomFor(l.surface) ? ' warn' : '');
    queueSave();
  });
  row.appendChild(ta);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const bit = (cls, txt, title) => { const s = document.createElement('span'); s.className = cls; s.textContent = txt; if (title) s.title = title; meta.appendChild(s); return s; };
  if (l.voice !== 'everyone' && !l.chapter) bit('tag voice', l.voice);
  const chars = bit('tag' + (liveText(l).length > roomFor(l.surface) ? ' warn' : ''), liveText(l).length + '/' + roomFor(l.surface), 'characters, and the room this surface gives');
  bit('id mono', l.id.replace(/^[A-Z_]+/, ''));

  const act = document.createElement('div'); act.className = 'act';
  const noteBtn = document.createElement('button'); noteBtn.textContent = e.note ? 'Note •' : 'Note';
  const note = document.createElement('textarea'); note.className = 'note' + (e.note ? ' show' : '');
  note.placeholder = 'A note to me about this line'; note.value = e.note || ''; note.rows = 2;
  note.addEventListener('input', () => { edits[l.id] = Object.assign({}, edits[l.id], { note: note.value }); noteBtn.textContent = note.value ? 'Note •' : 'Note'; queueSave(); });
  noteBtn.addEventListener('click', () => { note.classList.toggle('show'); if (note.classList.contains('show')) note.focus(); });
  act.appendChild(noteBtn);

  if (l.text !== liveText(l)) {
    const undo = document.createElement('button'); undo.textContent = 'Revert';
    undo.addEventListener('click', () => { delete edits[l.id]; queueSave(); render(); });
    act.appendChild(undo);
  }
  const del = document.createElement('button'); del.className = 'del';
  del.textContent = e.deleted ? 'Keep' : 'Cut';
  del.title = 'Mark this line to be removed from the game';
  del.addEventListener('click', () => {
    edits[l.id] = Object.assign({}, edits[l.id], { deleted: !e.deleted });
    queueSave(); render();
  });
  act.appendChild(del);
  meta.appendChild(act);
  row.appendChild(meta);
  row.appendChild(note);
  requestAnimationFrame(() => grow(ta));
  return row;
}

function render() {
  const q = $('find').value.trim().toLowerCase();
  const onlyEdited = $('fEdited').getAttribute('aria-pressed') === 'true';
  const onlyDead = $('fDead').getAttribute('aria-pressed') === 'true';
  const onlyLong = $('fLong').getAttribute('aria-pressed') === 'true';
  const host = $('script'); host.textContent = '';
  let shown = 0;

  for (const ch of DATA.chapters) {
    const mine = ch.lines.filter((l) => {
      if (q && !(liveText(l).toLowerCase().includes(q) || l.id.toLowerCase().includes(q))) return false;
      if (onlyEdited && !isEdited(l)) return false;
      if (onlyDead && !l.dead) return false;
      if (onlyLong && liveText(l).length <= roomFor(l.surface)) return false;
      return true;
    });
    const mineAdded = added.filter((a) => a.chapter === ch.name);
    if (!mine.length && !mineAdded.length) continue;
    const h = document.createElement('h2');
    h.textContent = ch.name;
    const c = document.createElement('span'); c.className = 'count mono';
    c.textContent = '  ' + mine.length + ' line' + (mine.length === 1 ? '' : 's');
    h.appendChild(c);
    host.appendChild(h);
    // One context line per group, not per row. Repeating "Standing at the shelves…" down eight
    // consecutive rows buries the words the writer came to read.
    // Grouped by the event, not by the block: the basin and the shelf are both ROOM_LINES but they
    // are two different moments, and Joe wants to add a line to each of them on its own.
    let lastKey = null;
    for (const l of mine) {
      const key = groupKey(l);
      if (key !== lastKey) { lastKey = key; host.appendChild(groupHead(l, key)); }
      host.appendChild(rowFor(l)); shown++;
    }

    for (const a of mineAdded) {
      const row = document.createElement('div'); row.className = 'row edited';
      const ta = document.createElement('textarea'); ta.value = a.text; ta.spellcheck = true; ta.rows = 1;
      ta.setAttribute('aria-label', 'New line in ' + a.block);
      ta.addEventListener('input', () => { a.text = ta.value; grow(ta); queueSave(); });
      row.appendChild(ta);
      const meta = document.createElement('div'); meta.className = 'meta';
      const n = document.createElement('span'); n.className = 'tag warn'; n.textContent = 'new — I will wire this in';
      const b = document.createElement('span'); b.className = 'id mono'; b.textContent = a.block;
      meta.appendChild(n); meta.appendChild(b);
      const act = document.createElement('div'); act.className = 'act';
      const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Remove';
      del.addEventListener('click', () => { added = added.filter((x) => x !== a); queueSave(); render(); });
      act.appendChild(del); meta.appendChild(act);
      row.appendChild(meta); host.appendChild(row); shown++;
      requestAnimationFrame(() => grow(ta));
    }

  }
  if (!shown) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No lines match that.'; host.appendChild(p); }
  const n = Object.values(edits).filter((e) => e && (e.text !== undefined || e.deleted)).length;
  $('stat').textContent = DATA.total + ' lines · ' + n + ' changed · ' + added.length + ' new';
}

for (const id of ['fEdited', 'fDead', 'fLong']) {
  $(id).addEventListener('click', () => {
    $(id).setAttribute('aria-pressed', $(id).getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    render();
  });
}
$('copyOut').addEventListener('click', copyChanges);
$('find').addEventListener('input', render);
render();
setSaved('connecting…');

(async () => {
  const local = loadLocal();
  if (local && local.edits) { edits = local.edits; added = local.added || []; render(); }
  db = await (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null));
  if (!db) {
    setSaved(local && local.updatedAt
      ? 'on this device, last kept ' + new Date(local.updatedAt).toLocaleString()
      : 'writing here is kept on this device — Copy changes hands them over');
    return;
  }
  try {
    const doc = await db.doc('writer/edits').get();
    // the store wins if it is newer; otherwise whatever this device was holding stands
    if (doc && doc.edits && (!local || !local.updatedAt || (doc.updatedAt || '') >= local.updatedAt)) {
      edits = doc.edits; added = doc.added || []; render();
    } else if (local && local.edits) { queueSave(); }
    setSaved(doc && doc.updatedAt ? 'last saved ' + new Date(doc.updatedAt).toLocaleString() : 'ready');
  } catch (e) { setSaved('ready'); }
})();

addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
