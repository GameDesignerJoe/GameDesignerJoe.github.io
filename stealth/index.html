<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5f8996">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Unseen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #12313f; --pale: #e9f5f8; --teal: #3f8fa4; --orange: #ff8a3d; --star: #f3e57e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5f8996; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Chakra Petch", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hud, #stick, #title, #pause, button { touch-action: none; }
  button { font: inherit; cursor: pointer; }

  /* HUD */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 14px);
    display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; z-index: 3; transition: opacity .5s; }
  #hud.gone { opacity: 0; }
  .floorTag { display: flex; align-items: baseline; gap: 8px; color: var(--pale); text-shadow: 0 2px 0 rgba(18,49,63,.35); }
  .floorTag b { font-size: 30px; font-weight: 700; font-style: italic; letter-spacing: 1px; line-height: 1; }
  .floorTag small { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; display: block; }
  .floorTag .nm { font-size: 13px; letter-spacing: 1px; opacity: .9; }
  /* narrow screens: the star pill sits close by, so the floor's name goes under its number instead of running into the pill */
  @media (max-width: 520px) { .floorTag { flex-direction: column; align-items: flex-start; gap: 3px; } .floorTag .nm { max-width: calc(50vw - 64px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
  #hudStars { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 10px); font-size: 22px; letter-spacing: 4px; line-height: 1.2;
    background: rgba(18,49,63,.4); border: 2px solid rgba(233,245,248,.6); border-radius: 999px; padding: 2px 8px 2px 12px; white-space: nowrap; }
  #hudStars span, .stars span { color: rgba(233,245,248,.55); -webkit-text-stroke: 1px rgba(18,49,63,.4); text-shadow: none; transition: color .3s, transform .3s; display: inline-block; }
  #hudStars span.on { -webkit-text-stroke: 1px rgba(150,120,20,.55); }
  #hudStars span.punch { animation: punch .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes punch { 0% { transform: scale(1.35); } 100% { transform: scale(1.1); } }
  #hudStars span.on, .stars span.on { color: var(--star); text-shadow: 0 0 10px rgba(243,229,126,.7), 0 2px 0 rgba(18,49,63,.35); transform: scale(1.1); }
  .right { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
  #hudKeys { display: flex; gap: 5px; margin-right: 4px; }
  #hudKeys .key { width: 16px; height: 11px; border-radius: 2px; box-shadow: 0 2px 0 rgba(18,49,63,.35); transform: rotate(-25deg); }
  .iconBtn { width: 48px; height: 48px; border-radius: 12px; border: 0; background: rgba(233,245,248,.82); color: var(--ink); display: grid; place-items: center;
    box-shadow: 0 3px 0 rgba(18,49,63,.25); }
  .iconBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(18,49,63,.25); }
  .iconBtn.on { background: var(--orange); color: #fff; }
  .iconBtn svg { width: 22px; height: 22px; }

  /* the stick: the maze's, bottom centre upright, bottom right on its side */
  #stick { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%); width: 212px; height: 212px; border-radius: 50%;
    background: rgba(233,245,248,.10); border: 1.5px solid rgba(233,245,248,.45); touch-action: none; z-index: 2; transition: opacity .4s; }
  #stick::before { content: ''; position: absolute; inset: 21%; border-radius: 50%; border: 1px dashed rgba(233,245,248,.35); pointer-events: none; }
  #stick::after { content: ''; position: absolute; inset: -28px; border-radius: 50%; }   /* an invisible margin: a thumb landing just off the disc still takes the stick */
  #knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(233,245,248,.35);
    border: 1.5px solid rgba(233,245,248,.75); transition: background .12s, border-color .12s; pointer-events: none; box-shadow: 0 3px 0 rgba(18,49,63,.2); }
  #stick.on #knob { background: rgba(233,245,248,.55); }
  #stick.run #knob { background: rgba(255,138,61,.85); border-color: #fff; }
  #stick.gone { opacity: 0; pointer-events: none; }
  @media (orientation: landscape) {
    #stick { left: auto; right: calc(env(safe-area-inset-right) + 26px); bottom: calc(env(safe-area-inset-bottom) + 16px); transform: none; width: 188px; height: 188px; }
    body[data-stick=left] #stick { right: auto; left: calc(env(safe-area-inset-left) + 26px); }
  }
  body.desk #stick, body.desk #optStick { display: none; }

  /* banners and stamps */
  #banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; z-index: 4; opacity: 0; transform: translateY(16px); transition: opacity .45s, transform .45s; }
  #banner.show { opacity: 1; transform: none; }
  #banner.hide { opacity: 0; transform: translateY(-20px); }
  #banner .bn { font-size: clamp(56px, 13vw, 120px); font-weight: 700; font-style: italic; color: var(--pale); letter-spacing: 2px; line-height: 1.05; white-space: nowrap;
    text-shadow: 6px 8px 0 rgba(18,49,63,.5); }
  #banner .bs { display: inline-block; margin-top: 10px; font-size: 18px; font-weight: 700; letter-spacing: 8px; padding: 5px 10px 5px 18px; border-radius: 999px; text-transform: uppercase;
    color: var(--ink); background: rgba(233,245,248,.88); box-shadow: 0 3px 0 rgba(18,49,63,.3); }
  /* the stamp sits in the top third: the centre of the screen is where the capture happens, and it stays in view */
  #result { position: fixed; inset: 0; display: grid; place-content: start center; padding-top: calc(env(safe-area-inset-top) + 17vh); text-align: center; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .3s; }
  #result.show { opacity: 1; background: radial-gradient(circle at 50% 28%, rgba(18,49,63,.35), transparent 60%); }
  .stamp { font-size: clamp(48px, 15vw, 120px); line-height: 1.05; letter-spacing: .02em; white-space: nowrap; justify-self: center; font-weight: 700; font-style: italic; padding: 4px 26px; border: 6px solid; border-radius: 12px; transform: rotate(-6deg) scale(2.2); opacity: 0;
    background: rgba(233,245,248,1); box-shadow: 0 8px 0 rgba(18,49,63,.35); }
  /* a heavy landing: it slams down past its size, then settles */
  #result.show .stamp { animation: stamp .42s cubic-bezier(.3,0,.4,1) forwards; }
  @keyframes stamp { 0% { transform: rotate(-6deg) scale(2.2); opacity: 0; } 60% { transform: rotate(-6deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); opacity: 1; } }
  .stamp.caught { color: #d8392a; border-color: #d8392a; }
  .stamp.clear { color: var(--teal); border-color: var(--teal); }
  #result .sub { margin-top: 16px; color: var(--pale); font-size: 15px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 0 rgba(18,49,63,.45); }
  #result .sub.above { margin: 0 0 14px; }
  #result .stars { margin-top: 14px; font-size: 40px; letter-spacing: 8px; }
  #result .stars span { color: rgba(233,245,248,.35); -webkit-text-stroke: 1.5px rgba(18,49,63,.55); }
  #result .stars span.on { color: var(--star); -webkit-text-stroke: 1.5px rgba(150,120,20,.6); transform: scale(1.8); opacity: 0; animation: starPop .32s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes starPop { to { transform: scale(1); opacity: 1; } }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 84px); transform: translate(-50%, -10px); max-width: min(88vw, 440px); width: max-content;
    padding: 9px 16px; border-radius: 12px; background: rgba(18,49,63,.84); color: var(--pale); font-size: 14px; line-height: 1.35; text-align: center;
    opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none; z-index: 4; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #wipe { position: fixed; inset: 0; background: #15364a; z-index: 6; pointer-events: none; transform: translateY(100%); }
  #wipe.in { transform: translateY(0); transition: transform .5s cubic-bezier(.7,0,.3,1); }
  #wipe.out { transform: translateY(-100%); transition: transform .55s cubic-bezier(.7,0,.3,1); }

  /* title */
  #title { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 6vh; box-sizing: border-box;
    background: radial-gradient(ellipse at center, rgba(210,232,237,.15), rgba(40,90,105,.45)); }
  #title.show { display: flex; }
  /* a soft dark scrim behind the text block so it reads over the attract floor */
  #title::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 60% 40% at 50% 50%, rgba(18,49,63,.5), transparent); }
  @media (orientation: portrait) {
    #title { justify-content: flex-start; padding-top: 22vh; }
    #title::before { background: radial-gradient(ellipse 80% 32% at 50% 40%, rgba(18,49,63,.55), transparent); }
  }
  .logo { position: relative; width: min(84vw, 460px); }
  .logo svg { width: 100%; display: block; overflow: visible; }
  .logoWord { font-size: min(17vw, 104px); padding-right: .08em; font-weight: 700; font-style: italic; letter-spacing: .04em; color: var(--pale); line-height: .9; text-align: center;
    text-shadow: 4px 6px 0 rgba(18,49,63,.45); }
  .tag { color: var(--pale); background: rgba(18,49,63,.35); border-radius: 8px; padding: 6px 12px; width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; letter-spacing: clamp(2px, 1.2vw, 6px); font-size: clamp(11px, 3.2vw, 13px); text-transform: uppercase; text-shadow: 0 2px 0 rgba(18,49,63,.4); margin-bottom: 22px; }
  .bigBtn { min-width: 240px; padding: 15px 28px; border-radius: 14px; border: 0; background: var(--orange); color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px;
    box-shadow: 0 5px 0 #b84f17; }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b84f17; }
  .ghostBtn { min-width: 240px; padding: 11px 22px; border-radius: 12px; border: 2px solid rgba(233,245,248,.7); background: rgba(18,49,63,.55); color: var(--pale); font-size: 15px; }
  .tag span { display: inline-block; }
  @media (max-width: 520px) { .tag { display: flex; flex-direction: column; align-items: center; } }
  .titleBtns { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #titleMeta { color: var(--pale); font-size: 13px; letter-spacing: 2px; opacity: .9; min-height: 18px; text-shadow: 0 1px 0 rgba(18,49,63,.4); }
  .credit { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 12px); color: rgba(233,245,248,.75); font-size: 11px; letter-spacing: 1px; text-align: center; padding: 0 20px; }

  /* pause */
  #pause { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(18,49,63,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #pause.show { display: grid; }
  .card { background: var(--pale); border-radius: 18px; padding: 22px 22px 18px; width: min(86vw, 320px); display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 0 rgba(18,49,63,.3);
    max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; touch-action: pan-y; }
  .card h2 { margin: 0; font-size: 28px; font-style: italic; }
  .card .meta { font-size: 13px; opacity: .7; margin-bottom: 6px; }
  .card button { padding: 12px; border-radius: 10px; border: 0; background: #d3e9ee; color: var(--ink); font-size: 16px; text-align: left; }
  .card button.primary { background: var(--orange); color: #fff; font-weight: 700; text-align: center; box-shadow: 0 3px 0 #b84f17; }
  .card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .card .row.three { grid-template-columns: 1fr 1fr 1fr; }
  .card .row button { text-align: center; padding-left: 6px; padding-right: 6px; }
  .card button svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 5px; }
  .card .pStars { display: flex; align-items: baseline; gap: 12px; margin: -2px 0 4px; }
  .card .stars { font-size: 28px; letter-spacing: 4px; line-height: 1; }
  .card .stars span { color: rgba(18,49,63,.12); -webkit-text-stroke: 1.5px rgba(18,49,63,.4); }
  .card .stars span.on { color: var(--star); -webkit-text-stroke: 1.5px rgba(150,120,20,.6); text-shadow: 0 2px 0 rgba(18,49,63,.25); transform: none; }
  .card .pTotal { font-size: 13px; opacity: .7; letter-spacing: 1px; }
  .card .legend { font-size: 12.5px; line-height: 1.5; opacity: .8; margin-top: 4px; }

  /* short screens: phones on their side */
  @media (max-height: 500px) {
    .card { width: min(92vw, 560px); padding: 14px 18px; gap: 7px; }
    .card h2 { font-size: 22px; }
    .card .meta { margin-bottom: 2px; }
    .card button { padding: 9px 12px; font-size: 15px; }
    .card .legend { display: none; }
    #title { gap: 6px; }
    .logo svg { display: none; }
    .logoWord { font-size: min(15vh, 64px); }
    .tag { margin-bottom: 8px; }
    .titleBtns { flex-direction: row; }
    .titleBtns .bigBtn, .titleBtns .ghostBtn { min-width: 200px; }
    .titleBtns .bigBtn { padding: 12px 22px; font-size: 18px; }
    .titleBtns .ghostBtn { align-self: stretch; }
    .credit { display: none; }
    #result { padding-top: calc(env(safe-area-inset-top) + max(9vh, 54px)); }
    .stamp { font-size: clamp(40px, 17vh, 84px); padding: 2px 20px; border-width: 5px; }
    .card .stars { font-size: 22px; }
    .card .pStars { margin: -4px 0 0; }
    #result .sub { margin-top: 10px; }
    #result .sub.above { margin: 0 0 8px; }
    #result .sub.foot { display: none; }
    #banner { top: 22%; }
    #banner .bn { font-size: clamp(48px, 15vh, 76px); }
    #banner .bs { font-size: 15px; letter-spacing: 6px; margin-top: 6px; }
    .tag { max-width: min(76vh, calc(100vw - 32px)); letter-spacing: 3px; }
    #result .stars { margin-top: 8px; font-size: 32px; }
    #toast { top: auto; bottom: calc(env(safe-area-inset-bottom) + 30px); left: calc(env(safe-area-inset-left) + 16px); transform: translateY(10px); max-width: 46vw; font-size: 13px; text-align: left; }
    #toast.show { transform: none; }
    body[data-stick=left] #toast { left: auto; right: calc(env(safe-area-inset-right) + 16px); }
  }
  #ver { display: none; position: fixed; left: calc(env(safe-area-inset-left) + 10px); bottom: calc(env(safe-area-inset-bottom) + 6px); z-index: 7; font-size: 11px; letter-spacing: .5px;
    color: rgba(233,245,248,.75); text-shadow: 0 1px 2px rgba(18,49,63,.5); }
  #ver button { font: inherit; color: inherit; background: none; border: 0; padding: 4px 2px; text-decoration: underline; text-underline-offset: 2px; touch-action: manipulation; }
  body.chrome #ver { display: block; }   /* title and pause only; the refresh is there even when GitHub hasn't answered with the version */
  @media (orientation: landscape) { body[data-stick=left] #ver { left: auto; right: calc(env(safe-area-inset-right) + 10px); } }
  /* big screens: the HUD grows with the room */
  @media (min-width: 1000px) {
    .floorTag b { font-size: 42px; }
    .floorTag small { font-size: 14px; }
    .floorTag .nm { font-size: 17px; }
    .iconBtn { width: 52px; height: 52px; border-radius: 14px; }
    .iconBtn svg { width: 27px; height: 27px; }
    #hudStars { font-size: 30px; top: calc(env(safe-area-inset-top) + 12px); }
    .stamp { font-size: clamp(72px, 9vw, 150px); }
    #result .stars { font-size: 64px; }
    #result .sub { font-size: 18px; }
    .card { width: 420px; padding: 30px 30px 24px; gap: 12px; }
    .card h2 { font-size: 38px; }
    .card button { font-size: 18px; padding: 14px; }
    .card .stars { font-size: 34px; }
  }
  #dbg { position: fixed; left: 8px; bottom: 6px; font: 11px monospace; color: #fff; z-index: 9; pointer-events: none; }
</style>
</head>
<body data-stick="right">
<canvas id="cv"></canvas>

<div id="hud" class="gone">
  <div class="floorTag"><div><small>Floor</small><b id="floorNum">01</b></div><div class="nm" id="floorName">Lobby</div></div>
  <div id="hudStars"></div>
  <div class="right">
    <div id="hudKeys"></div>
    <button class="iconBtn" id="mapBtn" aria-label="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
    <button class="iconBtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  </div>
</div>

<div id="stick" class="gone"><div id="knob"></div></div>
<div id="banner"></div>
<div id="result"></div>
<div id="toast"></div>

<div id="title">
  <div class="logo">
    <svg viewBox="0 0 460 150" aria-hidden="true">
      <defs><clipPath id="lc"><rect x="0" y="0" width="460" height="150"/></clipPath></defs>
      <path d="M150 34 L310 34 L360 110 L100 110 Z" fill="rgba(170,235,252,.55)"/>
      <rect x="219" y="18" width="22" height="22" rx="4" fill="#15364a"/>
      <rect x="235" y="22" width="3" height="14" fill="#bdf0ff"/>
      <rect x="186" y="62" width="88" height="30" fill="#e9f5f8"/>
      <path d="M186 92 L274 92 L296 118 L208 118 Z M274 62 L296 88 L296 118 L274 92 Z" fill="rgba(18,49,63,.35)"/>
      <rect x="222" y="102" width="16" height="16" rx="3" fill="#ff8a3d" stroke="#b84f17" stroke-width="2"/>
    </svg>
    <div class="logoWord">UNSEEN</div>
  </div>
  <div class="tag"><span>Climb the tower.</span> <span>Stay out of the light.</span></div>
  <div class="titleBtns">
    <button class="bigBtn" id="btnPlay">Begin</button>
    <button class="ghostBtn" id="btnNew">New run</button>
  </div>
  <div id="titleMeta"></div>
  <div class="credit">Headphones recommended</div>
</div>

<div id="pause">
  <div class="card">
    <h2>Paused</h2>
    <div class="meta" id="pFloor"></div>
    <div class="pStars"><div class="stars" id="pStars"></div><div class="pTotal" id="pTotal"></div></div>
    <button class="primary" id="optResume">Resume</button>
    <div class="row"><button id="optRestart">Restart floor</button><button id="optQuit">Quit to title</button></div>
    <div class="row three"><button id="optMusic">Music: on</button><button id="optSound">Sound: on</button><button id="optStick">Stick: right</button></div>
    <div class="legend">Push the stick gently to sneak, all the way to run (running is loud). Dark pools hide you. Keys open doors of their colour. Three ★ on every floor.</div>
  </div>
</div>
<div id="wipe"></div>
<div id="dbg"></div>

<div id="ver"><span id="verNum">v—</span> · <button id="hardRefresh" type="button">refresh</button></div>
<script>
// The version is the number of commits that have touched stealth/, so it goes up by itself with
// every update. Asked of GitHub once a load; the last answer is kept for when that fails.
(function () {
  const el = document.getElementById('verNum');
  // hidden until a real number is known: a placeholder is clutter
  const known = (v) => { el.textContent = v; document.getElementById('ver').classList.add('known'); };
  try { const k = localStorage.getItem('unseen.ver'); if (k) known(k); } catch (e) {}
  fetch('https://api.github.com/repos/GameDesignerJoe/GameDesignerJoe.github.io/commits?path=stealth&per_page=1', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; const m = /[?&]page=(\d+)>; rel="last"/.exec(r.headers.get('link') || ''); return m ? +m[1] : r.json().then(a => a.length); })
    .then(n => { const v = 'v0.' + n; known(v); try { localStorage.setItem('unseen.ver', v); } catch (e) {} })
    .catch(() => {});
  // A hard refresh: drop any service worker and cache, then reload with every script fetched fresh
  document.getElementById('hardRefresh').addEventListener('click', async (e) => {
    e.stopPropagation();
    try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (err) {}
    try { for (const k of await caches.keys()) await caches.delete(k); } catch (err) {}
    const u = new URL(location.href); u.searchParams.set('r', Date.now().toString(36));
    location.replace(u.toString());
  });
  // the game's scripts, cache-busted after a hard refresh
  const bust = new URLSearchParams(location.search).get('r');
  const files = ['js/util.js', 'js/level.js', 'js/audio.js', 'js/game.js'];
  (function next(i) {
    if (i >= files.length) return;
    const s = document.createElement('script'); s.src = files[i] + (bust ? '?r=' + bust : '');
    s.onload = () => next(i + 1); document.body.appendChild(s);
  })(0);
})();
</script>
</body>
</html>
