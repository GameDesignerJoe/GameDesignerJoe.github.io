<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship It!</title>
<meta name="description" content="Where each of my side projects stands, and the way back in.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Ship It!</h1></div>
    <div class="topbtns"><button class="round" data-act="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
  </header>
  <section class="goal" id="goal" aria-label="What this is for"></section>
  <section class="recent" id="recent" aria-label="Recently worked on"></section>
  <div class="pending" id="pending" hidden></div>
  <section class="now" id="now" aria-label="One thing right now"></section>
  <section class="sec" aria-label="Focus">
    <div class="sechead"><h2>Focus</h2><span>Two stars, no more</span></div>
    <div class="focus" id="focus"></div>
  </section>
  <section class="sec" aria-label="The dev plan">
    <div class="sechead"><h2>The dev plan</h2><span>Ten gates to the App Store</span></div>
    <div class="path" id="path"></div>
    <div class="legend"><span><i style="background:var(--red)"></i>Games</span><span><i style="background:var(--blue)"></i>Tabletop</span><span><i style="background:var(--yellow)"></i>Tools</span><span><i class="nfpkey"></i>Not for publish</span></div>
    <p class="srcnote" id="srcnote"></p>
  </section>
  <section class="sec" aria-label="All projects">
    <div class="sechead"><h2>All projects</h2><span id="count"></span></div>
    <div class="filters" id="filters"></div>
    <div class="cards" id="cards"></div>
    <button class="btn line more" id="more" data-act="more"></button>
    <details class="hid" id="hiddenbox"></details>
  </section>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="shots.js"></script>
<script src="app.js"></script>
</body>
</html>
